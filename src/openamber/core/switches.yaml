- platform: template
  id: reset_start_timeout_errors_switch
  name: "Reset systeem timeout fouten"
  optimistic: true
  restore_mode: ALWAYS_OFF
  entity_category: diagnostic
  web_server:
    sorting_group_id: error_codes
  turn_on_action:
    - lambda: |-
        id(error_pump_start_timeout).publish_state(false);
        id(error_compressor_start_timeout).publish_state(false);
        id(error_pump_stop_timeout).publish_state(false);
        id(error_modbus_connection_timeout).publish_state(false);
        id(error_three_way_valve_state_timeout).publish_state(false);
    - switch.turn_off: reset_start_timeout_errors_switch

- platform: template
  optimistic: True
  id: backup_heater_relay
  name: "Backup verwarmingselement"
  internal: True
  on_state: 
    then:
    - switch.control:
        id: backup_heater_stage_1
        state: !lambda return x;
    - switch.control:
        id: backup_heater_stage_2
        state: !lambda return x;

