text_sensor:
- platform: template
  name: "Buiten unit EEPROM versie"
  update_interval: 60s
  entity_category: diagnostic
  lambda: |-
    if (!id(outside_unit_program_version).has_state() ||
        !id(outside_unit_eeprom_version_part1).has_state() ||
        !id(outside_unit_eeprom_version_part2).has_state()) {
      return {};
    }

    int v1 = (int)id(outside_unit_program_version).state;
    int v2 = (int)id(outside_unit_eeprom_version_part1).state;
    int v3 = (int)id(outside_unit_eeprom_version_part2).state;

    char buffer[20];
    snprintf(buffer, sizeof(buffer), "V%04X,%03d%03d", v1, v2, v3);
    return std::string(buffer);
  icon: "mdi:chip"

- platform: template
  id: heatpump_model_name
  name: "Warmtepomp model"
  entity_category: diagnostic
  update_interval: 60s
  lambda: |-
    if (!id(model_identification_1).has_state()) {
      return {};
    }
    int model = (int)id(model_identification_1).state;
    switch (model) {
      case 140: return std::string("Amber 65");
      case 150: return std::string("Amber 95");
      case 15:  return std::string("Amber 120");
      case 145: return std::string("HP-S 95");
      default:  return std::string("Onbekend model");
    }
  icon: "mdi:heat-pump-outline"

