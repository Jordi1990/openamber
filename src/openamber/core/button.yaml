button:
  - platform: factory_reset
    disabled_by_default: true
    name: Restart with Factory Default Settings
  - platform: restart
    id: restart_openamber
    name: Restart OpenAmber
  - platform: template
    id: dump_eeprom_parameters_button
    name: "Dump EEPROM parameters"
    disabled_by_default: true
    entity_category: diagnostic
    on_press:
      - script.execute: dump_eeprom_parameters
  - platform: template
    id: custom_defrost_start_button
    name: "Eigen defrost nu starten"
    icon: "mdi:snowflake-melt"
    web_server:
      sorting_group_id: custom_defrost
    on_press:
      - lambda: |-
          id(amber_ctrl).request_custom_defrost();
