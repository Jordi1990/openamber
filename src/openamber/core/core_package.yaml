substitutions:
  room_temperature_source: room_temperature
  # Firmware manifests per update channel. The beta manifest always describes the newest release, beta or
  # stable, so a beta user also gets the final release. Relative firmware paths resolve next to the manifest.
  firmware_manifest_stable_url: http://openamber.nl/openamber.manifest.json
  firmware_manifest_beta_url: http://openamber.nl/openamber.beta.manifest.json

# ==============================================================================
# OpenAmber Core Application Package (Hardware-Independent Business Logic)
# ==============================================================================

packages:
  - !include globals.yaml
  - !include openamber_component.yaml
  - !include datetime.yaml
  - !include output.yaml
  - !include button.yaml
  - !include climates.yaml
  - !include scripts.yaml
  - !include numbers.yaml
  - !include switches.yaml
  - !include selects.yaml
  - !include sensors.yaml
  - !include binary_sensors.yaml
  - !include text_sensors.yaml
  - !include eebus.yaml
