globals:
  # Controlled stop requested with the "Gecontroleerd stoppen" button. Not restored: after a restart regulation
  # must never stay stopped by accident.
  - id: controlled_stop_active
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: analytics_topic
    type: std::string
    restore_value: no
    initial_value: '"openamber/telemetry"'
  - id: modbus_inside_is_online
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: analytics_batch_timestamp
    type: int64_t
    restore_value: no
    initial_value: '1726320000'
  - id: modbus_outside_is_online
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: custom_defrost_runtime_s
    type: uint32_t
    restore_value: yes
    initial_value: '0'
  - id: custom_defrost_interval_min
    type: uint32_t
    restore_value: yes
    initial_value: '0'
  # Ice counter of the custom defrost (Pa·h since the last defrost), see custom_defrost_controller.h.
  - id: custom_defrost_ice_load
    type: float
    restore_value: yes
    initial_value: '0.0'
