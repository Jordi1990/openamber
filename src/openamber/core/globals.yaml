globals:
  # Controlled stop requested with the "Gecontroleerd stoppen" button. Not restored: after a restart regulation
  # must never stay stopped by accident.
  - id: controlled_stop_active
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: analytics_topic
    type: std::string
    restore_value: no
    initial_value: '"openamber/telemetry"'
  - id: modbus_inside_is_online
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: analytics_batch_timestamp
    type: int64_t
    restore_value: no
    initial_value: '1726320000'
  - id: modbus_outside_is_online
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: custom_defrost_runtime_s
    type: uint32_t
    restore_value: yes
    initial_value: '0'
  - id: custom_defrost_interval_min
    type: uint32_t
    restore_value: yes
    initial_value: '0'
  # Compressor starts in a row that timed out. TO02 (error_compressor_start_timeout) is raised only after
  # COMPRESSOR_START_MAX_ATTEMPTS; a successful start or the "Reset systeem timeout fouten" switch clears it.
  - id: compressor_start_failures
    type: int
    restore_value: no
    initial_value: '0'
