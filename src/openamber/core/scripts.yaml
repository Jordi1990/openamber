script:
- id: update_home_thermostat_mode_ui
  mode: restart
  then: []

- id: apply_pid_settings
  then:
    - lambda: |-
        auto call = id(pump_p0_pid_temperature_control).make_call();
        call.set_target_temperature(id(pump_p0_pid_target_delta_t).state);
        call.perform();
    - climate.pid.set_control_parameters:
        id: pump_p0_pid_temperature_control
        kp: !lambda 'return id(pump_p0_pid_kp).state;'
        ki: !lambda 'return id(pump_p0_pid_ki).state;'
        kd: !lambda 'return id(pump_p0_pid_kd).state;'
    - climate.pid.set_control_parameters:
        id: pid_heat_temperature_control
        kp: !lambda 'return id(pid_heat_kp).state;'
        ki: !lambda 'return id(pid_heat_ki).state;'
        kd: !lambda 'return id(pid_heat_kd).state;'
    - lambda: |-
        const float heat_deadband = id(pid_heat_deadband).state;
        id(pid_heat_temperature_control).set_threshold_low(-heat_deadband);
        id(pid_heat_temperature_control).set_threshold_high(heat_deadband);
    - climate.pid.set_control_parameters:
        id: pid_cool_temperature_control
        kp: !lambda 'return id(pid_cool_kp).state;'
        ki: !lambda 'return id(pid_cool_ki).state;'
        kd: !lambda 'return id(pid_cool_kd).state;'
    - lambda: |-
        const float cool_deadband = id(pid_cool_deadband).state;
        id(pid_cool_temperature_control).set_threshold_low(-cool_deadband);
        id(pid_cool_temperature_control).set_threshold_high(cool_deadband);
    - climate.pid.set_control_parameters:
        id: pid_mixing_valve_zone1
        kp: !lambda 'return id(pid_mixing_valve_zone1_kp).state;'
        ki: !lambda 'return id(pid_mixing_valve_zone1_ki).state;'
        kd: !lambda 'return id(pid_mixing_valve_zone1_kd).state;'
    - lambda: |-
        const float mv_z1_deadband = id(pid_mixing_valve_zone1_deadband).state;
        id(pid_mixing_valve_zone1).set_threshold_low(-mv_z1_deadband);
        id(pid_mixing_valve_zone1).set_threshold_high(mv_z1_deadband);
    - climate.pid.set_control_parameters:
        id: pid_mixing_valve_zone2
        kp: !lambda 'return id(pid_mixing_valve_zone2_kp).state;'
        ki: !lambda 'return id(pid_mixing_valve_zone2_ki).state;'
        kd: !lambda 'return id(pid_mixing_valve_zone2_kd).state;'
    - lambda: |-
        const float mv_z2_deadband = id(pid_mixing_valve_zone2_deadband).state;
        id(pid_mixing_valve_zone2).set_threshold_low(-mv_z2_deadband);
        id(pid_mixing_valve_zone2).set_threshold_high(mv_z2_deadband);

- id: apply_thermostat_settings
  then:
    - lambda: |-
        // Pas deadband/overrun instellingen toe
        id(climate_controller).set_heat_deadband(id(thermostat_heat_deadband).state);
        id(climate_controller).set_heat_overrun(id(thermostat_heat_overrun).state);
        id(climate_controller).set_cool_deadband(id(thermostat_cool_deadband).state);
        id(climate_controller).set_cool_overrun(id(thermostat_cool_overrun).state);
    - climate.control:
        id: climate_controller
        mode: !lambda |-
          auto mode = id(climate_controller).mode;
          switch (mode) {
            case climate::CLIMATE_MODE_COOL:
              return climate::CLIMATE_MODE_COOL;
            case climate::CLIMATE_MODE_HEAT:
              return climate::CLIMATE_MODE_HEAT;
            default:
              return climate::CLIMATE_MODE_OFF;
          }
        target_temperature_low: !lambda 'return id(thermostat_default_heat_setpoint).state;'
        target_temperature_high: !lambda 'return id(thermostat_default_cool_setpoint).state;'

# Writes the fan table chosen in OpenAmber to the outdoor unit (RAM only, lost on a power cycle
# of the outdoor unit). Runs on every change and once a minute, so a restarted unit gets it back.
- id: apply_outdoor_fan_table
  mode: queued
  max_runs: 2
  then:
    - lambda: |-
        if (!id(outdoor_fan_table_enabled).state) return;
        struct FanParam { number::Number *unit; number::Number *wanted; };
        const FanParam params[] = {
          {id(outdoor_unit_fan_param_3301), id(outdoor_fan_heat_warm_rpm)},
          {id(outdoor_unit_fan_param_3303), id(outdoor_fan_heat_hz_low_rpm)},
          {id(outdoor_unit_fan_param_3304), id(outdoor_fan_heat_mild_rpm)},
          {id(outdoor_unit_fan_param_3305), id(outdoor_fan_heat_hz_mid_rpm)},
          {id(outdoor_unit_fan_param_3306), id(outdoor_fan_heat_max_rpm)},
          {id(outdoor_unit_fan_param_3323), id(outdoor_fan_cool_low_rpm)},
          {id(outdoor_unit_fan_param_3325), id(outdoor_fan_cool_hz_low_rpm)},
          {id(outdoor_unit_fan_param_3326), id(outdoor_fan_cool_mild_rpm)},
          {id(outdoor_unit_fan_param_3327), id(outdoor_fan_cool_hz_mid_rpm)},
          {id(outdoor_unit_fan_param_3328), id(outdoor_fan_cool_max_rpm)},
        };
        for (const auto &p : params) {
          if (!p.unit->has_state() || !p.wanted->has_state() || std::isnan(p.wanted->state)) continue;
          if (std::fabs(p.unit->state - p.wanted->state) < 5.0f) continue;
          ESP_LOGI("amber", "Outdoor fan table: %.0f -> %.0f rpm", p.unit->state, p.wanted->state);
          p.unit->make_call().set_value(p.wanted->state).perform();
        }

# Puts back the factory fan table (EEPROM version 114) when the own fan table is switched off.
- id: restore_outdoor_fan_table
  then:
    - lambda: |-
        struct FanDefault { number::Number *unit; float rpm; };
        const FanDefault defaults[] = {
          {id(outdoor_unit_fan_param_3301), 520}, {id(outdoor_unit_fan_param_3303), 560},
          {id(outdoor_unit_fan_param_3304), 620}, {id(outdoor_unit_fan_param_3305), 680},
          {id(outdoor_unit_fan_param_3306), 720}, {id(outdoor_unit_fan_param_3323), 620},
          {id(outdoor_unit_fan_param_3325), 620}, {id(outdoor_unit_fan_param_3326), 720},
          {id(outdoor_unit_fan_param_3327), 720}, {id(outdoor_unit_fan_param_3328), 720},
        };
        for (const auto &d : defaults) {
          d.unit->make_call().set_value(d.rpm).perform();
        }
