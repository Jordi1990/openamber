# Menu Root Page: Service Overzicht (zonder sidebar, 2-koloms grid)
# ------------------------------------------------------------
id: service_overview_page
title: "Service"
widgets:
  - obj:
      width: 100%
      height: SIZE_CONTENT
      bg_opa: 0%
      border_opa: 0%
      pad_left: 12
      pad_right: 12
      pad_top: 4
      pad_bottom: 16
      layout:
        type: FLEX
        flex_flow: ROW_WRAP
        flex_align_main: START
        flex_align_cross: START
        pad_row: 8
        pad_column: 8
      widgets:
        - obj:
            id: service_tab_maintenance
            styles: menu_tile_style
            scrollable: false
            pressed:
              styles: menu_tile_pressed_style
            disabled:
              styles: menu_tile_disabled_style
            on_click:
              - lvgl.menu.set_page:
                  id: service_menu
                  page: service_maintenance_page
              - script.execute:
                  id: service_select_tab
                  tab_index: 0
            widgets:
              - label: { text: "\U000F1B91", styles: menu_tile_icon_style }
              - label: { id: service_tab_maintenance_lbl, text: "${t_algemeen}", long_mode: WRAP, styles: menu_tile_label_style }

        - obj:
            id: service_tab_deaeration
            styles: menu_tile_style
            scrollable: false
            pressed:
              styles: menu_tile_pressed_style
            disabled:
              styles: menu_tile_disabled_style
