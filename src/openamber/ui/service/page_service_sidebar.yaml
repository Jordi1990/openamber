# Service Sidebar Page
# ------------------------------------------------------------
id: service_sidebar_page
title: "Service"
widgets:
  - obj:
      id: service_tab_maintenance
      width: 100%
      height: 40
      bg_color: 0x1F3B68
      bg_opa: 100%
      radius: 10
      border_width: 0
      border_opa: 0%
      pad_left: 12
      pad_top: 2
      pad_bottom: 2
      on_click:
        - lvgl.menu.set_page:
            id: service_menu
            page: service_maintenance_page
        - script.execute:
            id: service_select_tab
            tab_index: 0
      widgets:
        - label:
            id: service_tab_maintenance_lbl
            text: "Algemeen"
            text_color: 0xFFFFFF
            text_font: font_text_20
            align: LEFT_MID

