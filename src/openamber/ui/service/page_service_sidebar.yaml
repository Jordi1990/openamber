obj:
  id: service_tabs_bar
  grid_cell_row_pos: 0
  grid_cell_column_pos: 0
  grid_cell_x_align: STRETCH
  grid_cell_y_align: STRETCH
  width: 210
  height: 100%
  bg_color: 0xE8ECF1
  bg_opa: 100%
  radius: 14
  border_width: 0
  border_opa: 0%
  pad_left: 4
  pad_right: 4
  pad_top: 3
  pad_bottom: 3
  scrollbar_mode: "OFF"
  scrollable: true
  layout:
    type: FLEX
    flex_flow: COLUMN
    flex_align_main: START
    flex_align_cross: CENTER
    pad_row: 2
  widgets:
    - obj:
        id: service_tab_maintenance
        width: 100%
        height: 40
        bg_color: 0xE8ECF1
        bg_opa: 100%
        radius: 10
        border_width: 0
        border_opa: 0%
        pad_left: 12
        pad_top: 2
        pad_bottom: 2
        on_click:
          - script.execute:
              id: service_select_tab
              tab_index: 0
        widgets:
          - label:
              id: service_tab_maintenance_lbl
              text: "Algemeen"
              text_color: 0x4B5563
              text_font: font_text_20
              align: LEFT_MID

    - obj:
        id: service_tab_compressor
        width: 100%
        height: 40
        bg_color: 0xE8ECF1
        bg_opa: 100%
        radius: 10
        border_width: 0
        border_opa: 0%
        pad_left: 12
        pad_top: 2
        pad_bottom: 2
        on_click:
          - script.execute:
              id: service_select_tab
              tab_index: 1
        widgets:
          - label:
              id: service_tab_compressor_lbl
              text: "Buitenunit"
              text_color: 0x4B5563
              text_font: font_text_20
              align: LEFT_MID

    - obj:
        id: service_tab_pumps
        width: 100%
