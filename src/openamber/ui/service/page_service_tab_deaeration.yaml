# Menu Page: Ontluchten
# ------------------------------------------------------------
id: service_deaeration_page
title: "${t_ontluchten}"
styles: setting_page_style
widgets:
  - obj:
      id: service_deaeration_panel
      width: 100%
      height: SIZE_CONTENT
      bg_opa: 0%
      border_opa: 0%
      pad_all: 0
      layout:
        type: FLEX
        flex_flow: COLUMN
        flex_align_main: START
        flex_align_cross: CENTER
        pad_row: 8
      widgets:
        - obj:
            id: service_deaeration_header
            styles: setting_row_style
            widgets:
              - label:
                  id: service_deaeration_title
                  text: "${t_ontluchten}"
                  text_color: 0x1F2933
                  text_font: font_text_24
                  align: TOP_LEFT
              - label:
                  id: service_deaeration_desc
                  width: 100%
                  text: "${t_automatische_ontluchtingsroutine}"
                  text_color: 0x6B7280
                  text_font: font_text_20
                  long_mode: WRAP
                  align: TOP_LEFT
                  y: 38

        - label:
            id: service_deaeration_lock_hint
            pad_left: 18
            width: 100%
            text: "${t_ontluchten_is_alleen_beschikbaar_in_onde}"
            text_color: 0x9CA3AF
            text_font: font_text_20
            long_mode: WRAP
            align: TOP_LEFT

        - obj:
            id: service_deaeration_status_box
            styles: setting_row_style
            height: 84
            scrollbar_mode: "OFF"
            scrollable: false
            widgets:
              - label:
                  id: service_deaeration_status_val
                  text: "${t_inactief}"
                  text_color: 0x6B7280
                  text_font: font_text_20
                  align: TOP_LEFT
              - label:
                  id: service_deaeration_time_val
                  text: "${t_resterend}"
                  text_color: 0x6B7280
                  text_font: font_text_20
                  align: TOP_RIGHT
              - bar:
                  id: service_deaeration_progress_bar
                  width: 100%
                  height: 10
                  align: BOTTOM_MID
                  min_value: 0
                  max_value: 100
                  value: 0
                  bg_color: 0xD1D5DB
                  radius: 5
                  indicator:
                    bg_color: 0x1F3B68
                    radius: 5

        - obj:
            width: 100%
            height: 50
            bg_opa: 0%
            border_opa: 0%
            pad_all: 0
            scrollable: false
            scrollbar_mode: "OFF"
            widgets:
              - obj:
                  id: service_deaeration_short_btn
                  width: 48%
                  height: 50
                  align: TOP_LEFT
                  bg_color: 0xE8ECF1
                  bg_opa: 100%
                  radius: 10
                  border_opa: 0%
                  scrollbar_mode: "OFF"
                  scrollable: false
                  on_click:
                    - lambda: |-
                        if (id(amber_ctrl).is_maintenance_state()) {
                          if (id(amber_ctrl).is_deaeration_running()) {
                            {
                              id(amber_ctrl).stop_deaeration_routine();
                            }
                          } else {
                            {
                              id(amber_ctrl).start_deaeration_routine(false);
                            }
                          }
                          id(update_service_mode_ui).execute();
                        } else {
                          id(update_service_mode_ui).execute();
                        }
                  widgets:
                    - label:
                        id: service_deaeration_short_btn_lbl
                        text: "${t_kort_10_min}"
                        text_color: 0x4B5563
                        text_font: font_text_20
                        align: CENTER

              - obj:
                  id: service_deaeration_extended_btn
                  width: 48%
                  height: 50
                  align: TOP_RIGHT
                  bg_color: 0xE8ECF1
                  bg_opa: 100%
                  radius: 10
                  border_opa: 0%
                  scrollbar_mode: "OFF"
                  scrollable: false
                  on_click:
                    - lambda: |-
                        if (id(amber_ctrl).is_maintenance_state()) {
                          if (id(amber_ctrl).is_deaeration_running()) {
                            {
                              id(amber_ctrl).stop_deaeration_routine();
                            }
                          } else {
                            {
                              id(amber_ctrl).start_deaeration_routine(true);
                            }
                          }
                          id(update_service_mode_ui).execute();
                        } else {
                          id(update_service_mode_ui).execute();
                        }
                  widgets:
                    - label:
                        id: service_deaeration_extended_btn_lbl
                        text: "${t_uitgebreid_31_min}"
                        text_color: 0x4B5563
                        text_font: font_text_20
                        align: CENTER
