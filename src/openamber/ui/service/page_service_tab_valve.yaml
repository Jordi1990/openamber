obj:
  id: service_mpanel_valve
  width: 100%
  height: 100%
  hidden: true
  bg_opa: 0%
  border_opa: 0%
  pad_all: 0
  widgets:
    - label:
        text: "Klepstand forceren"
        text_color: 0x1F2933
        text_font: font_text_24
        align: TOP_LEFT
    - label:
        width: 100%
        text: "Forceer de 3-weg klep tijdelijk naar CV/Koelen of Tapwater"
        text_color: 0x6B7280
        text_font: font_text_20
        long_mode: WRAP
        align: TOP_LEFT
        y: 38
    - obj:
        id: service_valve_btn_heat_cool
        width: 48%
        height: 42
        align: TOP_LEFT
        y: 74
        bg_color: 0xE8ECF1
        bg_opa: 100%
        radius: 8
        border_opa: 0%
        scrollbar_mode: "OFF"
        scrollable: false
        on_click:
          - lambda: |-
              if (id(state_machine_state_main).state == "Maintenance") {
                lv_obj_set_style_bg_color(id(service_valve_btn_heat_cool), lv_color_hex(0x1F3B68), LV_PART_MAIN);
                lv_obj_set_style_text_color(id(service_valve_btn_heat_cool_lbl), lv_color_hex(0xFFFFFF), LV_PART_MAIN);
                lv_obj_set_style_bg_color(id(service_valve_btn_dhw), lv_color_hex(0xE8ECF1), LV_PART_MAIN);
                lv_obj_set_style_text_color(id(service_valve_btn_dhw_lbl), lv_color_hex(0x4B5563), LV_PART_MAIN);
                id(three_way_valve_heat_cool_switch).turn_on();
                id(three_way_valve_dhw_switch).turn_off();
                id(update_service_valve_ui).execute();
              }
        widgets:
          - label:
              id: service_valve_btn_heat_cool_lbl
              text: "CV/Koelen"
              text_color: 0x4B5563
              text_font: font_text_20
              align: CENTER
    - obj:
        id: service_valve_btn_dhw
        width: 48%
        height: 42
        align: TOP_RIGHT
        y: 74
        bg_color: 0xE8ECF1
        bg_opa: 100%
        radius: 8
        border_opa: 0%
        scrollbar_mode: "OFF"
        scrollable: false
        on_click:
          - lambda: |-
              if (id(state_machine_state_main).state == "Maintenance") {
                lv_obj_set_style_bg_color(id(service_valve_btn_dhw), lv_color_hex(0x1F3B68), LV_PART_MAIN);
                lv_obj_set_style_text_color(id(service_valve_btn_dhw_lbl), lv_color_hex(0xFFFFFF), LV_PART_MAIN);
                lv_obj_set_style_bg_color(id(service_valve_btn_heat_cool), lv_color_hex(0xE8ECF1), LV_PART_MAIN);
                lv_obj_set_style_text_color(id(service_valve_btn_heat_cool_lbl), lv_color_hex(0x4B5563), LV_PART_MAIN);
                id(three_way_valve_dhw_switch).turn_on();
                id(three_way_valve_heat_cool_switch).turn_off();
                id(update_service_valve_ui).execute();
              }
        widgets:
          - label:
              id: service_valve_btn_dhw_lbl
              text: "Tapwater"
              text_color: 0x4B5563
              text_font: font_text_20
              align: CENTER

