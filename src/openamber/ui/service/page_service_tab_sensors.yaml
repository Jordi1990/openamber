# Menu Page: Service - Diagnose (Categorie keuzemenu)
# ------------------------------------------------------------
id: service_sensors_page
title: "${t_diagnose}"
widgets:
  - obj:
      id: service_sensors_panel
      width: 100%
      height: SIZE_CONTENT
      bg_opa: 0%
      border_opa: 0%
      pad_left: 12
      pad_right: 12
      pad_top: 4
      pad_bottom: 16
      layout:
        type: FLEX
        flex_flow: ROW_WRAP
        flex_align_main: START
        flex_align_cross: START
        pad_row: 8
        pad_column: 8
      widgets:
        - obj:
            id: service_sensors_stab_status
            styles: menu_tile_style
            scrollable: false
            pressed:
              styles: menu_tile_pressed_style
            disabled:
              styles: menu_tile_disabled_style
            on_click:
              - lvgl.menu.set_page:
                  id: service_menu
                  page: service_sensors_status_page
              - script.execute: update_service_diag_summary_ui
            widgets:
              - label: { text: "\U000F05E0", styles: menu_tile_icon_style }
              - label: { id: service_sensors_stab_status_lbl, text: "Status", long_mode: WRAP, styles: menu_tile_label_style }

        - obj:
            id: service_sensors_stab_temp
            styles: menu_tile_style
            scrollable: false
            pressed:
              styles: menu_tile_pressed_style
            disabled:
              styles: menu_tile_disabled_style
            on_click:
              - lvgl.menu.set_page:
                  id: service_menu
                  page: service_sensors_temp_page
              - script.execute: update_service_diag_summary_ui
            widgets:
              - label: { text: "\U000F029A", styles: menu_tile_icon_style }
              - label: { id: service_sensors_stab_temp_lbl, text: "${t_druk_en_temperatuur}", long_mode: WRAP, styles: menu_tile_label_style }

        - obj:
            id: service_sensors_stab_control
            styles: menu_tile_style
            scrollable: false
            pressed:
              styles: menu_tile_pressed_style
            disabled:
              styles: menu_tile_disabled_style
            on_click:
              - lvgl.menu.set_page:
                  id: service_menu
                  page: service_sensors_control_page
              - script.execute: update_service_diag_summary_ui
            widgets:
              - label: { text: "\U000F062E", styles: menu_tile_icon_style }
              - label: { id: service_sensors_stab_control_lbl, text: "${t_aansturing}", long_mode: WRAP, styles: menu_tile_label_style }

        - obj:
            id: service_sensors_stab_system
            styles: menu_tile_style
            scrollable: false
            pressed:
              styles: menu_tile_pressed_style
            disabled:
              styles: menu_tile_disabled_style
            on_click:
              - lvgl.menu.set_page:
                  id: service_menu
                  page: service_sensors_system_page
              - script.execute: update_service_diag_summary_ui
            widgets:
              - label: { text: "\U000F08D6", styles: menu_tile_icon_style }
              - label: { id: service_sensors_stab_system_lbl, text: "${t_systeem}", long_mode: WRAP, styles: menu_tile_label_style }

        - obj:
            id: service_sensors_stab_demand
            styles: menu_tile_style
            scrollable: false
            pressed:
              styles: menu_tile_pressed_style
            disabled:
              styles: menu_tile_disabled_style
            on_click:
              - lvgl.menu.set_page:
                  id: service_menu
                  page: service_sensors_demand_page
              - script.execute: update_service_diag_summary_ui
            widgets:
              - label: { text: "\U000F0393", styles: menu_tile_icon_style }
              - label: { id: service_sensors_stab_demand_lbl, text: "${t_warmte_en_koudevraag}", long_mode: WRAP, styles: menu_tile_label_style }
