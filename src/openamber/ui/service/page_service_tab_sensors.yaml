obj:
  id: service_sensors_panel
  width: 100%
  height: 100%
  align: TOP_LEFT
  y: 0
  hidden: true
  bg_opa: 0%
  border_opa: 0%
  pad_all: 0
  scrollbar_mode: "OFF"
  scrollable: false
  layout:
    type: FLEX
    flex_flow: ROW_WRAP
    flex_align_main: START
    flex_align_cross: CENTER
    pad_row: 10
    pad_column: 10
  widgets:
    - obj:
        width: 49%
        height: 166
        bg_color: 0xFFFFFF
        bg_opa: 100%
        radius: 12
        border_width: 1
        border_color: 0xE5E7EB
        border_opa: 100%
        pad_all: 10
        scrollbar_mode: "OFF"
        scrollable: false
        widgets:
          - label: { text: "Status", text_color: 0x111827, text_font: font_text_20, align: TOP_LEFT }
          - table:
              id: service_diag_status_table
              width: 100%
              y: 28
              bg_opa: 0%
              border_width: 0
              scrollbar_mode: "OFF"
              scrollable: false
              items:
                text_font: font_text_20
                text_color: 0x1F2933
                border_width: 0
                bg_opa: 0%
                pad_top: 2
                pad_bottom: 2
                pad_left: 0
                pad_right: 0
              columns:
                - width: 44%
                - width: 56%
              rows:
                - ["Hoofdstatus", "-"]
                - ["CV/Koelen", "-"]
                - ["Tapwater", "-"]

    - obj:
        width: 49%
        height: 166
        bg_color: 0xFFFFFF
        bg_opa: 100%
        radius: 12
        border_width: 1
        border_color: 0xE5E7EB
        border_opa: 100%
        pad_all: 10
        scrollbar_mode: "OFF"
        scrollable: false
        widgets:
          - label: { text: "Druk & Temperatuur", text_color: 0x111827, text_font: font_text_20, align: TOP_LEFT }
          - table:
              id: service_diag_temp_table
              width: 100%
              y: 28
              bg_opa: 0%
              border_width: 0
              scrollbar_mode: "OFF"
              scrollable: false
              items:
                text_font: font_text_20
                text_color: 0x1F2933
                border_width: 0
                bg_opa: 0%
                pad_top: 2
                pad_bottom: 2
                pad_left: 0
                pad_right: 0
              columns:
                - width: 44%
                - width: 56%
              rows:
                - ["Ta / Tc", "- / -"]
                - ["Tuo / Tui", "- / -"]
                - ["Zuig / Pers", "- / -"]

    - obj:
        width: 49%
        height: 230
        bg_color: 0xFFFFFF
        bg_opa: 100%
        radius: 12
        border_width: 1
        border_color: 0xE5E7EB
        border_opa: 100%
        pad_all: 10
        scrollbar_mode: "OFF"
        scrollable: false
        widgets:
          - label: { text: "Aansturing", text_color: 0x111827, text_font: font_text_20, align: TOP_LEFT }
          - table:
              id: service_diag_control_table
              width: 100%
              y: 28
              bg_opa: 0%
              border_width: 0
              scrollbar_mode: "OFF"
              scrollable: false
              items:
                text_font: font_text_20
                text_color: 0x1F2933
                border_width: 0
                bg_opa: 0%
                pad_top: 2
                pad_bottom: 2
                pad_left: 0
                pad_right: 0
              columns:
                - width: 44%
                - width: 56%
              rows:
                - ["Compressor", "- Hz"]
                - ["Pomp PWM", "- %"]
                - ["Fan RPM", "- rpm"]
                - ["Expansieklep", "- %"]

    - obj:
        width: 49%
        height: 230
        bg_color: 0xFFFFFF
        bg_opa: 100%
        radius: 12
        border_width: 1
        border_color: 0xE5E7EB
        border_opa: 100%
        pad_all: 10
        scrollbar_mode: "OFF"
        scrollable: false
        widgets:
          - label: { text: "Systeem", text_color: 0x111827, text_font: font_text_20, align: TOP_LEFT }
          - table:
              id: service_diag_system_table
              width: 100%
              y: 28
              bg_opa: 0%
              border_width: 0
              scrollbar_mode: "OFF"
              scrollable: false
              items:
                text_font: font_text_20
                text_color: 0x1F2933
                border_width: 0
                bg_opa: 0%
                pad_top: 2
                pad_bottom: 2
                pad_left: 0
                pad_right: 0
              columns:
                - width: 62%
                - width: 38%
              rows:
                - ["Defrost / Bodemplaat", "- / -"]
                - ["Modbus binnen", "-"]
                - ["Modbus buiten", "-"]
                - ["SG contacten A / B", "- / -"]
                - ["Warmte/koude vraag", "- / -"]



