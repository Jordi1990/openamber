obj:
  id: service_errors_panel
  width: 100%
  height: 100%
  align: TOP_LEFT
  y: 0
  hidden: true
  bg_opa: 0%
  border_opa: 0%
  pad_all: 0
  scrollbar_mode: "OFF"
  scrollable: false
  widgets:
    - obj:
        width: 100%
        height: 100%
        bg_color: 0xFFFFFF
        bg_opa: 100%
        radius: 12
        border_width: 1
        border_color: 0xE5E7EB
        border_opa: 100%
        pad_all: 14
        scrollbar_mode: "OFF"
        scrollable: false
        layout:
          type: FLEX
          flex_flow: COLUMN
          flex_align_main: START
          flex_align_cross: CENTER
          pad_row: 8
        widgets:
          - label:
              text: "Foutmeldingen"
              text_color: 0x991B1B
              text_font: font_text_24
          - obj:
              id: service_errors_reset_timeout_btn
              width: 100%
              height: 44
              hidden: true
              bg_color: 0xB91C1C
              bg_opa: 100%
              radius: 10
              border_width: 0
              border_opa: 0%
              scrollbar_mode: "OFF"
              scrollable: false
              on_click:
                - switch.turn_on: reset_start_timeout_errors_switch
              widgets:
                - label:
                    text: "Reset timeout-fouten"
                    text_color: 0xFFFFFF
                    text_font: font_text_20
                    align: CENTER
          - list:
              id: service_errors_list
              width: 100%
              height: 380
              bg_opa: 0%
              border_width: 0
              scrollbar_mode: "AUTO"
              scrollable: true
              pad_row: 6


