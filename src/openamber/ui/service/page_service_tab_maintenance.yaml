# Menu Page: Algemeen
# ------------------------------------------------------------
id: service_maintenance_page
title: "${t_algemeen}"
styles: setting_page_style
widgets:
  - obj:
      id: service_maintenance_panel
      width: 100%
      height: SIZE_CONTENT
      bg_opa: 0%
      border_opa: 0%
      pad_all: 0
      layout:
        type: FLEX
        flex_flow: COLUMN
        flex_align_main: START
        flex_align_cross: CENTER
        pad_row: 8
      widgets:
        - obj:
            id: service_maintenance_header
            styles: setting_row_style
            widgets:
              - label:
                  id: service_maintenance_title
                  text: "${t_onderhoudsmodus}"
                  text_color: 0x1F2933
                  text_font: font_text_24
                  align: TOP_LEFT
              - label:
                  id: service_maintenance_state
                  width: 75%
                  height: SIZE_CONTENT
                  text: "${t_onderhoudsmodus_niet_actief}"
                  text_color: 0x6B7280
                  text_font: font_text_20
                  align: TOP_LEFT
                  y: 38
              - switch:
                  id: set_service_mode_switch_ui
                  align: TOP_RIGHT
                  bg_color: 0x9CA3AF
                  indicator:
                    bg_color: 0x16A34A
                  knob:
                    bg_color: 0xFFFFFF
                  on_click:
                    - lambda: |-
                        if (id(service_mode_enabled).state) {
                          id(service_mode_enabled).turn_off();
                          id(update_service_mode_ui).execute();
                        } else {
                          id(service_mode_enabled).turn_on();
                          id(update_service_mode_ui).execute();
                        }

        - label:
            id: service_maintenance_lock_hint
            pad_left: 18
            width: 100%
            text: "${t_stop_eerst_de_warmtepomp_via_systeem_beh}"
            text_color: 0x9CA3AF
            text_font: font_text_20
            long_mode: WRAP
            align: TOP_LEFT
