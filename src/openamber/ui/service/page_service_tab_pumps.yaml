# Menu Page: Pompen
# ------------------------------------------------------------
id: service_pumps_page
title: "Pompen"
styles: setting_page_style
widgets:
  - obj:
      id: service_mpanel_pumps
      width: 100%
      height: SIZE_CONTENT
      bg_opa: 0%
      border_opa: 0%
      pad_all: 0
      scrollbar_mode: "OFF"
      scrollable: false
      layout:
        type: FLEX
        flex_flow: COLUMN
        flex_align_main: START
        flex_align_cross: CENTER
        pad_row: 10
      widgets:
        - obj:
            styles: setting_row_style
            widgets:
              - label:
                  text: "P0 pomp relais"
                  text_color: 0x1F2933
                  text_font: font_text_24
                  align: TOP_LEFT
              - label:
                  text: "Schakel P0 pomp"
                  width: 72%
                  text_color: 0x6B7280
                  text_font: font_text_20
                  align: TOP_LEFT
                  y: 34
              - switch:
                  id: service_pump_p0_switch_ui
                  align: TOP_RIGHT
                  bg_color: 0x9CA3AF
                  indicator:
                    bg_color: 0x16A34A
                  knob:
                    bg_color: 0xFFFFFF
                  on_click:
                    - lambda: |-
                        if (id(state_machine_state_main).state == "Maintenance") {
                          id(pump_p0_relay_switch).toggle();
                        } else {
                          id(update_service_mode_ui).execute();
                        }

        - obj:
            styles: setting_row_style
            widgets:
              - label:
                  text: "P0 PWM"
                  text_color: 0x1F2933
                  text_font: font_text_24
                  align: TOP_LEFT
              - label:
                  id: service_p0_pwm_slider_value
                  text: "- %"
                  text_color: 0x1F2933
                  text_font: font_text_24
                  align: TOP_RIGHT
              - label:
                  text: "P0 Pomp PWM waarde"
                  text_color: 0x6B7280
                  text_font: font_text_20
                  align: TOP_LEFT
                  y: 34
              - slider:
                  id: service_p0_pwm_slider
                  width: 96%
                  align: TOP_MID
                  y: 74
                  min_value: 0
                  max_value: 100
                  value: 0
                  knob:
                    bg_color: 0xFFFFFF
                    border_color: 0x1F3B68
                    border_width: 3
                  on_value:
                    then:
                      - lambda: |-
                          const auto duty = lv_slider_get_value(id(service_p0_pwm_slider));
                          lv_label_set_text_fmt(id(service_p0_pwm_slider_value), "%ld %%", (long) duty);
                  on_release:
                    then:
                      - lambda: |-
                          if (id(state_machine_state_main).state == "Maintenance") {
                            {
                              const auto duty = lv_slider_get_value(id(service_p0_pwm_slider));
                              const float control_speed = ((duty * 10) * -1) + 1000;
                              auto pump_call = id(pump_control_pwm_number).make_call();
                              pump_call.set_value(control_speed);
                              pump_call.perform();
                            }
                          } else {
                            id(update_service_mode_ui).execute();
                          }

        - obj:
            styles: setting_row_style
            widgets:
              - label:
                  text: "P1 pomp relais"
                  text_color: 0x1F2933
