# Menu Page: Buitenunit
# ------------------------------------------------------------
id: service_compressor_page
title: "${t_buitenunit}"
styles: setting_page_style
widgets:
  - obj:
      id: service_mpanel_compressor
      width: 100%
      height: SIZE_CONTENT
      bg_opa: 0%
      border_opa: 0%
      pad_all: 0
      layout:
        type: FLEX
        flex_flow: COLUMN
        flex_align_main: START
        flex_align_cross: CENTER
        pad_row: 10
      widgets:
        - obj:
            styles: setting_row_style
            widgets:
              - label:
                  text: "${t_ventilator_rpm}"
                  text_color: 0x1F2933
                  text_font: font_text_24
                  align: TOP_LEFT
              - label:
                  id: service_fan_slider_value
                  text: "- RPM"
                  text_color: 0x1F2933
                  text_font: font_text_24
                  align: TOP_RIGHT
              - label:
                  text: "${t_kies_handmatig_een_ventilator_rpm_waarde}"
                  text_color: 0x6B7280
                  text_font: font_text_20
                  align: TOP_LEFT
                  y: 34
              - slider:
                  id: service_fan_slider
                  width: 96%
                  align: TOP_MID
                  y: 74
                  min_value: 0
                  max_value: 1000
                  value: 0
                  knob:
                    bg_color: 0xFFFFFF
                    border_color: 0x1F3B68
                    border_width: 3
                  on_value:
                    then:
                      - lambda: |-
                          const auto duty = lv_slider_get_value(id(service_fan_slider));
                          lv_label_set_text_fmt(id(service_fan_slider_value), "%ld RPM", (long) duty);
                  on_release:
                    then:
                      - lambda: |-
                          if (id(state_machine_state_main).state == "Maintenance") {
                            {
                              const auto duty = lv_slider_get_value(id(service_fan_slider));
                              auto fan_call = id(fan_speed_manual_number).make_call();
                              fan_call.set_value(duty);
                              fan_call.perform();
                            }
                          } else {
                            id(update_service_mode_ui).execute();
                          }

        - obj:
            styles: setting_row_style
            widgets:
              - label:
                  text: "${t_carterverwarming}"
                  text_color: 0x1F2933
                  text_font: font_text_24
                  align: TOP_LEFT
              - label:
                  text: "${t_schakel_de_carterverwarming}"
                  width: 72%
                  text_color: 0x6B7280
                  text_font: font_text_20
                  align: TOP_LEFT
                  y: 34
              - switch:
                  id: service_crankcase_heater_switch_ui
                  align: TOP_RIGHT
                  bg_color: 0x9CA3AF
                  indicator:
                    bg_color: 0x16A34A
                  knob:
                    bg_color: 0xFFFFFF
                  on_click:
                    - lambda: |-
                        if (id(state_machine_state_main).state == "Maintenance") {
                          id(compressor_crankcase_heater_manual_switch).toggle();
                        } else {
                          id(update_service_mode_ui).execute();
                        }

        - obj:
            styles: setting_row_style
            widgets:
              - label:
                  text: "${t_bodemplaat_verwarming_2}"
                  text_color: 0x1F2933
                  text_font: font_text_24
                  align: TOP_LEFT
              - label:
                  text: "${t_schakel_de_bodemplaatverwarming}"
                  width: 72%
                  text_color: 0x6B7280
                  text_font: font_text_20
                  align: TOP_LEFT
                  y: 34
              - switch:
                  id: service_bottom_plate_heater_switch_ui
                  align: TOP_RIGHT
                  bg_color: 0x9CA3AF
                  indicator:
                    bg_color: 0x16A34A
                  knob:
                    bg_color: 0xFFFFFF
                  on_click:
                    - lambda: |-
                        if (id(state_machine_state_main).state == "Maintenance") {
                          id(bottom_plate_heater_manual_switch).toggle();
                        } else {
                          id(update_service_mode_ui).execute();
                        }
