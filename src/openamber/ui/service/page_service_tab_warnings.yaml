obj:
  id: service_warnings_panel
  width: 100%
  height: 100%
  align: TOP_LEFT
  y: 0
  hidden: true
  bg_opa: 0%
  border_opa: 0%
  pad_all: 0
  scrollbar_mode: "OFF"
  scrollable: false
  widgets:
    - obj:
        width: 100%
        height: 100%
        bg_color: 0xFFFFFF
        bg_opa: 100%
        radius: 12
        border_width: 1
        border_color: 0xE5E7EB
        border_opa: 100%
        pad_all: 14
        scrollbar_mode: "OFF"
        scrollable: false
        layout:
          type: FLEX
          flex_flow: COLUMN
          flex_align_main: START
          flex_align_cross: CENTER
          pad_row: 8
        widgets:
          - label:
              text: "Waarschuwingen"
              text_color: 0x92400E
              text_font: font_text_24
          - list:
              id: service_warnings_list
              width: 100%
              height: 420
              bg_opa: 0%
              border_width: 0
              scrollbar_mode: "AUTO"
              scrollable: true
              pad_row: 6


