# Menu Page: Back-up
# ------------------------------------------------------------
id: service_backup_page
title: "${t_back_up}"
styles: setting_page_style
widgets:
  - obj:
      id: service_mpanel_backup
      width: 100%
      height: SIZE_CONTENT
      bg_opa: 0%
      border_opa: 0%
      pad_all: 0
      layout:
        type: FLEX
        flex_flow: COLUMN
        flex_align_main: START
        flex_align_cross: CENTER
        pad_row: 10
      widgets:
        - obj:
            styles: setting_row_style
            widgets:
              - label:
                  text: "${t_backup_element}"
                  text_color: 0x1F2933
                  text_font: font_text_24
                  align: TOP_LEFT
              - label:
                  text: "${t_schakel_elektrisch_backup_element}"
                  width: 72%
                  text_color: 0x6B7280
                  text_font: font_text_20
                  align: TOP_LEFT
                  y: 34
              - switch:
                  id: service_backup_heater_relay_switch_ui
                  align: TOP_RIGHT
                  bg_color: 0x9CA3AF
                  indicator:
                    bg_color: 0x16A34A
                  knob:
                    bg_color: 0xFFFFFF
                  on_click:
                    - lambda: |-
                        if (id(state_machine_state_main).state == "Maintenance") {
                          id(backup_heater_relay).toggle();
                        } else {
                          id(update_service_mode_ui).execute();
                        }

        - obj:
            styles: setting_row_style
            widgets:
              - label:
                  text: "${t_cv_hybride_backup_relais}"
                  text_color: 0x1F2933
                  text_font: font_text_24
                  align: TOP_LEFT
              - label:
                  text: "${t_schakel_hybride_backup_relais}"
                  width: 72%
                  text_color: 0x6B7280
                  text_font: font_text_20
                  align: TOP_LEFT
                  y: 34
              - switch:
                  id: service_external_backup_heating_relay_switch_ui
                  align: TOP_RIGHT
                  bg_color: 0x9CA3AF
                  indicator:
                    bg_color: 0x16A34A
                  knob:
                    bg_color: 0xFFFFFF
                  on_click:
                    - lambda: |-
                        if (id(state_machine_state_main).state == "Maintenance") {
                          id(external_backup_heating_relay).toggle();
                        } else {
                          id(update_service_mode_ui).execute();
                        }
