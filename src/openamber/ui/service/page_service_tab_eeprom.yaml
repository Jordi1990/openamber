obj:
  id: service_eeprom_panel
  width: 100%
  height: 100%
  hidden: true
  bg_opa: 0%
  border_opa: 0%
  pad_all: 0
  widgets:
    - label:
        text: "EEPROM Dump (Alleen lezen)"
        text_color: 0x1F2933
        text_font: font_text_24
        align: TOP_LEFT
    - label:
        text: "Verzend EEPROM parameters naar OpenAmber Analytics."
        width: 72%
        text_color: 0x6B7280
        text_font: font_text_20
        align: TOP_LEFT
        y: 34
    - button:
        id: service_eeprom_dump_button
        width: 200
        height: 56
        align: TOP_RIGHT
        bg_color: 0x1F3B68
        radius: 10
        on_click:
          - lvgl.widget.disable: { id: service_eeprom_dump_button }
          - script.execute: dump_eeprom_parameters
        widgets:
          - label:
              text: "Dump EEPROM"
              text_color: 0xFFFFFF
              text_font: font_text_20
              align: CENTER