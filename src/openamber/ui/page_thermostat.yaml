obj:
  id: page_thermostat
  width: 100%
  height: 76%
  x: 0
  y: 70
  hidden: true
  bg_opa: 0%
  border_opa: 0%
  scrollbar_mode: "OFF"
  scrollable: false
  pad_left: 24
  pad_right: 24
  pad_top: 4
  pad_bottom: 4

  widgets:
    - obj:
        id: thermostat_page_card
        width: 100%
        height: 100%
        bg_color: 0xF5F8FC
        bg_opa: 100%
        radius: 18
        border_width: 0
        border_opa: 0%
        shadow_width: 10
        shadow_spread: 0
        shadow_color: 0x000000
        shadow_opa: 20%
        pad_all: 18
        scrollbar_mode: "OFF"
        scrollable: false

        widgets:
          - obj:
              id: home_thermostat_group
              width: 100%
              # Full height: with SIZE_CONTENT it stays 0 px high when the (initially hidden) panel appears.
              height: 100%
              bg_opa: 0%
              border_opa: 0%
              pad_all: 0
              scrollbar_mode: "OFF"
              scrollable: false
              widgets:
                # Shown only with the internal thermostat (update_home_thermostat_visibility).
                - obj:
                    id: home_thermostat_controls_panel
                    width: 100%
                    height: SIZE_CONTENT
                    hidden: true
                    bg_opa: 0%
                    border_opa: 0%
                    pad_all: 0
                    scrollbar_mode: "OFF"
                    scrollable: false
                    layout:
                      type: FLEX
                      flex_flow: COLUMN
                      flex_align_cross: CENTER
                      pad_row: 12
                    widgets:
                      # Mode tiles; update_home_thermostat_mode_ui colors the active one.
                      - obj:
                          id: home_therm_mode_group
                          width: 100%
                          height: SIZE_CONTENT
                          bg_opa: 0%
                          border_opa: 0%
                          pad_all: 0
                          scrollbar_mode: "OFF"
                          scrollable: false
                          layout:
                            type: FLEX
                            flex_flow: ROW
                            flex_align_main: SPACE_BETWEEN
                            flex_align_cross: CENTER
                          widgets:
                            - obj:
                                id: home_therm_mode_heat_btn
                                styles: menu_tile_style
                                width: 32%
                                height: 128
                                scrollable: false
                                pressed:
                                  styles: menu_tile_pressed_style
                                on_click:
                                  - lambda: |-
                                      {
                                        auto call = id(climate_controller).make_call();
                                        call.set_mode(climate::CLIMATE_MODE_HEAT);
                                        call.perform();
                                      }
                                      id(update_thermostat_settings_ui).execute();
                                widgets:
                                  - label: { id: home_therm_mode_heat_icon, text: "\U000F0238", styles: menu_tile_icon_style }
                                  - label: { id: home_therm_mode_heat_lbl, text: "${t_verwarmen}", long_mode: WRAP, styles: menu_tile_label_style }
                            - obj:
                                id: home_therm_mode_cool_btn
                                styles: menu_tile_style
                                width: 32%
                                height: 128
                                scrollable: false
                                pressed:
                                  styles: menu_tile_pressed_style
                                on_click:
                                  - lambda: |-
                                      {
                                        auto call = id(climate_controller).make_call();
                                        call.set_mode(climate::CLIMATE_MODE_COOL);
                                        call.perform();
                                      }
                                      id(update_thermostat_settings_ui).execute();
                                widgets:
                                  - label: { id: home_therm_mode_cool_icon, text: "\U000F0717", styles: menu_tile_icon_style }
                                  - label: { id: home_therm_mode_cool_lbl, text: "${t_koelen}", long_mode: WRAP, styles: menu_tile_label_style }
                            - obj:
                                id: home_therm_mode_off_btn
                                styles: menu_tile_style
                                width: 32%
                                height: 128
                                scrollable: false
                                pressed:
                                  styles: menu_tile_pressed_style
                                on_click:
                                  - lambda: |-
                                      auto call = id(climate_controller).make_call();
                                      call.set_mode(climate::CLIMATE_MODE_OFF);
                                      call.perform();
                                widgets:
                                  - label: { id: home_therm_mode_off_icon, text: "\U000F0906", styles: menu_tile_icon_style }
                                  - label: { id: home_therm_mode_off_lbl, text: "${t_uit_2}", long_mode: WRAP, styles: menu_tile_label_style }

                      # Room temperature and setpoint side by side.
                      - obj:
                          id: home_therm_compact_row
                          width: 100%
                          height: SIZE_CONTENT
                          bg_opa: 0%
                          border_opa: 0%
                          pad_all: 0
                          scrollbar_mode: "OFF"
                          scrollable: false
                          layout:
                            type: FLEX
                            flex_flow: ROW
                            flex_align_main: SPACE_BETWEEN
                            flex_align_cross: START
                          widgets:
                            - obj:
                                id: home_therm_current_temp_column
                                styles: setting_row_style
                                width: 49%
                                height: 156
                                scrollable: false
                                widgets:
                                  - label:
                                      id: home_therm_current_temp_title
                                      text: "${t_kamertemperatuur}"
                                      text_color: 0x6B7280
                                      text_font: font_text_20
                                      align: TOP_MID
                                  - obj:
                                      id: home_therm_current_temp_card
                                      width: SIZE_CONTENT
                                      height: SIZE_CONTENT
                                      align: CENTER
                                      y: 14
                                      bg_opa: 0%
                                      border_opa: 0%
                                      pad_all: 0
                                      scrollbar_mode: "OFF"
                                      scrollable: false
                                      layout:
                                        type: FLEX
                                        flex_flow: ROW
                                        flex_align_cross: CENTER
                                        pad_column: 10
                                      widgets:
                                        - label:
                                            id: home_therm_current_temp_icon
                                            text: "\U000F050F"
                                            styles: menu_tile_icon_style

                                            y: 0
                                        - label:
                                            id: home_therm_current_temp_value
                                            text: "-.-°C"
                                            text_color: 0x0F2547
                                            text_font: font_value_big

                            - obj:
                                id: home_therm_setpoint_column
                                styles: setting_row_style
                                width: 49%
                                height: 156
                                scrollable: false
                                widgets:
                                  - label:
                                      id: home_therm_setpoint_title
                                      text: "${t_ingestelde_temperatuur}"
                                      text_color: 0x6B7280
                                      text_font: font_text_20
                                      align: TOP_MID
                                  - obj:
                                      id: home_therm_setpoint_row
                                      width: SIZE_CONTENT
                                      height: SIZE_CONTENT
                                      align: CENTER
                                      y: 14
                                      bg_opa: 0%
                                      border_opa: 0%
                                      pad_all: 0
                                      scrollbar_mode: "OFF"
                                      scrollable: false
                                      layout:
                                        type: FLEX
                                        flex_flow: ROW
                                        flex_align_cross: CENTER
                                        pad_column: 16
                                      widgets:
                                        - obj:
                                            id: home_therm_setpoint_dec
                                            styles: setting_step_btn_style
                                            width: 58
                                            height: 58
                                            radius: 29
                                            scrollable: false
                                            pressed:
                                              styles: setting_step_btn_pressed_style
                                            on_click:
                                              - lambda: |-
                                                  {
                                                    auto mode = id(climate_controller).mode;
                                                    auto call = id(climate_controller).make_call();
                                                    float target = 0.0f;
                                                    if (mode == climate::CLIMATE_MODE_COOL) {
                                                      target = id(climate_controller).target_temperature_high - 0.1f;
                                                      call.set_target_temperature_high(target);
                                                    } else {
                                                      target = id(climate_controller).target_temperature_low - 0.1f;
                                                      call.set_target_temperature_low(target);
                                                    }
                                                    call.perform();
                                                  }
                                                  id(update_thermostat_settings_ui).execute();
                                            widgets:
                                              - label: { id: home_therm_setpoint_dec_lbl, text: "\U000F0374", styles: setting_step_icon_style, text_font: font_mdi_30 }

                                        - label:
                                            id: home_therm_setpoint_value
                                            text: "20.5°C"
                                            text_color: 0x0F2547
                                            text_font: font_value_big

                                        - obj:
                                            id: home_therm_setpoint_inc
                                            styles: setting_step_btn_style
                                            width: 58
                                            height: 58
                                            radius: 29
                                            scrollable: false
                                            pressed:
                                              styles: setting_step_btn_pressed_style
                                            on_click:
                                              - lambda: |-
                                                  {
                                                    auto mode = id(climate_controller).mode;
                                                    auto call = id(climate_controller).make_call();
                                                    float target = 0.0f;
                                                    if (mode == climate::CLIMATE_MODE_COOL) {
                                                      target = id(climate_controller).target_temperature_high + 0.1f;
                                                      call.set_target_temperature_high(target);
                                                    } else {
                                                      target = id(climate_controller).target_temperature_low + 0.1f;
                                                      call.set_target_temperature_low(target);
                                                    }
                                                    call.perform();
                                                  }
                                                  id(update_thermostat_settings_ui).execute();
                                            widgets:
                                              - label: { id: home_therm_setpoint_inc_lbl, text: "\U000F0415", styles: setting_step_icon_style, text_font: font_mdi_30 }
