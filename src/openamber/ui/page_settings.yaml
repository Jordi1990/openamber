obj:
  id: page_settings
  width: 100%
  height: 76%
  x: 0
  y: 70
  hidden: true
  bg_opa: 0%
  border_opa: 0%
  scrollbar_mode: "OFF"
  scrollable: false
  pad_left: 24
  pad_right: 24
  pad_top: 4
  pad_bottom: 4

  widgets:
    - obj:
        id: settings_card
        width: 100%
        height: 100%
        bg_color: 0xF5F8FC
        bg_opa: 100%
        radius: 18
        pad_left: 16
        pad_right: 16
        pad_top: 8
        pad_bottom: 8
        border_width: 0
        border_opa: 0%
        shadow_width: 10
        shadow_spread: 0
        shadow_color: 0x000000
        shadow_opa: 20%
        scrollbar_mode: "OFF"
        scrollable: false
        layout:
          type: GRID
          grid_rows: [FR(1)]
          grid_columns: [210, FR(1)]
          pad_column: 12

        widgets:
          - !include settings/page_settings_sidebar.yaml
          - obj:
              id: settings_content
              grid_cell_row_pos: 0
              grid_cell_column_pos: 1
              grid_cell_x_align: STRETCH
              grid_cell_y_align: STRETCH
              bg_opa: 0%
              border_opa: 0%
              scrollbar_mode: "OFF"
              scrollable: false
              widgets:
                - !include settings/page_settings_tab_general.yaml
                - obj:
                    id: sensor_calibration_pager
                    hidden: true
                    width: 100%
                    height: 44
                    align: BOTTOM_MID
                    y: -4
                    bg_opa: 0%
                    border_opa: 0%
                    pad_all: 0
                    layout:
                      type: FLEX
                      flex_flow: ROW
                      flex_align_main: CENTER
                      flex_align_cross: CENTER
                      pad_column: 8
                    widgets:
                      - obj:
                          id: sensor_calibration_page_1_button
                          width: 40
                          height: 36
                          bg_color: 0x1F3B68
                          bg_opa: 100%
                          radius: 8
                          border_opa: 0%
                          scrollbar_mode: "OFF"
                          scrollable: false
                          on_click:
                            - script.execute:
                                id: sensor_calibration_select_page
                                page: 1
                          widgets:
                            - label: { text: "\U000F0141", text_color: 0xFFFFFF, text_font: font_mdi_24, align: CENTER }
                      - label:
                          id: sensor_calibration_page_indicator
                          text: "Pagina 1 / 2"
                          text_color: 0x4B5563
                          text_font: font_text_20
                      - obj:
                          id: sensor_calibration_page_2_button
                          width: 40
                          height: 36
                          bg_color: 0xCBD5E1
                          bg_opa: 100%
                          radius: 8
                          border_opa: 0%
                          scrollbar_mode: "OFF"
                          scrollable: false
                          on_click:
                            - script.execute:
                                id: sensor_calibration_select_page
                                page: 2
                          widgets:
                            - label: { text: "\U000F0142", text_color: 0x4B5563, text_font: font_mdi_24, align: CENTER }
                - !include settings/page_settings_tab_advanced.yaml
                - !include settings/page_settings_tab_pump.yaml
                - !include settings/page_settings_tab_heating.yaml
                - !include settings/page_settings_tab_cooling.yaml
                - !include settings/page_settings_tab_dhw.yaml
                - !include settings/page_settings_tab_bijverwarmen.yaml
                - !include settings/page_settings_tab_smartgrid.yaml
                - !include settings/page_settings_tab_wifi.yaml
                - !include settings/page_settings_tab_thermostat.yaml
