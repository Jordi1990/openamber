obj:
  id: page_settings
  width: 100%
  height: 76%
  x: 0
  y: 70
  hidden: true
  bg_opa: 0%
  border_opa: 0%
  scrollbar_mode: "OFF"
  scrollable: false
  pad_left: 24
  pad_right: 24
  pad_top: 4
  pad_bottom: 4

  widgets:
    - obj:
        id: settings_card
        width: 100%
        height: 100%
        bg_color: 0xF5F8FC
        bg_opa: 100%
        radius: 18
        pad_left: 16
        pad_right: 16
        pad_top: 8
        pad_bottom: 8
        border_width: 0
        border_opa: 0%
        shadow_width: 10
        shadow_spread: 0
        shadow_color: 0x000000
        shadow_opa: 20%
        scrollbar_mode: "OFF"
        scrollable: false
        layout:
          type: GRID
          grid_rows: [FR(1)]
          grid_columns: [200, FR(1)]
          pad_column: 6

        widgets:
          - !include settings/page_settings_sidebar.yaml
          - obj:
              id: settings_content
              grid_cell_row_pos: 0
              grid_cell_column_pos: 1
              grid_cell_x_align: STRETCH
              grid_cell_y_align: STRETCH
              bg_opa: 0%
              border_opa: 0%
              pad_all: 0
              scrollbar_mode: "OFF"
              scrollable: false
              widgets:
                - !include settings/page_settings_tab_general.yaml
                - obj:
                    id: mengventielen_pager
                    hidden: true
                    width: 100%
                    height: 44
                    align: BOTTOM_MID
                    y: -4
                    bg_opa: 0%
                    border_opa: 0%
                    pad_all: 0
                    layout:
                      type: FLEX
                      flex_flow: ROW
                      flex_align_main: CENTER
                      flex_align_cross: CENTER
                      pad_column: 8
                    widgets:
                      - obj:
                          id: mengventielen_page_1_button
                          width: 40
                          height: 36
                          bg_color: 0xCBD5E1
                          bg_opa: 100%
                          radius: 8
                          border_opa: 0%
                          scrollbar_mode: "OFF"
                          scrollable: false
                          on_click:
                            - script.execute:
                                id: mengventielen_select_page
                                page: 1
                          widgets:
                            - label: { id: mengventielen_page_1_button_lbl, text: "\U000F0141", text_color: 0x4B5563, text_font: font_mdi_24, align: CENTER }
                      - label:
                          id: mengventielen_page_indicator
                          text: "Pagina 1 / 2"
                          text_color: 0x4B5563
                          text_font: font_text_20
                      - obj:
                          id: mengventielen_page_2_button
                          width: 40
                          height: 36
                          bg_color: 0x1F3B68
                          bg_opa: 100%
                          radius: 8
                          border_opa: 0%
                          scrollbar_mode: "OFF"
                          scrollable: false
                          on_click:
                            - script.execute:
                                id: mengventielen_select_page
                                page: 2
                          widgets:
                            - label: { id: mengventielen_page_2_button_lbl, text: "\U000F0142", text_color: 0xFFFFFF, text_font: font_mdi_24, align: CENTER }
                - obj:
                    id: sensor_calibration_pager
                    hidden: true
                    width: 100%
                    height: 44
                    align: BOTTOM_MID
                    y: -4
                    bg_opa: 0%
                    border_opa: 0%
                    pad_all: 0
                    layout:
                      type: FLEX
                      flex_flow: ROW
                      flex_align_main: CENTER
                      flex_align_cross: CENTER
                      pad_column: 8
                    widgets:
                      - obj:
                          id: sensor_calibration_page_1_button
                          width: 40
                          height: 36
                          bg_color: 0xCBD5E1
                          bg_opa: 100%
                          radius: 8
                          border_opa: 0%
                          scrollbar_mode: "OFF"
                          scrollable: false
                          on_click:
                            - script.execute:
                                id: sensor_calibration_select_page
                                page: 1
                          widgets:
                            - label: { id: sensor_calibration_page_1_button_lbl, text: "\U000F0141", text_color: 0x4B5563, text_font: font_mdi_24, align: CENTER }
                      - label:
                          id: sensor_calibration_page_indicator
                          text: "Pagina 1 / 2"
                          text_color: 0x4B5563
                          text_font: font_text_20
                      - obj:
                          id: sensor_calibration_page_2_button
                          width: 40
                          height: 36
                          bg_color: 0x1F3B68
                          bg_opa: 100%
                          radius: 8
                          border_opa: 0%
                          scrollbar_mode: "OFF"
                          scrollable: false
                          on_click:
                            - script.execute:
                                id: sensor_calibration_select_page
                                page: 2
                          widgets:
                            - label: { id: sensor_calibration_page_2_button_lbl, text: "\U000F0142", text_color: 0xFFFFFF, text_font: font_mdi_24, align: CENTER }
                - !include settings/page_settings_tab_advanced.yaml
                - obj:
                    id: advanced_pid_pager
                    hidden: true
                    width: 100%
                    height: 44
                    align: BOTTOM_MID
                    y: -4
                    bg_opa: 0%
                    border_opa: 0%
                    pad_all: 0
                    layout:
                      type: FLEX
                      flex_flow: ROW
                      flex_align_main: CENTER
                      flex_align_cross: CENTER
                      pad_column: 8
                    widgets:
                      - obj:
                          id: advanced_pid_page_prev_button
                          width: 40
                          height: 36
                          bg_color: 0xCBD5E1
                          bg_opa: 100%
                          radius: 8
                          border_opa: 0%
                          scrollbar_mode: "OFF"
                          scrollable: false
                          on_click:
                            - script.execute: advanced_pid_prev_page
                          widgets:
                            - label: { id: advanced_pid_page_prev_button_lbl, text: "\U000F0141", text_color: 0x4B5563, text_font: font_mdi_24, align: CENTER }
                      - label:
                          id: advanced_pid_page_indicator
                          text: "Pagina 1 / 7"
                          text_color: 0x4B5563
                          text_font: font_text_20
                      - obj:
                          id: advanced_pid_page_next_button
                          width: 40
                          height: 36
                          bg_color: 0x1F3B68
                          bg_opa: 100%
                          radius: 8
                          border_opa: 0%
                          scrollbar_mode: "OFF"
                          scrollable: false
                          on_click:
                            - script.execute: advanced_pid_next_page
                          widgets:
                            - label: { id: advanced_pid_page_next_button_lbl, text: "\U000F0142", text_color: 0xFFFFFF, text_font: font_mdi_24, align: CENTER }
                - obj:
                    id: advanced_defrost_pager
                    hidden: true
                    width: 100%
                    height: 44
                    align: BOTTOM_MID
                    y: -4
                    bg_opa: 0%
                    border_opa: 0%
                    pad_all: 0
                    layout:
                      type: FLEX
                      flex_flow: ROW
                      flex_align_main: CENTER
                      flex_align_cross: CENTER
                      pad_column: 8
                    widgets:
                      - obj:
                          id: advanced_defrost_page_1_button
                          width: 40
                          height: 36
                          bg_color: 0xCBD5E1
                          bg_opa: 100%
                          radius: 8
                          border_opa: 0%
                          scrollbar_mode: "OFF"
                          scrollable: false
                          on_click:
                            - script.execute:
                                id: advanced_defrost_select_page
                                page: 1
                          widgets:
                            - label: { id: advanced_defrost_page_1_button_lbl, text: "\U000F0141", text_color: 0x4B5563, text_font: font_mdi_24, align: CENTER }
                      - label:
                          id: advanced_defrost_page_indicator
                          text: "Pagina 1 / 2"
                          text_color: 0x4B5563
                          text_font: font_text_20
                      - obj:
                          id: advanced_defrost_page_2_button
                          width: 40
                          height: 36
                          bg_color: 0x1F3B68
                          bg_opa: 100%
                          radius: 8
                          border_opa: 0%
                          scrollbar_mode: "OFF"
                          scrollable: false
                          on_click:
                            - script.execute:
                                id: advanced_defrost_select_page
                                page: 2
                          widgets:
                            - label: { id: advanced_defrost_page_2_button_lbl, text: "\U000F0142", text_color: 0xFFFFFF, text_font: font_mdi_24, align: CENTER }
                - obj:
                    id: custom_defrost_pager
                    hidden: true
                    width: 100%
                    height: 44
                    align: BOTTOM_MID
                    y: -4
                    bg_opa: 0%
                    border_opa: 0%
                    pad_all: 0
                    layout:
                      type: FLEX
                      flex_flow: ROW
                      flex_align_main: CENTER
                      flex_align_cross: CENTER
                      pad_column: 8
                    widgets:
                      - obj:
                          id: custom_defrost_page_prev_button
                          width: 40
                          height: 36
                          bg_color: 0xCBD5E1
                          bg_opa: 100%
                          radius: 8
                          border_opa: 0%
                          scrollbar_mode: "OFF"
                          scrollable: false
                          on_click:
                            - script.execute:
                                id: custom_defrost_select_page
                                page: !lambda 'return id(custom_defrost_page) - 1;'
                          widgets:
                            - label: { id: custom_defrost_page_prev_button_lbl, text: "\U000F0141", text_color: 0x4B5563, text_font: font_mdi_24, align: CENTER }
                      - label:
                          id: custom_defrost_page_indicator
                          text: "Pagina 1 / 6"
                          text_color: 0x4B5563
                          text_font: font_text_20
                      - obj:
                          id: custom_defrost_page_next_button
                          width: 40
                          height: 36
                          bg_color: 0x1F3B68
                          bg_opa: 100%
                          radius: 8
                          border_opa: 0%
                          scrollbar_mode: "OFF"
                          scrollable: false
                          on_click:
                            - script.execute:
                                id: custom_defrost_select_page
                                page: !lambda 'return id(custom_defrost_page) + 1;'
                          widgets:
                            - label: { id: custom_defrost_page_next_button_lbl, text: "\U000F0142", text_color: 0xFFFFFF, text_font: font_mdi_24, align: CENTER }
                - !include settings/page_settings_tab_pump.yaml
                - obj:
                    id: pump_p0_pid_pager
                    hidden: true
                    width: 100%
                    height: 44
                    align: BOTTOM_MID
                    y: -4
                    bg_opa: 0%
                    border_opa: 0%
                    pad_all: 0
                    layout:
                      type: FLEX
                      flex_flow: ROW
                      flex_align_main: CENTER
                      flex_align_cross: CENTER
                      pad_column: 8
                    widgets:
                      - obj:
                          id: pump_p0_pid_page_1_button
                          width: 40
                          height: 36
                          bg_color: 0xCBD5E1
                          bg_opa: 100%
                          radius: 8
                          border_opa: 0%
                          scrollbar_mode: "OFF"
                          scrollable: false
                          on_click:
                            - script.execute:
                                id: pump_p0_pid_select_page
                                page: 1
                          widgets:
                            - label: { id: pump_p0_pid_page_1_button_lbl, text: "\U000F0141", text_color: 0x4B5563, text_font: font_mdi_24, align: CENTER }
                      - label:
                          id: pump_p0_pid_page_indicator
                          text: "Pagina 1 / 2"
                          text_color: 0x4B5563
                          text_font: font_text_20
                      - obj:
                          id: pump_p0_pid_page_2_button
                          width: 40
                          height: 36
                          bg_color: 0x1F3B68
                          bg_opa: 100%
                          radius: 8
                          border_opa: 0%
                          scrollbar_mode: "OFF"
                          scrollable: false
                          on_click:
                            - script.execute:
                                id: pump_p0_pid_select_page
                                page: 2
                          widgets:
                            - label: { id: pump_p0_pid_page_2_button_lbl, text: "\U000F0142", text_color: 0xFFFFFF, text_font: font_mdi_24, align: CENTER }
                - !include settings/page_settings_tab_heating.yaml
                - !include settings/page_settings_tab_cooling.yaml
                - !include settings/page_settings_tab_dhw.yaml
                - !include settings/page_settings_tab_bijverwarmen.yaml
                - !include settings/page_settings_tab_smartgrid.yaml
                - obj:
                    id: eebus_pager
                    hidden: true
                    width: 100%
                    height: 44
                    align: BOTTOM_MID
                    y: -4
                    bg_opa: 0%
                    border_opa: 0%
                    pad_all: 0
                    layout:
                      type: FLEX
                      flex_flow: ROW
                      flex_align_main: CENTER
                      flex_align_cross: CENTER
                      pad_column: 8
                    widgets:
                      - obj:
                          id: eebus_page_1_button
                          width: 40
                          height: 36
                          bg_color: 0x1F3B68
                          bg_opa: 100%
                          radius: 8
                          border_opa: 0%
                          scrollbar_mode: "OFF"
                          scrollable: false
                          on_click:
                            - script.execute:
                                id: eebus_select_page
                                page: 1
                          widgets:
                            - label: { id: eebus_page_1_button_lbl, text: "\U000F0141", text_color: 0xFFFFFF, text_font: font_mdi_24, align: CENTER }
                      - label:
                          id: eebus_page_indicator
                          text: "Pagina 1 / 2"
                          text_color: 0x4B5563
                          text_font: font_text_20
                      - obj:
                          id: eebus_page_2_button
                          width: 40
                          height: 36
                          bg_color: 0xCBD5E1
                          bg_opa: 100%
                          radius: 8
                          border_opa: 0%
                          scrollbar_mode: "OFF"
                          scrollable: false
                          on_click:
                            - script.execute:
                                id: eebus_select_page
                                page: 2
                          widgets:
                            - label: { id: eebus_page_2_button_lbl, text: "\U000F0142", text_color: 0x4B5563, text_font: font_mdi_24, align: CENTER }
                - !include settings/page_settings_tab_wifi.yaml
                - !include settings/page_settings_tab_thermostat.yaml

    - obj:
        id: custom_defrost_confirm_modal
        width: 100%
        height: 100%
        hidden: true
        bg_color: 0x000000
        bg_opa: 45%
        radius: 18
        border_width: 0
        border_opa: 0%
        pad_all: 0
        scrollbar_mode: "OFF"
        scrollable: false

        widgets:
          - obj:
              id: custom_defrost_confirm_modal_card
              width: 580
              height: 280
              align: CENTER
              bg_color: 0xFFFFFF
              bg_opa: 100%
              radius: 18
              border_width: 0
              border_opa: 0%
              pad_left: 22
              pad_right: 22
              pad_top: 18
              pad_bottom: 18
              scrollbar_mode: "OFF"
              scrollable: false

              widgets:
                - label:
                    text: "Defrost-regie naar OpenAmber"
                    text_color: 0x1F2933
                    text_font: font_text_24
                    align: TOP_LEFT

                - label:
                    width: 100%
                    text: "De buitenunit ontdooit dan niet meer zelf, OpenAmber start de defrosts. Lukt een defrost niet, dan valt de regie automatisch terug naar de buitenunit. Test eerst met dry-run."
                    text_color: 0x1F2933
                    text_font: font_text_20
                    long_mode: WRAP
                    align: TOP_LEFT
                    y: 48

                - obj:
                    id: custom_defrost_confirm_modal_cancel_button
                    width: 200
                    height: 52
                    align: BOTTOM_LEFT
                    bg_color: 0xCBD5E1
                    bg_opa: 100%
                    radius: 14
                    border_width: 0
                    border_opa: 0%
                    pad_all: 0
                    scrollbar_mode: "OFF"
                    scrollable: false
                    on_click:
                      - lvgl.widget.hide:
                          id: custom_defrost_confirm_modal
                    widgets:
                      - label:
                          text: "Annuleren"
                          text_color: 0x1F2933
                          text_font: font_text_24
                          align: CENTER

                - obj:
                    id: custom_defrost_confirm_modal_ok_button
                    width: 200
                    height: 52
                    align: BOTTOM_RIGHT
                    bg_color: 0x0072CE
                    bg_opa: 100%
                    radius: 14
                    border_width: 0
                    border_opa: 0%
                    pad_all: 0
                    scrollbar_mode: "OFF"
                    scrollable: false
                    on_click:
                      - lvgl.widget.hide:
                          id: custom_defrost_confirm_modal
                      - select.set:
                          id: custom_defrost_mode_select
                          option: "OpenAmber"
                    widgets:
                      - label:
                          text: "Activeren"
                          text_color: 0xFFFFFF
                          text_font: font_text_24
                          align: CENTER

    - obj:
        id: default_compressor_frequencies_modal
        width: 100%
        height: 100%
        hidden: true
        bg_color: 0x000000
        bg_opa: 45%
        radius: 18
        border_width: 0
        border_opa: 0%
        pad_all: 0
        scrollbar_mode: "OFF"
        scrollable: false

        widgets:
          - obj:
              id: default_compressor_frequencies_modal_card
              width: 580
              height: 260
              align: CENTER
              bg_color: 0xFFFFFF
              bg_opa: 100%
              radius: 18
              border_width: 0
              border_opa: 0%
              pad_left: 22
              pad_right: 22
              pad_top: 18
              pad_bottom: 18
              scrollbar_mode: "OFF"
              scrollable: false

              widgets:
                - label:
                    id: default_compressor_frequencies_modal_title
                    text: "Herstart vereist"
                    text_color: 0x1F2933
                    text_font: font_text_24
                    align: TOP_LEFT

                - label:
                    id: default_compressor_frequencies_modal_text
                    width: 100%
                    text: "Om de standaard compressorfrequenties te activeren moet de complete warmtepomp inclusief buitenunit opnieuw worden opgestart door de stroom kort te onderbreken."
                    text_color: 0x1F2933
                    text_font: font_text_20
                    long_mode: WRAP
                    align: TOP_LEFT
                    y: 48

                - obj:
                    id: default_compressor_frequencies_modal_ok_button
                    width: 200
                    height: 52
                    align: BOTTOM_RIGHT
                    bg_color: 0x0072CE
                    bg_opa: 100%
                    radius: 14
                    border_width: 0
                    border_opa: 0%
                    pad_all: 0
                    scrollbar_mode: "OFF"
                    scrollable: false
                    on_click:
                      - lvgl.widget.hide:
                          id: default_compressor_frequencies_modal
                    widgets:
                      - label:
                          id: default_compressor_frequencies_modal_ok_label
                          text: "Begrepen"
                          text_color: 0xFFFFFF
                          text_font: font_text_24
                          align: CENTER
