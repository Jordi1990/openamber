obj:
  id: page_settings
  width: 100%
  height: 76%
  x: 0
  y: 70
  hidden: true
  bg_opa: 0%
  border_opa: 0%
  scrollbar_mode: "OFF"
  scrollable: false
  pad_left: 24
  pad_right: 24
  pad_top: 4
  pad_bottom: 4

  widgets:
    - menu:
        id: settings_menu
        root_page: settings_overview_page
        width: 100%
        height: 100%
        bg_color: 0xF5F8FC
        bg_opa: 100%
        radius: 18
        border_width: 0
        border_opa: 0%
        shadow_width: 10
        shadow_spread: 0
        shadow_color: 0x000000
        shadow_opa: 20%
        header_style:
          bg_color: 0xF5F8FC
          bg_opa: 100%
          height: 60
          pad_left: 16
          pad_right: 16
          pad_top: 8
          pad_bottom: 8
          text_font: font_text_24
          text_color: 0x1F2933
        on_value:
          - script.execute: setup_menu_header_ui
        pages:
          - !include settings/page_settings_overview.yaml
          - !include settings/page_settings_tab_general.yaml
          - !include settings/page_settings_tab_general_systeem.yaml
          - !include settings/page_settings_tab_general_display.yaml
          - !include settings/page_settings_tab_general_analytics.yaml
          - !include settings/page_settings_tab_general_stiltemodus.yaml
          - !include settings/page_settings_tab_general_hardware.yaml
          - !include settings/page_settings_tab_general_mengventielen.yaml
          - !include settings/page_settings_tab_general_mengventielen_z1.yaml
          - !include settings/page_settings_tab_general_mengventielen_z2.yaml
          - !include settings/page_settings_tab_general_sensorkalibratie.yaml
          - !include settings/page_settings_tab_general_sensorkalibratie_ruimte.yaml
          - !include settings/page_settings_tab_general_sensorkalibratie_cv.yaml
          - !include settings/page_settings_tab_thermostat.yaml
          - !include settings/page_settings_tab_thermostat_setpoint.yaml
          - !include settings/page_settings_tab_thermostat_verwarmen.yaml
          - !include settings/page_settings_tab_thermostat_koelen.yaml
          - !include settings/page_settings_tab_thermostat_extern.yaml
          - !include settings/page_settings_tab_pump.yaml
          - !include settings/page_settings_tab_pump_algemeen.yaml
          - !include settings/page_settings_tab_pump_pompsnelheid.yaml
          - !include settings/page_settings_tab_pump_p0_pid.yaml
          - !include settings/page_settings_tab_pump_p0_pid_limieten.yaml
          - !include settings/page_settings_tab_pump_p0_pid_params.yaml
          - !include settings/page_settings_tab_pump_vorstbescherming.yaml
          - !include settings/page_settings_tab_heating.yaml
          - !include settings/page_settings_tab_heating_algemeen.yaml
          - !include settings/page_settings_tab_heating_stooklijn.yaml
          - !include settings/page_settings_tab_heating_stooklijn_z2.yaml
          - !include settings/page_settings_tab_heating_start_stop.yaml
          - !include settings/page_settings_tab_heating_noodbedrijf.yaml
          - !include settings/page_settings_tab_cooling.yaml
          - !include settings/page_settings_tab_cooling_algemeen.yaml
          - !include settings/page_settings_tab_cooling_setpoint.yaml
          - !include settings/page_settings_tab_dhw.yaml
          - !include settings/page_settings_tab_dhw_algemeen.yaml
          - !include settings/page_settings_tab_dhw_schema.yaml
          - !include settings/page_settings_tab_dhw_legionella.yaml
          - !include settings/page_settings_tab_dhw_winter.yaml
          - !include settings/page_settings_tab_bijverwarmen.yaml
          - !include settings/page_settings_tab_bijverwarmen_algemeen.yaml
          - !include settings/page_settings_tab_bijverwarmen_verwarmen.yaml
          - !include settings/page_settings_tab_bijverwarmen_tapwater.yaml
          - !include settings/page_settings_tab_smartgrid.yaml
          - !include settings/page_settings_tab_energie_sgready.yaml
          - !include settings/page_settings_tab_energie_eebus.yaml
          - !include settings/page_settings_tab_wifi.yaml
          - !include settings/page_settings_tab_wifi_wifi.yaml
          - !include settings/page_settings_tab_advanced.yaml
          - !include settings/page_settings_tab_advanced_pid.yaml
          - !include settings/page_settings_tab_advanced_pid_heat.yaml
          - !include settings/page_settings_tab_advanced_pid_cool.yaml
          - !include settings/page_settings_tab_advanced_pid_pump.yaml
          - !include settings/page_settings_tab_advanced_pid_mv1.yaml
          - !include settings/page_settings_tab_advanced_pid_mv2.yaml
          - !include settings/page_settings_tab_advanced_bodemplaat.yaml
          - !include settings/page_settings_tab_advanced_defrost.yaml
          - !include settings/page_settings_tab_advanced_defrost_temps.yaml
          - !include settings/page_settings_tab_advanced_compressor.yaml
          - !include settings/page_settings_tab_advanced_fan.yaml
          - !include settings/page_settings_tab_advanced_fan_heat_ta.yaml
          - !include settings/page_settings_tab_advanced_fan_heat_hz.yaml
          - !include settings/page_settings_tab_advanced_fan_cool_ta.yaml
          - !include settings/page_settings_tab_advanced_fan_cool_hz.yaml
          - !include settings/page_settings_tab_advanced_pump.yaml

    - obj:
        id: outdoor_unit_optimizations_modal
        width: 100%
        height: 100%
        hidden: true
        bg_color: 0x000000
        bg_opa: 45%
        radius: 18
        border_width: 0
        border_opa: 0%
        pad_all: 0
        scrollbar_mode: "OFF"
        scrollable: false

        widgets:
          - obj:
              id: outdoor_unit_optimizations_modal_card
              width: 580
              height: 260
              align: CENTER
              bg_color: 0xFFFFFF
              bg_opa: 100%
              radius: 18
              border_width: 0
              border_opa: 0%
              pad_left: 22
              pad_right: 22
              pad_top: 18
              pad_bottom: 18
              scrollbar_mode: "OFF"
              scrollable: false

              widgets:
                - label:
                    id: outdoor_unit_optimizations_modal_title
                    text: "${t_herstart_vereist}"
                    text_color: 0x1F2933
                    text_font: font_text_24
                    align: TOP_LEFT

                - label:
                    id: outdoor_unit_optimizations_modal_text
                    width: 100%
                    text: "${t_om_de_standaard_instellingen_van_de_buit}"
                    text_color: 0x1F2933
                    text_font: font_text_20
                    long_mode: WRAP
                    align: TOP_LEFT
                    y: 48

                - obj:
                    id: outdoor_unit_optimizations_modal_ok_button
                    width: 200
                    height: 52
                    align: BOTTOM_RIGHT
                    bg_color: 0x0072CE
                    bg_opa: 100%
                    radius: 14
                    border_width: 0
                    border_opa: 0%
                    pad_all: 0
                    scrollbar_mode: "OFF"
                    scrollable: false
                    on_click:
                      - lvgl.widget.hide:
                          id: outdoor_unit_optimizations_modal
                    widgets:
                      - label:
                          id: outdoor_unit_optimizations_modal_ok_label
                          text: "${t_begrepen}"
                          text_color: 0xFFFFFF
                          text_font: font_text_24
                          align: CENTER
