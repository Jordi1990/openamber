# System -> Beheer: software status card and action tiles. Diagnostiek opens system_diagnostics_panel.
obj:
  id: service_updates_panel
  width: 100%
  height: 100%
  bg_opa: 0%
  border_opa: 0%
  pad_all: 0
  scrollbar_mode: AUTO
  scrollable: true
  layout:
    type: FLEX
    flex_flow: COLUMN
    flex_align_main: START
    flex_align_cross: CENTER
    pad_row: 12
  widgets:
    - obj:
        id: service_update_card
        styles: setting_row_style
        scrollable: false
        widgets:
        - label:
            id: service_update_status
            # The update scripts put the whole status in service_update_version.
            hidden: true
            width: 62%
            text: "${t_controleren_op_update}"
            text_color: 0x1F2933
            text_font: font_mdi_24
            long_mode: WRAP
            align: TOP_LEFT

        - label:
            id: service_update_version
            width: 62%
            text: "${t_versie_informatie_wordt_geladen}"
            text_color: 0x1F2933
            text_font: font_text_24
            long_mode: WRAP
            align: TOP_LEFT

        - label:
            id: service_update_error
            width: 62%
            text: ""
            hidden: true
            text_color: 0xEF4444
            text_font: font_text_20
            long_mode: WRAP
            align: TOP_LEFT
            y: 80

        - obj:
            id: service_update_button
            width: 250
            height: 52
            align: TOP_LEFT
            y: 80
            hidden: true
            bg_color: 0x0072CE
            bg_opa: 100%
            radius: 26
            border_width: 0
            border_opa: 0%
            pad_all: 0
            on_click:
              - lambda: |-
                  // Outside standby the heat pump is in operation (also while the compressor or pump is idle):
                  // offer to stop it in a controlled way first.
                  bool active = !id(amber_ctrl).is_standby();
                  id(service_confirm_action) = active ? 4 : 2;
                  if (active) {
                    lv_obj_set_size(id(service_confirm_card), 620, 330);
                    lv_obj_set_width(id(service_confirm_cancel_button), 150);
                    lv_obj_set_width(id(service_confirm_button), 190);
                    lv_obj_remove_flag(id(service_confirm_stop_first_button), LV_OBJ_FLAG_HIDDEN);
                  }
                  bool to_stable = id(service_update_to_stable);
                  id(service_update_target) = id(firmware_update).update_info.latest_version;
                  lv_label_set_text(id(service_confirm_title), active ? oa_tr("Warmtepomp in bedrijf")
                      : (to_stable ? oa_tr("Stabiele versie installeren") : oa_tr("Update bevestigen")));
                  lv_obj_send_event(id(service_confirm_title), lvgl::lv_update_event, nullptr);
                  lv_label_set_text(id(service_confirm_text), active
                      ? oa_tr("De update kan veilig tijdens bedrijf. Of stop eerst gecontroleerd en start de update opnieuw zodra de status Standby is.")
                      : (to_stable ? oa_tr("Wil je de beta vervangen door de stabiele versie?")
                                  : oa_tr("Wil je de firmware update nu starten?")));
                  lv_obj_send_event(id(service_confirm_text), lvgl::lv_update_event, nullptr);
                  lv_label_set_text(id(service_confirm_button_label), active ? oa_tr("Nu updaten")
                      : (to_stable ? oa_tr("Installeren") : oa_tr("Update starten")));
                  lv_obj_send_event(id(service_confirm_button_label), lvgl::lv_update_event, nullptr);
                  lv_obj_set_style_bg_color(id(service_confirm_button), lv_color_hex(0x0072CE), LV_PART_MAIN);
                  lv_obj_remove_flag(id(service_confirm_modal), LV_OBJ_FLAG_HIDDEN);
            widgets:
              - label:
                  id: service_update_button_label
                  text: "${t_update_installeren}"
                  text_color: 0xFFFFFF
                  text_font: font_text_20
                  align: CENTER

        - label:
            id: service_release_qr_hint
            width: 120
            text: "${t_release_info}"
            hidden: true
            text_color: 0x6B7280
            text_font: font_text_20
            text_align: CENTER
            align: TOP_RIGHT
            y: 126

        - qrcode:
            id: service_release_qr
            hidden: true
            align: TOP_RIGHT
            # 120 keeps the card low enough for the update channel row below the tiles to fit without scrolling.
            size: 120
            dark_color: 0x000000
            light_color: 0xFFFFFF
            text: "https://github.com/Jordi1990/openamber/releases"

    # Actions as tiles; the update scripts gray out the ones that are not available.
    - obj:
        id: service_action_row
        width: 100%
        height: SIZE_CONTENT
        bg_opa: 0%
        border_opa: 0%
        pad_all: 0
        scrollbar_mode: "OFF"
        scrollable: false
        layout:
          type: FLEX
          flex_flow: ROW
          flex_align_main: SPACE_BETWEEN
          flex_align_cross: CENTER
        widgets:
        - obj:
            id: service_check_update_button
            styles: menu_tile_style
            width: 23.5%
            height: 128
            scrollable: false
            pressed:
              styles: menu_tile_pressed_style
            on_click:
              - globals.set:
                  id: service_update_check_failed
                  value: 'false'
              - globals.set:
                  id: service_update_check_in_progress
                  value: 'true'
              - lambda: |-
                  lvgl::LvglComponent::lv_obj_set_state_value(id(service_check_update_button), LV_STATE_DISABLED, true);
                  lv_obj_set_style_bg_color(id(service_check_update_button), lv_color_hex(0xEDF1F6), LV_PART_MAIN);
                  lv_label_set_text(id(service_check_update_button_label), oa_tr("Ophalen..."));
                  lv_obj_send_event(id(service_check_update_button_label), lvgl::lv_update_event, nullptr);
                  lv_obj_set_style_text_color(id(service_check_update_button_label), lv_color_hex(0x9CA3AF), LV_PART_MAIN);
              - update.check:
                  id: firmware_update
              - delay: 30s
              - if:
                  condition:
                    and:
                      - not:
                          update.is_available: firmware_update
                      - lambda: |-
                          const auto &info = id(firmware_update).update_info;
                          return info.latest_version.empty() && info.release_url.empty();
                  then:
                    - globals.set:
                        id: service_update_check_failed
                        value: 'true'
                  else:
                    - globals.set:
                        id: service_update_check_failed
                        value: 'false'
              - globals.set:
                  id: service_update_check_in_progress
                  value: 'false'
              - script.execute: update_firmware_ui
            widgets:
              - label: { text: "\U000F06B0", styles: menu_tile_icon_style }
              - label: { id: service_check_update_button_label, text: "${t_controleer_updates}", long_mode: WRAP, styles: menu_tile_label_style }
        - obj:
            id: service_controlled_stop_button
            styles: menu_tile_style
            width: 23.5%
            height: 128
            scrollable: false
            pressed:
              styles: menu_tile_pressed_style
            on_click:
              - if:
                  condition:
                    lambda: 'return id(controlled_stop_active);'
                  then:
                    - if:
                        condition:
                          lambda: 'return !id(service_mode_enabled).state && id(amber_ctrl).is_standby();'
                        then:
                          - button.press: controlled_stop_resume_button
                          - lambda: |-
                              lv_label_set_text(id(service_controlled_stop_button_label), oa_tr("Stop warmtepomp"));
                              lv_obj_send_event(id(service_controlled_stop_button_label), lvgl::lv_update_event, nullptr);
                              id(update_header_mode_badge).execute();
                  else:
                    - globals.set:
                        id: service_confirm_action
                        value: '3'
                    - lambda: |-
                        lv_label_set_text(id(service_confirm_title), oa_tr("Warmtepomp stoppen"));
                        lv_obj_send_event(id(service_confirm_title), lvgl::lv_update_event, nullptr);
                        lv_label_set_text(id(service_confirm_text), oa_tr("De warmtepomp wordt gecontroleerd uit bedrijf genomen. De regeling hervat automatisch na 30 minuten."));
                        lv_obj_send_event(id(service_confirm_text), lvgl::lv_update_event, nullptr);
                        lv_label_set_text(id(service_confirm_button_label), oa_tr("Stoppen"));
                        lv_obj_send_event(id(service_confirm_button_label), lvgl::lv_update_event, nullptr);
                        lv_obj_set_style_bg_color(id(service_confirm_button), lv_color_hex(0x0072CE), LV_PART_MAIN);
                        lv_obj_remove_flag(id(service_confirm_modal), LV_OBJ_FLAG_HIDDEN);
            widgets:
              - label: { text: "\U000F0906", styles: menu_tile_icon_style }
              - label: { id: service_controlled_stop_button_label, text: "${t_stop_warmtepomp}", long_mode: WRAP, styles: menu_tile_label_style }
        - obj:
            id: service_restart_button
            styles: menu_tile_style
            width: 23.5%
            height: 128
            scrollable: false
            pressed:
              styles: menu_tile_pressed_style
            on_click:
              - globals.set:
                  id: service_confirm_action
                  value: '1'
              - lambda: |-
                  lv_label_set_text(id(service_confirm_title), oa_tr("Herstarten bevestigen"));
                  lv_obj_send_event(id(service_confirm_title), lvgl::lv_update_event, nullptr);
                  lv_label_set_text(id(service_confirm_text), oa_tr("Wil je OpenAmber nu herstarten?"));
                  lv_obj_send_event(id(service_confirm_text), lvgl::lv_update_event, nullptr);
                  lv_label_set_text(id(service_confirm_button_label), oa_tr("Herstarten"));
                  lv_obj_send_event(id(service_confirm_button_label), lvgl::lv_update_event, nullptr);
                  lv_obj_set_style_bg_color(id(service_confirm_button), lv_color_hex(0x0072CE), LV_PART_MAIN);
                  lv_obj_remove_flag(id(service_confirm_modal), LV_OBJ_FLAG_HIDDEN);
            widgets:
              - label: { text: "\U000F0709", styles: menu_tile_icon_style }
              - label: { id: service_restart_button_label, text: "${t_herstarten}", long_mode: WRAP, styles: menu_tile_label_style }
        - obj:
            id: system_tab_diagnostics
            styles: menu_tile_style
            width: 23.5%
            height: 128
            scrollable: false
            pressed:
              styles: menu_tile_pressed_style
            on_click:
              - lambda: |-
                  lv_obj_add_flag(id(service_updates_panel), LV_OBJ_FLAG_HIDDEN);
                  lv_obj_remove_flag(id(system_diagnostics_panel), LV_OBJ_FLAG_HIDDEN);
                  id(update_system_diagnostics_ui).execute();
            widgets:
              - label: { text: "\U000F04D9", styles: menu_tile_icon_style }
              - label: { id: system_tab_diagnostics_lbl, text: "${t_diagnostiek}", long_mode: WRAP, styles: menu_tile_label_style }

    # Update channel: Beta offers new versions earlier. Switching it checks the chosen manifest right away.
    - obj:
        id: service_update_channel_row
        styles: setting_row_style
        scrollable: false
        widgets:
          - label: { text: "${t_updatekanaal}", text_color: 0x1F2933, text_font: font_text_24, align: TOP_LEFT }
          - label: { text: "${t_beta_geeft_nieuwe_versies_eerder_met_mee}", text_color: 0x6B7280, text_font: font_text_20, align: TOP_LEFT, y: 32 }
          - dropdown:
              id: service_update_channel_dd
              symbol: "󰅀"
              width: 220
              align: TOP_RIGHT
              y: 0
              options:
                - "${t_stabiel}"
                - "${t_beta}"
              selected_index: 0
              text_font: font_text_20
              dropdown_list:
                text_font: font_text_20
              on_change:
                then:
                  - lambda: |-
                      auto val = lv_dropdown_get_selected(id(service_update_channel_dd)->obj);
                      auto idx = id(firmware_update_channel).active_index();
                      if (idx.has_value() && idx.value() == (size_t) val) return;
                      id(firmware_update_channel).make_call().set_index(val).perform();
