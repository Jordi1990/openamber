obj:
  id: service_updates_panel
  width: 100%
  height: 100%
  align: TOP_LEFT
  y: 0
  hidden: false
  bg_opa: 0%
  border_opa: 0%
  pad_all: 0
  scrollbar_mode: "OFF"
  scrollable: false
  widgets:
    - label:
        id: service_update_status
        width: 62%
        text: "Controleren op update..."
        text_color: 0x1F2933
        text_font: font_mdi_24
        long_mode: WRAP
        align: TOP_LEFT

    - obj:
        id: service_update_button
        width: 180
        height: 52
        align: BOTTOM_RIGHT
        y: 0
        hidden: true
        bg_color: 0x0072CE
        bg_opa: 100%
        radius: 14
        border_width: 0
        border_opa: 0%
        pad_all: 0
        on_click:
          - lambda: |-
              // While the heat pump runs, offer to stop it in a controlled way first.
              bool active = id(current_compressor_frequency).state > 0 ||
                            id(compressor_control_select).active_index().value_or(0) > 0 ||
                            id(internal_pump_active).state;
              id(service_confirm_action) = active ? 4 : 2;
              if (active) {
                lv_obj_set_size(id(service_confirm_card), 620, 330);
                lv_obj_set_width(id(service_confirm_cancel_button), 150);
                lv_obj_set_width(id(service_confirm_button), 190);
                lv_obj_remove_flag(id(service_confirm_stop_first_button), LV_OBJ_FLAG_HIDDEN);
              }
              lv_label_set_text(id(service_confirm_title), active ? "Warmtepomp actief" : "Update bevestigen");
              lv_obj_send_event(id(service_confirm_title), lvgl::lv_update_event, nullptr);
              lv_label_set_text(id(service_confirm_text), active
                  ? "De update kan veilig tijdens bedrijf. Je kunt ook eerst gecontroleerd stoppen; de update start dan vanzelf in standby."
                  : "Wil je de firmware update nu starten?");
              lv_obj_send_event(id(service_confirm_text), lvgl::lv_update_event, nullptr);
              lv_label_set_text(id(service_confirm_button_label), active ? "Nu updaten" : "Update starten");
              lv_obj_send_event(id(service_confirm_button_label), lvgl::lv_update_event, nullptr);
              lv_obj_set_style_bg_color(id(service_confirm_button), lv_color_hex(0x0072CE), LV_PART_MAIN);
              lv_obj_remove_flag(id(service_confirm_modal), LV_OBJ_FLAG_HIDDEN);
        widgets:
          - label:
              id: service_update_button_label
              text: "Update"
              text_color: 0xFFFFFF
              text_font: font_mdi_24
              align: CENTER

    - obj:
        id: service_check_update_button
        width: 250
        height: 52
        align: TOP_RIGHT
        y: -2
        hidden: false
        bg_color: 0x0072CE
        bg_opa: 100%
        radius: 14
        border_width: 0
        border_opa: 0%
        pad_all: 0
        on_click:
          - globals.set:
              id: service_update_check_failed
              value: 'false'
          - globals.set:
              id: service_update_check_in_progress
              value: 'true'
          - lambda: |-
              lvgl::LvglComponent::lv_obj_set_state_value(id(service_check_update_button), LV_STATE_DISABLED, true);
              lv_obj_set_style_bg_color(id(service_check_update_button), lv_color_hex(0xC7CDD6), LV_PART_MAIN);
              lv_label_set_text(id(service_check_update_button_label), "Ophalen...");
              lv_obj_send_event(id(service_check_update_button_label), lvgl::lv_update_event, nullptr);
              lv_obj_set_style_text_color(id(service_check_update_button_label), lv_color_hex(0x4B5563), LV_PART_MAIN);
          - update.check:
              id: firmware_update
          - delay: 30s
          - if:
              condition:
                and:
                  - not:
                      update.is_available: firmware_update
                  - lambda: |-
                      const auto &info = id(firmware_update).update_info;
                      return info.latest_version.empty() && info.release_url.empty();
              then:
                - globals.set:
                    id: service_update_check_failed
                    value: 'true'
              else:
                - globals.set:
                    id: service_update_check_failed
                    value: 'false'
          - globals.set:
              id: service_update_check_in_progress
              value: 'false'
          - script.execute: update_firmware_ui
        widgets:
          - label:
              id: service_check_update_button_label
              text: "Controleer updates"
              text_color: 0xFFFFFF
              text_font: font_mdi_24
              align: CENTER

    - label:
        id: service_update_version
        width: 96%
        text: "Versie informatie wordt geladen..."
        text_color: 0x1F2933
        text_font: font_mdi_24
        long_mode: WRAP
        align: TOP_LEFT
        y: 32

    - label:
        id: service_update_error
        width: 96%
        text: ""
        hidden: true
        text_color: 0xEF4444
        text_font: font_mdi_24
        long_mode: WRAP
        align: TOP_LEFT
        y: 68

    - label:
        id: service_release_qr_hint
        text: "Scan QR voor release info"
        hidden: true
        text_color: 0x1F2933
        text_font: font_mdi_24
        align: TOP_LEFT
        y: 110

    - qrcode:
        id: service_release_qr
        hidden: true
        align: TOP_MID
        y: 138
        size: 180
        dark_color: 0x000000
        light_color: 0xFFFFFF
        text: "https://github.com/Jordi1990/openamber/releases"

    - obj:
        id: service_controlled_stop_button
        width: 200
        height: 52
        align: BOTTOM_LEFT
        y: -64
        bg_color: 0xE5E7EB
        bg_opa: 100%
        radius: 14
        border_width: 0
        border_opa: 0%
        pad_all: 0
        on_click:
          - globals.set:
              id: service_confirm_action
              value: '3'
          - lambda: |-
              lv_label_set_text(id(service_confirm_title), "Gecontroleerd stoppen");
              lv_obj_send_event(id(service_confirm_title), lvgl::lv_update_event, nullptr);
              lv_label_set_text(id(service_confirm_text), "Compressor en pompen netjes stoppen? Hervat vanzelf na 30 min.");
              lv_obj_send_event(id(service_confirm_text), lvgl::lv_update_event, nullptr);
              lv_label_set_text(id(service_confirm_button_label), "Stoppen");
              lv_obj_send_event(id(service_confirm_button_label), lvgl::lv_update_event, nullptr);
              lv_obj_set_style_bg_color(id(service_confirm_button), lv_color_hex(0x0072CE), LV_PART_MAIN);
              lv_obj_remove_flag(id(service_confirm_modal), LV_OBJ_FLAG_HIDDEN);
        widgets:
          - label:
              id: service_controlled_stop_button_label
              text: "Stoppen"
              text_color: 0x1F2933
              text_font: font_mdi_24
              align: CENTER

    - obj:
        id: service_controlled_stop_resume_button
        width: 200
        height: 52
        align: BOTTOM_LEFT
        x: 212
        y: -64
        bg_color: 0xE5E7EB
        bg_opa: 100%
        radius: 14
        border_width: 0
        border_opa: 0%
        pad_all: 0
        on_click:
          - button.press: controlled_stop_resume_button
        widgets:
          - label:
              id: service_controlled_stop_resume_button_label
              text: "Hervatten"
              text_color: 0x1F2933
              text_font: font_mdi_24
              align: CENTER

    - obj:
        id: service_restart_button
        width: 250
        height: 52
        align: BOTTOM_LEFT
        bg_color: 0xE5E7EB
        bg_opa: 100%
        radius: 14
        border_width: 0
        border_opa: 0%
        pad_all: 0
        on_click:
          - globals.set:
              id: service_confirm_action
              value: '1'
          - lambda: |-
              lv_label_set_text(id(service_confirm_title), "Herstarten bevestigen");
              lv_obj_send_event(id(service_confirm_title), lvgl::lv_update_event, nullptr);
              lv_label_set_text(id(service_confirm_text), "Wil je OpenAmber nu herstarten?");
              lv_obj_send_event(id(service_confirm_text), lvgl::lv_update_event, nullptr);
              lv_label_set_text(id(service_confirm_button_label), "Herstarten");
              lv_obj_send_event(id(service_confirm_button_label), lvgl::lv_update_event, nullptr);
              lv_obj_set_style_bg_color(id(service_confirm_button), lv_color_hex(0x0072CE), LV_PART_MAIN);
              lv_obj_remove_flag(id(service_confirm_modal), LV_OBJ_FLAG_HIDDEN);
        widgets:
          - label:
              id: service_restart_button_label
              text: "Herstarten"
              text_color: 0x1F2933
              text_font: font_mdi_24
              align: CENTER
