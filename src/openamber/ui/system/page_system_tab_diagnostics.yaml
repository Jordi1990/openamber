obj:
  id: system_diagnostics_panel
  width: 100%
  height: 100%
  align: TOP_LEFT
  y: 0
  hidden: true
  bg_opa: 0%
  border_opa: 0%
  pad_all: 0
  scrollbar_mode: "OFF"
  scrollable: false
  layout:
    type: FLEX
    flex_flow: ROW_WRAP
    flex_align_main: START
    flex_align_cross: CENTER
    pad_row: 10
    pad_column: 10
  widgets:
    - obj:
        width: 100%
        height: 190
        bg_color: 0xFFFFFF
        bg_opa: 100%
        radius: 12
        border_width: 1
        border_color: 0xE5E7EB
        border_opa: 100%
        pad_all: 10
        scrollbar_mode: "OFF"
        scrollable: false
        widgets:
          - label: { text: "Runtime", text_color: 0x111827, text_font: font_text_20, align: TOP_LEFT }
          - table:
              id: system_diag_runtime_table
              width: 100%
              y: 28
              bg_opa: 0%
              border_width: 0
              scrollbar_mode: "OFF"
              scrollable: false
              items:
                text_font: font_text_20
                text_color: 0x1F2933
                border_width: 0
                bg_opa: 0%
                pad_top: 2
                pad_bottom: 2
                pad_left: 0
                pad_right: 0
              columns:
                - width: 44%
                - width: 56%
              rows:
                - ["ESPHome", "-"]
                - ["Uptime", "-"]

    - obj:
        width: 100%
        height: 210
        bg_color: 0xFFFFFF
        bg_opa: 100%
        radius: 12
        border_width: 1
        border_color: 0xE5E7EB
        border_opa: 100%
        pad_all: 10
        scrollbar_mode: "OFF"
        scrollable: false
        widgets:
          - label: { text: "Geheugen", text_color: 0x111827, text_font: font_text_20, align: TOP_LEFT }
          - table:
              id: system_diag_memory_table
              width: 100%
              y: 28
              bg_opa: 0%
              border_width: 0
              scrollbar_mode: "OFF"
              scrollable: false
              items:
                text_font: font_text_20
                text_color: 0x1F2933
                border_width: 0
                bg_opa: 0%
                pad_top: 2
                pad_bottom: 2
                pad_left: 0
                pad_right: 0
              columns:
                - width: 44%
                - width: 56%
              rows:
                - ["Heap vrij", "-"]
                - ["Heap frag.", "-"]
                - ["Heap max", "-"]
                - ["PSRAM vrij", "-"]

    - obj:
        width: 100%
        height: 160
        bg_color: 0xFFFFFF
        bg_opa: 100%
        radius: 12
        border_width: 1
        border_color: 0xE5E7EB
        border_opa: 100%
        pad_all: 10
        scrollbar_mode: "OFF"
        scrollable: false
        widgets:
          - label: { text: "ESP", text_color: 0x111827, text_font: font_text_20, align: TOP_LEFT }
          - table:
              id: system_diag_esp_table
              width: 100%
              y: 28
              bg_opa: 0%
              border_width: 0
              scrollbar_mode: "OFF"
              scrollable: false
              items:
                text_font: font_text_20
                text_color: 0x1F2933
                border_width: 0
                bg_opa: 0%
                pad_top: 2
                pad_bottom: 2
                pad_left: 0
                pad_right: 0
              columns:
                - width: 44%
                - width: 56%
              rows:
                - ["Chip", "-"]
                - ["Reset reason", "-"]

