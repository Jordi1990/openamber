obj:
  id: system_sidebar
  grid_cell_row_pos: 0
  grid_cell_column_pos: 0
  grid_cell_x_align: STRETCH
  grid_cell_y_align: STRETCH
  width: 210
  height: 100%
  bg_color: 0xE8ECF1
  bg_opa: 100%
  radius: 14
  border_width: 0
  border_opa: 0%
  pad_left: 4
  pad_right: 4
  pad_top: 3
  pad_bottom: 3
  scrollbar_mode: "OFF"
  scrollable: false
  layout:
    type: FLEX
    flex_flow: COLUMN
    flex_align_main: START
    flex_align_cross: CENTER
    pad_row: 2
  widgets:
    - obj:
        id: system_tab_management
        width: 100%
        height: 40
        bg_color: 0x1F3B68
        bg_opa: 100%
        radius: 10
        border_width: 0
        border_opa: 0%
        pad_left: 12
        pad_top: 2
        pad_bottom: 2
        on_click:
          - lambda: |-
              lv_obj_remove_flag(id(service_updates_panel), LV_OBJ_FLAG_HIDDEN);
              lv_obj_add_flag(id(system_diagnostics_panel), LV_OBJ_FLAG_HIDDEN);
              lv_obj_set_style_bg_color(id(system_tab_management), lv_color_hex(0x1F3B68), LV_PART_MAIN);
              lv_obj_set_style_text_color(id(system_tab_management_lbl), lv_color_hex(0xFFFFFF), LV_PART_MAIN);
              lv_obj_set_style_bg_color(id(system_tab_diagnostics), lv_color_hex(0xE8ECF1), LV_PART_MAIN);
              lv_obj_set_style_text_color(id(system_tab_diagnostics_lbl), lv_color_hex(0x4B5563), LV_PART_MAIN);
        widgets:
          - label:
              id: system_tab_management_lbl
              text: "Beheer"
              text_color: 0xFFFFFF
              text_font: font_text_20
              align: LEFT_MID

    - obj:
        id: system_tab_diagnostics
        width: 100%
        height: 40
        bg_color: 0xE8ECF1
        bg_opa: 100%
        radius: 10
        border_width: 0
        border_opa: 0%
        pad_left: 12
        pad_top: 2
        pad_bottom: 2
        on_click:
          - lambda: |-
              lv_obj_add_flag(id(service_updates_panel), LV_OBJ_FLAG_HIDDEN);
              lv_obj_remove_flag(id(system_diagnostics_panel), LV_OBJ_FLAG_HIDDEN);
              id(update_system_diagnostics_ui).execute();
              lv_obj_set_style_bg_color(id(system_tab_management), lv_color_hex(0xE8ECF1), LV_PART_MAIN);
              lv_obj_set_style_text_color(id(system_tab_management_lbl), lv_color_hex(0x4B5563), LV_PART_MAIN);
              lv_obj_set_style_bg_color(id(system_tab_diagnostics), lv_color_hex(0x1F3B68), LV_PART_MAIN);
              lv_obj_set_style_text_color(id(system_tab_diagnostics_lbl), lv_color_hex(0xFFFFFF), LV_PART_MAIN);
        widgets:
          - label:
              id: system_tab_diagnostics_lbl
              text: "Diagnostiek"
              text_color: 0x4B5563
              text_font: font_text_20
              align: LEFT_MID
