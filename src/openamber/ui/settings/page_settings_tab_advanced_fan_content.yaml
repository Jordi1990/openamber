# ── Pagina 1: aan/uit en actueel toerental ──
- obj:
    id: set_fan_note_row
    width: 100%
    height: SIZE_CONTENT
    bg_opa: 0%
    border_opa: 0%
    pad_all: 6
    widgets:
      - label:
          width: 100%
          text: "Let op: experimenteel. De buitenunit regelt de fan zelf en neemt het laagste van het plafond op buitentemperatuur en het plafond op compressorfrequentie. OpenAmber zet deze tabel elke minuut terug in de buitenunit (niet in de EEPROM)."
          text_color: 0xB45309
          text_font: font_text_20
          long_mode: WRAP
          align: TOP_LEFT

- obj:
    id: set_fan_enable_row
    width: 100%
    height: SIZE_CONTENT
    bg_opa: 0%
    border_opa: 0%
    pad_all: 6
    widgets:
      - label: { text: "Eigen fantabel", text_color: 0x1F2933, text_font: font_text_24, align: TOP_LEFT }
      - label: { text: "Uit: fabriekstabel terugzetten", text_color: 0x6B7280, text_font: font_text_20, align: TOP_LEFT, y: 38 }
      - switch:
          id: set_fan_enable_switch_ui
          align: TOP_RIGHT
          bg_color: 0x9CA3AF
          indicator:
            bg_color: 0x16A34A
          knob:
            bg_color: 0xFFFFFF
          on_click:
            - if:
                condition:
                  switch.is_on: outdoor_fan_table_enabled
                then:
                  - switch.turn_off: outdoor_fan_table_enabled
                else:
                  - switch.turn_on: outdoor_fan_table_enabled

- obj:
    id: set_fan_actual_row
    width: 100%
    height: SIZE_CONTENT
    bg_opa: 0%
    border_opa: 0%
    pad_all: 6
    widgets:
      - label: { text: "Toerental nu", text_color: 0x1F2933, text_font: font_text_24, align: TOP_LEFT }
      - label: { text: "Gemeten door de buitenunit", text_color: 0x6B7280, text_font: font_text_20, align: TOP_LEFT, y: 38 }
      - label: { id: set_fan_actual_val, text: "-", text_color: 0x1F2933, text_font: font_text_24, align: TOP_RIGHT }

# ── Pagina 2: Verwarmen, plafond op buitentemperatuur ──
- obj:
    id: set_fan_heat_max_row
    hidden: true
    width: 100%
    height: SIZE_CONTENT
    bg_opa: 0%
    border_opa: 0%
    pad_all: 6
    widgets:
      - label: { text: "Verwarmen: koud of hoog", text_color: 0x1F2933, text_font: font_text_24, align: TOP_LEFT }
      - label: { text: "Ta onder 11°C, of compressor vanaf F7", text_color: 0x6B7280, text_font: font_text_20, align: TOP_LEFT, y: 38 }
      - obj:
          width: SIZE_CONTENT
          height: SIZE_CONTENT
          align: TOP_RIGHT
          bg_opa: 0%
          border_opa: 0%
          pad_all: 0
          layout: { type: FLEX, flex_flow: ROW, flex_align_cross: CENTER, pad_column: 8 }
          widgets:
            - obj:
                width: 40
                height: 40
                bg_color: 0x1F3B68
                bg_opa: 100%
                radius: 10
                border_opa: 0%
                scrollbar_mode: "OFF"
                scrollable: false
                on_click:
                  - number.decrement: outdoor_fan_heat_max_rpm
                widgets:
                  - label: { text: "\U000F0374", text_color: 0xFFFFFF, text_font: font_mdi_24, align: CENTER }
            - label: { id: set_fan_heat_max_val, text: "720 rpm", text_color: 0x1F2933, text_font: font_text_24 }
            - obj:
                width: 40
                height: 40
                bg_color: 0x1F3B68
                bg_opa: 100%
                radius: 10
                border_opa: 0%
                scrollbar_mode: "OFF"
                scrollable: false
                on_click:
                  - number.increment: outdoor_fan_heat_max_rpm
                widgets:
                  - label: { text: "\U000F0415", text_color: 0xFFFFFF, text_font: font_mdi_24, align: CENTER }

