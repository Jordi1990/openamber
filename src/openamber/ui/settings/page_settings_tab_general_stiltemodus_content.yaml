- obj:
    id: set_silent_mode_power_row
    styles: setting_row_style
    widgets:
      - label: { id: set_silent_mode_power_lbl, text: "${t_stille_modus_vermogen}", text_color: 0x9CA3AF, text_font: font_text_24, align: TOP_LEFT }
      - label: { id: set_silent_mode_power_sub, text: "${t_max_compressorvermogen_tijdens_stille_mo}", text_color: 0x9CA3AF, text_font: font_text_20, align: TOP_LEFT, y: 32 }
      - dropdown:
          id: set_silent_mode_power_dd
          symbol: "\U000F0140"
          width: 220
          align: TOP_RIGHT
          y: 0
          options:
            - "${t_beperkt}"
            - "${t_zeer_laag}"
            - "${t_laag}"
            - "${t_gemiddeld}"
            - "${t_verhoogd}"
            - "${t_hoog}"
            - "${t_maximaal}"
          text_font: font_text_20
          dropdown_list:
            text_font: font_text_20
          on_change:
            then:
              - if:
                  condition:
                    switch.is_on: silent_mode_enabled_switch
                  then:
                    - lambda: |-
                        const char* opts[] = {"Beperkt","Zeer laag","Laag","Gemiddeld","Verhoogd","Hoog","Maximaal"};
                        auto val = lv_dropdown_get_selected(id(set_silent_mode_power_dd)->obj);
                        if (val < 7) id(silent_mode_compressor_mode).make_call().set_option(opts[val]).perform();
