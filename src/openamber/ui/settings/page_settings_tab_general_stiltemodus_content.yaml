# Stille modus content
# ------------------------------------------------------------
- obj:
    id: set_silent_mode_enabled_row
    styles: setting_row_style
    widgets:
      - label: { text: "${t_stille_modus_inschakelen}", text_color: 0x1F2933, text_font: font_text_24, align: TOP_LEFT }
      - label: { text: "${t_limiteer_het_maximale_compressorvermogen}", text_color: 0x6B7280, text_font: font_text_20, align: TOP_LEFT, y: 32 }
      - switch:
          id: set_silent_mode_switch_ui
          align: TOP_RIGHT
          bg_color: 0x9CA3AF
          indicator:
            bg_color: 0x16A34A
          knob:
            bg_color: 0xFFFFFF
          on_click:
            - lambda: |-
                if (id(silent_mode_enabled_switch).state) {
                  id(silent_mode_enabled_switch).turn_off();
                } else {
                  id(silent_mode_enabled_switch).turn_on();
                }

- obj:
    id: set_silent_mode_start_time_row
    styles: setting_row_style
    widgets:
      - label: { id: set_silent_mode_start_time_lbl, text: "${t_starttijd}", text_color: 0x9CA3AF, text_font: font_text_24, align: TOP_LEFT }
      - label: { id: set_silent_mode_start_time_sub, text: "${t_tijdstip_waarop_de_stille_modus_start}", text_color: 0x9CA3AF, text_font: font_text_20, align: TOP_LEFT, y: 32 }
      - obj:
          width: SIZE_CONTENT
          height: SIZE_CONTENT
          align: TOP_RIGHT
          bg_opa: 0%
          border_opa: 0%
          pad_all: 0
          layout: { type: FLEX, flex_flow: ROW, flex_align_cross: CENTER, pad_column: 4 }
          widgets:
            - obj:
                id: set_silent_mode_start_time_dec
                styles: setting_step_btn_style
                pressed:
                  styles: setting_step_btn_pressed_style
                scrollable: false
                on_click:
                  - if:
                      condition:
                        switch.is_on: silent_mode_enabled_switch
                      then:
                        - lambda: |-
                            int h = id(silent_mode_start_time).hour;
                            int m = id(silent_mode_start_time).minute;
                            m -= 30;
                            if (m < 0) { m += 60; h = (h + 23) % 24; }
                            auto call = id(silent_mode_start_time).make_call();
                            call.set_time(h, m, 0);
                            call.perform();
                        - lvgl.label.update:
                            id: set_silent_mode_start_time_val
                            text:
                              format: "%02d:%02d"
                              args: ['id(silent_mode_start_time).hour', 'id(silent_mode_start_time).minute']
                widgets:
                  - label: { id: set_silent_mode_start_time_dec_lbl, text: "\U000F0374", styles: setting_step_icon_style }
            - label: { id: set_silent_mode_start_time_val, text: "23:00", text_color: 0x9CA3AF, text_font: font_text_24 }
            - obj:
                id: set_silent_mode_start_time_inc
                styles: setting_step_btn_style
                pressed:
                  styles: setting_step_btn_pressed_style
                scrollable: false
                on_click:
                  - if:
                      condition:
                        switch.is_on: silent_mode_enabled_switch
                      then:
                        - lambda: |-
                            int h = id(silent_mode_start_time).hour;
                            int m = id(silent_mode_start_time).minute;
                            m += 30;
                            if (m >= 60) { m -= 60; h = (h + 1) % 24; }
                            auto call = id(silent_mode_start_time).make_call();
                            call.set_time(h, m, 0);
                            call.perform();
                        - lvgl.label.update:
                            id: set_silent_mode_start_time_val
                            text:
                              format: "%02d:%02d"
                              args: ['id(silent_mode_start_time).hour', 'id(silent_mode_start_time).minute']
                widgets:
                  - label: { id: set_silent_mode_start_time_inc_lbl, text: "\U000F0415", styles: setting_step_icon_style }

