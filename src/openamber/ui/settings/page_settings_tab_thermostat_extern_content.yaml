# Thermostaat extern signaal & draadloze thermostaat content
# ------------------------------------------------------------
- obj:
    id: thermostat_row_off_delay
    styles: setting_row_style
    widgets:
      - label: { text: "${t_uitschakelvertraging_extern_signaal}", text_color: 0x1F2933, text_font: font_text_24, align: TOP_LEFT }
      - label: { text: "${t_vertraging_voor_stoppen_bij_wegvallen_wa}", text_color: 0x6B7280, text_font: font_text_20, align: TOP_LEFT, y: 32 }
      - obj:
          width: SIZE_CONTENT
          height: SIZE_CONTENT
          align: TOP_RIGHT
          bg_opa: 0%
          border_opa: 0%
          pad_all: 0
          layout: { type: FLEX, flex_flow: ROW, flex_align_cross: CENTER, pad_column: 8 }
          widgets:
            - obj:
                id: set_therm_off_delay_dec_btn
                styles: setting_step_btn_style
                pressed:
                  styles: setting_step_btn_pressed_style
                scrollable: false
                on_click:
                  - if:
                      condition:
                        lambda: |-
                          auto idx = id(thermostat_mode_select).active_index();
                          return idx.has_value() && idx.value() != 0;
                      then:
                        - number.decrement: thermostat_off_delay
                widgets:
                  - label: { text: "\U000F0374", styles: setting_step_icon_style }
            - label: { id: set_therm_off_delay_val, text: "0 min", text_color: 0x1F2933, text_font: font_text_24 }
            - obj:
                id: set_therm_off_delay_inc_btn
                styles: setting_step_btn_style
                pressed:
                  styles: setting_step_btn_pressed_style
                scrollable: false
                on_click:
                  - if:
                      condition:
                        lambda: |-
                          auto idx = id(thermostat_mode_select).active_index();
                          return idx.has_value() && idx.value() != 0;
                      then:
                        - number.increment: thermostat_off_delay
                widgets:
                  - label: { text: "\U000F0415", styles: setting_step_icon_style }

- obj:
    id: thermostat_row_link_enabled
    hidden: true
    styles: setting_row_style
    widgets:
      - label: { text: "${t_draadloze_thermostaat}", text_color: 0x1F2933, text_font: font_text_24, align: TOP_LEFT }
      - label: { text: "${t_koppeling_met_externe_thermostaat_zet_th}", text_color: 0x6B7280, text_font: font_text_20, align: TOP_LEFT, y: 32 }
      - switch:
          id: set_therm_link_switch_ui
          align: TOP_RIGHT
          bg_color: 0x9CA3AF
          indicator:
            bg_color: 0x16A34A
          knob:
            bg_color: 0xFFFFFF
          on_click:
            - script.execute: thermostat_link_toggle_ui

- obj:
    id: thermostat_row_link_code
    hidden: true
    styles: setting_row_style
    widgets:
      - label: { text: "${t_koppelcode_draadloze_thermostaat}", text_color: 0x1F2933, text_font: font_text_24, align: TOP_LEFT }
      - label: { text: "${t_voer_deze_code_in_op_de_draadloze_thermo}", text_color: 0x6B7280, text_font: font_text_20, align: TOP_LEFT, y: 32 }
      - obj:
          width: SIZE_CONTENT
          height: SIZE_CONTENT
          align: TOP_RIGHT
          bg_opa: 0%
          border_opa: 0%
          pad_all: 0
          layout: { type: FLEX, flex_flow: ROW, flex_align_cross: CENTER, pad_column: 8 }
          widgets:
            - label: { id: set_therm_link_code_val, text: "------", text_color: 0x1F2933, text_font: font_text_24 }
            - obj:
                id: set_therm_link_new_btn
                width: SIZE_CONTENT
                height: 40
                pad_left: 12
                pad_right: 12
                bg_color: 0x1F3B68
                bg_opa: 100%
                radius: 10
                border_opa: 0%
                scrollbar_mode: "OFF"
                scrollable: false
                on_click:
                  - script.execute: thermostat_link_new_code_confirm
                widgets:
                  - label: { id: set_therm_link_new_btn_lbl, text: "${t_nieuw}", text_color: 0xFFFFFF, text_font: font_text_20, align: CENTER }
