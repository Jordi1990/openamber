                  - label: { text: "\U000F0374", styles: setting_step_icon_style }
            - label: { id: set_dhw_restart_val, text: "15°C", text_color: 0x1F2933, text_font: font_text_24 }
            - obj:
                styles: setting_step_btn_style
                pressed:
                  styles: setting_step_btn_pressed_style
                scrollable: false
                on_click:
                  - number.increment: dhw_restart_dhw_delta
                widgets:
                  - label: { text: "\U000F0415", styles: setting_step_icon_style }

- obj:
    styles: setting_row_style
    widgets:
      - label: { text: "Basisvermogen", text_color: 0x1F2933, text_font: font_text_24, align: TOP_LEFT }
      - label: { text: "Compressorvermogen in normale modus", text_color: 0x6B7280, text_font: font_text_20, align: TOP_LEFT, y: 32 }
      - dropdown:
          id: set_dhw_power_dd
          symbol: "\U000F0140"
          width: 220
          align: TOP_RIGHT
          y: 0
          options:
            - "Beperkt"
            - "Zeer laag"
            - "Laag"
            - "Gemiddeld"
            - "Verhoogd"
            - "Hoog"
            - "Maximaal"
          text_font: font_text_20
          dropdown_list:
            text_font: font_text_20
          on_change:
            then:
              - lambda: |-
                  const char* opts[] = {"Beperkt","Zeer laag","Laag","Gemiddeld","Verhoogd","Hoog","Maximaal"};
                  auto val = lv_dropdown_get_selected(id(set_dhw_power_dd)->obj);
                  if (val < 7) id(dhw_compressor_mode).make_call().set_option(opts[val]).perform();

- obj:
    styles: setting_row_style
    widgets:
      - label: { text: "Tapwaterpomp startmodus", text_color: 0x1F2933, text_font: font_text_24, align: TOP_LEFT }
      - label: { text: "Wanneer de tapwaterpomp start", text_color: 0x6B7280, text_font: font_text_20, align: TOP_LEFT, y: 32 }
      - dropdown:
          id: set_dhw_pump_dd
          symbol: "\U000F0140"
          width: 290
          align: TOP_RIGHT
          y: 0
          options:
            - "Aanvoer warmer dan vat"
            - "Samen met compressor"
          text_font: font_text_20
          dropdown_list:
            text_font: font_text_20
          on_change:
            then:
              - lambda: |-
                  auto val = lv_dropdown_get_selected(id(set_dhw_pump_dd)->obj);
                  auto call = id(dhw_pump_start_mode_select).make_call();
                  call.set_index(val);
                  call.perform();

- obj:
    id: set_defrost_from_dhw_tank_row
    styles: setting_row_style
    widgets:
      - label: { text: "Ontdooien via tapwatervat", text_color: 0x1F2933, text_font: font_text_24, align: TOP_LEFT }
      - label: { text: "Defrost tijdens verwarmen haalt warmte uit het vat", text_color: 0x6B7280, text_font: font_text_20, align: TOP_LEFT, y: 32 }
      - switch:
          id: set_defrost_from_dhw_tank_switch_ui
          align: TOP_RIGHT
          bg_color: 0x9CA3AF
          indicator:
            bg_color: 0x16A34A
          knob:
            bg_color: 0xFFFFFF
          on_click:
            - lambda: |-
                if (id(defrost_from_dhw_tank_switch).state) {
                  id(defrost_from_dhw_tank_switch).turn_off();
                } else {
                  id(defrost_from_dhw_tank_switch).turn_on();
                }