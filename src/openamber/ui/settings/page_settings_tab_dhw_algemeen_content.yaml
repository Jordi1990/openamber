- obj:
    styles: setting_row_style
    widgets:
      - label: { text: "${t_basisvermogen}", text_color: 0x1F2933, text_font: font_text_24, align: TOP_LEFT }
      - label: { text: "${t_compressorvermogen_in_normale_modus}", text_color: 0x6B7280, text_font: font_text_20, align: TOP_LEFT, y: 32 }
      - dropdown:
          id: set_dhw_power_dd
          symbol: "\U000F0140"
          width: 220
          align: TOP_RIGHT
          y: 0
          options:
            - "${t_beperkt}"
            - "${t_zeer_laag}"
            - "${t_laag}"
            - "${t_gemiddeld}"
            - "${t_verhoogd}"
            - "${t_hoog}"
            - "${t_maximaal}"
          text_font: font_text_20
          dropdown_list:
            text_font: font_text_20
          on_change:
            then:
              - lambda: |-
                  const char* opts[] = {"Beperkt","Zeer laag","Laag","Gemiddeld","Verhoogd","Hoog","Maximaal"};
                  auto val = lv_dropdown_get_selected(id(set_dhw_power_dd)->obj);
                  if (val < 7) id(dhw_compressor_mode).make_call().set_option(opts[val]).perform();

- obj:
    styles: setting_row_style
    widgets:
      - label: { text: "${t_tapwaterpomp_startmodus}", text_color: 0x1F2933, text_font: font_text_24, align: TOP_LEFT }
      - label: { text: "${t_wanneer_de_tapwaterpomp_start}", text_color: 0x6B7280, text_font: font_text_20, align: TOP_LEFT, y: 32 }
      - dropdown:
          id: set_dhw_pump_dd
          symbol: "\U000F0140"
          width: 290
          align: TOP_RIGHT
          y: 0
          options:
            - "${t_aanvoer_warmer_dan_vat}"
            - "${t_samen_met_compressor}"
          text_font: font_text_20
          dropdown_list:
            text_font: font_text_20
          on_change:
            then:
              - lambda: |-
                  auto val = lv_dropdown_get_selected(id(set_dhw_pump_dd)->obj);
                  auto call = id(dhw_pump_start_mode_select).make_call();
                  call.set_index(val);
                  call.perform();