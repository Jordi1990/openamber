- obj:
    id: set_cooling_allowed_row
    styles: setting_row_style
    widgets:
      - label: { text: "${t_koelen_toegestaan}", text_color: 0x1F2933, text_font: font_text_24, align: TOP_LEFT }
      - label: { text: "${t_bij_uit_wordt_elke_koudevraag_genegeerd}", text_color: 0x6B7280, text_font: font_text_20, align: TOP_LEFT, y: 32 }
      - switch:
          id: set_cooling_allowed_switch_ui
          align: TOP_RIGHT
          bg_color: 0x9CA3AF
          indicator:
            bg_color: 0x16A34A
          knob:
            bg_color: 0xFFFFFF
          on_click:
            - lambda: |-
                if (id(cooling_allowed_switch).state) {
                  id(cooling_allowed_switch).turn_off();
                } else {
                  id(cooling_allowed_switch).turn_on();
                }


- obj:
    id: set_cool_power_row
    styles: setting_row_style
    widgets:
      - label: { text: "${t_koelen_vermogen}", text_color: 0x1F2933, text_font: font_text_24, align: TOP_LEFT }
      - label: { text: "${t_max_compressorvermogen_bij_koelen}", text_color: 0x6B7280, text_font: font_text_20, align: TOP_LEFT, y: 32 }
      - dropdown:
          id: set_cool_power_dd
          symbol: "\U000F0140"
          width: 220
          align: TOP_RIGHT
          y: 0
          options:
            - "${t_beperkt}"
            - "${t_zeer_laag}"
            - "${t_laag}"
            - "${t_gemiddeld}"
            - "${t_verhoogd}"
            - "${t_hoog}"
            - "${t_maximaal}"
          text_font: font_text_20
          dropdown_list:
            text_font: font_text_20
          on_change:
            then:
              - lambda: |-
                  const char* opts[] = {"Beperkt","Zeer laag","Laag","Gemiddeld","Verhoogd","Hoog","Maximaal"};
                  auto val = lv_dropdown_get_selected(id(set_cool_power_dd)->obj);
                  if (val < 7) id(cool_compressor_mode).make_call().set_option(opts[val]).perform();


- obj:
    id: set_comp_start_cool_row
    styles: setting_row_style
    widgets:
      - label: { text: "${t_start_delta_c}", text_color: 0x1F2933, text_font: font_text_24, align: TOP_LEFT }
      - label: { text: "${t_verschil_met_setpoint_om_compressor_te_s}", text_color: 0x6B7280, text_font: font_text_20, align: TOP_LEFT, y: 32 }
      - obj:
          width: SIZE_CONTENT
          height: SIZE_CONTENT
          align: TOP_RIGHT
          bg_opa: 0%
          border_opa: 0%
          pad_all: 0
          layout: { type: FLEX, flex_flow: ROW, flex_align_cross: CENTER, pad_column: 8 }
          widgets:
            - obj:
                id: set_comp_start_cool_dec
                styles: setting_step_btn_style
                pressed:
                  styles: setting_step_btn_pressed_style
                scrollable: false
                on_click:
                  - number.decrement: compressor_start_delta_cooling
                widgets:
                  - label: { text: "\U000F0374", styles: setting_step_icon_style }
            - label: { id: set_comp_start_cool_val, text: "3.0°C", text_color: 0x1F2933, text_font: font_text_24 }
            - obj:
                id: set_comp_start_cool_inc
                styles: setting_step_btn_style
                pressed:
                  styles: setting_step_btn_pressed_style
                scrollable: false
                on_click:
                  - number.increment: compressor_start_delta_cooling
                widgets:
                  - label: { text: "\U000F0415", styles: setting_step_icon_style }


