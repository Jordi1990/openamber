                widgets:
                  - label: { text: "\U000F0374", text_color: 0xFFFFFF, text_font: font_mdi_24, align: CENTER }
            - label: { id: set_fan_cool_hz_mid_val, text: "-- rpm", text_color: 0x1F2933, text_font: font_text_24 }
            - obj:
