# Menu Page: Geavanceerd (Categorie keuzemenu)
# ------------------------------------------------------------
id: panel_advanced
title: "Geavanceerd"
widgets:
  - obj:
      width: 100%
      height: SIZE_CONTENT
      bg_opa: 0%
      border_opa: 0%
      pad_all: 0
      layout:
        type: FLEX
        flex_flow: ROW_WRAP
        flex_align_main: START
        flex_align_cross: START
        pad_row: 10
        pad_column: 10
      widgets:
        - obj:
            id: advanced_stab_pid
            width: 49%
            scrollbar_mode: "OFF"
            scrollable: false
            height: 54
            bg_color: 0xFFFFFF
            bg_opa: 100%
            radius: 12
            border_width: 1
            border_color: 0xE2E8F0
            border_opa: 100%
            pad_left: 16
            pad_right: 16
            on_click:
              - lvgl.menu.set_page:
                  id: settings_menu
                  page: panel_advanced_page_pid
            widgets:
              - label: { text: "\U000F08D4", text_color: 0x1F3B68, text_font: font_mdi_24, align: LEFT_MID }
              - label: { id: advanced_stab_pid_lbl, text: "PID Regeling Parameters", text_color: 0x1F2933, text_font: font_text_20, align: LEFT_MID, x: 40 }
              - label: { text: "\U000F0142", text_color: 0x9CA3AF, text_font: font_mdi_24, align: RIGHT_MID }

        - obj:
            id: advanced_stab_bodemplaat
            width: 49%
            scrollbar_mode: "OFF"
            scrollable: false
            height: 54
            bg_color: 0xFFFFFF
            bg_opa: 100%
            radius: 12
            border_width: 1
            border_color: 0xE2E8F0
            border_opa: 100%
            pad_left: 16
            pad_right: 16
            on_click:
              - lvgl.menu.set_page:
                  id: settings_menu
                  page: panel_advanced_page_bodemplaat
            widgets:
              - label: { text: "\U000F0238", text_color: 0x1F3B68, text_font: font_mdi_24, align: LEFT_MID }
              - label: { id: advanced_stab_bodemplaat_lbl, text: "Bodemplaatverwarming", text_color: 0x1F2933, text_font: font_text_20, align: LEFT_MID, x: 40 }
              - label: { text: "\U000F0142", text_color: 0x9CA3AF, text_font: font_mdi_24, align: RIGHT_MID }

        - obj:
            id: advanced_stab_defrost
            width: 49%
            scrollbar_mode: "OFF"
            scrollable: false
            height: 54
            bg_color: 0xFFFFFF
            bg_opa: 100%
            radius: 12
            border_width: 1
            border_color: 0xE2E8F0
            border_opa: 100%
            pad_left: 16
            pad_right: 16
            on_click:
              - lvgl.menu.set_page:
                  id: settings_menu
                  page: panel_advanced_page_defrost
            widgets:
              - label: { text: "\U000F071A", text_color: 0x1F3B68, text_font: font_mdi_24, align: LEFT_MID }
              - label: { id: advanced_stab_defrost_lbl, text: "Ontdooicyclus (Defrost)", text_color: 0x1F2933, text_font: font_text_20, align: LEFT_MID, x: 40 }
              - label: { text: "\U000F0142", text_color: 0x9CA3AF, text_font: font_mdi_24, align: RIGHT_MID }

        - obj:
            id: advanced_stab_defrost_temps
            width: 49%
            scrollbar_mode: "OFF"
            scrollable: false
            height: 54
            bg_color: 0xFFFFFF
            bg_opa: 100%
            radius: 12
            border_width: 1
            border_color: 0xE2E8F0
            border_opa: 100%
            pad_left: 16
            pad_right: 16
            on_click:
              - lvgl.menu.set_page:
                  id: settings_menu
                  page: panel_advanced_page_defrost_temps
            widgets:
              - label: { text: "\U000F050F", text_color: 0x1F3B68, text_font: font_mdi_24, align: LEFT_MID }
              - label: { id: advanced_stab_defrost_temps_lbl, text: "Defrost temperaturen", text_color: 0x1F2933, text_font: font_text_20, align: LEFT_MID, x: 40 }
