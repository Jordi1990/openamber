# Menu Page: Geavanceerd (Categorie keuzemenu)
# ------------------------------------------------------------
id: panel_advanced
title: "${t_geavanceerd}"
widgets:
  - obj:
      width: 100%
      height: SIZE_CONTENT
      bg_opa: 0%
      border_opa: 0%
      pad_left: 12
      pad_right: 12
      pad_top: 4
      pad_bottom: 16
      layout:
        type: FLEX
        flex_flow: ROW_WRAP
        flex_align_main: START
        flex_align_cross: START
        pad_row: 8
        pad_column: 8
      widgets:
        - obj:
            id: advanced_stab_pid
            styles: menu_tile_style
            scrollable: false
            pressed:
              styles: menu_tile_pressed_style
            disabled:
              styles: menu_tile_disabled_style
            on_click:
              - lvgl.menu.set_page:
                  id: settings_menu
                  page: panel_advanced_page_pid
            widgets:
              - label: { text: "\U000F012A", styles: menu_tile_icon_style }
              - label: { id: advanced_stab_pid_lbl, text: "${t_pid_regeling}", long_mode: WRAP, styles: menu_tile_label_style }

        - obj:
            id: advanced_stab_bodemplaat
            styles: menu_tile_style
            scrollable: false
            pressed:
              styles: menu_tile_pressed_style
            disabled:
              styles: menu_tile_disabled_style
            on_click:
              - lvgl.menu.set_page:
                  id: settings_menu
                  page: panel_advanced_page_bodemplaat
            widgets:
              - label: { text: "\U000F0438", styles: menu_tile_icon_style }
              - label: { id: advanced_stab_bodemplaat_lbl, text: "${t_bodemplaat_verwarming_3}", long_mode: WRAP, styles: menu_tile_label_style }

        - obj:
            id: advanced_stab_defrost
            styles: menu_tile_style
            scrollable: false
            pressed:
              styles: menu_tile_pressed_style
