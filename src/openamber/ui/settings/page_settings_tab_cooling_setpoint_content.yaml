- obj:
    id: set_cool_mode_row
    styles: setting_row_style
    widgets:
      - label: { text: "${t_koelmodus}", text_color: 0x1F2933, text_font: font_text_24, align: TOP_LEFT }
      - label: { text: "${t_kies_fixed_of_extern_setpoint}", text_color: 0x6B7280, text_font: font_text_20, align: TOP_LEFT, y: 32 }
      - dropdown:
          id: set_cool_mode_dd
          symbol: "\U000F0140"
          width: 220
          align: TOP_RIGHT
          y: 0
          options:
            - "${t_fixed_setpoint}"
            - "${t_extern_setpoint}"
          text_font: font_text_20
          dropdown_list:
            text_font: font_text_20
          on_change:
            then:
              - lambda: |-
                  {
                    auto val = lv_dropdown_get_selected(id(set_cool_mode_dd)->obj);
                    if (val == 0) id(cool_mode_select).make_call().set_option("Intern setpoint").perform();
                    else id(cool_mode_select).make_call().set_option("Extern setpoint").perform();
                  }
                  id(update_manual_setpoint_ui).execute();


- obj:
    id: set_cool_setpoint_row
    styles: setting_row_style
    widgets:
      - label: { id: set_cool_setpoint_lbl, text: "${t_setpoint_c}", text_color: 0x1F2933, text_font: font_text_24, align: TOP_LEFT }
      - label: { id: set_cool_setpoint_sub, text: "${t_doeltemperatuur_voor_koelen}", text_color: 0x6B7280, text_font: font_text_20, align: TOP_LEFT, y: 32 }
      - obj:
          width: SIZE_CONTENT
          height: SIZE_CONTENT
          align: TOP_RIGHT
          bg_opa: 0%
          border_opa: 0%
          pad_all: 0
          layout: { type: FLEX, flex_flow: ROW, flex_align_cross: CENTER, pad_column: 8 }
          widgets:
            - obj:
                id: set_cool_setpoint_dec
                styles: setting_step_btn_style
                pressed:
                  styles: setting_step_btn_pressed_style
                scrollable: false
                on_click:
                  - lambda: |-
                      if (id(cool_mode_select).current_option() == "Intern setpoint") {
                        {
                          auto call = id(cooling_setpoint_number).make_call();
                          call.with_operation(number::NUMBER_OP_DECREMENT);
                          call.with_cycle(true);
                          call.perform();
                        }
                      }
                widgets:
                  - label: { text: "\U000F0374", styles: setting_step_icon_style }
            - label: { id: set_cool_setpoint_val, text: "7°C", text_color: 0x1F2933, text_font: font_text_24 }
            - obj:
                id: set_cool_setpoint_inc
                styles: setting_step_btn_style
                pressed:
                  styles: setting_step_btn_pressed_style
                scrollable: false
                on_click:
                  - lambda: |-
                      if (id(cool_mode_select).current_option() == "Intern setpoint") {
                        {
                          auto call = id(cooling_setpoint_number).make_call();
                          call.with_operation(number::NUMBER_OP_INCREMENT);
                          call.with_cycle(true);
                          call.perform();
                        }
                      }
                widgets:
                  - label: { text: "\U000F0415", styles: setting_step_icon_style }


- obj:
    id: set_cool_manual_sp_row
    styles: setting_row_style
    widgets:
      - label: { id: set_cool_manual_sp_lbl, text: "${t_extern_setpoint_c}", text_color: 0x1F2933, text_font: font_text_24, align: TOP_LEFT }
      - label: { id: set_cool_manual_sp_sub, text: "${t_koel_setpoint_bij_extern_setpoint}", text_color: 0x6B7280, text_font: font_text_20, align: TOP_LEFT, y: 32 }
      - obj:
          width: SIZE_CONTENT
          height: SIZE_CONTENT
          align: TOP_RIGHT
          bg_opa: 0%
          border_opa: 0%
          pad_all: 0
          layout: { type: FLEX, flex_flow: ROW, flex_align_cross: CENTER, pad_column: 8 }
          widgets:
            - obj:
                id: set_cool_manual_sp_dec
                styles: setting_step_btn_style
                pressed:
                  styles: setting_step_btn_pressed_style
                scrollable: false
                on_click:
                  - lambda: |-
                      if (id(cool_mode_select).current_option() == "Extern setpoint") {
                        {
                          auto call = id(manual_setpoint).make_call();
                          call.with_operation(number::NUMBER_OP_DECREMENT);
                          call.with_cycle(true);
                          call.perform();
                        }
                        lv_label_set_text(id(set_cool_manual_sp_val), str_sprintf("%.0f°C", id(manual_setpoint).state).c_str());
                        lv_obj_send_event(id(set_cool_manual_sp_val), lvgl::lv_update_event, nullptr);
                      }
                widgets:
                  - label: { text: "\U000F0374", styles: setting_step_icon_style }
            - label: { id: set_cool_manual_sp_val, text: "30°C", text_color: 0x1F2933, text_font: font_text_24 }
            - obj:
                id: set_cool_manual_sp_inc
                styles: setting_step_btn_style
                pressed:
                  styles: setting_step_btn_pressed_style
                scrollable: false
                on_click:
                  - lambda: |-
                      if (id(cool_mode_select).current_option() == "Extern setpoint") {
                        {
                          auto call = id(manual_setpoint).make_call();
                          call.with_operation(number::NUMBER_OP_INCREMENT);
                          call.with_cycle(true);
                          call.perform();
                        }
                        lv_label_set_text(id(set_cool_manual_sp_val), str_sprintf("%.0f°C", id(manual_setpoint).state).c_str());
                        lv_obj_send_event(id(set_cool_manual_sp_val), lvgl::lv_update_event, nullptr);
                      }
                widgets:
                  - label: { text: "\U000F0415", styles: setting_step_icon_style }



