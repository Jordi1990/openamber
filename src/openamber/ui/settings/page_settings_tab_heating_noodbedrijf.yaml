# Menu Page: Noodbedrijf
# ------------------------------------------------------------
id: panel_heating_page_noodbedrijf
title: "Noodbedrijf"
styles: setting_page_style
widgets:
  - obj:
      id: set_general_emergency_mode_row
      styles: setting_row_style
      widgets:
        - label: { text: "Noodbedrijf", text_color: 0x1F2933, text_font: font_text_24, align: TOP_LEFT }
        - label: { text: "Schakel de compressor uit en laat alleen het backup-element werken", text_color: 0x6B7280, text_font: font_text_20, align: TOP_LEFT, y: 32 }
        - switch:
            id: set_emergency_mode_switch_ui
            align: TOP_RIGHT
            bg_color: 0x9CA3AF
            indicator:
              bg_color: 0xF97316
            knob:
              bg_color: 0xFFFFFF
            on_click:
              - lambda: |-
                  if (id(emergency_mode_enabled).state) {
                    id(emergency_mode_enabled).turn_off();
                  } else {
                    id(emergency_mode_enabled).turn_on();
                  }
