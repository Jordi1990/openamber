# Defrost: algemeen content
# ------------------------------------------------------------
- obj:
    id: set_custom_defrost_mode_row
    styles: setting_row_style
    widgets:
      - label: { text: "${t_defrost_controle}", text_color: 0x1F2933, text_font: font_text_24, align: TOP_LEFT }
      - label: { text: "${t_wie_bepaalt_wanneer_er_ontdooid_wordt}", text_color: 0x6B7280, text_font: font_text_20, align: TOP_LEFT, y: 32 }
      - dropdown:
          id: set_custom_defrost_mode_dd
          symbol: "\U000F0140"
          width: 230
          align: TOP_RIGHT
          y: 0
          options:
            - "${t_buitenunit}"
            - "OpenAmber"
          text_font: font_text_20
          dropdown_list:
            text_font: font_text_20
          on_value:
            then:
              - lambda: |-
                  auto val = lv_dropdown_get_selected(id(set_custom_defrost_mode_dd)->obj);
                  auto current = id(defrost_control_select).active_index().value_or(0);
                  if (val == current) return;
                  if (val == CUSTOM_DEFROST_MODE_OPENAMBER) {
                    // OpenAmber takes over defrost control: ask for confirmation first.
                    lv_dropdown_set_selected(id(set_custom_defrost_mode_dd)->obj, current);
                    lv_obj_clear_flag(id(custom_defrost_confirm_modal), LV_OBJ_FLAG_HIDDEN);
                    return;
                  }
                  id(defrost_control_select).make_call().set_index(val).perform();

# Hidden in mode Buitenunit (update_defrost_tiles_ui).
- obj:
    id: set_custom_defrost_min_runtime_row
    styles: setting_row_style
    widgets:
      - label: { text: "${t_minimaal_interval}", text_color: 0x1F2933, text_font: font_text_24, align: TOP_LEFT }
      - label: { text: "${t_draaitijd_tussen_twee_defrosts}", text_color: 0x6B7280, text_font: font_text_20, align: TOP_LEFT, y: 32 }
      - obj:
          width: SIZE_CONTENT
          height: SIZE_CONTENT
          align: TOP_RIGHT
          bg_opa: 0%
          border_opa: 0%
          pad_all: 0
          layout: { type: FLEX, flex_flow: ROW, flex_align_cross: CENTER, pad_column: 8 }
          widgets:
            - obj:
                styles: setting_step_btn_style
                pressed:
                  styles: setting_step_btn_pressed_style
                scrollable: false
                on_click:
                  - number.decrement: custom_defrost_min_runtime
                widgets:
                  - label: { text: "\U000F0374", styles: setting_step_icon_style }
            - label: { id: set_custom_defrost_min_runtime_val, text: "35 min", text_color: 0x1F2933, text_font: font_text_24 }
            - obj:
                styles: setting_step_btn_style
                pressed:
                  styles: setting_step_btn_pressed_style
                scrollable: false
                on_click:
                  - number.increment: custom_defrost_min_runtime
                widgets:
                  - label: { text: "\U000F0415", styles: setting_step_icon_style }

# The source dropdown is filled by the BLE package (ble_sensor_ui.h). Without BLE, or with
# Bluetooth off or no paired sensor, it shows "Geen sensor beschikbaar" and the rows below
# on the Luchtvochtigheid page are disabled (update_custom_defrost_humidity_ui). Hidden in mode Buitenunit.
- obj:
    id: set_custom_defrost_humidity_source_row
    styles: setting_row_style
    scrollable: false
    widgets:
      - label: { text: "${t_bron_buitenvochtigheid}", text_color: 0x1F2933, text_font: font_text_24, align: TOP_LEFT }
      - label: { text: "${t_gekoppelde_bluetooth_sensor}", text_color: 0x6B7280, text_font: font_text_20, align: TOP_LEFT, y: 32 }
      - dropdown:
          id: set_custom_defrost_humidity_source_dd
          width: 360
          height: 40
          align: TOP_RIGHT
          y: -4
          symbol: "\U000F0140"
          options:
            - "${t_geen_sensor_beschikbaar}"
          text_font: font_text_20
          dropdown_list: { text_font: font_text_20 }
