# Defrost: luchtvochtigheid content
# ------------------------------------------------------------
- obj:
    id: set_custom_defrost_frost_margin_row
    styles: setting_row_style
    widgets:
      - label: { text: "${t_marge_rijppunt}", text_color: 0x1F2933, text_font: font_text_24, align: TOP_LEFT }
      - label: { text: "${t_tp_moet_zoveel_onder_het_rijppunt_liggen}", text_color: 0x6B7280, text_font: font_text_20, align: TOP_LEFT, y: 32 }
      - obj:
          width: SIZE_CONTENT
          height: SIZE_CONTENT
          align: TOP_RIGHT
          bg_opa: 0%
          border_opa: 0%
          pad_all: 0
          layout: { type: FLEX, flex_flow: ROW, flex_align_cross: CENTER, pad_column: 8 }
          widgets:
            - obj:
                styles: setting_step_btn_style
                pressed:
                  styles: setting_step_btn_pressed_style
                scrollable: false
                on_click:
                  - number.decrement: custom_defrost_frost_point_margin
                widgets:
                  - label: { text: "\U000F0374", styles: setting_step_icon_style }
            - label: { id: set_custom_defrost_frost_margin_val, text: "0.0 K", text_color: 0x1F2933, text_font: font_text_24 }
            - obj:
                styles: setting_step_btn_style
                pressed:
                  styles: setting_step_btn_pressed_style
                scrollable: false
                on_click:
                  - number.increment: custom_defrost_frost_point_margin
                widgets:
                  - label: { text: "\U000F0415", styles: setting_step_icon_style }

- obj:
    id: set_custom_defrost_humidity_value_row
    styles: setting_row_style
    widgets:
      - label: { text: "${t_buitenvochtigheid_rijppunt}", text_color: 0x1F2933, text_font: font_text_24, align: TOP_LEFT }
      - label: { text: "${t_huidige_meting_en_rijppunt_van_de_lucht}", text_color: 0x6B7280, text_font: font_text_20, align: TOP_LEFT, y: 32 }
      - label: { id: set_custom_defrost_humidity_value_val, text: "-", text_color: 0x1F2933, text_font: font_text_24, align: TOP_RIGHT }

- obj:
    id: set_custom_defrost_ice_threshold_row
    styles: setting_row_style
    widgets:
      - label: { text: "${t_drempel_ijsteller}", text_color: 0x1F2933, text_font: font_text_24, align: TOP_LEFT }
      - label: { text: "${t_ontdooien_bij_zoveel_ijsaangroei_0_uit}", text_color: 0x6B7280, text_font: font_text_20, align: TOP_LEFT, y: 32 }
      - obj:
          width: SIZE_CONTENT
          height: SIZE_CONTENT
          align: TOP_RIGHT
          bg_opa: 0%
          border_opa: 0%
          pad_all: 0
          layout: { type: FLEX, flex_flow: ROW, flex_align_cross: CENTER, pad_column: 8 }
          widgets:
            - obj:
                styles: setting_step_btn_style
                pressed:
                  styles: setting_step_btn_pressed_style
                scrollable: false
                on_click:
                  - number.decrement: custom_defrost_ice_threshold
                widgets:
                  - label: { text: "\U000F0374", styles: setting_step_icon_style }
            - label: { id: set_custom_defrost_ice_threshold_val, text: "90 Pa·h", text_color: 0x1F2933, text_font: font_text_24 }
            - obj:
                styles: setting_step_btn_style
                pressed:
                  styles: setting_step_btn_pressed_style
                scrollable: false
                on_click:
                  - number.increment: custom_defrost_ice_threshold
                widgets:
                  - label: { text: "\U000F0415", styles: setting_step_icon_style }

- obj:
    id: set_custom_defrost_ice_load_row
    styles: setting_row_style
    widgets:
      - label: { text: "${t_ijsteller}", text_color: 0x1F2933, text_font: font_text_24, align: TOP_LEFT }
      - label: { text: "${t_ijsaangroei_sinds_de_laatste_defrost}", text_color: 0x6B7280, text_font: font_text_20, align: TOP_LEFT, y: 32 }
      - label: { id: set_custom_defrost_ice_load_val, text: "0 Pa·h", text_color: 0x1F2933, text_font: font_text_24, align: TOP_RIGHT }
