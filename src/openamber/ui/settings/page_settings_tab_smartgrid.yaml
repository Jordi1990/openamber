# Panel: Energiebeheer (was SmartGrid)
# Sub-tabs: SG-Ready | EEBUS
# ------------------------------------------------------------
obj:
  id: panel_smartgrid
  width: 100%
  height: 100%
  hidden: true
  bg_opa: 0%
  border_opa: 0%
  pad_left: 4
  pad_right: 4
  pad_top: 4
  pad_bottom: 4
  scrollbar_mode: "OFF"
  scrollable: false
  layout:
    type: FLEX
    flex_flow: COLUMN
    flex_align_main: START
    flex_align_cross: CENTER
    pad_row: 4

  widgets:
    - obj:
        id: panel_energie_tab_bar
        width: 100%
        height: 40
        bg_opa: 0%
        border_opa: 0%
        pad_all: 0
        scrollbar_mode: "OFF"
        scrollable: false
        layout:
          type: FLEX
          flex_flow: ROW
          flex_align_main: START
          flex_align_cross: CENTER
          pad_column: 6
        widgets:
          - obj:
              id: energie_stab_sgready
              width: SIZE_CONTENT
              height: 34
              bg_color: 0x1F3B68
              bg_opa: 100%
              radius: 8
              border_opa: 0%
              pad_left: 12
              pad_right: 12
              pad_top: 4
              pad_bottom: 4
              scrollbar_mode: "OFF"
              scrollable: false
              on_click:
                - script.execute:
                    id: energie_select_tab
                    tab_index: 0
              widgets:
                - label: { id: energie_stab_sgready_lbl, text: "SG-Ready", text_color: 0xFFFFFF, text_font: font_text_20, align: CENTER }

          - obj:
              id: energie_stab_eebus
              width: SIZE_CONTENT
              height: 34
              bg_color: 0xCBD5E1
              bg_opa: 100%
              radius: 8
              border_opa: 0%
              pad_left: 12
              pad_right: 12
              pad_top: 4
              pad_bottom: 4
              scrollbar_mode: "OFF"
              scrollable: false
              on_click:
                - script.execute:
                    id: energie_select_tab
                    tab_index: 1
              widgets:
                - label: { id: energie_stab_eebus_lbl, text: "EEBUS", text_color: 0x4B5563, text_font: font_text_20, align: CENTER }

    - obj:
        id: panel_energie_page_sgready
        width: 100%
        height: SIZE_CONTENT
        bg_opa: 0%
        border_opa: 0%
        pad_all: 0
        scrollbar_mode: "OFF"
        scrollable: false
        layout:
          type: FLEX
          flex_flow: COLUMN
          flex_align_main: START
          flex_align_cross: CENTER
          pad_row: 6
        widgets: !include page_settings_tab_energie_sgready_content.yaml

    - obj:
        id: panel_energie_page_eebus
        hidden: true
        width: 100%
        height: 0
        flex_grow: 1
        bg_opa: 0%
        border_opa: 0%
        pad_all: 0
        scrollbar_mode: "OFF"
        scrollable: false
        layout:
          type: FLEX
          flex_flow: COLUMN
          flex_align_main: START
          flex_align_cross: CENTER
          pad_row: 6
        widgets: !include page_settings_tab_energie_eebus_content.yaml

# ------------------------------------------------------------
