# Menu Page: Energiebeheer (Categorie keuzemenu)
# ------------------------------------------------------------
id: panel_smartgrid
title: "${t_energiebeheer}"
widgets:
  - obj:
      width: 100%
      height: SIZE_CONTENT
      bg_opa: 0%
      border_opa: 0%
      pad_left: 12
      pad_right: 12
      pad_top: 4
      pad_bottom: 16
      layout:
        type: FLEX
        flex_flow: ROW_WRAP
        flex_align_main: START
        flex_align_cross: START
        pad_row: 8
        pad_column: 8
      widgets:
        - obj:
            id: energie_stab_sgready
            styles: menu_tile_style
            scrollable: false
            pressed:
              styles: menu_tile_pressed_style
            disabled:
              styles: menu_tile_disabled_style
            on_click:
              - lvgl.menu.set_page:
                  id: settings_menu
                  page: panel_energie_page_sgready
            widgets:
              - label: { text: "\U000F140B", styles: menu_tile_icon_style }
              - label: { id: energie_stab_sgready_lbl, text: "SG-Ready", long_mode: WRAP, styles: menu_tile_label_style }

        - obj:
            id: energie_stab_eebus
            styles: menu_tile_style
            scrollable: false
            pressed:
              styles: menu_tile_pressed_style
            disabled:
              styles: menu_tile_disabled_style
            on_click:
              - lvgl.menu.set_page:
                  id: settings_menu
                  page: panel_energie_page_eebus
              - script.execute: update_eebus_settings_ui
            widgets:
              - label: { text: "\U000F0337", styles: menu_tile_icon_style }
              - label: { id: energie_stab_eebus_lbl, text: "EEBUS", long_mode: WRAP, styles: menu_tile_label_style }
