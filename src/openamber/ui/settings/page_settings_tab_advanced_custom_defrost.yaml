            widgets:
              - label: { text: "\U000F04DB", styles: menu_tile_icon_style }
              - label: { id: custom_defrost_stab_vangnet_lbl, text: "Vangnet en blokkades", long_mode: WRAP, styles: menu_tile_label_style }

        - obj:
            id: custom_defrost_stab_vocht
