# Menu Page: Analytics (Algemeen)
# ------------------------------------------------------------
id: panel_general_page_analytics
title: "Analytics"
styles: setting_page_style
widgets:
  - obj:
      width: 100%
      height: SIZE_CONTENT
      bg_opa: 0%
      border_opa: 0%
      pad_all: 0
      layout:
        type: FLEX
        flex_flow: COLUMN
        flex_align_main: START
        flex_align_cross: CENTER
        pad_row: 8
      widgets:
        - obj:
            id: set_general_system_analytics
            styles: setting_row_style
            widgets:
              - label: { text: "${t_analytics_versturen}", text_color: 0x1F2933, text_font: font_text_24, align: TOP_LEFT }
              - label: { text: "${t_deel_anonieme_gebruiksdata_voor_het_open}", text_color: 0x6B7280, text_font: font_text_20, align: TOP_LEFT, y: 32 }
              - switch:
                  id: set_analytics_enabled_switch_ui
                  align: TOP_RIGHT
                  bg_color: 0x9CA3AF
                  indicator:
                    bg_color: 0x16A34A
                  knob:
                    bg_color: 0xFFFFFF
                  on_click:
                    - lambda: |-
                        if (id(analytics_enabled_switch).state) {
                          id(analytics_enabled_switch).turn_off();
                        } else {
                          id(analytics_enabled_switch).turn_on();
                        }

        - obj:
            id: set_analytics_id_row
            styles: setting_row_style
            hidden: true
            widgets:
              - label: { text: "${t_analytics_id}", text_color: 0x9CA3AF, text_font: font_text_24, align: TOP_LEFT }
              - label:
                  id: set_analytics_id_value
                  width: 100%
                  text: "${t_onbekend}"
                  text_color: 0x9CA3AF
                  text_font: font_text_20
                  long_mode: WRAP
                  align: TOP_LEFT
                  y: 36
