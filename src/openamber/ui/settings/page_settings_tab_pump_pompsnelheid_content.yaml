- obj:
    id: set_pump_heat_row
    styles: setting_row_style
    widgets:
      - label: { text: "${t_pompsnelheid_verwarmen}", text_color: 0x1F2933, text_font: font_text_24, align: TOP_LEFT }
      - label: { text: "${t_pompsnelheid_tijdens_verwarmen}", text_color: 0x6B7280, text_font: font_text_20, align: TOP_LEFT, y: 32 }
      - obj:
          width: SIZE_CONTENT
          height: SIZE_CONTENT
          align: TOP_RIGHT
          bg_opa: 0%
          border_opa: 0%
          pad_all: 0
          layout: { type: FLEX, flex_flow: ROW, flex_align_cross: CENTER, pad_column: 8 }
          widgets:
            - obj:
                id: set_pump_heat_dec_btn
                styles: setting_step_btn_style
                pressed:
                  styles: setting_step_btn_pressed_style
                scrollable: false
                on_click:
                  - lambda: |-
                      if (!id(pump_p0_pid_enabled).state) {
                        {
                          auto call = id(pump_speed_heating_number).make_call();
                          call.with_operation(number::NUMBER_OP_DECREMENT);
                          call.with_cycle(true);
                          call.perform();
                        }
                      }
                widgets:
                  - label: { text: "\U000F0374", styles: setting_step_icon_style }
            - label: { id: set_pump_heat_val, text: "100%", text_color: 0x1F2933, text_font: font_text_24 }
            - obj:
                id: set_pump_heat_inc_btn
                styles: setting_step_btn_style
                pressed:
                  styles: setting_step_btn_pressed_style
                scrollable: false
                on_click:
                  - lambda: |-
                      if (!id(pump_p0_pid_enabled).state) {
                        {
                          auto call = id(pump_speed_heating_number).make_call();
                          call.with_operation(number::NUMBER_OP_INCREMENT);
                          call.with_cycle(true);
                          call.perform();
                        }
                      }
                widgets:
                  - label: { text: "\U000F0415", styles: setting_step_icon_style }
      - obj:
          id: set_pump_heat_disabled_overlay
          hidden: true
          ignore_layout: true
          align: TOP_LEFT
          width: 100%
          height: 100%
          bg_color: 0xF5F8FC
          bg_opa: 60%
          border_opa: 0%
          radius: 8
          pad_all: 0
          scrollbar_mode: "OFF"
          scrollable: false
      

