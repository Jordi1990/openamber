# Menu Page: Vorstbescherming
# ------------------------------------------------------------
id: panel_pump_page_vorstbescherming
title: "${t_vorstbescherming}"
styles: setting_page_style
widgets:
  - obj:
      id: panel_frost
      width: 100%
      height: SIZE_CONTENT
      bg_opa: 0%
      border_opa: 0%
      pad_all: 0
      layout:
        type: FLEX
        flex_flow: COLUMN
        flex_align_main: START
        flex_align_cross: CENTER
        pad_row: 8
      widgets:
        - obj:
            styles: setting_row_style
            widgets:
              - label: { text: "${t_buitentemperatuur_1e_trap}", text_color: 0x1F2933, text_font: font_text_24, align: TOP_LEFT }
              - label: { text: "${t_buitentemperatuur_waaronder_trap_1_activ}", text_color: 0x6B7280, text_font: font_text_20, align: TOP_LEFT, y: 32 }
              - obj:
                  width: SIZE_CONTENT
                  height: SIZE_CONTENT
                  align: TOP_RIGHT
                  bg_opa: 0%
                  border_opa: 0%
                  pad_all: 0
                  layout: { type: FLEX, flex_flow: ROW, flex_align_cross: CENTER, pad_column: 8 }
                  widgets:
                    - obj:
                        styles: setting_step_btn_style
                        pressed:
                          styles: setting_step_btn_pressed_style
                        scrollable: false
                        on_click:
                          - number.decrement: frost_protection_stage_1_temp_ta
                        widgets:
                          - label: { text: "\U000F0374", styles: setting_step_icon_style }
                    - label: { id: set_frost1_val, text: "5.0°C", text_color: 0x1F2933, text_font: font_text_24 }
                    - obj:
                        styles: setting_step_btn_style
                        pressed:
                          styles: setting_step_btn_pressed_style
                        scrollable: false
                        on_click:
                          - number.increment: frost_protection_stage_1_temp_ta
                        widgets:
                          - label: { text: "\U000F0415", styles: setting_step_icon_style }

        - obj:
            styles: setting_row_style
            widgets:
              - label: { text: "${t_buitentemperatuur_2e_trap}", text_color: 0x1F2933, text_font: font_text_24, align: TOP_LEFT }
              - label: { text: "${t_buitentemperatuur_waaronder_trap_2_activ}", text_color: 0x6B7280, text_font: font_text_20, align: TOP_LEFT, y: 32 }
              - obj:
                  width: SIZE_CONTENT
                  height: SIZE_CONTENT
                  align: TOP_RIGHT
                  bg_opa: 0%
                  border_opa: 0%
                  pad_all: 0
                  layout: { type: FLEX, flex_flow: ROW, flex_align_cross: CENTER, pad_column: 8 }
                  widgets:
                    - obj:
                        styles: setting_step_btn_style
                        pressed:
                          styles: setting_step_btn_pressed_style
                        scrollable: false
                        on_click:
                          - number.decrement: frost_protection_stage_2_temp_ta
                        widgets:
                          - label: { text: "\U000F0374", styles: setting_step_icon_style }
                    - label: { id: set_frost2_ta_val, text: "4.0°C", text_color: 0x1F2933, text_font: font_text_24 }
                    - obj:
                        styles: setting_step_btn_style
                        pressed:
                          styles: setting_step_btn_pressed_style
                        scrollable: false
                        on_click:
                          - number.increment: frost_protection_stage_2_temp_ta
                        widgets:
                          - label: { text: "\U000F0415", styles: setting_step_icon_style }

        - obj:
            styles: setting_row_style
            widgets:
              - label: { text: "${t_watertemperatuur_2e_trap}", text_color: 0x1F2933, text_font: font_text_24, align: TOP_LEFT }
              - label: { text: "${t_watertemperatuur_waaronder_trap_2_active}", text_color: 0x6B7280, text_font: font_text_20, align: TOP_LEFT, y: 32 }
              - obj:
                  width: SIZE_CONTENT
                  height: SIZE_CONTENT
                  align: TOP_RIGHT
                  bg_opa: 0%
                  border_opa: 0%
                  pad_all: 0
                  layout: { type: FLEX, flex_flow: ROW, flex_align_cross: CENTER, pad_column: 8 }
                  widgets:
                    - obj:
                        styles: setting_step_btn_style
                        pressed:
                          styles: setting_step_btn_pressed_style
                        scrollable: false
                        on_click:
                          - number.decrement: frost_protection_stage_2_temp_tui
                        widgets:
                          - label: { text: "\U000F0374", styles: setting_step_icon_style }
                    - label: { id: set_frost2_tui_val, text: "7.0°C", text_color: 0x1F2933, text_font: font_text_24 }
                    - obj:
                        styles: setting_step_btn_style
                        pressed:
                          styles: setting_step_btn_pressed_style
                        scrollable: false
                        on_click:
                          - number.increment: frost_protection_stage_2_temp_tui
                        widgets:
                          - label: { text: "\U000F0415", styles: setting_step_icon_style }
