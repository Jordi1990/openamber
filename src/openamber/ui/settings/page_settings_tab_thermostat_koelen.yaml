# Menu Page: Thermostaat Koelen
# ------------------------------------------------------------
id: panel_thermostat_page_koelen
title: "${t_koelen}"
styles: setting_page_style
widgets:
  - obj:
      width: 100%
      height: SIZE_CONTENT
      bg_opa: 0%
      border_opa: 0%
      pad_all: 0
      layout:
        type: FLEX
        flex_flow: COLUMN
        flex_align_main: START
        flex_align_cross: CENTER
        pad_row: 8
      widgets:
        - obj:
            id: thermostat_row_cool_deadband
            styles: setting_row_style
            widgets:
              - label: { text: "${t_deadband_koelen}", text_color: 0x1F2933, text_font: font_text_24, align: TOP_LEFT }
              - label: { text: "${t_temperatuurverschil_boven_setpoint_voor}", text_color: 0x6B7280, text_font: font_text_20, align: TOP_LEFT, y: 32 }
              - obj:
                  width: SIZE_CONTENT
                  height: SIZE_CONTENT
                  align: TOP_RIGHT
                  bg_opa: 0%
                  border_opa: 0%
                  pad_all: 0
                  layout: { type: FLEX, flex_flow: ROW, flex_align_cross: CENTER, pad_column: 8 }
                  widgets:
                    - obj:
                        styles: setting_step_btn_style
                        pressed:
                          styles: setting_step_btn_pressed_style
                        scrollable: false
                        on_click:
                          - number.decrement: thermostat_cool_deadband
                        widgets:
                          - label: { text: "\U000F0374", styles: setting_step_icon_style }
                    - label: { id: set_therm_cool_db_val, text: "0.5°C", text_color: 0x1F2933, text_font: font_text_24 }
                    - obj:
                        styles: setting_step_btn_style
                        pressed:
                          styles: setting_step_btn_pressed_style
                        scrollable: false
                        on_click:
                          - number.increment: thermostat_cool_deadband
                        widgets:
                          - label: { text: "\U000F0415", styles: setting_step_icon_style }

        - obj:
            id: thermostat_row_cool_overrun
            styles: setting_row_style
            widgets:
              - label: { text: "${t_overrun_koelen}", text_color: 0x1F2933, text_font: font_text_24, align: TOP_LEFT }
              - label: { text: "${t_temperatuurverschil_onder_setpoint_voor}", text_color: 0x6B7280, text_font: font_text_20, align: TOP_LEFT, y: 32 }
              - obj:
                  width: SIZE_CONTENT
                  height: SIZE_CONTENT
                  align: TOP_RIGHT
                  bg_opa: 0%
                  border_opa: 0%
                  pad_all: 0
                  layout: { type: FLEX, flex_flow: ROW, flex_align_cross: CENTER, pad_column: 8 }
                  widgets:
                    - obj:
                        styles: setting_step_btn_style
                        pressed:
                          styles: setting_step_btn_pressed_style
                        scrollable: false
                        on_click:
                          - number.decrement: thermostat_cool_overrun
                        widgets:
                          - label: { text: "\U000F0374", styles: setting_step_icon_style }
                    - label: { id: set_therm_cool_or_val, text: "3.0°C", text_color: 0x1F2933, text_font: font_text_24 }
                    - obj:
                        styles: setting_step_btn_style
                        pressed:
                          styles: setting_step_btn_pressed_style
                        scrollable: false
                        on_click:
                          - number.increment: thermostat_cool_overrun
                        widgets:
                          - label: { text: "\U000F0415", styles: setting_step_icon_style }
