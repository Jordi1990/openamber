# Menu Page: Pomp P0 PID Regelparameters
# ------------------------------------------------------------
id: panel_pump_page_p0_pid_params
title: "${t_pid_parameters}"
styles: setting_page_style
widgets:
  - obj:
      id: set_pump_pid_defrost_pwm_row
      styles: setting_row_style
      widgets:
        - label: { text: "${t_pompsnelheid_ontdooien}", text_color: 0x1F2933, text_font: font_text_24, align: TOP_LEFT }
        - label: { text: "${t_pompsnelheid_tijdens_de_ontdooicyclus}", text_color: 0x6B7280, text_font: font_text_20, align: TOP_LEFT, y: 32 }
        - obj:
            width: SIZE_CONTENT
            height: SIZE_CONTENT
            align: TOP_RIGHT
            bg_opa: 0%
            border_opa: 0%
            pad_all: 0
            layout: { type: FLEX, flex_flow: ROW, flex_align_cross: CENTER, pad_column: 8 }
            widgets:
              - obj:
                  styles: setting_step_btn_style
                  pressed:
                    styles: setting_step_btn_pressed_style
                  scrollable: false
                  on_click:
                    - number.decrement: pump_p0_pid_defrost_pwm
                  widgets:
                    - label: { text: "\U000F0374", styles: setting_step_icon_style }
              - label: { id: set_pump_pid_defrost_pwm_val, text: "100%", text_color: 0x1F2933, text_font: font_text_24 }
              - obj:
                  styles: setting_step_btn_style
                  pressed:
                    styles: setting_step_btn_pressed_style
                  scrollable: false
                  on_click:
                    - number.increment: pump_p0_pid_defrost_pwm
                  widgets:
                    - label: { text: "\U000F0415", styles: setting_step_icon_style }

  - obj:
      styles: setting_row_style
      widgets:
        - label: { text: "PID P (Kp)", text_color: 0x1F2933, text_font: font_text_24, align: TOP_LEFT }
        - label: { text: "${t_hoger_sneller_meer_pompcapaciteit_bij_op}", text_color: 0x6B7280, text_font: font_text_20, align: TOP_LEFT, y: 32 }
