- obj:
    styles: setting_row_style
    widgets:
      - label: { text: "${t_legionellapreventie}", text_color: 0x1F2933, text_font: font_text_24, align: TOP_LEFT }
      - label: { text: "${t_periodieke_opwarming_tegen_legionella}", text_color: 0x6B7280, text_font: font_text_20, align: TOP_LEFT, y: 32 }
      - switch:
          id: set_legio_switch
          align: TOP_RIGHT
          bg_color: 0x9CA3AF
          indicator:
            bg_color: 0x16A34A
          knob:
            bg_color: 0xFFFFFF
          on_click:
            - lambda: |-
                if (id(legio_enabled_switch).state) {
                  id(legio_enabled_switch).turn_off();
                } else {
                  id(legio_enabled_switch).turn_on();
                }

- obj:
    styles: setting_row_style
    widgets:
      - label: { id: set_legio_days_lbl, text: "${t_legionella_herhaling_dgn}", text_color: 0x1F2933, text_font: font_text_24, align: TOP_LEFT }
      - label: { id: set_legio_days_sub, text: "${t_dagen_tussen_preventieverwarming}", text_color: 0x6B7280, text_font: font_text_20, align: TOP_LEFT, y: 32 }
      - obj:
          width: SIZE_CONTENT
          height: SIZE_CONTENT
          align: TOP_RIGHT
          bg_opa: 0%
          border_opa: 0%
          pad_all: 0
          layout: { type: FLEX, flex_flow: ROW, flex_align_cross: CENTER, pad_column: 8 }
          widgets:
            - obj:
                id: set_legio_days_dec
                styles: setting_step_btn_style
                pressed:
                  styles: setting_step_btn_pressed_style
                scrollable: false
                on_click:
                  - lambda: |-
                      if (id(legio_enabled_switch).state) {
                        {
                          auto call = id(legio_repeat_days_number).make_call();
                          call.with_operation(number::NUMBER_OP_DECREMENT);
                          call.with_cycle(true);
                          call.perform();
                        }
                      }
                widgets:
                  - label: { id: set_legio_days_dec_lbl, text: "\U000F0374", styles: setting_step_icon_style }
            - label: { id: set_legio_days_val, text: "7 d", text_color: 0x1F2933, text_font: font_text_24 }
            - obj:
                id: set_legio_days_inc
                styles: setting_step_btn_style
                pressed:
                  styles: setting_step_btn_pressed_style
                scrollable: false
                on_click:
                  - lambda: |-
                      if (id(legio_enabled_switch).state) {
                        {
                          auto call = id(legio_repeat_days_number).make_call();
                          call.with_operation(number::NUMBER_OP_INCREMENT);
                          call.with_cycle(true);
                          call.perform();
                        }
                      }
                widgets:
                  - label: { id: set_legio_days_inc_lbl, text: "\U000F0415", styles: setting_step_icon_style }

