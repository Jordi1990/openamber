# Menu Page: Pomp P0 PID Limieten & Doelwaarde
# ------------------------------------------------------------
id: panel_pump_page_p0_pid_limieten
title: "${t_regeling}"
styles: setting_page_style
widgets:
  - obj:
      id: pump_p0_pid_page_1_row_enable
      styles: setting_row_style
      widgets:
        - label: { text: "${t_pomp_p0_dynamisch_pwm_verwarmen}", text_color: 0x1F2933, text_font: font_text_24, align: TOP_LEFT }
        - label: { text: "${t_regel_p0_automatisch_op_basis_van_delta}", text_color: 0x6B7280, text_font: font_text_20, align: TOP_LEFT, y: 32 }
        - switch:
            id: set_pump_pid_enabled_switch_ui
            align: TOP_RIGHT
            bg_color: 0x9CA3AF
            indicator:
              bg_color: 0x16A34A
            knob:
              bg_color: 0xFFFFFF
            on_click:
              - lambda: |-
                  if (id(pump_p0_pid_enabled).state) {
                    id(pump_p0_pid_enabled).turn_off();
                  } else {
                    id(pump_p0_pid_enabled).turn_on();
                  }

  - obj:
      id: set_pump_pid_target_delta_t_row
      styles: setting_row_style
      widgets:
        - label: { text: "${t_gewenste_delta_t}", text_color: 0x1F2933, text_font: font_text_24, align: TOP_LEFT }
        - label: { text: "${t_doelwaarde_voor_tuo_tui_tijdens_verwarme}", text_color: 0x6B7280, text_font: font_text_20, align: TOP_LEFT, y: 32 }
        - obj:
            width: SIZE_CONTENT
            height: SIZE_CONTENT
            align: TOP_RIGHT
            bg_opa: 0%
            border_opa: 0%
            pad_all: 0
            layout: { type: FLEX, flex_flow: ROW, flex_align_cross: CENTER, pad_column: 8 }
            widgets:
              - obj:
                  styles: setting_step_btn_style
                  pressed:
                    styles: setting_step_btn_pressed_style
                  scrollable: false
                  on_click:
                    - number.decrement: pump_p0_pid_target_delta_t
                  widgets:
                    - label: { text: "\U000F0374", styles: setting_step_icon_style }
              - label: { id: set_pump_pid_target_delta_t_val, text: "5.0°C", text_color: 0x1F2933, text_font: font_text_24 }
              - obj:
                  styles: setting_step_btn_style
                  pressed:
                    styles: setting_step_btn_pressed_style
                  scrollable: false
                  on_click:
                    - number.increment: pump_p0_pid_target_delta_t
                  widgets:
                    - label: { text: "\U000F0415", styles: setting_step_icon_style }

  - obj:
      id: set_pump_pid_min_pwm_row
      styles: setting_row_style
      widgets:
        - label: { text: "${t_minimale_pomp_snelheid}", text_color: 0x1F2933, text_font: font_text_24, align: TOP_LEFT }
        - label: { text: "${t_ondergrens_voor_automatische_p0_regeling}", text_color: 0x6B7280, text_font: font_text_20, align: TOP_LEFT, y: 32 }
        - obj:
            width: SIZE_CONTENT
            height: SIZE_CONTENT
            align: TOP_RIGHT
            bg_opa: 0%
            border_opa: 0%
            pad_all: 0
            layout: { type: FLEX, flex_flow: ROW, flex_align_cross: CENTER, pad_column: 8 }
            widgets:
              - obj:
                  styles: setting_step_btn_style
                  pressed:
                    styles: setting_step_btn_pressed_style
                  scrollable: false
                  on_click:
                    - number.decrement: pump_p0_pid_min_pwm
                  widgets:
                    - label: { text: "\U000F0374", styles: setting_step_icon_style }
              - label: { id: set_pump_pid_min_pwm_val, text: "55%", text_color: 0x1F2933, text_font: font_text_24 }
              - obj:
                  styles: setting_step_btn_style
                  pressed:
                    styles: setting_step_btn_pressed_style
                  scrollable: false
                  on_click:
                    - number.increment: pump_p0_pid_min_pwm
                  widgets:
                    - label: { text: "\U000F0415", styles: setting_step_icon_style }

  - obj:
      id: set_pump_pid_max_pwm_row
      styles: setting_row_style
      widgets:
        - label: { text: "${t_maximale_pomp_snelheid}", text_color: 0x1F2933, text_font: font_text_24, align: TOP_LEFT }
        - label: { text: "${t_bovengrens_voor_automatische_p0_regeling}", text_color: 0x6B7280, text_font: font_text_20, align: TOP_LEFT, y: 32 }
        - obj:
            width: SIZE_CONTENT
            height: SIZE_CONTENT
            align: TOP_RIGHT
            bg_opa: 0%
            border_opa: 0%
            pad_all: 0
            layout: { type: FLEX, flex_flow: ROW, flex_align_cross: CENTER, pad_column: 8 }
            widgets:
              - obj:
                  styles: setting_step_btn_style
                  pressed:
                    styles: setting_step_btn_pressed_style
                  scrollable: false
                  on_click:
                    - number.decrement: pump_p0_pid_max_pwm
                  widgets:
                    - label: { text: "\U000F0374", styles: setting_step_icon_style }
              - label: { id: set_pump_pid_max_pwm_val, text: "90%", text_color: 0x1F2933, text_font: font_text_24 }
              - obj:
                  styles: setting_step_btn_style
                  pressed:
                    styles: setting_step_btn_pressed_style
                  scrollable: false
                  on_click:
                    - number.increment: pump_p0_pid_max_pwm
                  widgets:
                    - label: { text: "\U000F0415", styles: setting_step_icon_style }
