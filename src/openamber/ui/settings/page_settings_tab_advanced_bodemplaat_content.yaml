- obj:
    id: set_general_bodemplaat_note_row
    styles: setting_row_style
    widgets:
      - label:
          width: 100%
          text: "${t_let_op_experimentele_instellingen_wijzig}"
          text_color: 0xB45309
          text_font: font_text_20
          long_mode: WRAP
          align: TOP_LEFT

- obj:
    id: set_general_bodemplaat_mode_row
    styles: setting_row_style
    widgets:
      - label: { text: "${t_bodemplaat}", text_color: 0x1F2933, text_font: font_text_24, align: TOP_LEFT }
      - label: { text: "${t_kies_wanneer_actief}", text_color: 0x6B7280, text_font: font_text_20, align: TOP_LEFT, y: 32 }
      - dropdown:
          id: set_bottomplate_mode_dd
          symbol: "\U000F0140"
          width: 230
          align: TOP_RIGHT
          y: 0
          options:
            - "${t_onbekend}"
            - "${t_buitentemperatuur}"
            - "${t_tijdens_defrost}"
          text_font: font_text_20
          dropdown_list:
            text_font: font_text_20
          on_change:
            then:
              - lambda: |-
                  {
                    auto val = lv_dropdown_get_selected(id(set_bottomplate_mode_dd)->obj);
                    if (val == 0) id(bottomplate_heater_mode).make_call().set_option("Onbekend").perform();
                    else if (val == 1) id(bottomplate_heater_mode).make_call().set_option("Buitentemperatuur").perform();
                    else id(bottomplate_heater_mode).make_call().set_option("Tijdens defrost").perform();
                  }
                  id(update_bottomplate_mode_ui).execute();

- obj:
    id: set_general_bodemplaat_start_row
    styles: setting_row_style
    widgets:
      - label: { text: "${t_starttemperatuur_bodemplaat}", text_color: 0x1F2933, text_font: font_text_24, align: TOP_LEFT }
      - label: { text: "${t_buitentemperatuur_voor_inschakelen_bodem}", text_color: 0x6B7280, text_font: font_text_20, align: TOP_LEFT, y: 32 }
      - obj:
          width: SIZE_CONTENT
          height: SIZE_CONTENT
          align: TOP_RIGHT
          bg_opa: 0%
          border_opa: 0%
          pad_all: 0
          layout: { type: FLEX, flex_flow: ROW, flex_align_cross: CENTER, pad_column: 8 }
          widgets:
            - obj:
                styles: setting_step_btn_style
                pressed:
                  styles: setting_step_btn_pressed_style
                scrollable: false
                on_click:
                  - number.decrement: bottomplate_heater_ambient_temperature_start
                widgets:
                  - label: { text: "\U000F0374", styles: setting_step_icon_style }
            - label: { id: set_bottomplate_start_val, text: "34°C", text_color: 0x1F2933, text_font: font_text_24 }
            - obj:
                styles: setting_step_btn_style
                pressed:
                  styles: setting_step_btn_pressed_style
                scrollable: false
                on_click:
                  - number.increment: bottomplate_heater_ambient_temperature_start
                widgets:
                  - label: { text: "\U000F0415", styles: setting_step_icon_style }

- obj:
    id: set_general_bodemplaat_hysteresis_row
    styles: setting_row_style
    widgets:
      - label: { text: "${t_stop_hysterese_bodemplaat}", text_color: 0x1F2933, text_font: font_text_24, align: TOP_LEFT }
      - label: { text: "${t_hysterese_voor_uitschakelen_bodemplaat}", text_color: 0x6B7280, text_font: font_text_20, align: TOP_LEFT, y: 32 }
      - obj:
          width: SIZE_CONTENT
          height: SIZE_CONTENT
          align: TOP_RIGHT
          bg_opa: 0%
          border_opa: 0%
          pad_all: 0
          layout: { type: FLEX, flex_flow: ROW, flex_align_cross: CENTER, pad_column: 8 }
          widgets:
            - obj:
                styles: setting_step_btn_style
                pressed:
                  styles: setting_step_btn_pressed_style
                scrollable: false
                on_click:
                  - number.decrement: bottomplate_heater_ambient_hysteresis_stop
                widgets:
                  - label: { text: "\U000F0374", styles: setting_step_icon_style }
            - label: { id: set_bottomplate_hysteresis_val, text: "3°C", text_color: 0x1F2933, text_font: font_text_24 }
            - obj:
                styles: setting_step_btn_style
                pressed:
                  styles: setting_step_btn_pressed_style
                scrollable: false
                on_click:
                  - number.increment: bottomplate_heater_ambient_hysteresis_stop
                widgets:
                  - label: { text: "\U000F0415", styles: setting_step_icon_style }
