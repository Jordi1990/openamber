- obj:
    styles: setting_row_style
    widgets:
      - label: { text: "${t_wintervermogen}", text_color: 0x1F2933, text_font: font_text_24, align: TOP_LEFT }
      - label: { text: "${t_max_compressorvermogen_in_wintermodus}", text_color: 0x6B7280, text_font: font_text_20, align: TOP_LEFT, y: 32 }
      - dropdown:
          id: set_dhw_winter_dd
          symbol: "\U000F0140"
          width: 220
          align: TOP_RIGHT
          y: 0
          options:
            - "${t_gemiddeld}"
            - "${t_verhoogd}"
            - "${t_hoog}"
            - "${t_maximaal}"
          text_font: font_text_20
          dropdown_list:
            text_font: font_text_20
          on_change:
            then:
              - lambda: |-
                  const char* opts[] = {"Gemiddeld","Verhoogd","Hoog","Maximaal"};
                  auto val = lv_dropdown_get_selected(id(set_dhw_winter_dd)->obj);
                  if (val < 4) id(dhw_compressor_mode_max).make_call().set_option(opts[val]).perform();

- obj:
    styles: setting_row_style
    widgets:
      - label: { text: "${t_wintertemperatuurdrempel}", text_color: 0x1F2933, text_font: font_text_24, align: TOP_LEFT }
      - label: { text: "${t_buitentemperatuur_waaronder_wintermodus}", text_color: 0x6B7280, text_font: font_text_20, align: TOP_LEFT, y: 32 }
      - obj:
          width: SIZE_CONTENT
          height: SIZE_CONTENT
          align: TOP_RIGHT
          bg_opa: 0%
          border_opa: 0%
          pad_all: 0
          layout: { type: FLEX, flex_flow: ROW, flex_align_cross: CENTER, pad_column: 8 }
          widgets:
            - obj:
                styles: setting_step_btn_style
                pressed:
                  styles: setting_step_btn_pressed_style
                scrollable: false
                on_click:
                  - number.decrement: dhw_temperature_threshold_max_compressor_mode
                widgets:
                  - label: { text: "\U000F0374", styles: setting_step_icon_style }
            - label: { id: set_dhw_winter_temp_val, text: "5°C", text_color: 0x1F2933, text_font: font_text_24 }
            - obj:
                styles: setting_step_btn_style
                pressed:
                  styles: setting_step_btn_pressed_style
                scrollable: false
                on_click:
                  - number.increment: dhw_temperature_threshold_max_compressor_mode
                widgets:
                  - label: { text: "\U000F0415", styles: setting_step_icon_style }