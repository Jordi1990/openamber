      - label:
          id: set_dhw_days_summary
          text: "${t_actief_op}"
          text_color: 0x6B7280
          text_font: font_text_20
          align: TOP_LEFT
          y: 108
      - obj:
          width: 100%
          height: SIZE_CONTENT
          align: TOP_LEFT
          y: 138
          bg_opa: 0%
          border_opa: 0%
          pad_all: 0
          widgets:
            - label: { id: set_dhw_start_time_lbl, text: "${t_starttijd}", text_color: 0x1F2933, text_font: font_text_24, align: TOP_LEFT }
            - obj:
                width: SIZE_CONTENT
                height: SIZE_CONTENT
                align: TOP_RIGHT
                bg_opa: 0%
                border_opa: 0%
                pad_all: 0
                layout: { type: FLEX, flex_flow: ROW, flex_align_cross: CENTER, pad_column: 4 }
                widgets:
                  - obj:
                      id: set_dhw_start_time_dec
                      styles: setting_step_btn_style
                      pressed:
                        styles: setting_step_btn_pressed_style
                      scrollable: false
                      on_click:
                        - lambda: |-
                            if (id(dhw_schedule_enabled_switch).state) {
                              {
                                int h = id(dhw_start_time).hour;
                                int m = id(dhw_start_time).minute;
                                m -= 30;
                                if (m < 0) { m += 60; h = (h + 23) % 24; }
                                auto call = id(dhw_start_time).make_call();
                                call.set_time(h, m, 0);
                                call.perform();
                              }
                              lv_label_set_text(id(set_dhw_start_time_val), str_sprintf("%02d:%02d", id(dhw_start_time).hour, id(dhw_start_time).minute).c_str());
                              lv_obj_send_event(id(set_dhw_start_time_val), lvgl::lv_update_event, nullptr);
                            }
                      widgets:
                        - label: { id: set_dhw_start_time_dec_lbl, text: "\U000F0374", styles: setting_step_icon_style }
                  - label: { id: set_dhw_start_time_val, text: "10:00", text_color: 0x1F2933, text_font: font_text_24 }
                  - obj:
                      id: set_dhw_start_time_inc
                      styles: setting_step_btn_style
                      pressed:
                        styles: setting_step_btn_pressed_style
                      scrollable: false
                      on_click:
                        - lambda: |-
                            if (id(dhw_schedule_enabled_switch).state) {
                              {
                                int h = id(dhw_start_time).hour;
                                int m = id(dhw_start_time).minute;
                                m += 30;
                                if (m >= 60) { m -= 60; h = (h + 1) % 24; }
                                auto call = id(dhw_start_time).make_call();
                                call.set_time(h, m, 0);
                                call.perform();
                              }
                              lv_label_set_text(id(set_dhw_start_time_val), str_sprintf("%02d:%02d", id(dhw_start_time).hour, id(dhw_start_time).minute).c_str());
                              lv_obj_send_event(id(set_dhw_start_time_val), lvgl::lv_update_event, nullptr);
                            }
                      widgets:
                        - label: { id: set_dhw_start_time_inc_lbl, text: "\U000F0415", styles: setting_step_icon_style }
