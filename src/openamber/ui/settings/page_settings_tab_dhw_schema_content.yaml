      - switch:
          id: set_dhw_sched_switch
          align: TOP_RIGHT
          bg_color: 0x9CA3AF
          indicator:
            bg_color: 0x16A34A
          knob:
            bg_color: 0xFFFFFF
          on_click:
            - lambda: |-
                if (id(dhw_schedule_enabled_switch).state) {
                  id(dhw_schedule_enabled_switch).turn_off();
                } else {
                  id(dhw_schedule_enabled_switch).turn_on();
                }
