# ── Pagina 1: regie en trigger Tp ──
- obj:
    id: set_custom_defrost_mode_row
    width: 100%
    height: SIZE_CONTENT
    bg_opa: 0%
    border_opa: 0%
    pad_all: 6
    widgets:
      - label: { text: "Defrost-regie", text_color: 0x1F2933, text_font: font_text_24, align: TOP_LEFT }
      - label: { text: "Wie bepaalt wanneer er ontdooid wordt", text_color: 0x6B7280, text_font: font_text_20, align: TOP_LEFT, y: 38 }
      - dropdown:
          id: set_custom_defrost_mode_dd
          symbol: "\U000F0140"
          width: 230
          align: TOP_RIGHT
          y: 0
          options:
            - "Buitenunit"
            - "Dry-run"
            - "OpenAmber"
          text_font: font_text_20
          dropdown_list:
            text_font: font_text_20
          on_value:
            then:
              - lambda: |-
                  auto val = lv_dropdown_get_selected(id(set_custom_defrost_mode_dd)->obj);
                  auto current = id(custom_defrost_mode_select).active_index().value_or(0);
                  if (val == current) return;
                  if (val == 2) {
                    // OpenAmber takes over defrost control: ask for confirmation first.
                    lv_dropdown_set_selected(id(set_custom_defrost_mode_dd)->obj, current);
                    lv_obj_clear_flag(id(custom_defrost_confirm_modal), LV_OBJ_FLAG_HIDDEN);
                    return;
                  }
                  id(custom_defrost_mode_select).make_call().set_index(val).perform();

- obj:
    id: set_custom_defrost_max_ta_row
    width: 100%
    height: SIZE_CONTENT
    bg_opa: 0%
    border_opa: 0%
    pad_all: 6
    widgets:
      - label: { text: "Maximale buitentemperatuur", text_color: 0x1F2933, text_font: font_text_24, align: TOP_LEFT }
      - label: { text: "Boven deze Ta wordt niet ontdooid", text_color: 0x6B7280, text_font: font_text_20, align: TOP_LEFT, y: 38 }
      - obj:
          width: SIZE_CONTENT
          height: SIZE_CONTENT
          align: TOP_RIGHT
          bg_opa: 0%
          border_opa: 0%
          pad_all: 0
          layout: { type: FLEX, flex_flow: ROW, flex_align_cross: CENTER, pad_column: 8 }
          widgets:
            - obj:
                width: 40
                height: 40
                bg_color: 0x1F3B68
                bg_opa: 100%
                radius: 10
                border_opa: 0%
                scrollbar_mode: "OFF"
                scrollable: false
                on_click:
                  - number.decrement: custom_defrost_max_ta
                widgets:
                  - label: { text: "\U000F0374", text_color: 0xFFFFFF, text_font: font_mdi_24, align: CENTER }
            - label: { id: set_custom_defrost_max_ta_val, text: "7°C", text_color: 0x1F2933, text_font: font_text_24 }
            - obj:
                width: 40
