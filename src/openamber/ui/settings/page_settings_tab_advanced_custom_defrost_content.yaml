      - switch:
          id: set_custom_defrost_humidity_switch_ui
          align: TOP_RIGHT
          bg_color: 0x9CA3AF
          indicator:
            bg_color: 0x16A34A
          knob:
            bg_color: 0xFFFFFF
          on_click:
            - if:
                condition:
                  switch.is_on: custom_defrost_humidity_switch
                then:
                  - switch.turn_off: custom_defrost_humidity_switch
                else:
                  - switch.turn_on: custom_defrost_humidity_switch

