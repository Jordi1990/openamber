# ── Pagina 1: regie en interval ──
- obj:
    id: set_custom_defrost_mode_row
    width: 100%
    height: SIZE_CONTENT
    bg_opa: 0%
    border_opa: 0%
    pad_all: 6
    widgets:
      - label: { text: "Defrost-regie", text_color: 0x1F2933, text_font: font_text_24, align: TOP_LEFT }
      - label: { text: "Wie bepaalt wanneer er ontdooid wordt", text_color: 0x6B7280, text_font: font_text_20, align: TOP_LEFT, y: 38 }
      - dropdown:
          id: set_custom_defrost_mode_dd
          symbol: "\U000F0140"
          width: 230
          align: TOP_RIGHT
          y: 0
          options:
            - "Buitenunit"
            - "Dry-run"
            - "OpenAmber"
          text_font: font_text_20
          dropdown_list:
            text_font: font_text_20
          on_value:
            then:
              - lambda: |-
                  auto val = lv_dropdown_get_selected(id(set_custom_defrost_mode_dd)->obj);
                  auto current = id(custom_defrost_mode_select).active_index().value_or(0);
                  if (val == current) return;
                  if (val == 2) {
                    // OpenAmber takes over defrost control: ask for confirmation first.
                    lv_dropdown_set_selected(id(set_custom_defrost_mode_dd)->obj, current);
                    lv_obj_clear_flag(id(custom_defrost_confirm_modal), LV_OBJ_FLAG_HIDDEN);
                    return;
                  }
                  id(custom_defrost_mode_select).make_call().set_index(val).perform();

- obj:
