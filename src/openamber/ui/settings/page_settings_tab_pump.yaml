# Menu Page: Pomp (Categorie keuzemenu)
# ------------------------------------------------------------
id: panel_pump
title: "Pomp"
widgets:
  - obj:
      width: 100%
      height: SIZE_CONTENT
      bg_opa: 0%
      border_opa: 0%
      pad_left: 12
      pad_right: 12
      pad_top: 4
      pad_bottom: 16
      layout:
        type: FLEX
        flex_flow: ROW_WRAP
        flex_align_main: START
        flex_align_cross: START
        pad_row: 8
        pad_column: 8
      widgets:
        - obj:
            id: pump_stab_algemeen
            styles: menu_tile_style
            scrollable: false
            pressed:
              styles: menu_tile_pressed_style
            disabled:
              styles: menu_tile_disabled_style
            on_click:
              - lvgl.menu.set_page:
                  id: settings_menu
                  page: panel_pump_page_algemeen
            widgets:
              - label: { text: "\U000F08BB", styles: menu_tile_icon_style }
              - label: { id: pump_stab_algemeen_lbl, text: "Algemeen", long_mode: WRAP, styles: menu_tile_label_style }

        - obj:
            id: pump_stab_pompsnelheid
            styles: menu_tile_style
            scrollable: false
            pressed:
              styles: menu_tile_pressed_style
            disabled:
              styles: menu_tile_disabled_style
            on_click:
              - lvgl.menu.set_page:
                  id: settings_menu
                  page: panel_pump_page_pompsnelheid
            widgets:
              - label: { text: "\U000F04C5", styles: menu_tile_icon_style }
              - label: { id: pump_stab_pompsnelheid_lbl, text: "Pompsnelheid", long_mode: WRAP, styles: menu_tile_label_style }

        - obj:
            id: pump_stab_p0_pid
            styles: menu_tile_style
            scrollable: false
            pressed:
              styles: menu_tile_pressed_style
            disabled:
              styles: menu_tile_disabled_style
            on_click:
              - lvgl.menu.set_page:
                  id: settings_menu
                  page: panel_pump_page_p0_pid
            widgets:
              - label: { text: "\U000F012A", styles: menu_tile_icon_style }
              - label: { id: pump_stab_p0_pid_lbl, text: "Dynamisch PWM P0", long_mode: WRAP, styles: menu_tile_label_style }

        - obj:
            id: pump_stab_vorstbescherming
            styles: menu_tile_style
            scrollable: false
            pressed:
              styles: menu_tile_pressed_style
            disabled:
              styles: menu_tile_disabled_style
            on_click:
              - lvgl.menu.set_page:
                  id: settings_menu
                  page: panel_pump_page_vorstbescherming
            widgets:
              - label: { text: "\U000F0F29", styles: menu_tile_icon_style }
              - label: { id: pump_stab_vorstbescherming_lbl, text: "Vorst-\nbescherming", long_mode: WRAP, styles: menu_tile_label_style }
