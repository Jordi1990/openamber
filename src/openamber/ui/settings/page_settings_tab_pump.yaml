# Menu Page: Pomp (Hoofdmenu)
# ------------------------------------------------------------
id: panel_pump
title: "Pomp"
widgets:
  - obj:
      id: panel_pump_page_algemeen
      width: 100%
      height: SIZE_CONTENT
      bg_opa: 0%
      border_opa: 0%
      pad_all: 0
      layout:
        type: FLEX
        flex_flow: COLUMN
        flex_align_main: START
        flex_align_cross: CENTER
        pad_row: 6
      widgets: !include page_settings_tab_pump_algemeen_content.yaml

  # Drill-down subpage navigation rows
  - obj:
      id: pump_subpages_nav
      width: 100%
      height: SIZE_CONTENT
      bg_opa: 0%
      border_opa: 0%
      pad_all: 0
      layout:
        type: FLEX
        flex_flow: COLUMN
        flex_align_main: START
        flex_align_cross: CENTER
        pad_row: 6
      widgets:
        - obj:
            id: pump_stab_pompsnelheid
            width: 100%
            height: 52
            bg_color: 0xE8ECF1
            bg_opa: 100%
            radius: 12
            border_opa: 0%
            pad_left: 14
            pad_right: 14
            on_click:
              - lvgl.menu.set_page:
                  id: settings_menu
                  page: panel_pump_page_pompsnelheid
            widgets:
              - label: { id: pump_stab_pompsnelheid_lbl, text: "Pompsnelheid", text_color: 0x1F2933, text_font: font_text_20, align: LEFT_MID }
              - label: { text: "\U000F0142", text_color: 0x6B7280, text_font: font_mdi_24, align: RIGHT_MID }

        - obj:
            id: pump_stab_p0_pid
            width: 100%
            height: 52
            bg_color: 0xE8ECF1
            bg_opa: 100%
            radius: 12
            border_opa: 0%
            pad_left: 14
            pad_right: 14
            on_click:
              - lvgl.menu.set_page:
                  id: settings_menu
                  page: panel_pump_page_p0_pid
            widgets:
              - label: { id: pump_stab_p0_pid_lbl, text: "Dynamisch PWM P0 (PID)", text_color: 0x1F2933, text_font: font_text_20, align: LEFT_MID }
              - label: { text: "\U000F0142", text_color: 0x6B7280, text_font: font_mdi_24, align: RIGHT_MID }

        - obj:
            id: pump_stab_vorstbescherming
            width: 100%
            height: 52
            bg_color: 0xE8ECF1
            bg_opa: 100%
            radius: 12
            border_opa: 0%
            pad_left: 14
            pad_right: 14
            on_click:
              - lvgl.menu.set_page:
                  id: settings_menu
                  page: panel_pump_page_vorstbescherming
            widgets:
              - label: { id: pump_stab_vorstbescherming_lbl, text: "Vorstbescherming", text_color: 0x1F2933, text_font: font_text_20, align: LEFT_MID }
              - label: { text: "\U000F0142", text_color: 0x6B7280, text_font: font_mdi_24, align: RIGHT_MID }
