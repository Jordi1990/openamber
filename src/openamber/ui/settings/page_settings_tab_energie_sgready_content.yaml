# Content: SG-Ready boost-instellingen
# Included by page_settings_tab_smartgrid.yaml (SG-Ready sub-tab)
# ------------------------------------------------------------
- obj:
    styles: setting_row_style
    widgets:
      - label: { text: "${t_verwarmingsboost_c}", text_color: 0x1F2933, text_font: font_text_24, align: TOP_LEFT }
      - label: { text: "${t_extra_temperatuur_verwarming_bij_sg_boos}", text_color: 0x6B7280, text_font: font_text_20, align: TOP_LEFT, y: 32 }
      - obj:
          width: SIZE_CONTENT
          height: SIZE_CONTENT
          align: TOP_RIGHT
          bg_opa: 0%
          border_opa: 0%
          pad_all: 0
          layout: { type: FLEX, flex_flow: ROW, flex_align_cross: CENTER, pad_column: 8 }
          widgets:
            - obj:
                styles: setting_step_btn_style
                pressed:
                  styles: setting_step_btn_pressed_style
                scrollable: false
                on_click:
                  - number.decrement: sg_ready_heating_boost_temperature_number
                widgets:
                  - label: { text: "\U000F0374", styles: setting_step_icon_style }
            - label: { id: set_sg_heat_boost_val, text: "5°C", text_color: 0x1F2933, text_font: font_text_24 }
            - obj:
                styles: setting_step_btn_style
                pressed:
                  styles: setting_step_btn_pressed_style
                scrollable: false
                on_click:
                  - number.increment: sg_ready_heating_boost_temperature_number
                widgets:
                  - label: { text: "\U000F0415", styles: setting_step_icon_style }

