# PID-regeling - Pomp P0
# ------------------------------------------------------------
- obj:
    id: set_pump_pid_kp_row
    styles: setting_row_style
    widgets:
      - label: { text: "Pomp P0 PID P (Kp)", text_color: 0x1F2933, text_font: font_text_24, align: TOP_LEFT }
      - label: { text: "Hoger: sneller meer pompcapaciteit bij oplopende delta-T", text_color: 0x6B7280, text_font: font_text_20, align: TOP_LEFT, y: 32 }
      - obj:
          width: SIZE_CONTENT
          height: SIZE_CONTENT
          align: TOP_RIGHT
          bg_opa: 0%
          border_opa: 0%
          pad_all: 0
          layout: { type: FLEX, flex_flow: ROW, flex_align_cross: CENTER, pad_column: 8 }
          widgets:
            - obj:
                styles: setting_step_btn_style
                pressed:
                  styles: setting_step_btn_pressed_style
                scrollable: false
                on_click:
                  - number.decrement: pump_p0_pid_kp
                widgets:
                  - label: { text: "\U000F0374", styles: setting_step_icon_style }
            - label: { id: set_adv_pump_pid_kp_val, text: "0.12", text_color: 0x1F2933, text_font: font_text_24 }
            - obj:
                styles: setting_step_btn_style
                pressed:
                  styles: setting_step_btn_pressed_style
                scrollable: false
                on_click:
                  - number.increment: pump_p0_pid_kp
                widgets:
                  - label: { text: "\U000F0415", styles: setting_step_icon_style }

