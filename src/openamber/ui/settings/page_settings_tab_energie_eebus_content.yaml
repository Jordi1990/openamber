# Content: EEBUS koppeling
# Included by page_settings_tab_energie_eebus.yaml
# ------------------------------------------------------------
- obj:
    id: eebus_page_1_row_enable
    styles: setting_row_style
    widgets:
      - label: { text: "${t_eebus_inschakelen}", text_color: 0x1F2933, text_font: font_text_24, align: TOP_LEFT }
      - label: { text: "${t_activeer_eebus_communicatie_met_ems}", text_color: 0x6B7280, text_font: font_text_20, align: TOP_LEFT, y: 32 }
      - switch:
          id: set_eebus_enabled_switch_ui
          align: TOP_RIGHT
          bg_color: 0x9CA3AF
          indicator:
            bg_color: 0x16A34A
          knob:
            bg_color: 0xFFFFFF
          on_click:
            - lambda: |-
                if (id(eebus_enabled_switch).state) {
                  id(eebus_enabled_switch).turn_off();
                } else {
                  id(eebus_enabled_switch).turn_on();
                }

- obj:
    id: eebus_page_1_row_connection
    styles: setting_row_style
    widgets:
      - label: { text: "${t_verbinding_met_ems}", text_color: 0x1F2933, text_font: font_text_24, align: TOP_LEFT }
      - label: { id: eebus_connection_sub_lbl, text: "${t_status_van_de_eebus_verbinding}", text_color: 0x6B7280, text_font: font_text_20, align: TOP_LEFT, y: 36 }
      - button:
          id: eebus_disconnect_btn
          hidden: true
          width: SIZE_CONTENT
          height: 32
          align: TOP_LEFT
          y: 68
          bg_color: 0xEF4444
          radius: 6
          pad_left: 12
          pad_right: 12
          pad_top: 2
          pad_bottom: 2
          on_click:
            - script.execute: eebus_disconnect
          widgets:
            - label: { text: "${t_verbreek_verbinding}", text_color: 0xFFFFFF, text_font: font_text_20, align: CENTER }
      - obj:
          width: SIZE_CONTENT
          height: SIZE_CONTENT
          align: TOP_RIGHT
          y: 4
          bg_opa: 0%
          border_opa: 0%
          pad_all: 0
          layout: { type: FLEX, flex_flow: ROW, flex_align_cross: CENTER, pad_column: 8 }
          widgets:
            - label: { id: eebus_connection_status_icon, text: "\U000F0338", text_color: 0xEF4444, text_font: font_mdi_24 }
            - label: { id: eebus_connection_status_lbl, text: "${t_niet_verbonden}", text_color: 0xEF4444, text_font: font_text_20 }

- obj:
    id: eebus_page_1_row_ski
    styles: setting_row_style
    height: 125
    widgets:
      - label: { text: "SKI", text_color: 0x1F2933, text_font: font_text_24, align: TOP_LEFT }
      - label: { text: "${t_subject_key_identifier_voor_pairing}", text_color: 0x6B7280, text_font: font_text_20, align: TOP_LEFT, y: 34 }
      - label:
          id: eebus_ski_display_lbl
          text: "–"
          text_color: 0x1F2933
          text_font: font_text_20
          align: TOP_LEFT
          y: 68
          long_mode: WRAP
          width: 100%
