# Menu Page: Thermostaat (Categorie keuzemenu)
# ------------------------------------------------------------
id: panel_thermostat
title: "${t_thermostaat}"
widgets:
  - obj:
      width: 100%
      height: SIZE_CONTENT
      bg_opa: 0%
      border_opa: 0%
      pad_left: 12
      pad_right: 12
      pad_top: 4
      pad_bottom: 16
      layout:
        type: FLEX
        flex_flow: ROW_WRAP
        flex_align_main: START
        flex_align_cross: START
        pad_row: 8
        pad_column: 8
      widgets:
        - obj:
            id: thermostat_stab_setpoints
            styles: menu_tile_style
            scrollable: false
            pressed:
              styles: menu_tile_pressed_style
            disabled:
              styles: menu_tile_disabled_style
            on_click:
              - lvgl.menu.set_page:
                  id: settings_menu
                  page: panel_thermostat_page_setpoint
            widgets:
              - label: { text: "\U000F08BB", styles: menu_tile_icon_style }
              - label: { id: thermostat_stab_setpoints_lbl, text: "${t_algemeen}", long_mode: WRAP, styles: menu_tile_label_style }

        - obj:
            id: thermostat_stab_verwarmen
            styles: menu_tile_style
            scrollable: false
            pressed:
              styles: menu_tile_pressed_style
            disabled:
              styles: menu_tile_disabled_style
            on_click:
              - lvgl.menu.set_page:
                  id: settings_menu
                  page: panel_thermostat_page_verwarmen
            widgets:
              - label: { text: "\U000F0238", styles: menu_tile_icon_style }
              - label: { id: thermostat_stab_verwarmen_lbl, text: "${t_verwarmen}", long_mode: WRAP, styles: menu_tile_label_style }

        - obj:
            id: thermostat_stab_koelen
            styles: menu_tile_style
            scrollable: false
            pressed:
              styles: menu_tile_pressed_style
            disabled:
              styles: menu_tile_disabled_style
            on_click:
              - lvgl.menu.set_page:
                  id: settings_menu
                  page: panel_thermostat_page_koelen
            widgets:
              - label: { text: "\U000F0717", styles: menu_tile_icon_style }
              - label: { id: thermostat_stab_koelen_lbl, text: "${t_koelen}", long_mode: WRAP, styles: menu_tile_label_style }

        - obj:
            id: thermostat_stab_extern
            styles: menu_tile_style
            scrollable: false
            pressed:
              styles: menu_tile_pressed_style
            disabled:
              styles: menu_tile_disabled_style
            on_click:
              - lvgl.menu.set_page:
                  id: settings_menu
                  page: panel_thermostat_page_extern
              - script.execute: update_thermostat_settings_ui
            widgets:
              - label: { text: "\U000F0337", styles: menu_tile_icon_style }
              - label: { id: thermostat_stab_extern_lbl, text: "${t_externe_thermostaat}", long_mode: WRAP, styles: menu_tile_label_style }
