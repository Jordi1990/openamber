# Ventilator content: Ventilator - Koelen buitentemperatuur
# ------------------------------------------------------------
- obj:
    id: set_fan_cool_max_row
    styles: setting_row_style
    widgets:
      - label: { text: "${t_koelen_warm_of_hoog}", text_color: 0x1F2933, text_font: font_text_24, align: TOP_LEFT }
      - label: { text: "${t_ta_vanaf_25c_of_compressor_vanaf_f7}", text_color: 0x6B7280, text_font: font_text_20, align: TOP_LEFT, y: 32 }
      - obj:
          width: SIZE_CONTENT
          height: SIZE_CONTENT
          align: TOP_RIGHT
          bg_opa: 0%
          border_opa: 0%
          pad_all: 0
          layout: { type: FLEX, flex_flow: ROW, flex_align_cross: CENTER, pad_column: 8 }
          widgets:
            - obj:
                styles: setting_step_btn_style
                pressed:
                  styles: setting_step_btn_pressed_style
                scrollable: false
                on_click:
                  - number.decrement: outdoor_unit_fan_param_3328
                widgets:
                  - label: { text: "\U000F0374", styles: setting_step_icon_style }
            - label: { id: set_fan_cool_max_val, text: "-- rpm", text_color: 0x1F2933, text_font: font_text_24 }
            - obj:
                styles: setting_step_btn_style
                pressed:
                  styles: setting_step_btn_pressed_style
                scrollable: false
                on_click:
                  - number.increment: outdoor_unit_fan_param_3328
                widgets:
                  - label: { text: "\U000F0415", styles: setting_step_icon_style }

