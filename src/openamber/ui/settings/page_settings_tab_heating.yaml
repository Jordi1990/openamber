# Menu Page: Verwarmen (Categorie keuzemenu)
# ------------------------------------------------------------
id: panel_heating
title: "Verwarmen"
widgets:
  - obj:
      width: 100%
      height: SIZE_CONTENT
      bg_opa: 0%
      border_opa: 0%
      pad_all: 0
      layout:
        type: FLEX
        flex_flow: COLUMN
        flex_align_main: START
        flex_align_cross: CENTER
        pad_row: 8
      widgets:
        - obj:
            id: heating_stab_algemeen
            width: 100%
            height: 52
            bg_color: 0xFFFFFF
            bg_opa: 100%
            radius: 12
            border_width: 1
            border_color: 0xE2E8F0
            border_opa: 100%
            pad_left: 16
            pad_right: 16
            on_click:
              - lvgl.menu.set_page:
                  id: settings_menu
                  page: panel_heating_page_algemeen
            widgets:
              - label: { text: "\U000F058F", text_color: 0x1F3B68, text_font: font_mdi_24, align: LEFT_MID }
              - label: { id: heating_stab_algemeen_lbl, text: "Algemeen & Modus", text_color: 0x1F2933, text_font: font_text_20, align: LEFT_MID, x: 40 }
              - label: { text: "\U000F0142", text_color: 0x9CA3AF, text_font: font_mdi_24, align: RIGHT_MID }

        - obj:
            id: heating_stab_stooklijn
            width: 100%
            height: 52
            bg_color: 0xFFFFFF
            bg_opa: 100%
            radius: 12
            border_width: 1
            border_color: 0xE2E8F0
            border_opa: 100%
            pad_left: 16
            pad_right: 16
            on_click:
              - lvgl.menu.set_page:
                  id: settings_menu
                  page: panel_heating_page_stooklijn
              - script.execute: update_heat_curve_chart
            widgets:
              - label: { text: "\U000F0126", text_color: 0x1F3B68, text_font: font_mdi_24, align: LEFT_MID }
              - label: { id: heating_stab_stooklijn_lbl, text: "Stooklijn Zone 1", text_color: 0x1F2933, text_font: font_text_20, align: LEFT_MID, x: 40 }
              - label: { text: "\U000F0142", text_color: 0x9CA3AF, text_font: font_mdi_24, align: RIGHT_MID }

        - obj:
            id: heating_stab_stooklijn_z2
            width: 100%
            height: 52
            bg_color: 0xFFFFFF
            bg_opa: 100%
            radius: 12
            border_width: 1
            border_color: 0xE2E8F0
            border_opa: 100%
            pad_left: 16
            pad_right: 16
            on_click:
              - lvgl.menu.set_page:
                  id: settings_menu
                  page: panel_heating_page_stooklijn_z2
              - script.execute: update_heat_curve_z2_chart
            widgets:
              - label: { text: "\U000F0126", text_color: 0x1F3B68, text_font: font_mdi_24, align: LEFT_MID }
              - label: { id: heating_stab_stooklijn_z2_lbl, text: "Stooklijn Zone 2", text_color: 0x1F2933, text_font: font_text_20, align: LEFT_MID, x: 40 }
              - label: { text: "\U000F0142", text_color: 0x9CA3AF, text_font: font_mdi_24, align: RIGHT_MID }

        - obj:
            id: heating_stab_start_stop
            width: 100%
            height: 52
            bg_color: 0xFFFFFF
            bg_opa: 100%
            radius: 12
            border_width: 1
            border_color: 0xE2E8F0
            border_opa: 100%
            pad_left: 16
            pad_right: 16
            on_click:
              - lvgl.menu.set_page:
                  id: settings_menu
                  page: panel_heating_page_start_stop
            widgets:
              - label: { text: "\U000F04D6", text_color: 0x1F3B68, text_font: font_mdi_24, align: LEFT_MID }
              - label: { id: heating_stab_start_stop_lbl, text: "Start / Stop Parameters", text_color: 0x1F2933, text_font: font_text_20, align: LEFT_MID, x: 40 }
              - label: { text: "\U000F0142", text_color: 0x9CA3AF, text_font: font_mdi_24, align: RIGHT_MID }

        - obj:
            id: heating_stab_noodbedrijf
            width: 100%
            height: 52
            bg_color: 0xFFFFFF
            bg_opa: 100%
            radius: 12
            border_width: 1
            border_color: 0xE2E8F0
            border_opa: 100%
            pad_left: 16
            pad_right: 16
            on_click:
              - lvgl.menu.set_page:
                  id: settings_menu
                  page: panel_heating_page_noodbedrijf
            widgets:
              - label: { text: "\U000F0026", text_color: 0x1F3B68, text_font: font_mdi_24, align: LEFT_MID }
              - label: { id: heating_stab_noodbedrijf_lbl, text: "Noodbedrijf", text_color: 0x1F2933, text_font: font_text_20, align: LEFT_MID, x: 40 }
              - label: { text: "\U000F0142", text_color: 0x9CA3AF, text_font: font_mdi_24, align: RIGHT_MID }
