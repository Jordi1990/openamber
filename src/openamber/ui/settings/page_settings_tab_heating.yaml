# Menu Page: Verwarmen (Hoofdmenu)
# ------------------------------------------------------------
id: panel_heating
title: "Verwarmen"
widgets:
  - obj:
      id: panel_heating_page_algemeen
      width: 100%
      height: SIZE_CONTENT
      bg_opa: 0%
      border_opa: 0%
      pad_all: 0
      layout:
        type: FLEX
        flex_flow: COLUMN
        flex_align_main: START
        flex_align_cross: CENTER
        pad_row: 6
      widgets: !include page_settings_tab_heating_algemeen_content.yaml

  # Drill-down subpage navigation rows
  - obj:
      id: heating_subpages_nav
      width: 100%
      height: SIZE_CONTENT
      bg_opa: 0%
      border_opa: 0%
      pad_all: 0
      layout:
        type: FLEX
        flex_flow: COLUMN
        flex_align_main: START
        flex_align_cross: CENTER
        pad_row: 6
      widgets:
        - obj:
            id: heating_stab_stooklijn
            width: 100%
            height: 52
            bg_color: 0xE8ECF1
            bg_opa: 100%
            radius: 12
            border_opa: 0%
            pad_left: 14
            pad_right: 14
            on_click:
              - lvgl.menu.set_page:
                  id: settings_menu
                  page: panel_heating_page_stooklijn
              - script.execute: update_heat_curve_chart
            widgets:
              - label: { id: heating_stab_stooklijn_lbl, text: "Stooklijn Zone 1", text_color: 0x1F2933, text_font: font_text_20, align: LEFT_MID }
              - label: { text: "\U000F0142", text_color: 0x6B7280, text_font: font_mdi_24, align: RIGHT_MID }

        - obj:
            id: heating_stab_stooklijn_z2
            width: 100%
            height: 52
            bg_color: 0xE8ECF1
            bg_opa: 100%
            radius: 12
            border_opa: 0%
            pad_left: 14
            pad_right: 14
            on_click:
              - lvgl.menu.set_page:
                  id: settings_menu
                  page: panel_heating_page_stooklijn_z2
              - script.execute: update_heat_curve_z2_chart
            widgets:
              - label: { id: heating_stab_stooklijn_z2_lbl, text: "Stooklijn Zone 2", text_color: 0x1F2933, text_font: font_text_20, align: LEFT_MID }
              - label: { text: "\U000F0142", text_color: 0x6B7280, text_font: font_mdi_24, align: RIGHT_MID }

        - obj:
            id: heating_stab_start_stop
            width: 100%
            height: 52
            bg_color: 0xE8ECF1
            bg_opa: 100%
            radius: 12
            border_opa: 0%
            pad_left: 14
            pad_right: 14
            on_click:
              - lvgl.menu.set_page:
                  id: settings_menu
                  page: panel_heating_page_start_stop
            widgets:
              - label: { id: heating_stab_start_stop_lbl, text: "Start / Stop Parameters", text_color: 0x1F2933, text_font: font_text_20, align: LEFT_MID }
              - label: { text: "\U000F0142", text_color: 0x6B7280, text_font: font_mdi_24, align: RIGHT_MID }

        - obj:
            id: heating_stab_noodbedrijf
            width: 100%
            height: 52
            bg_color: 0xE8ECF1
            bg_opa: 100%
            radius: 12
            border_opa: 0%
            pad_left: 14
            pad_right: 14
            on_click:
              - lvgl.menu.set_page:
                  id: settings_menu
                  page: panel_heating_page_noodbedrijf
            widgets:
              - label: { id: heating_stab_noodbedrijf_lbl, text: "Noodbedrijf", text_color: 0x1F2933, text_font: font_text_20, align: LEFT_MID }
              - label: { text: "\U000F0142", text_color: 0x6B7280, text_font: font_mdi_24, align: RIGHT_MID }
