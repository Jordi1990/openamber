# Menu Page: Verwarmen (Categorie keuzemenu)
# ------------------------------------------------------------
id: panel_heating
title: "${t_verwarmen}"
widgets:
  - obj:
      width: 100%
      height: SIZE_CONTENT
      bg_opa: 0%
      border_opa: 0%
      pad_left: 12
      pad_right: 12
      pad_top: 4
      pad_bottom: 16
      layout:
        type: FLEX
        flex_flow: ROW_WRAP
        flex_align_main: START
        flex_align_cross: START
        pad_row: 8
        pad_column: 8
      widgets:
        - obj:
            id: heating_stab_algemeen
            styles: menu_tile_style
            scrollable: false
            pressed:
              styles: menu_tile_pressed_style
            disabled:
              styles: menu_tile_disabled_style
            on_click:
              - lvgl.menu.set_page:
                  id: settings_menu
                  page: panel_heating_page_algemeen
            widgets:
              - label: { text: "\U000F08BB", styles: menu_tile_icon_style }
              - label: { id: heating_stab_algemeen_lbl, text: "${t_algemeen}", long_mode: WRAP, styles: menu_tile_label_style }

        - obj:
            id: heating_stab_stooklijn
            styles: menu_tile_style
            scrollable: false
            pressed:
              styles: menu_tile_pressed_style
            disabled:
              styles: menu_tile_disabled_style
            on_click:
              - lvgl.menu.set_page:
                  id: settings_menu
                  page: panel_heating_page_stooklijn
              - script.execute: update_heat_curve_chart
            widgets:
              - label: { text: "\U000F0FA7", styles: menu_tile_icon_style }
              - label: { id: heating_stab_stooklijn_lbl, text: "${t_stooklijn_zone_1}", long_mode: WRAP, styles: menu_tile_label_style }

        - obj:
            id: heating_stab_stooklijn_z2
            styles: menu_tile_style
            scrollable: false
            pressed:
              styles: menu_tile_pressed_style
            disabled:
              styles: menu_tile_disabled_style
            on_click:
              - lvgl.menu.set_page:
                  id: settings_menu
                  page: panel_heating_page_stooklijn_z2
              - script.execute: update_heat_curve_z2_chart
            widgets:
              - label: { text: "\U000F0FA7", styles: menu_tile_icon_style }
              - label: { id: heating_stab_stooklijn_z2_lbl, text: "${t_stooklijn_zone_2}", long_mode: WRAP, styles: menu_tile_label_style }

        - obj:
            id: heating_stab_start_stop
            styles: menu_tile_style
            scrollable: false
            pressed:
              styles: menu_tile_pressed_style
            disabled:
              styles: menu_tile_disabled_style
            on_click:
              - lvgl.menu.set_page:
                  id: settings_menu
                  page: panel_heating_page_start_stop
            widgets:
              - label: { text: "\U000F040E", styles: menu_tile_icon_style }
              - label: { id: heating_stab_start_stop_lbl, text: "${t_start_stop}", long_mode: WRAP, styles: menu_tile_label_style }

        - obj:
            id: heating_stab_noodbedrijf
            styles: menu_tile_style
            scrollable: false
            pressed:
              styles: menu_tile_pressed_style
            disabled:
              styles: menu_tile_disabled_style
            on_click:
              - lvgl.menu.set_page:
                  id: settings_menu
                  page: panel_heating_page_noodbedrijf
            widgets:
              - label: { text: "\U000F0026", styles: menu_tile_icon_style }
              - label: { id: heating_stab_noodbedrijf_lbl, text: "${t_noodbedrijf}", long_mode: WRAP, styles: menu_tile_label_style }
