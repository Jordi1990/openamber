# Menu Page: Dynamisch PWM P0 (PID) - Categoriekeuzemenu
# ------------------------------------------------------------
id: panel_pump_page_p0_pid
title: "${t_dynamisch_pwm_p0}"
widgets:
  - obj:
      width: 100%
      height: SIZE_CONTENT
      bg_opa: 0%
      border_opa: 0%
      pad_left: 12
      pad_right: 12
      pad_top: 4
      pad_bottom: 16
      layout:
        type: FLEX
        flex_flow: ROW_WRAP
        flex_align_main: START
        flex_align_cross: START
        pad_row: 8
        pad_column: 8
      widgets:
        - obj:
            id: pump_stab_p0_pid_limieten
            styles: menu_tile_style
            scrollable: false
            pressed:
              styles: menu_tile_pressed_style
            disabled:
              styles: menu_tile_disabled_style
            on_click:
              - lvgl.menu.set_page:
                  id: settings_menu
                  page: panel_pump_page_p0_pid_limieten
            widgets:
              - label: { text: "\U000F062E", styles: menu_tile_icon_style }
              - label: { id: pump_stab_p0_pid_limieten_lbl, text: "${t_regeling}", long_mode: WRAP, styles: menu_tile_label_style }

        - obj:
            id: pump_stab_p0_pid_params
            styles: menu_tile_style
            scrollable: false
            pressed:
              styles: menu_tile_pressed_style
            disabled:
              styles: menu_tile_disabled_style
            on_click:
              - lvgl.menu.set_page:
                  id: settings_menu
                  page: panel_pump_page_p0_pid_params
            widgets:
              - label: { text: "\U000F012A", styles: menu_tile_icon_style }
              - label: { id: pump_stab_p0_pid_params_lbl, text: "${t_pid_parameters}", long_mode: WRAP, styles: menu_tile_label_style }
