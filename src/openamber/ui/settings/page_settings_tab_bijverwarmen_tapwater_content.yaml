- obj:
    styles: setting_row_style
    widgets:
      - label: { text: "Min. verwarmsnelheid", text_color: 0x1F2933, text_font: font_text_24, align: TOP_LEFT }
      - label: { text: "Minimale Tapwater-verwarmsnelheid; lager schakelt backup in", text_color: 0x6B7280, text_font: font_text_20, align: TOP_LEFT, y: 32 }
      - obj:
          width: SIZE_CONTENT
          height: SIZE_CONTENT
          align: TOP_RIGHT
          bg_opa: 0%
          border_opa: 0%
          pad_all: 0
          layout: { type: FLEX, flex_flow: ROW, flex_align_cross: CENTER, pad_column: 8 }
          widgets:
            - obj:
                styles: setting_step_btn_style
                pressed:
                  styles: setting_step_btn_pressed_style
                scrollable: false
                on_click:
                  - number.decrement: dhw_backup_min_avg_rate
                widgets:
                  - label: { text: "\U000F0374", styles: setting_step_icon_style }
            - label: { id: set_dhw_rate_val, text: "0.12 °C/min", text_color: 0x1F2933, text_font: font_text_24 }
            - obj:
                styles: setting_step_btn_style
                pressed:
                  styles: setting_step_btn_pressed_style
                scrollable: false
                on_click:
                  - number.increment: dhw_backup_min_avg_rate
                widgets:
                  - label: { text: "\U000F0415", styles: setting_step_icon_style }

- obj:
    styles: setting_row_style
    widgets:
      - label: { text: "Backupvertraging", text_color: 0x1F2933, text_font: font_text_24, align: TOP_LEFT }
      - label: { text: "Tijd onder minimale verwarmsnelheid voordat backup inschakelt", text_color: 0x6B7280, text_font: font_text_20, align: TOP_LEFT, y: 32 }
      - obj:
          width: SIZE_CONTENT
          height: SIZE_CONTENT
          align: TOP_RIGHT
          bg_opa: 0%
          border_opa: 0%
          pad_all: 0
          layout: { type: FLEX, flex_flow: ROW, flex_align_cross: CENTER, pad_column: 8 }
          widgets:
            - obj:
                styles: setting_step_btn_style
                pressed:
                  styles: setting_step_btn_pressed_style
                scrollable: false
                on_click:
                  - number.decrement: dhw_backup_min_avg_rate_delay_minutes
                widgets:
                  - label: { text: "\U000F0374", styles: setting_step_icon_style }
            - label: { id: set_dhw_rate_delay_val, text: "5 min", text_color: 0x1F2933, text_font: font_text_24 }
            - obj:
                styles: setting_step_btn_style
                pressed:
                  styles: setting_step_btn_pressed_style
                scrollable: false
                on_click:
                  - number.increment: dhw_backup_min_avg_rate_delay_minutes
                widgets:
                  - label: { text: "\U000F0415", styles: setting_step_icon_style }
