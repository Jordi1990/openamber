- obj:
    styles: setting_row_style
    widgets:
      - label: { text: "${t_backup_element}", text_color: 0x1F2933, text_font: font_text_24, align: TOP_LEFT }
      - label: { text: "${t_extern_is_voor_hybride_opstellingen}", text_color: 0x6B7280, text_font: font_text_20, align: TOP_LEFT, y: 32 }
      - dropdown:
          id: set_backup_heating_mode_dd
          symbol: "\U000F0140"
          width: 320
          align: TOP_RIGHT
          y: 0
          options:
            - "${t_intern_verwarmingselement}"
            - "${t_externe_backup_verwarming}"
          text_font: font_text_20
          dropdown_list:
            text_font: font_text_20
          on_change:
            then:
              - lambda: |-
                  auto val = lv_dropdown_get_selected(id(set_backup_heating_mode_dd)->obj);
                  if (val == 0) id(backup_heating_mode).make_call().set_option("Intern verwarmingselement").perform();
                  else id(backup_heating_mode).make_call().set_option("Externe backup verwarming").perform();

- obj:
    styles: setting_row_style
    widgets:
      - label: { text: "${t_boosttemperatuur_bij_ontdooien}", text_color: 0x1F2933, text_font: font_text_24, align: TOP_LEFT }
      - label: { text: "${t_buitentemperatuur_voor_backup_bij_ontdoo}", text_color: 0x6B7280, text_font: font_text_20, align: TOP_LEFT, y: 32 }
      - obj:
          width: SIZE_CONTENT
          height: SIZE_CONTENT
          align: TOP_RIGHT
          bg_opa: 0%
          border_opa: 0%
          pad_all: 0
          layout: { type: FLEX, flex_flow: ROW, flex_align_cross: CENTER, pad_column: 8 }
          widgets:
            - obj:
                styles: setting_step_btn_style
                pressed:
                  styles: setting_step_btn_pressed_style
                scrollable: false
                on_click:
                  - number.decrement: defrost_backup_heater_boost_temperature_sensor
                widgets:
                  - label: { text: "\U000F0374", styles: setting_step_icon_style }
            - label: { id: set_defrost_boost_val, text: "-3°C", text_color: 0x1F2933, text_font: font_text_24 }
            - obj:
                styles: setting_step_btn_style
                pressed:
                  styles: setting_step_btn_pressed_style
                scrollable: false
                on_click:
                  - number.increment: defrost_backup_heater_boost_temperature_sensor
                widgets:
                  - label: { text: "\U000F0415", styles: setting_step_icon_style }
