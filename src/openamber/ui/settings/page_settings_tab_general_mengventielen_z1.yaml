# Menu Page: Mengventiel Zone 1
# ------------------------------------------------------------
id: panel_general_mv_zone1
title: "${t_mengventiel_zone_1_3}"
styles: setting_page_style
widgets:
  - obj:
      width: 100%
      height: SIZE_CONTENT
      bg_opa: 0%
      border_opa: 0%
      pad_all: 0
      layout:
        type: FLEX
        flex_flow: COLUMN
        flex_align_main: START
        flex_align_cross: CENTER
        pad_row: 8
      widgets:
        - obj:
            id: set_general_mv_z1_enabled
            styles: setting_row_style
            widgets:
              - label: { text: "${t_mengventiel_zone_1_aanwezig}", text_color: 0x1F2933, text_font: font_text_24, align: TOP_LEFT }
              - label: { text: "${t_mengventiel_zone_1_is_aanwezig_in_het_sy}", text_color: 0x6B7280, text_font: font_text_20, align: TOP_LEFT, y: 32 }
              - switch:
                  id: set_mv_z1_enabled_switch_ui
                  align: TOP_RIGHT
                  bg_color: 0x9CA3AF
                  indicator:
                    bg_color: 0x16A34A
                  knob:
                    bg_color: 0xFFFFFF
                  on_click:
                    - lambda: |-
                        if (id(mixing_valve_zone1_enabled).state) {
                          id(mixing_valve_zone1_enabled).turn_off();
                        } else {
                          id(mixing_valve_zone1_enabled).turn_on();
                        }

        - obj:
            id: set_general_mv_z1_min
            styles: setting_row_style
            widgets:
              - label: { text: "${t_minimum_positie}", text_color: 0x1F2933, text_font: font_text_24, align: TOP_LEFT }
              - label: { text: "${t_minimale_ventielopening_zone_1}", text_color: 0x6B7280, text_font: font_text_20, align: TOP_LEFT, y: 32 }
              - obj:
                  width: SIZE_CONTENT
                  height: SIZE_CONTENT
                  align: TOP_RIGHT
                  bg_opa: 0%
                  border_opa: 0%
                  pad_all: 0
                  layout: { type: FLEX, flex_flow: ROW, flex_align_cross: CENTER, pad_column: 8 }
                  widgets:
                    - obj:
                        styles: setting_step_btn_style
                        pressed:
                          styles: setting_step_btn_pressed_style
                        scrollable: false
                        on_click:
                          - number.decrement: mixing_valve_zone1_min_position
                        widgets:
                          - label: { text: "\U000F0374", styles: setting_step_icon_style }
                    - label: { id: set_mv_z1_min_val, text: "0%", text_color: 0x1F2933, text_font: font_text_24 }
                    - obj:
                        styles: setting_step_btn_style
                        pressed:
                          styles: setting_step_btn_pressed_style
                        scrollable: false
                        on_click:
                          - number.increment: mixing_valve_zone1_min_position
                        widgets:
                          - label: { text: "\U000F0415", styles: setting_step_icon_style }

        - obj:
            id: set_general_mv_z1_max
            styles: setting_row_style
            widgets:
              - label: { text: "${t_maximum_positie}", text_color: 0x1F2933, text_font: font_text_24, align: TOP_LEFT }
              - label: { text: "${t_maximale_ventielopening_zone_1}", text_color: 0x6B7280, text_font: font_text_20, align: TOP_LEFT, y: 32 }
              - obj:
                  width: SIZE_CONTENT
                  height: SIZE_CONTENT
                  align: TOP_RIGHT
                  bg_opa: 0%
                  border_opa: 0%
                  pad_all: 0
                  layout: { type: FLEX, flex_flow: ROW, flex_align_cross: CENTER, pad_column: 8 }
                  widgets:
                    - obj:
                        styles: setting_step_btn_style
                        pressed:
                          styles: setting_step_btn_pressed_style
                        scrollable: false
                        on_click:
                          - number.decrement: mixing_valve_zone1_max_position
                        widgets:
                          - label: { text: "\U000F0374", styles: setting_step_icon_style }
                    - label: { id: set_mv_z1_max_val, text: "100%", text_color: 0x1F2933, text_font: font_text_24 }
                    - obj:
                        styles: setting_step_btn_style
                        pressed:
                          styles: setting_step_btn_pressed_style
                        scrollable: false
                        on_click:
                          - number.increment: mixing_valve_zone1_max_position
                        widgets:
                          - label: { text: "\U000F0415", styles: setting_step_icon_style }
