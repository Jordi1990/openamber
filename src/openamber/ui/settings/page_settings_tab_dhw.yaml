# Menu Page: Tapwater (Categorie keuzemenu)
# ------------------------------------------------------------
id: panel_dhw
title: "Tapwater"
widgets:
  - obj:
      width: 100%
      height: SIZE_CONTENT
      bg_opa: 0%
      border_opa: 0%
      pad_all: 0
      layout:
        type: FLEX
        flex_flow: ROW_WRAP
        flex_align_main: START
        flex_align_cross: START
        pad_row: 10
        pad_column: 10
      widgets:
        - obj:
            id: dhw_stab_algemeen
            width: 49%
            height: 54
            bg_color: 0xFFFFFF
            bg_opa: 100%
            radius: 12
            border_width: 1
            border_color: 0xE2E8F0
            border_opa: 100%
            pad_left: 16
            pad_right: 16
            on_click:
              - lvgl.menu.set_page:
                  id: settings_menu
                  page: panel_dhw_page_algemeen
            widgets:
              - label: { text: "\U000F05A8", text_color: 0x1F3B68, text_font: font_mdi_24, align: LEFT_MID }
              - label: { id: dhw_stab_algemeen_lbl, text: "Basis & Setpoint", text_color: 0x1F2933, text_font: font_text_20, align: LEFT_MID, x: 40 }
              - label: { text: "\U000F0142", text_color: 0x9CA3AF, text_font: font_mdi_24, align: RIGHT_MID }

        - obj:
            id: dhw_stab_schema
            width: 49%
            height: 54
            bg_color: 0xFFFFFF
            bg_opa: 100%
            radius: 12
            border_width: 1
            border_color: 0xE2E8F0
            border_opa: 100%
            pad_left: 16
            pad_right: 16
            on_click:
              - lvgl.menu.set_page:
                  id: settings_menu
                  page: panel_dhw_page_schema
            widgets:
              - label: { text: "\U000F00F0", text_color: 0x1F3B68, text_font: font_mdi_24, align: LEFT_MID }
              - label: { id: dhw_stab_schema_lbl, text: "Klokprogramma & Schema", text_color: 0x1F2933, text_font: font_text_20, align: LEFT_MID, x: 40 }
              - label: { text: "\U000F0142", text_color: 0x9CA3AF, text_font: font_mdi_24, align: RIGHT_MID }

        - obj:
            id: dhw_stab_legionella
            width: 49%
            height: 54
            bg_color: 0xFFFFFF
            bg_opa: 100%
            radius: 12
            border_width: 1
            border_color: 0xE2E8F0
            border_opa: 100%
            pad_left: 16
            pad_right: 16
            on_click:
              - lvgl.menu.set_page:
                  id: settings_menu
                  page: panel_dhw_page_legionella
            widgets:
              - label: { text: "\U000F04B3", text_color: 0x1F3B68, text_font: font_mdi_24, align: LEFT_MID }
              - label: { id: dhw_stab_legionella_lbl, text: "Anti-Legionella Regeling", text_color: 0x1F2933, text_font: font_text_20, align: LEFT_MID, x: 40 }
              - label: { text: "\U000F0142", text_color: 0x9CA3AF, text_font: font_mdi_24, align: RIGHT_MID }

        - obj:
            id: dhw_stab_winter
            width: 49%
            height: 54
            bg_color: 0xFFFFFF
            bg_opa: 100%
            radius: 12
            border_width: 1
            border_color: 0xE2E8F0
            border_opa: 100%
            pad_left: 16
            pad_right: 16
            on_click:
              - lvgl.menu.set_page:
                  id: settings_menu
                  page: panel_dhw_page_winter
            widgets:
              - label: { text: "\U000F071A", text_color: 0x1F3B68, text_font: font_mdi_24, align: LEFT_MID }
              - label: { id: dhw_stab_winter_lbl, text: "Winter Parameters", text_color: 0x1F2933, text_font: font_text_20, align: LEFT_MID, x: 40 }
              - label: { text: "\U000F0142", text_color: 0x9CA3AF, text_font: font_mdi_24, align: RIGHT_MID }
