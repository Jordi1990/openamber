# Menu Page: Tapwater (Categorie keuzemenu)
# ------------------------------------------------------------
id: panel_dhw
title: "${t_tapwater}"
widgets:
  - obj:
      width: 100%
      height: SIZE_CONTENT
      bg_opa: 0%
      border_opa: 0%
      pad_left: 12
      pad_right: 12
      pad_top: 4
      pad_bottom: 16
      layout:
        type: FLEX
        flex_flow: ROW_WRAP
        flex_align_main: START
        flex_align_cross: START
        pad_row: 8
        pad_column: 8
      widgets:
        - obj:
            id: dhw_stab_algemeen
            styles: menu_tile_style
            scrollable: false
            pressed:
              styles: menu_tile_pressed_style
            disabled:
              styles: menu_tile_disabled_style
            on_click:
              - lvgl.menu.set_page:
                  id: settings_menu
                  page: panel_dhw_page_algemeen
            widgets:
              - label: { text: "\U000F08BB", styles: menu_tile_icon_style }
              - label: { id: dhw_stab_algemeen_lbl, text: "${t_algemeen}", long_mode: WRAP, styles: menu_tile_label_style }

        - obj:
            id: dhw_stab_schema
            styles: menu_tile_style
            scrollable: false
            pressed:
              styles: menu_tile_pressed_style
            disabled:
              styles: menu_tile_disabled_style
            on_click:
              - lvgl.menu.set_page:
                  id: settings_menu
                  page: panel_dhw_page_schema
            widgets:
              - label: { text: "\U000F00F0", styles: menu_tile_icon_style }
              - label: { id: dhw_stab_schema_lbl, text: "${t_schema}", long_mode: WRAP, styles: menu_tile_label_style }

        - obj:
            id: dhw_stab_legionella
            styles: menu_tile_style
            scrollable: false
            pressed:
              styles: menu_tile_pressed_style
            disabled:
              styles: menu_tile_disabled_style
            on_click:
              - lvgl.menu.set_page:
                  id: settings_menu
                  page: panel_dhw_page_legionella
            widgets:
              - label: { text: "\U000F0ED5", styles: menu_tile_icon_style }
              - label: { id: dhw_stab_legionella_lbl, text: "${t_legionella}", long_mode: WRAP, styles: menu_tile_label_style }

        - obj:
            id: dhw_stab_winter
            styles: menu_tile_style
            scrollable: false
            pressed:
              styles: menu_tile_pressed_style
            disabled:
              styles: menu_tile_disabled_style
            on_click:
              - lvgl.menu.set_page:
                  id: settings_menu
                  page: panel_dhw_page_winter
            widgets:
              - label: { text: "\U000F1A71", styles: menu_tile_icon_style }
              - label: { id: dhw_stab_winter_lbl, text: "Winter", long_mode: WRAP, styles: menu_tile_label_style }
