# Menu Page: Tapwater (Hoofdmenu)
# ------------------------------------------------------------
id: panel_dhw
title: "Tapwater"
widgets:
  - obj:
      id: panel_dhw_page_algemeen
      width: 100%
      height: SIZE_CONTENT
      bg_opa: 0%
      border_opa: 0%
      pad_all: 0
      layout:
        type: FLEX
        flex_flow: COLUMN
        flex_align_main: START
        flex_align_cross: CENTER
        pad_row: 6
      widgets: !include page_settings_tab_dhw_algemeen_content.yaml

  # Drill-down subpage navigation rows
  - obj:
      id: dhw_subpages_nav
      width: 100%
      height: SIZE_CONTENT
      bg_opa: 0%
      border_opa: 0%
      pad_all: 0
      layout:
        type: FLEX
        flex_flow: COLUMN
        flex_align_main: START
        flex_align_cross: CENTER
        pad_row: 6
      widgets:
        - obj:
            id: dhw_stab_schema
            width: 100%
            height: 52
            bg_color: 0xE8ECF1
            bg_opa: 100%
            radius: 12
            border_opa: 0%
            pad_left: 14
            pad_right: 14
            on_click:
              - lvgl.menu.set_page:
                  id: settings_menu
                  page: panel_dhw_page_schema
            widgets:
              - label: { id: dhw_stab_schema_lbl, text: "Klokprogramma & Schema", text_color: 0x1F2933, text_font: font_text_20, align: LEFT_MID }
              - label: { text: "\U000F0142", text_color: 0x6B7280, text_font: font_mdi_24, align: RIGHT_MID }

        - obj:
            id: dhw_stab_legionella
            width: 100%
            height: 52
            bg_color: 0xE8ECF1
            bg_opa: 100%
            radius: 12
            border_opa: 0%
            pad_left: 14
            pad_right: 14
            on_click:
              - lvgl.menu.set_page:
                  id: settings_menu
                  page: panel_dhw_page_legionella
            widgets:
              - label: { id: dhw_stab_legionella_lbl, text: "Anti-Legionella Regeling", text_color: 0x1F2933, text_font: font_text_20, align: LEFT_MID }
              - label: { text: "\U000F0142", text_color: 0x6B7280, text_font: font_mdi_24, align: RIGHT_MID }

        - obj:
            id: dhw_stab_winter
            width: 100%
            height: 52
            bg_color: 0xE8ECF1
            bg_opa: 100%
            radius: 12
            border_opa: 0%
            pad_left: 14
            pad_right: 14
            on_click:
              - lvgl.menu.set_page:
                  id: settings_menu
                  page: panel_dhw_page_winter
            widgets:
              - label: { id: dhw_stab_winter_lbl, text: "Winter Parameters", text_color: 0x1F2933, text_font: font_text_20, align: LEFT_MID }
              - label: { text: "\U000F0142", text_color: 0x6B7280, text_font: font_mdi_24, align: RIGHT_MID }
