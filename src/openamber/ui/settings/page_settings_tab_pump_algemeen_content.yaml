- obj:
    styles: setting_row_style
    widgets:
      - label: { text: "Pomp P1 aanwezig", text_color: 0x1F2933, text_font: font_text_24, align: TOP_LEFT }
      - label: { text: "Extra circulatiepomp P1 aanwezig", text_color: 0x6B7280, text_font: font_text_20, align: TOP_LEFT, y: 32 }
      - switch:
          id: set_pump_p1_switch
          align: TOP_RIGHT
          bg_color: 0x9CA3AF
          indicator:
            bg_color: 0x16A34A
          knob:
            bg_color: 0xFFFFFF
          on_click:
            - lambda: |-
                if (id(pump_p1_enabled).state) {
                  id(pump_p1_enabled).turn_off();
                } else {
                  id(pump_p1_enabled).turn_on();
                }
      

- obj:
    styles: setting_row_style
    widgets:
      - label: { text: "Pompinterval (min)", text_color: 0x1F2933, text_font: font_text_24, align: TOP_LEFT }
      - label: { text: "Tussentijd periodiek pompen bij warmte-/koudevraag", text_color: 0x6B7280, text_font: font_text_20, align: TOP_LEFT, y: 32 }
      - obj:
          width: SIZE_CONTENT
          height: SIZE_CONTENT
          align: TOP_RIGHT
          bg_opa: 0%
          border_opa: 0%
          pad_all: 0
          layout: { type: FLEX, flex_flow: ROW, flex_align_cross: CENTER, pad_column: 8 }
          widgets:
            - obj:
                styles: setting_step_btn_style
                pressed:
                  styles: setting_step_btn_pressed_style
                scrollable: false
                on_click:
                  - number.decrement: pump_interval
                widgets:
                  - label: { text: "\U000F0374", styles: setting_step_icon_style }
            - label: { id: set_pump_interval_val, text: "15 min", text_color: 0x1F2933, text_font: font_text_24 }
            - obj:
                styles: setting_step_btn_style
                pressed:
                  styles: setting_step_btn_pressed_style
                scrollable: false
                on_click:
                  - number.increment: pump_interval
                widgets:
                  - label: { text: "\U000F0415", styles: setting_step_icon_style }
      

