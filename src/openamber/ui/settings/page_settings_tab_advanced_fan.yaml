# Menu Page: Geavanceerd - Ventilator (Categorie keuzemenu)
# ------------------------------------------------------------
id: panel_advanced_page_fan
title: "Ventilator"
widgets:
  - obj:
      width: 100%
      height: SIZE_CONTENT
      bg_opa: 0%
      border_opa: 0%
      pad_left: 12
      pad_right: 12
      pad_top: 4
      pad_bottom: 16
      layout:
        type: FLEX
        flex_flow: ROW_WRAP
        flex_align_main: START
        flex_align_cross: START
        pad_row: 8
        pad_column: 8
      widgets:
        - obj:
            id: advanced_fan_stab_heat_ta
            styles: menu_tile_style
            scrollable: false
            pressed:
              styles: menu_tile_pressed_style
            disabled:
              styles: menu_tile_disabled_style
            on_click:
              - lvgl.menu.set_page:
                  id: settings_menu
                  page: panel_advanced_page_fan_heat_ta
            widgets:
              - label: { text: "\U000F0238", styles: menu_tile_icon_style }
              - label: { id: advanced_fan_stab_heat_ta_lbl, text: "Verwarmen: buitentemp.", long_mode: WRAP, styles: menu_tile_label_style }

        - obj:
            id: advanced_fan_stab_heat_hz
            styles: menu_tile_style
            scrollable: false
            pressed:
              styles: menu_tile_pressed_style
            disabled:
              styles: menu_tile_disabled_style
            on_click:
              - lvgl.menu.set_page:
                  id: settings_menu
                  page: panel_advanced_page_fan_heat_hz
            widgets:
              - label: { text: "\U000F04C5", styles: menu_tile_icon_style }
              - label: { id: advanced_fan_stab_heat_hz_lbl, text: "Verwarmen: compressor", long_mode: WRAP, styles: menu_tile_label_style }

        - obj:
            id: advanced_fan_stab_cool_ta
            styles: menu_tile_style
            scrollable: false
            pressed:
              styles: menu_tile_pressed_style
            disabled:
              styles: menu_tile_disabled_style
            on_click:
              - lvgl.menu.set_page:
                  id: settings_menu
                  page: panel_advanced_page_fan_cool_ta
            widgets:
              - label: { text: "\U000F0717", styles: menu_tile_icon_style }
              - label: { id: advanced_fan_stab_cool_ta_lbl, text: "Koelen: buitentemp.", long_mode: WRAP, styles: menu_tile_label_style }

        - obj:
            id: advanced_fan_stab_cool_hz
            styles: menu_tile_style
            scrollable: false
            pressed:
              styles: menu_tile_pressed_style
            disabled:
              styles: menu_tile_disabled_style
            on_click:
              - lvgl.menu.set_page:
                  id: settings_menu
                  page: panel_advanced_page_fan_cool_hz
            widgets:
              - label: { text: "\U000F04C5", styles: menu_tile_icon_style }
              - label: { id: advanced_fan_stab_cool_hz_lbl, text: "Koelen: compressor", long_mode: WRAP, styles: menu_tile_label_style }
