# Menu Page: Bijverwarmen (Categorie keuzemenu)
# ------------------------------------------------------------
id: panel_bijverwarmen
title: "${t_bijverwarmen}"
widgets:
  - obj:
      width: 100%
      height: SIZE_CONTENT
      bg_opa: 0%
      border_opa: 0%
      pad_left: 12
      pad_right: 12
      pad_top: 4
      pad_bottom: 16
      layout:
        type: FLEX
        flex_flow: ROW_WRAP
        flex_align_main: START
        flex_align_cross: START
        pad_row: 8
        pad_column: 8
      widgets:
        - obj:
            id: bijverwarmen_stab_algemeen
            styles: menu_tile_style
            scrollable: false
            pressed:
              styles: menu_tile_pressed_style
            disabled:
              styles: menu_tile_disabled_style
            on_click:
              - lvgl.menu.set_page:
                  id: settings_menu
                  page: panel_bijverwarmen_page_algemeen
            widgets:
              - label: { text: "\U000F08BB", styles: menu_tile_icon_style }
              - label: { id: bijverwarmen_stab_algemeen_lbl, text: "${t_algemeen}", long_mode: WRAP, styles: menu_tile_label_style }

        - obj:
            id: bijverwarmen_stab_verwarmen
            styles: menu_tile_style
            scrollable: false
            pressed:
              styles: menu_tile_pressed_style
            disabled:
              styles: menu_tile_disabled_style
            on_click:
              - lvgl.menu.set_page:
                  id: settings_menu
                  page: panel_bijverwarmen_page_verwarmen
            widgets:
              - label: { text: "\U000F0238", styles: menu_tile_icon_style }
              - label: { id: bijverwarmen_stab_verwarmen_lbl, text: "${t_verwarmen}", long_mode: WRAP, styles: menu_tile_label_style }

        - obj:
            id: bijverwarmen_stab_tapwater
            styles: menu_tile_style
            scrollable: false
            pressed:
              styles: menu_tile_pressed_style
            disabled:
              styles: menu_tile_disabled_style
            on_click:
              - lvgl.menu.set_page:
                  id: settings_menu
                  page: panel_bijverwarmen_page_tapwater
            widgets:
              - label: { text: "\U000F0F92", styles: menu_tile_icon_style }
              - label: { id: bijverwarmen_stab_tapwater_lbl, text: "${t_tapwater}", long_mode: WRAP, styles: menu_tile_label_style }
