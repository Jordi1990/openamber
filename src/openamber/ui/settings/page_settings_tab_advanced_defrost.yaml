# Menu Page: Geavanceerd - Defrost (Categorie keuzemenu)
# ------------------------------------------------------------
id: panel_advanced_page_defrost
title: "${t_defrost}"
widgets:
  - obj:
      width: 100%
      height: SIZE_CONTENT
      bg_opa: 0%
      border_opa: 0%
      pad_left: 12
      pad_right: 12
      pad_top: 4
      pad_bottom: 16
      layout:
        type: FLEX
        flex_flow: ROW_WRAP
        flex_align_main: START
        flex_align_cross: START
        pad_row: 8
        pad_column: 8
      widgets:
        - obj:
            id: defrost_stab_general
            styles: menu_tile_style
            scrollable: false
            pressed:
              styles: menu_tile_pressed_style
            disabled:
              styles: menu_tile_disabled_style
            on_click:
              - lvgl.menu.set_page:
                  id: settings_menu
                  page: panel_advanced_page_defrost_general
            widgets:
              - label: { text: "\U000F062E", styles: menu_tile_icon_style }
              - label: { id: defrost_stab_general_lbl, text: "${t_algemeen}", long_mode: WRAP, styles: menu_tile_label_style }

        - obj:
            id: defrost_stab_startlijn
            styles: menu_tile_style
            scrollable: false
            pressed:
              styles: menu_tile_pressed_style
            disabled:
              styles: menu_tile_disabled_style
            on_click:
              - lvgl.menu.set_page:
                  id: settings_menu
                  page: panel_advanced_page_defrost_startlijn
            widgets:
              - label: { text: "\U000F1A71", styles: menu_tile_icon_style }
              - label: { id: defrost_stab_startlijn_lbl, text: "${t_startlijn_en_interval}", long_mode: WRAP, styles: menu_tile_label_style }

        - obj:
            id: defrost_stab_vocht
            styles: menu_tile_style
            scrollable: false
            pressed:
              styles: menu_tile_pressed_style
            disabled:
              styles: menu_tile_disabled_style
            on_click:
              - script.execute: update_custom_defrost_humidity_ui
              - lvgl.menu.set_page:
                  id: settings_menu
                  page: panel_advanced_page_defrost_vocht
            widgets:
              - label: { text: "\U000F058C", styles: menu_tile_icon_style }
              - label: { id: defrost_stab_vocht_lbl, text: "${t_lucht_vochtigheid}", long_mode: WRAP, styles: menu_tile_label_style }

        - obj:
            id: defrost_stab_start_temps
            styles: menu_tile_style
            scrollable: false
            pressed:
              styles: menu_tile_pressed_style
            disabled:
              styles: menu_tile_disabled_style
            on_click:
              - lvgl.menu.set_page:
                  id: settings_menu
                  page: panel_advanced_page_defrost_temps
            widgets:
              - label: { text: "\U000F050F", styles: menu_tile_icon_style }
              - label: { id: defrost_stab_start_temps_lbl, text: "${t_start_temperaturen_unit}", long_mode: WRAP, styles: menu_tile_label_style }

        - obj:
            id: defrost_stab_end
            styles: menu_tile_style
            scrollable: false
            pressed:
              styles: menu_tile_pressed_style
            disabled:
              styles: menu_tile_disabled_style
            on_click:
              - lvgl.menu.set_page:
                  id: settings_menu
                  page: panel_advanced_page_defrost_end
            widgets:
              - label: { text: "\U000F12CB", styles: menu_tile_icon_style }
              - label: { id: defrost_stab_end_lbl, text: "${t_einde_defrost}", long_mode: WRAP, styles: menu_tile_label_style }

        - obj:
            id: defrost_stab_status
            styles: menu_tile_style
            scrollable: false
            pressed:
              styles: menu_tile_pressed_style
            disabled:
              styles: menu_tile_disabled_style
            on_click:
              - lvgl.menu.set_page:
                  id: settings_menu
                  page: panel_advanced_page_defrost_status
            widgets:
              - label: { text: "\U000F1767", styles: menu_tile_icon_style }
              - label: { id: defrost_stab_status_lbl, text: "Status", long_mode: WRAP, styles: menu_tile_label_style }
