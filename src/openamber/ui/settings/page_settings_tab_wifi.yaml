# Menu Page: Connectiviteit (Categorie keuzemenu)
# ------------------------------------------------------------
id: panel_wifi
title: "${t_connectiviteit}"
widgets:
  - obj:
      # The BLE package adds its Bluetooth card here.
      id: connectivity_cards
      width: 100%
      height: SIZE_CONTENT
      bg_opa: 0%
      border_opa: 0%
      pad_left: 12
      pad_right: 12
      pad_top: 4
      pad_bottom: 16
      layout:
        type: FLEX
        flex_flow: ROW_WRAP
        flex_align_main: START
        flex_align_cross: START
        pad_row: 8
        pad_column: 8
      widgets:
        - obj:
            id: conn_stab_wifi
            styles: menu_tile_style
            scrollable: false
            pressed:
              styles: menu_tile_pressed_style
            disabled:
              styles: menu_tile_disabled_style
            on_click:
              - lvgl.menu.set_page:
                  id: settings_menu
                  page: panel_wifi_page_wifi
              - script.execute: wifi_scan_networks_if_empty
            widgets:
              - label: { text: "\U000F0928", styles: menu_tile_icon_style }
              - label: { id: conn_stab_wifi_lbl, text: "${t_wifi}", long_mode: WRAP, styles: menu_tile_label_style }
