- obj:
    styles: setting_row_style
    widgets:
      - label: { text: "${t_backup_min_drempel}", text_color: 0x1F2933, text_font: font_text_24, align: TOP_LEFT }
      - label: { text: "${t_graadminuten_drempel_voor_backup_element}", text_color: 0x6B7280, text_font: font_text_20, align: TOP_LEFT, y: 32 }
      - obj:
          width: SIZE_CONTENT
          height: SIZE_CONTENT
          align: TOP_RIGHT
          bg_opa: 0%
          border_opa: 0%
          pad_all: 0
          layout: { type: FLEX, flex_flow: ROW, flex_align_cross: CENTER, pad_column: 8 }
          widgets:
            - obj:
                styles: setting_step_btn_style
                pressed:
                  styles: setting_step_btn_pressed_style
                scrollable: false
                on_click:
                  - number.decrement: backup_heater_degmin_threshold
                widgets:
                  - label: { text: "\U000F0374", styles: setting_step_icon_style }
            - label: { id: set_degmin_val, text: "40 °C·min", text_color: 0x1F2933, text_font: font_text_24 }
            - obj:
                styles: setting_step_btn_style
                pressed:
                  styles: setting_step_btn_pressed_style
                scrollable: false
                on_click:
                  - number.increment: backup_heater_degmin_threshold
                widgets:
                  - label: { text: "\U000F0415", styles: setting_step_icon_style }

- obj:
    id: set_backup_block_temp_row
    styles: setting_row_style
    widgets:
      - label: { text: "${t_blokkeren_boven_buitentemp}", text_color: 0x1F2933, text_font: font_text_24, align: TOP_LEFT }
      - label: { text: "${t_gemiddeld_over_1_uur_30c_in_de_praktijk}", text_color: 0x6B7280, text_font: font_text_20, align: TOP_LEFT, y: 32 }
      - obj:
          width: SIZE_CONTENT
          height: SIZE_CONTENT
          align: TOP_RIGHT
          bg_opa: 0%
          border_opa: 0%
          pad_all: 0
          layout: { type: FLEX, flex_flow: ROW, flex_align_cross: CENTER, pad_column: 8 }
          widgets:
            - obj:
                id: set_backup_block_temp_dec
                styles: setting_step_btn_style
                pressed:
                  styles: setting_step_btn_pressed_style
                scrollable: false
                on_click:
                  # No wrap-around: from -10 °C to 30 °C (never block) or back in one tap would be a surprise.
                  - number.decrement:
                      id: backup_heater_outside_block_temperature
                      cycle: false
                widgets:
                  - label: { text: "\U000F0374", styles: setting_step_icon_style }
            - label: { id: set_backup_block_temp_val, text: "30°C", text_color: 0x1F2933, text_font: font_text_24 }
            - obj:
                id: set_backup_block_temp_inc
                styles: setting_step_btn_style
                pressed:
                  styles: setting_step_btn_pressed_style
                scrollable: false
                on_click:
                  - number.increment:
                      id: backup_heater_outside_block_temperature
                      cycle: false
                widgets:
                  - label: { text: "\U000F0415", styles: setting_step_icon_style }

- obj:
    styles: setting_row_style
    widgets:
      - label: { text: "Stop delta backup element", text_color: 0x1F2933, text_font: font_text_24, align: TOP_LEFT }
      - label: { text: "Backup element uit bij TC boven setpoint + delta (ook voorspeld)", text_color: 0x6B7280, text_font: font_text_20, align: TOP_LEFT, y: 32 }
      - obj:
          width: SIZE_CONTENT
          height: SIZE_CONTENT
          align: TOP_RIGHT
          bg_opa: 0%
          border_opa: 0%
          pad_all: 0
          layout: { type: FLEX, flex_flow: ROW, flex_align_cross: CENTER, pad_column: 8 }
          widgets:
            - obj:
                styles: setting_step_btn_style
                pressed:
                  styles: setting_step_btn_pressed_style
                scrollable: false
                on_click:
                  - number.decrement:
                      id: backup_heater_stop_delta
                      cycle: false
                widgets:
                  - label: { text: "\U000F0374", styles: setting_step_icon_style }
            - label: { id: set_buh_stop_delta_val, text: "2.0 °C", text_color: 0x1F2933, text_font: font_text_24 }
            - obj:
                styles: setting_step_btn_style
                pressed:
                  styles: setting_step_btn_pressed_style
                scrollable: false
                on_click:
                  - number.increment:
                      id: backup_heater_stop_delta
                      cycle: false
                widgets:
                  - label: { text: "\U000F0415", styles: setting_step_icon_style }
