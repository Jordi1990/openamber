# Menu Page: Algemeen (Categorie keuzemenu)
# ------------------------------------------------------------
id: panel_general
title: "${t_algemeen}"
widgets:
  - obj:
      width: 100%
      height: SIZE_CONTENT
      bg_opa: 0%
      border_opa: 0%
      pad_left: 12
      pad_right: 12
      pad_top: 4
      pad_bottom: 16
      layout:
        type: FLEX
        flex_flow: ROW_WRAP
        flex_align_main: START
        flex_align_cross: START
        pad_row: 8
        pad_column: 8
      widgets:
        - obj:
            id: general_stab_systeem
            styles: menu_tile_style
            scrollable: false
            pressed:
              styles: menu_tile_pressed_style
            disabled:
              styles: menu_tile_disabled_style
            on_click:
              - lvgl.menu.set_page:
                  id: settings_menu
                  page: panel_general_page_systeem
            widgets:
              - label: { text: "\U000F08D6", styles: menu_tile_icon_style }
              - label: { id: general_stab_systeem_lbl, text: "${t_systeem}", long_mode: WRAP, styles: menu_tile_label_style }

        - obj:
            id: general_stab_display
            styles: menu_tile_style
            scrollable: false
            pressed:
              styles: menu_tile_pressed_style
            disabled:
              styles: menu_tile_disabled_style
            on_click:
              - lvgl.menu.set_page:
                  id: settings_menu
                  page: panel_general_page_display
            widgets:
              - label: { text: "\U000F0379", styles: menu_tile_icon_style }
              - label: { id: general_stab_display_lbl, text: "${t_display}", long_mode: WRAP, styles: menu_tile_label_style }

        - obj:
            id: general_stab_mengventielen
            styles: menu_tile_style
            scrollable: false
            pressed:
              styles: menu_tile_pressed_style
            disabled:
              styles: menu_tile_disabled_style
            on_click:
              - lvgl.menu.set_page:
                  id: settings_menu
                  page: panel_general_page_mengventielen
            widgets:
              - label: { text: "\U000F1066", styles: menu_tile_icon_style }
              - label: { id: general_stab_mengventielen_lbl, text: "${t_mengventielen}", long_mode: WRAP, styles: menu_tile_label_style }

        - obj:
            id: general_stab_sensor_kalibratie
            styles: menu_tile_style
            scrollable: false
            pressed:
              styles: menu_tile_pressed_style
            disabled:
              styles: menu_tile_disabled_style
            on_click:
              - lvgl.menu.set_page:
                  id: settings_menu
                  page: panel_general_page_sensor_kalibratie
            widgets:
              - label: { text: "\U000F050F", styles: menu_tile_icon_style }
              - label: { id: general_stab_sensor_kalibratie_lbl, text: "${t_sensor_kalibratie}", long_mode: WRAP, styles: menu_tile_label_style }

        - obj:
            id: general_stab_stiltemodus
            styles: menu_tile_style
            scrollable: false
            pressed:
              styles: menu_tile_pressed_style
            disabled:
              styles: menu_tile_disabled_style
            on_click:
              - lvgl.menu.set_page:
                  id: settings_menu
                  page: panel_general_page_stiltemodus
              - script.execute: update_silent_mode_ui
            widgets:
              - label: { text: "\U000F0581", styles: menu_tile_icon_style }
              - label: { id: general_stab_stiltemodus_lbl, text: "${t_stille_modus}", long_mode: WRAP, styles: menu_tile_label_style }

        - obj:
            id: general_stab_hardware
            styles: menu_tile_style
            scrollable: false
            pressed:
              styles: menu_tile_pressed_style
            disabled:
              styles: menu_tile_disabled_style
            on_click:
              - lvgl.menu.set_page:
                  id: settings_menu
                  page: panel_general_page_hardware
            widgets:
              - label: { text: "\U000F0521", styles: menu_tile_icon_style }
              - label: { id: general_stab_hardware_lbl, text: "${t_opties}", long_mode: WRAP, styles: menu_tile_label_style }

        - obj:
            id: general_stab_analytics
            styles: menu_tile_style
            scrollable: false
            pressed:
              styles: menu_tile_pressed_style
            disabled:
              styles: menu_tile_disabled_style
            on_click:
              - lvgl.menu.set_page:
                  id: settings_menu
                  page: panel_general_page_analytics
            widgets:
              - label: { text: "\U000F012A", styles: menu_tile_icon_style }
              - label: { id: general_stab_analytics_lbl, text: "Analytics", long_mode: WRAP, styles: menu_tile_label_style }
