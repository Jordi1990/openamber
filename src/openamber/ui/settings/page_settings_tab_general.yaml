# Menu Page: Algemeen (Hoofdmenu)
# ------------------------------------------------------------
id: panel_general
title: "Algemeen"
widgets:
  - obj:
      id: panel_general_page_systeem
      width: 100%
      height: SIZE_CONTENT
      bg_opa: 0%
      border_opa: 0%
      pad_all: 0
      layout:
        type: FLEX
        flex_flow: COLUMN
        flex_align_main: START
        flex_align_cross: CENTER
        pad_row: 6
      widgets: !include page_settings_tab_general_systeem_content.yaml

  # Drill-down subpage navigation rows
  - obj:
      id: general_subpages_nav
      width: 100%
      height: SIZE_CONTENT
      bg_opa: 0%
      border_opa: 0%
      pad_all: 0
      layout:
        type: FLEX
        flex_flow: COLUMN
        flex_align_main: START
        flex_align_cross: CENTER
        pad_row: 6
      widgets:
        - obj:
            id: general_stab_mengventielen
            width: 100%
            height: 52
            bg_color: 0xE8ECF1
            bg_opa: 100%
            radius: 12
            border_opa: 0%
            pad_left: 14
            pad_right: 14
            on_click:
              - lvgl.menu.set_page:
                  id: settings_menu
                  page: panel_general_page_mengventielen
            widgets:
              - label: { id: general_stab_mengventielen_lbl, text: "Mengventielen", text_color: 0x1F2933, text_font: font_text_20, align: LEFT_MID }
              - label: { text: "\U000F0142", text_color: 0x6B7280, text_font: font_mdi_24, align: RIGHT_MID }

        - obj:
            id: general_stab_sensor_kalibratie
            width: 100%
            height: 52
            bg_color: 0xE8ECF1
            bg_opa: 100%
            radius: 12
            border_opa: 0%
            pad_left: 14
            pad_right: 14
            on_click:
              - lvgl.menu.set_page:
                  id: settings_menu
                  page: panel_general_page_sensor_kalibratie
            widgets:
              - label: { id: general_stab_sensor_kalibratie_lbl, text: "Sensor kalibratie", text_color: 0x1F2933, text_font: font_text_20, align: LEFT_MID }
              - label: { text: "\U000F0142", text_color: 0x6B7280, text_font: font_mdi_24, align: RIGHT_MID }

        - obj:
            id: general_stab_hardware
            width: 100%
            height: 52
            bg_color: 0xE8ECF1
            bg_opa: 100%
            radius: 12
            border_opa: 0%
            pad_left: 14
            pad_right: 14
            on_click:
              - lvgl.menu.set_page:
                  id: settings_menu
                  page: panel_general_page_hardware
            widgets:
              - label: { id: general_stab_hardware_lbl, text: "Systeem Opties", text_color: 0x1F2933, text_font: font_text_20, align: LEFT_MID }
              - label: { text: "\U000F0142", text_color: 0x6B7280, text_font: font_mdi_24, align: RIGHT_MID }
