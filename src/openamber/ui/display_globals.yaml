globals:
  - id: is_idled
    type: bool
  # Screen-off timeout in ms, driven by display_screen_timeout_select.
  # UINT32_MAX means "never" (the LVGL idle trigger then never fires).
  - id: display_screen_timeout_ms
    type: uint32_t
    restore_value: no
    initial_value: '60000'
  - id: service_release_qr_url_cache
    type: std::string
    restore_value: no
  - id: service_update_check_in_progress
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: service_update_check_failed
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: service_update_install_in_progress
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: service_confirm_action
    type: int
    restore_value: no
    initial_value: '0'
  - id: header_alert_blink_phase
    type: bool
    restore_value: no
    initial_value: 'false'

# Fixed timeout after which the display returns to the home screen.
# Deliberately longer than the longest selectable screen-off timeout.
substitutions:
  display_return_home_timeout: 30min

select:
  - platform: template
    id: display_screen_timeout_select
    name: "Scherm uit na"
    icon: mdi:monitor-off
    optimistic: true
    options:
      - "Nooit"
      - "30 seconden"
      - "1 minuut"
      - "2 minuten"
      - "5 minuten"
    initial_option: "1 minuut"
    restore_value: true
    entity_category: config
    on_value:
      then:
        - lambda: |-
            static const uint32_t TIMEOUTS_MS[] = {UINT32_MAX, 30000, 60000, 120000, 300000};
            const size_t count = sizeof(TIMEOUTS_MS) / sizeof(TIMEOUTS_MS[0]);
            id(display_screen_timeout_ms) = TIMEOUTS_MS[i < count ? i : 2];
