obj:
  id: page_service
  width: 100%
  height: 76%
  x: 0
  y: 70
  hidden: true
  bg_opa: 0%
  border_opa: 0%
  scrollbar_mode: "OFF"
  scrollable: false
  pad_left: 24
  pad_right: 24
  pad_top: 4
  pad_bottom: 4

  widgets:
    - menu:
        id: service_menu
        root_page: service_overview_page
        width: 100%
        height: 100%
        bg_color: 0xF5F8FC
        bg_opa: 100%
        radius: 18
        border_width: 0
        border_opa: 0%
        shadow_width: 10
        shadow_spread: 0
        shadow_color: 0x000000
        shadow_opa: 20%
        header_style:
          bg_color: 0xF5F8FC
          bg_opa: 100%
          height: 60
          pad_left: 16
          pad_right: 16
          pad_top: 8
          pad_bottom: 8
          text_font: font_text_24
          text_color: 0x1F2933
        pages:
          - !include service/page_service_overview.yaml
          - !include service/page_service_tab_maintenance.yaml
          - !include service/page_service_tab_deaeration.yaml
          - !include service/page_service_tab_compressor.yaml
          - !include service/page_service_tab_pumps.yaml
          - !include service/page_service_tab_valve.yaml
          - !include service/page_service_tab_backup.yaml
          - !include service/page_service_tab_eeprom.yaml
          - !include service/page_service_tab_sensors.yaml
          - !include service/page_service_tab_errors.yaml
          - !include service/page_service_tab_warnings.yaml
