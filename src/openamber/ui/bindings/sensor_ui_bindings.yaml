# ── Nav bar: WiFi icon + Settings WiFi panel ──
- id: !extend wifi_signal_db
  on_value:
    then:
      - lambda: |-
          lv_label_set_text(id(nav_status_wifi_icon), std::string([&]() -> std::string {
            if (isnan(x)) return (std::string) "\U000F092E";
            if (x >= -60.0f) return (std::string) "\U000F0928";
            if (x >= -70.0f) return (std::string) "\U000F0925";
            if (x >= -80.0f) return (std::string) "\U000F0922";
            return (std::string) "\U000F091F";
          }()).c_str());
          lv_obj_send_event(id(nav_status_wifi_icon), lvgl::lv_update_event, nullptr);
          lv_obj_set_style_text_color(id(nav_status_wifi_icon), [&]() -> lv_color_t {
            if (isnan(x)) return lv_color_hex(0x9CA3AF);
            if (x >= -70.0f) return lv_color_hex(0xD1D5DB);
            if (x >= -80.0f) return lv_color_hex(0xF59E0B);
            return lv_color_hex(0xEF4444);
          }(), LV_PART_MAIN);
          if (!isnan(x)) {
            lv_label_set_text(id(wifi_status_label), "Verbonden");
            lv_obj_send_event(id(wifi_status_label), lvgl::lv_update_event, nullptr);
            lv_obj_set_style_text_color(id(wifi_status_label), lv_color_hex(0x16A34A), LV_PART_MAIN);
          } else {
            lv_label_set_text(id(wifi_status_label), "Niet verbonden");
            lv_obj_send_event(id(wifi_status_label), lvgl::lv_update_event, nullptr);
            lv_obj_set_style_text_color(id(wifi_status_label), lv_color_hex(0xEF4444), LV_PART_MAIN);
          }
          id(update_wifi_connected_summary_ui).execute();
          id(update_system_diagnostics_ui).execute();
          if (isnan(x)) {
            lv_obj_add_flag(id(wifi_connected_section), LV_OBJ_FLAG_HIDDEN);
            lv_obj_remove_flag(id(wifi_disconnected_section), LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_obj_remove_flag(id(wifi_connected_section), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(wifi_disconnected_section), LV_OBJ_FLAG_HIDDEN);
          }

