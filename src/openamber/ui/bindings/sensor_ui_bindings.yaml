# ══════════════════════════════════════════════════════════════
# Sensor → LVGL UI bindings (event-driven via !extend)
# These extend sensors defined in common/sensors.yaml to add
# on_value callbacks that update LVGL widgets on change.
# ══════════════════════════════════════════════════════════════

# ── Home page: Water temperatures ──
- id: !extend outlet_temperature_tuo
  on_value:
    then:
      - lambda: |-
          lv_label_set_text(id(water_aanvoer_value), str_sprintf("%.1f°C", x).c_str());
          lv_obj_send_event(id(water_aanvoer_value), lvgl::lv_update_event, nullptr);
          id(update_water_mode_temperature_display).execute();
          id(update_service_diag_summary_ui).execute();

- id: !extend inlet_temperature_tui
  on_value:
    then:
      - lambda: |-
          lv_label_set_text(id(water_retour_value), str_sprintf("%.1f°C", x).c_str());
          lv_obj_send_event(id(water_retour_value), lvgl::lv_update_event, nullptr);
          id(update_water_mode_temperature_display).execute();
          id(update_service_diag_summary_ui).execute();

- id: !extend heat_exchanger_delta_t
  on_value:
    then:
      - lvgl.label.update:
          id: water_delta_value
          text:
            format: "%.1f°C"
            args: ['x']

# ── Home page: Tiles ──
- id: !extend fan_rpm_sensor
  on_value:
    then:
      - lambda: |-
          lv_obj_set_style_bg_color(id(tile_fan), [&]() -> lv_color_t {
            if (x > 0) return lv_color_hex(0xF5F8FC);
            return lv_color_hex(0x919191);
          }(), LV_PART_MAIN);
          lv_label_set_text(id(tile_fan_value), str_sprintf("%.0f RPM", x).c_str());
          lv_obj_send_event(id(tile_fan_value), lvgl::lv_update_event, nullptr);
          id(update_service_diag_summary_ui).execute();

- id: !extend pump_p0_current_pwm_sensor
  on_value:
    then:
      - lambda: |-
          lv_obj_set_style_bg_color(id(tile_pump), [&]() -> lv_color_t {
            if (x > 0) return lv_color_hex(0xF5F8FC);
            return lv_color_hex(0x919191);
          }(), LV_PART_MAIN);
          id(update_home_pump_tile_state).execute();
          id(update_service_diag_summary_ui).execute();
          lv_label_set_text(id(service_p0_pwm_slider_value), str_sprintf("%.0f %%", x).c_str());
          lv_obj_send_event(id(service_p0_pwm_slider_value), lvgl::lv_update_event, nullptr);
          {
            if (id(service_p0_pwm_slider) != nullptr) {
              lv_slider_set_value(id(service_p0_pwm_slider), (int) x, LV_ANIM_OFF);
            }
          }

