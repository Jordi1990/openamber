# ── Home page: Outdoor temperature ──
- id: !extend temperature_outside_ta
  on_value:
    then:
      - lambda: |-
          if (!isnan(x)) {
            lv_label_set_text(id(header_outdoor), str_sprintf("%.1f°C", x).c_str());
            lv_obj_send_event(id(header_outdoor), lvgl::lv_update_event, nullptr);
          } else {
            lv_label_set_text(id(header_outdoor), "-.-°C");
            lv_obj_send_event(id(header_outdoor), lvgl::lv_update_event, nullptr);
          }
          id(update_service_diag_summary_ui).execute();

