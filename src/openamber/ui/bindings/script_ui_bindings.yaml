- id: update_service_mode_ui
  mode: restart
  then:
    - lambda: |-
        id(update_header_alert_icons).execute();
        id(update_service_diag_summary_ui).execute();
        id(update_service_errors_ui).execute();
        id(update_service_warnings_ui).execute();
        if (!lv_obj_has_flag(id(page_service), LV_OBJ_FLAG_HIDDEN)) {
          lvgl::LvglComponent::lv_obj_set_state_value(id(set_service_mode_switch_ui), LV_STATE_CHECKED, (id(service_mode_enabled).state));
          lvgl::LvglComponent::lv_obj_set_state_value(id(service_pump_p0_switch_ui), LV_STATE_CHECKED, (id(pump_p0_relay_switch).state));
          lvgl::LvglComponent::lv_obj_set_state_value(id(service_pump_p1_switch_ui), LV_STATE_CHECKED, (id(pump_p1_relay_switch).state));
          lvgl::LvglComponent::lv_obj_set_state_value(id(service_pump_p2_switch_ui), LV_STATE_CHECKED, (id(pump_p2_relay_switch).state));
          lvgl::LvglComponent::lv_obj_set_state_value(id(service_dhw_pump_switch_ui), LV_STATE_CHECKED, (id(dhw_pump_relay_switch).state));
          lvgl::LvglComponent::lv_obj_set_state_value(id(service_backup_heater_relay_switch_ui), LV_STATE_CHECKED, (id(backup_heater_relay).state));
          lvgl::LvglComponent::lv_obj_set_state_value(id(service_external_backup_heating_relay_switch_ui), LV_STATE_CHECKED, (id(external_backup_heating_relay).state));
          lvgl::LvglComponent::lv_obj_set_state_value(id(service_crankcase_heater_switch_ui), LV_STATE_CHECKED, (id(compressor_crankcase_heater_manual_switch).state));
          lvgl::LvglComponent::lv_obj_set_state_value(id(service_bottom_plate_heater_switch_ui), LV_STATE_CHECKED, (id(bottom_plate_heater_manual_switch).state));
          id(update_service_valve_ui).execute();
          id(update_service_deaeration_ui).execute();
          lv_label_set_text(id(service_p0_pwm_slider_value), str_sprintf("%.0f %%", id(pump_p0_current_pwm_sensor).state).c_str());
          lv_obj_send_event(id(service_p0_pwm_slider_value), lvgl::lv_update_event, nullptr);
          lv_label_set_text(id(service_fan_slider_value), str_sprintf("%.0f RPM", id(fan_speed_manual_number).state).c_str());
          lv_obj_send_event(id(service_fan_slider_value), lvgl::lv_update_event, nullptr);
          {
            if (id(service_p0_pwm_slider) != nullptr) {
              lv_slider_set_value(id(service_p0_pwm_slider), (int) id(pump_p0_current_pwm_sensor).state, LV_ANIM_OFF);
            }
            if (id(service_fan_slider) != nullptr) {
              lv_slider_set_value(id(service_fan_slider), (int) id(fan_speed_manual_number).state, LV_ANIM_OFF);
            }
          }
          // Maintenance mode can only be turned on while the heat pump is stopped (Systeem > Beheer > Stop warmtepomp).
          const bool stopped = id(controlled_stop_active) && id(amber_ctrl).is_standby();
          const char *hint = id(service_mode_enabled).state
              ? oa_tr("Onderhoudsmodus wordt voorbereid.")
              : (stopped
                  ? oa_tr("Warmtepomp gestopt: onderhoudsmodus kan worden ingeschakeld.")
                  : oa_tr("Stop eerst de warmtepomp via Systeem > Beheer."));
          for (lv_obj_t *hint_lbl : {id(service_maintenance_lock_hint)}) {
            if (strcmp(lv_label_get_text(hint_lbl), hint) != 0) {
              lv_label_set_text(hint_lbl, hint);
              lv_obj_send_event(hint_lbl, lvgl::lv_update_event, nullptr);
            }
          }
          const bool switch_allowed = id(service_mode_enabled).state || stopped;
          lvgl::LvglComponent::lv_obj_set_state_value(id(set_service_mode_switch_ui), LV_STATE_DISABLED, !switch_allowed);
          lv_obj_set_style_opa(id(set_service_mode_switch_ui), static_cast<uint8_t>(switch_allowed ? 255.0f : 102.0f), LV_PART_MAIN);
          if (id(service_mode_enabled).state && id(state_machine_state_main).state == "Maintenance") {
            lv_label_set_text(id(service_maintenance_state), oa_tr("Onderhoudsmodus actief"));
            lv_obj_send_event(id(service_maintenance_state), lvgl::lv_update_event, nullptr);
            lv_obj_set_style_text_color(id(service_maintenance_state), lv_color_hex(0x166534), LV_PART_MAIN);
            lv_obj_add_flag(id(service_maintenance_lock_hint), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(service_deaeration_lock_hint), LV_OBJ_FLAG_HIDDEN);
            lvgl::LvglComponent::lv_obj_set_state_value(id(service_deaeration_short_btn), LV_STATE_DISABLED, false);
            lvgl::LvglComponent::lv_obj_set_state_value(id(service_deaeration_extended_btn), LV_STATE_DISABLED, false);
          } else {
            if (id(service_mode_enabled).state) {
              lv_obj_remove_flag(id(service_maintenance_lock_hint), LV_OBJ_FLAG_HIDDEN);
              lv_obj_remove_flag(id(service_deaeration_lock_hint), LV_OBJ_FLAG_HIDDEN);
              lv_label_set_text(id(service_maintenance_state), oa_tr("Onderhoudsmodus wordt gestart..."));
              lv_obj_send_event(id(service_maintenance_state), lvgl::lv_update_event, nullptr);
              lv_obj_set_style_text_color(id(service_maintenance_state), lv_color_hex(0xB45309), LV_PART_MAIN);
            } else {
              lv_label_set_text(id(service_maintenance_state), oa_tr("Onderhoudsmodus niet actief"));
              lv_obj_send_event(id(service_maintenance_state), lvgl::lv_update_event, nullptr);
              lv_obj_set_style_text_color(id(service_maintenance_state), lv_color_hex(0x6B7280), LV_PART_MAIN);
              lv_obj_remove_flag(id(service_maintenance_lock_hint), LV_OBJ_FLAG_HIDDEN);
              lv_obj_remove_flag(id(service_deaeration_lock_hint), LV_OBJ_FLAG_HIDDEN);
            }
            lvgl::LvglComponent::lv_obj_set_state_value(id(service_deaeration_short_btn), LV_STATE_DISABLED, true);
