- id: update_service_diag_summary_ui
  mode: restart
  then:
    - lambda: |-
        if (!lv_obj_has_flag(id(page_service), LV_OBJ_FLAG_HIDDEN)) {
          [&]() {
            if (id(service_diag_status_table) == nullptr ||
                id(service_diag_temp_table) == nullptr ||
                id(service_diag_control_table) == nullptr ||
                id(service_diag_system_table) == nullptr) return;
            
            auto *st = id(service_diag_status_table)->obj;
            lv_table_set_cell_value(st, 0, 1, id(state_machine_state_main).state.empty() ? "-" : id(state_machine_state_main).state.c_str());
            lv_table_set_cell_value(st, 1, 1, id(state_machine_state_heat_cool).state.empty() ? "-" : id(state_machine_state_heat_cool).state.c_str());
            lv_table_set_cell_value(st, 2, 1, id(state_machine_state_dhw).state.empty() ? "-" : id(state_machine_state_dhw).state.c_str());
            lv_table_set_cell_value(st, 3, 1, id(current_setpoint).has_state() ? str_sprintf("%.1f°C", id(current_setpoint).state).c_str() : "-");
            lv_table_set_cell_value(st, 4, 1, id(current_dhw_setpoint_sensor).has_state() ? str_sprintf("%.1f°C", id(current_dhw_setpoint_sensor).state).c_str() : "-");
            lv_table_set_cell_value(st, 5, 1, id(thermal_power).has_state() ? str_sprintf("%.1f kW", id(thermal_power).state).c_str() : "-");
            lv_table_set_cell_value(st, 6, 1, id(service_mode_enabled).state ? "Actief" : "Inactief");
            
            auto *tt = id(service_diag_temp_table)->obj;
            lv_table_set_cell_value(tt, 0, 1, id(temperature_outside_ta).has_state() ? str_sprintf("%.1f°C", id(temperature_outside_ta).state).c_str() : "-");
            lv_table_set_cell_value(tt, 1, 1, id(outlet_temperature_tuo).has_state() ? str_sprintf("%.1f°C", id(outlet_temperature_tuo).state).c_str() : "-");
            lv_table_set_cell_value(tt, 2, 1, id(inlet_temperature_tui).has_state() ? str_sprintf("%.1f°C", id(inlet_temperature_tui).state).c_str() : "-");
            lv_table_set_cell_value(tt, 3, 1, id(heat_cool_control_temperature).has_state() ? str_sprintf("%.1f°C", id(heat_cool_control_temperature).state).c_str() : "-");
            lv_table_set_cell_value(tt, 4, 1, id(dhw_temperature_tw_sensor).has_state() ? str_sprintf("%.1f°C", id(dhw_temperature_tw_sensor).state).c_str() : "-");
            if (id(outlet_temperature_tuo).has_state() && id(inlet_temperature_tui).has_state()) {
              lv_table_set_cell_value(tt, 5, 1, str_sprintf("%.1f K", id(outlet_temperature_tuo).state - id(inlet_temperature_tui).state).c_str());
            } else {
              lv_table_set_cell_value(tt, 5, 1, "-");
            }
            lv_table_set_cell_value(tt, 6, 1, id(suction_pressure_ps).has_state() ? str_sprintf("%.1f bar", id(suction_pressure_ps).state).c_str() : "-");
            lv_table_set_cell_value(tt, 7, 1, id(discharge_pressure_pd).has_state() ? str_sprintf("%.1f bar", id(discharge_pressure_pd).state).c_str() : "-");
            
            auto *ct = id(service_diag_control_table)->obj;
            lv_table_set_cell_value(ct, 0, 1, id(current_compressor_frequency).has_state() ? str_sprintf("%.0f Hz", id(current_compressor_frequency).state).c_str() : "- Hz");
            lv_table_set_cell_value(ct, 1, 1, id(pump_p0_current_pwm_sensor).has_state() ? str_sprintf("%.0f %%", id(pump_p0_current_pwm_sensor).state).c_str() : "- %");
            lv_table_set_cell_value(ct, 2, 1, id(fan_rpm_sensor).has_state() ? str_sprintf("%.0f rpm", id(fan_rpm_sensor).state).c_str() : "- rpm");
            lv_table_set_cell_value(ct, 3, 1, id(expansion_valve_position).has_state() ? str_sprintf("%.0f %%", id(expansion_valve_position).state).c_str() : "- %");
            lv_table_set_cell_value(ct, 4, 1, id(mixing_valve_zone1_position).has_state() ? str_sprintf("%.0f %%", id(mixing_valve_zone1_position).state).c_str() : "- %");
            lv_table_set_cell_value(ct, 5, 1, id(mixing_valve_zone2_position).has_state() ? str_sprintf("%.0f %%", id(mixing_valve_zone2_position).state).c_str() : "- %");
            lv_table_set_cell_value(ct, 6, 1, id(three_way_valve_heat_cool_switch).state ? "CV" : "Tapwater");
            
            auto *sy = id(service_diag_system_table)->obj;
            lv_table_set_cell_value(sy, 0, 1, id(defrost_active_sensor).state ? "AAN" : "UIT");
            lv_table_set_cell_value(sy, 1, 1, id(bottom_heater_active_sensor).state ? "AAN" : "UIT");
            lv_table_set_cell_value(sy, 2, 1, id(modbus_inside_online).state ? "Online" : "Offline");
            lv_table_set_cell_value(sy, 3, 1, id(modbus_outside_online).state ? "Online" : "Offline");
            std::string sg_ab = str_sprintf("%s / %s", id(sg_ready_a_active_sensor).state ? "AAN" : "UIT", id(sg_ready_b_active_sensor).state ? "AAN" : "UIT");
            lv_table_set_cell_value(sy, 4, 1, sg_ab.c_str());
            lv_table_set_cell_value(sy, 5, 1, id(external_heat_demand_wired).state ? "AAN" : "UIT");
            lv_table_set_cell_value(sy, 6, 1, id(external_heat_demand_wired_zone_2).state ? "AAN" : "UIT");
            lv_table_set_cell_value(sy, 7, 1, id(external_cool_demand_wired).state ? "AAN" : "UIT");
          }();
        }

- id: update_system_diagnostics_ui
  mode: restart
  then:
    - lambda: |-
        if (!lv_obj_has_flag(id(page_system), LV_OBJ_FLAG_HIDDEN)) {
          [&]() {
            if (id(system_diag_runtime_table) == nullptr ||
                id(system_diag_memory_table) == nullptr ||
                id(system_diag_esp_table) == nullptr) return;
            
            auto *rt = id(system_diag_runtime_table)->obj;
            lv_table_set_cell_value(rt, 0, 1, ESPHOME_VERSION);
            if (id(sensor_uptime).has_state()) {
              uint32_t mins = static_cast<uint32_t>(id(sensor_uptime).state) / 60U;
              if (mins >= 1440U) {
                lv_table_set_cell_value(rt, 1, 1, str_sprintf("%lu d %lu u", static_cast<unsigned long>(mins / 1440U), static_cast<unsigned long>((mins / 60U) % 24U)).c_str());
              } else if (mins >= 60U) {
                lv_table_set_cell_value(rt, 1, 1, str_sprintf("%lu u %lu m", static_cast<unsigned long>(mins / 60U), static_cast<unsigned long>(mins % 60U)).c_str());
              } else {
                lv_table_set_cell_value(rt, 1, 1, str_sprintf("%lu m", static_cast<unsigned long>(mins)).c_str());
              }
            } else {
              lv_table_set_cell_value(rt, 1, 1, "-");
            }
            
            auto *mt = id(system_diag_memory_table)->obj;
            lv_table_set_cell_value(mt, 0, 1, id(system_heap_free).has_state() ? str_sprintf("%.0f kB", id(system_heap_free).state / 1024.0f).c_str() : "-");
            lv_table_set_cell_value(mt, 1, 1, id(system_heap_fragmentation).has_state() ? str_sprintf("%.0f %%", id(system_heap_fragmentation).state).c_str() : "-");
            lv_table_set_cell_value(mt, 2, 1, id(system_heap_max_block).has_state() ? str_sprintf("%.0f kB", id(system_heap_max_block).state / 1024.0f).c_str() : "-");
            lv_table_set_cell_value(mt, 3, 1, id(system_psram_free).has_state() ? str_sprintf("%.0f kB", id(system_psram_free).state / 1024.0f).c_str() : "-");
            
            auto *et = id(system_diag_esp_table)->obj;
            lv_table_set_cell_value(et, 0, 1, id(system_debug_device_info).state.empty() ? "-" : id(system_debug_device_info).state.c_str());
            lv_table_set_cell_value(et, 1, 1, id(system_debug_reset_reason).state.empty() ? "-" : id(system_debug_reset_reason).state.c_str());
          }();
        }


- id: update_firmware_ui
  mode: restart
  then:
    - if:
        condition:
          update.is_available: firmware_update
        then:
          - globals.set:
              id: service_update_check_failed
              value: 'false'
          - lvgl.widget.show: { id: nav_system_badge }
          - if:
              condition:
                lambda: 'return !lv_obj_has_flag(id(page_system), LV_OBJ_FLAG_HIDDEN);'
              then:
                - lambda: |-
                    lv_label_set_text(id(service_update_status), "");
                    lv_obj_send_event(id(service_update_status), lvgl::lv_update_event, nullptr);
                    lv_obj_add_flag(id(service_update_error), LV_OBJ_FLAG_HIDDEN);
                    lv_label_set_text(id(service_update_version), str_sprintf("Beschikbaar: %s (huidig: %s)", id(firmware_update).update_info.latest_version.empty() ? "onbekend" : id(firmware_update).update_info.latest_version.c_str(), id(firmware_update).update_info.current_version.empty() ? ESPHOME_PROJECT_VERSION : id(firmware_update).update_info.current_version.c_str()).c_str());
                    lv_obj_send_event(id(service_update_version), lvgl::lv_update_event, nullptr);
                - if:
                    condition:
                      lambda: |-
                        const auto &info = id(firmware_update).update_info;
                        std::string release_url = !info.release_url.empty()
                          ? info.release_url
                          : std::string("https://github.com/Jordi1990/openamber/releases");
                        return id(service_release_qr_url_cache) != release_url;
                    then:
                      - lambda: |-
                          const auto &info = id(firmware_update).update_info;
                          id(service_release_qr_url_cache) = !info.release_url.empty()
                            ? info.release_url
                            : std::string("https://github.com/Jordi1990/openamber/releases");
                      - lvgl.qrcode.update:
                          id: service_release_qr
                          text: !lambda 'return id(service_release_qr_url_cache);'
                - lambda: |-
                    lv_obj_remove_flag(id(service_release_qr_hint), LV_OBJ_FLAG_HIDDEN);
                    lv_obj_remove_flag(id(service_release_qr), LV_OBJ_FLAG_HIDDEN);
                    lv_obj_remove_flag(id(service_update_button), LV_OBJ_FLAG_HIDDEN);
                    if (id(service_update_check_in_progress)) {
                      lvgl::LvglComponent::lv_obj_set_state_value(id(service_check_update_button), LV_STATE_DISABLED, false);
                      lv_obj_remove_flag(id(service_check_update_button), LV_OBJ_FLAG_HIDDEN);
                      lvgl::LvglComponent::lv_obj_set_state_value(id(service_check_update_button), LV_STATE_DISABLED, true);
                      lv_obj_set_style_bg_color(id(service_check_update_button), lv_color_hex(0xC7CDD6), LV_PART_MAIN);
                      lv_label_set_text(id(service_check_update_button_label), "Ophalen...");
                      lv_obj_send_event(id(service_check_update_button_label), lvgl::lv_update_event, nullptr);
                      lv_obj_set_style_text_color(id(service_check_update_button_label), lv_color_hex(0x4B5563), LV_PART_MAIN);
                    } else {
                      lvgl::LvglComponent::lv_obj_set_state_value(id(service_check_update_button), LV_STATE_DISABLED, false);
                      lv_obj_remove_flag(id(service_check_update_button), LV_OBJ_FLAG_HIDDEN);
                      lv_obj_set_style_bg_color(id(service_check_update_button), lv_color_hex(0x0072CE), LV_PART_MAIN);
                      lv_label_set_text(id(service_check_update_button_label), "Controleer updates");
                      lv_obj_send_event(id(service_check_update_button_label), lvgl::lv_update_event, nullptr);
                      lv_obj_set_style_text_color(id(service_check_update_button_label), lv_color_hex(0xFFFFFF), LV_PART_MAIN);
                    }
        else:
          - lambda: |-
              lv_obj_add_flag(id(nav_system_badge), LV_OBJ_FLAG_HIDDEN);
              if (!lv_obj_has_flag(id(page_system), LV_OBJ_FLAG_HIDDEN)) {
                if (id(service_update_check_failed)) {
                  lv_label_set_text(id(service_update_error), "Geen verbinding mogelijk met update server");
                  lv_obj_send_event(id(service_update_error), lvgl::lv_update_event, nullptr);
                  lv_obj_remove_flag(id(service_update_error), LV_OBJ_FLAG_HIDDEN);
                } else {
                  lv_obj_add_flag(id(service_update_error), LV_OBJ_FLAG_HIDDEN);
                }
                lv_label_set_text(id(service_update_status), "");
                lv_obj_send_event(id(service_update_status), lvgl::lv_update_event, nullptr);
                lv_label_set_text(id(service_update_version), str_sprintf("Geen nieuwe software beschikbaar\nHuidige versie: %s", id(firmware_update).update_info.current_version.empty() ? ESPHOME_PROJECT_VERSION : id(firmware_update).update_info.current_version.c_str()).c_str());
                lv_obj_send_event(id(service_update_version), lvgl::lv_update_event, nullptr);
                lv_obj_add_flag(id(service_release_qr_hint), LV_OBJ_FLAG_HIDDEN);
                lv_obj_add_flag(id(service_release_qr), LV_OBJ_FLAG_HIDDEN);
                lv_obj_add_flag(id(service_update_button), LV_OBJ_FLAG_HIDDEN);
                if (id(service_update_check_in_progress)) {
                  lvgl::LvglComponent::lv_obj_set_state_value(id(service_check_update_button), LV_STATE_DISABLED, false);
