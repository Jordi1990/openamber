- id: update_mixing_valves_ui
  mode: restart
  then:
    - lambda: |-
        if (id(mixing_valve_zone1_enabled).state) {
          lv_obj_add_state(id(set_mv_z1_enabled_switch_ui), LV_STATE_CHECKED);
        } else {
          lv_obj_clear_state(id(set_mv_z1_enabled_switch_ui), LV_STATE_CHECKED);
        }
        if (id(mixing_valve_zone2_enabled).state) {
          lv_obj_add_state(id(set_mv_z2_enabled_switch_ui), LV_STATE_CHECKED);
        } else {
          lv_obj_clear_state(id(set_mv_z2_enabled_switch_ui), LV_STATE_CHECKED);
        }
        static char buf[16];
