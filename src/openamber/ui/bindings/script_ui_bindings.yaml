- id: update_header_alert_icons
  mode: restart
  then:
    - lvgl.widget.update:
        id: nav_status_error_btn
        hidden: !lambda 'return !id(error_active).state;'
    - lvgl.widget.update:
        id: nav_status_warning_btn
        hidden: !lambda 'return !id(warning_active).state;'
    - lvgl.widget.update:
        id: nav_status_error_btn
        bg_color: !lambda |-
          return id(header_alert_blink_phase) ? lv_color_hex(0xEF4444) : lv_color_hex(0xB91C1C);
    - lvgl.widget.update:
        id: nav_status_warning_btn
        bg_color: !lambda |-
          return id(header_alert_blink_phase) ? lv_color_hex(0xF59E0B) : lv_color_hex(0xD97706);
    - lvgl.widget.update:
        id: nav_status_error_icon
        text_color: !lambda |-
          return lv_color_hex(0xFFFFFF);
    - lvgl.widget.update:
        id: nav_status_warning_icon
        text_color: !lambda |-
          return lv_color_hex(0xFFFFFF);

- id: toggle_header_alert_blink
  mode: restart
  then:
    - if:
        condition:
          lambda: 'return id(error_active).state || id(warning_active).state;'
        then:
          - globals.set:
              id: header_alert_blink_phase
              value: !lambda 'return !id(header_alert_blink_phase);'
          - script.execute: update_header_alert_icons

- id: update_service_diag_summary_ui
  mode: restart
  then:
    - if:
        condition:
          lambda: 'return !lv_obj_has_flag(id(page_service), LV_OBJ_FLAG_HIDDEN);'
        then:
          - lambda: |-
              if (id(service_diag_status_table) == nullptr ||
                  id(service_diag_temp_table) == nullptr ||
                  id(service_diag_control_table) == nullptr ||
                  id(service_diag_system_table) == nullptr ||
                  id(service_diag_demand_table) == nullptr) return;

              auto *st = id(service_diag_status_table)->obj;
              lv_table_set_cell_value(st, 0, 1, id(state_machine_state_main).state.empty() ? "-" : id(state_machine_state_main).state.c_str());
              lv_table_set_cell_value(st, 1, 1, id(state_machine_state_heat_cool).state.empty() ? "-" : id(state_machine_state_heat_cool).state.c_str());
              lv_table_set_cell_value(st, 2, 1, id(state_machine_state_dhw).state.empty() ? "-" : id(state_machine_state_dhw).state.c_str());
              lv_table_set_cell_value(st, 3, 1, id(current_setpoint).has_state() ? str_sprintf("%.1f°C", id(current_setpoint).state).c_str() : "-");
              lv_table_set_cell_value(st, 4, 1, id(current_dhw_setpoint_sensor).has_state() ? str_sprintf("%.1f°C", id(current_dhw_setpoint_sensor).state).c_str() : "-");
              lv_table_set_cell_value(st, 5, 1, id(thermal_power).has_state() ? str_sprintf("%.1f kW", id(thermal_power).state).c_str() : "-");
              lv_table_set_cell_value(st, 6, 1, id(service_mode_enabled).state ? "Actief" : "Inactief");

              auto *tt = id(service_diag_temp_table)->obj;
              lv_table_set_cell_value(tt, 0, 1, id(temperature_outside_ta).has_state() ? str_sprintf("%.1f°C", id(temperature_outside_ta).state).c_str() : "-");
              lv_table_set_cell_value(tt, 1, 1, id(outlet_temperature_tuo).has_state() ? str_sprintf("%.1f°C", id(outlet_temperature_tuo).state).c_str() : "-");
              lv_table_set_cell_value(tt, 2, 1, id(inlet_temperature_tui).has_state() ? str_sprintf("%.1f°C", id(inlet_temperature_tui).state).c_str() : "-");
              lv_table_set_cell_value(tt, 3, 1, id(heat_cool_control_temperature).has_state() ? str_sprintf("%.1f°C", id(heat_cool_control_temperature).state).c_str() : "-");
              lv_table_set_cell_value(tt, 4, 1, id(dhw_temperature_tw_sensor).has_state() ? str_sprintf("%.1f°C", id(dhw_temperature_tw_sensor).state).c_str() : "-");
              if (id(outlet_temperature_tuo).has_state() && id(inlet_temperature_tui).has_state()) {
                lv_table_set_cell_value(tt, 5, 1, str_sprintf("%.1f K", id(outlet_temperature_tuo).state - id(inlet_temperature_tui).state).c_str());
              } else {
                lv_table_set_cell_value(tt, 5, 1, "-");
              }
              lv_table_set_cell_value(tt, 6, 1, id(suction_pressure_ps).has_state() ? str_sprintf("%.1f bar", id(suction_pressure_ps).state).c_str() : "-");
              lv_table_set_cell_value(tt, 7, 1, id(discharge_pressure_pd).has_state() ? str_sprintf("%.1f bar", id(discharge_pressure_pd).state).c_str() : "-");

              auto *ct = id(service_diag_control_table)->obj;
              lv_table_set_cell_value(ct, 0, 1, id(current_compressor_frequency).has_state() ? str_sprintf("%.0f Hz", id(current_compressor_frequency).state).c_str() : "- Hz");
              auto compressor_level = id(compressor_control_select).active_index();
              lv_table_set_cell_value(ct, 1, 1, compressor_level.has_value() ? str_sprintf("%d", (int) compressor_level.value()).c_str() : "-");
              // 2102 is the frequency the outdoor unit targets after applying its own limits (ambient temperature table, protections).
              if (id(compressor_setpoint_frequency).has_state()) {
                lv_table_set_cell_value(ct, 2, 1, str_sprintf(id(error_flag_p12).state ? "%.0f Hz (begrensd)" : "%.0f Hz", id(compressor_setpoint_frequency).state).c_str());
              } else {
                lv_table_set_cell_value(ct, 2, 1, "- Hz");
              }
              lv_table_set_cell_value(ct, 3, 1, id(pump_p0_current_pwm_sensor).has_state() ? str_sprintf("%.0f %%", id(pump_p0_current_pwm_sensor).state).c_str() : "- %");
              lv_table_set_cell_value(ct, 4, 1, id(fan_rpm_sensor).has_state() ? str_sprintf("%.0f rpm", id(fan_rpm_sensor).state).c_str() : "- rpm");
              lv_table_set_cell_value(ct, 5, 1, id(expansion_valve_position).has_state() ? str_sprintf("%.0f %%", id(expansion_valve_position).state).c_str() : "- %");
              lv_table_set_cell_value(ct, 6, 1, id(mixing_valve_zone1_position).has_state() ? str_sprintf("%.0f %%", id(mixing_valve_zone1_position).state).c_str() : "- %");
              lv_table_set_cell_value(ct, 7, 1, id(mixing_valve_zone2_position).has_state() ? str_sprintf("%.0f %%", id(mixing_valve_zone2_position).state).c_str() : "- %");
              lv_table_set_cell_value(ct, 8, 1, id(three_way_valve_heat_cool_switch).state ? "CV" : "Tapwater");

              auto *sy = id(service_diag_system_table)->obj;
              lv_table_set_cell_value(sy, 0, 1, id(defrost_phase_text).state.empty() ? "-" : id(defrost_phase_text).state.c_str());
              lv_table_set_cell_value(sy, 1, 1, id(bottom_heater_active_sensor).state ? "AAN" : "UIT");
              lv_table_set_cell_value(sy, 2, 1, id(modbus_inside_online).state ? "Online" : "Offline");
              lv_table_set_cell_value(sy, 3, 1, id(modbus_outside_online).state ? "Online" : "Offline");
              std::string sg_ab = str_sprintf("%s / %s", id(sg_ready_a_active_sensor).state ? "AAN" : "UIT", id(sg_ready_b_active_sensor).state ? "AAN" : "UIT");
              lv_table_set_cell_value(sy, 4, 1, sg_ab.c_str());

              auto *dm = id(service_diag_demand_table)->obj;
              lv_table_set_cell_value(dm, 0, 1, id(heat_demand_active_sensor_zone_1).state ? "AAN" : "UIT");
              lv_table_set_cell_value(dm, 1, 1, id(heat_demand_active_sensor_zone_2).state ? "AAN" : "UIT");
              lv_table_set_cell_value(dm, 2, 1, id(cool_demand_active_sensor).state ? "AAN" : "UIT");
              lv_table_set_cell_value(dm, 3, 1, id(external_heat_demand_wired).state ? "AAN" : "UIT");
              lv_table_set_cell_value(dm, 4, 1, id(external_heat_demand_wired_zone_2).state ? "AAN" : "UIT");
              lv_table_set_cell_value(dm, 5, 1, id(external_cool_demand_wired).state ? "AAN" : "UIT");

- id: update_system_diagnostics_ui
  mode: restart
  then:
    - if:
        condition:
          lambda: 'return !lv_obj_has_flag(id(page_system), LV_OBJ_FLAG_HIDDEN);'
        then:
          - lambda: |-
              if (id(system_diag_runtime_table) == nullptr ||
                  id(system_diag_memory_table) == nullptr ||
                  id(system_diag_esp_table) == nullptr) return;

              auto *rt = id(system_diag_runtime_table)->obj;
              lv_table_set_cell_value(rt, 0, 1, ESPHOME_VERSION);
              if (id(sensor_uptime).has_state()) {
                uint32_t mins = static_cast<uint32_t>(id(sensor_uptime).state) / 60U;
                if (mins >= 1440U) {
                  lv_table_set_cell_value(rt, 1, 1, str_sprintf("%lu d %lu u", static_cast<unsigned long>(mins / 1440U), static_cast<unsigned long>((mins / 60U) % 24U)).c_str());
                } else if (mins >= 60U) {
                  lv_table_set_cell_value(rt, 1, 1, str_sprintf("%lu u %lu m", static_cast<unsigned long>(mins / 60U), static_cast<unsigned long>(mins % 60U)).c_str());
                } else {
                  lv_table_set_cell_value(rt, 1, 1, str_sprintf("%lu m", static_cast<unsigned long>(mins)).c_str());
                }
              } else {
                lv_table_set_cell_value(rt, 1, 1, "-");
              }

              auto *mt = id(system_diag_memory_table)->obj;
              lv_table_set_cell_value(mt, 0, 1, id(system_heap_free).has_state() ? str_sprintf("%.0f kB", id(system_heap_free).state / 1024.0f).c_str() : "-");
              lv_table_set_cell_value(mt, 1, 1, id(system_heap_fragmentation).has_state() ? str_sprintf("%.0f %%", id(system_heap_fragmentation).state).c_str() : "-");
              lv_table_set_cell_value(mt, 2, 1, id(system_heap_max_block).has_state() ? str_sprintf("%.0f kB", id(system_heap_max_block).state / 1024.0f).c_str() : "-");
              lv_table_set_cell_value(mt, 3, 1, id(system_psram_free).has_state() ? str_sprintf("%.0f kB", id(system_psram_free).state / 1024.0f).c_str() : "-");

              auto *et = id(system_diag_esp_table)->obj;
              lv_table_set_cell_value(et, 0, 1, id(system_debug_device_info).state.empty() ? "-" : id(system_debug_device_info).state.c_str());
              lv_table_set_cell_value(et, 1, 1, id(system_debug_reset_reason).state.empty() ? "-" : id(system_debug_reset_reason).state.c_str());


- id: update_firmware_ui
  mode: restart
  then:
    - if:
        condition:
          update.is_available: firmware_update
        then:
          - globals.set:
              id: service_update_check_failed
              value: 'false'
          - lvgl.widget.show: { id: nav_system_badge }
          - if:
              condition:
                lambda: 'return !lv_obj_has_flag(id(page_system), LV_OBJ_FLAG_HIDDEN);'
              then:
                - lvgl.label.update:
                    id: service_update_status
                    text: ""
                - lvgl.widget.hide:
                    id: service_update_error
                - lvgl.label.update:
                    id: service_update_version
                    text:
                      format: "Beschikbaar: %s (huidig: %s)"
                      args:
                        - 'id(firmware_update).update_info.latest_version.empty() ? "onbekend" : id(firmware_update).update_info.latest_version.c_str()'
                        - 'id(firmware_update).update_info.current_version.empty() ? ESPHOME_PROJECT_VERSION : id(firmware_update).update_info.current_version.c_str()'
                - if:
                    condition:
                      lambda: |-
                        const auto &info = id(firmware_update).update_info;
                        std::string release_url = !info.release_url.empty()
                          ? info.release_url
                          : std::string("https://github.com/Jordi1990/openamber/releases");
                        return id(service_release_qr_url_cache) != release_url;
                    then:
                      - lambda: |-
                          const auto &info = id(firmware_update).update_info;
                          id(service_release_qr_url_cache) = !info.release_url.empty()
                            ? info.release_url
                            : std::string("https://github.com/Jordi1990/openamber/releases");
                      - lvgl.qrcode.update:
                          id: service_release_qr
                          text: !lambda 'return id(service_release_qr_url_cache);'
                - lvgl.widget.show: { id: service_release_qr_hint }
                - lvgl.widget.show: { id: service_release_qr }
                - lvgl.widget.show: { id: service_update_button }
                - if:
                    condition:
                      lambda: |-
                        return id(service_update_check_in_progress);
                    then:
                      - lvgl.widget.enable:
                          id: service_check_update_button
                      - lvgl.widget.show:
                          id: service_check_update_button
                      - lvgl.widget.disable:
                          id: service_check_update_button
                      - lvgl.widget.update:
                          id: service_check_update_button
                          bg_color: 0xC7CDD6
                      - lvgl.label.update:
                          id: service_check_update_button_label
                          text: "Ophalen..."
                      - lvgl.widget.update:
                          id: service_check_update_button_label
                          text_color: 0x4B5563
                    else:
                      - lvgl.widget.enable:
                          id: service_check_update_button
                      - lvgl.widget.show:
                          id: service_check_update_button
                      - lvgl.widget.update:
                          id: service_check_update_button
                          bg_color: 0x0072CE
                      - lvgl.label.update:
                          id: service_check_update_button_label
                          text: "Controleer updates"
                      - lvgl.widget.update:
                          id: service_check_update_button_label
                          text_color: 0xFFFFFF
        else:
          - lvgl.widget.hide: { id: nav_system_badge }
          - if:
              condition:
                lambda: 'return !lv_obj_has_flag(id(page_system), LV_OBJ_FLAG_HIDDEN);'
              then:
                - if:
                    condition:
                      lambda: |-
                        return id(service_update_check_failed);
                    then:
                      - lvgl.label.update:
                          id: service_update_error
                          text: "Geen verbinding mogelijk met update server"
                      - lvgl.widget.show:
                          id: service_update_error
                    else:
                      - lvgl.widget.hide:
                          id: service_update_error
                - lvgl.label.update:
                    id: service_update_status
                    text: ""
                - lvgl.label.update:
                    id: service_update_version
                    text:
                      format: "Geen nieuwe software beschikbaar\nHuidige versie: %s"
                      args:
                        - 'id(firmware_update).update_info.current_version.empty() ? ESPHOME_PROJECT_VERSION : id(firmware_update).update_info.current_version.c_str()'
                - lvgl.widget.hide: { id: service_release_qr_hint }
                - lvgl.widget.hide: { id: service_release_qr }
                - lvgl.widget.hide: { id: service_update_button }
                - if:
                    condition:
                      lambda: |-
                        return id(service_update_check_in_progress);
                    then:
                      - lvgl.widget.enable:
                          id: service_check_update_button
                      - lvgl.widget.show:
                          id: service_check_update_button
                      - lvgl.widget.disable:
                          id: service_check_update_button
                      - lvgl.widget.update:
                          id: service_check_update_button
                          bg_color: 0xC7CDD6
                      - lvgl.label.update:
                          id: service_check_update_button_label
                          text: "Ophalen..."
                      - lvgl.widget.update:
                          id: service_check_update_button_label
                          text_color: 0x4B5563
                    else:
                      - lvgl.widget.show:
                          id: service_check_update_button
                      - lvgl.widget.enable:
                          id: service_check_update_button
                      - lvgl.widget.update:
                          id: service_check_update_button
                          bg_color: 0x0072CE
                      - lvgl.label.update:
                          id: service_check_update_button_label
                          text: "Controleer updates"
                      - lvgl.widget.update:
                          id: service_check_update_button_label
                          text_color: 0xFFFFFF
    - if:
        condition:
          lambda: 'return !lv_obj_has_flag(id(page_system), LV_OBJ_FLAG_HIDDEN);'
        then:
          - if:
              condition:
                lambda: |-
                  return id(service_update_install_in_progress);
              then:
                - lvgl.widget.show:
                    id: service_update_progress_overlay
              else:
                - lvgl.widget.hide:
                    id: service_update_progress_overlay

- id: update_service_errors_ui
  mode: restart
  then:
    - lambda: |-
        if (id(service_errors_list) == nullptr) {
          return;
        }
        if (lv_obj_has_flag(id(page_service), LV_OBJ_FLAG_HIDDEN)) {
          return;
        }

        struct AlertItem {
          const char *title;
          const char *explanation;
          bool active;
        };

        const AlertItem items[] = {
          {"P03 - Storing compressorstart", "De warmtepomp is geblokkeerd door een storing in de compressorstart.", id(error_flag_p03).state},
          {"P05 - Storing compressor - hogedrukbeveiliging", "Als de persdruk meer dan 32 bar bedraagt wordt de compressor uitgeschakeld.", id(error_flag_p05).state},
          {"P08 - Storing sensor persgasdruk", "Storing sensor persgasdruk.", id(error_flag_p08).state},
          {"P09 - Storing sensor verdamper/condensor buitendeel", "Storing sensor verdamper/condensor buitendeel.", id(error_flag_p09).state},
          {"P10 - Voedingsspanning te hoog of te laag", "Voedingsspanning te hoog of te laag.", id(error_flag_p10).state},
          {"F01 - Storing buitentemperatuursensor", "Storing buitentemperatuursensor.", id(error_flag_f01).state},
          {"F02 - Storing sensor verdamper/condensor buitendeel", "Storing sensor verdamper/condensor buitendeel.", id(error_flag_f02).state},
          {"F03 - Storing persgas temp sensor", "Storing persgas temp sensor.", id(error_flag_f03).state},
          {"F04 - Storing zuiggas temp sensor", "Storing zuiggas temp sensor.", id(error_flag_f04).state},
          {"F05 - Storing zuiggas druk sensor", "Storing zuiggas druk sensor.", id(error_flag_f05).state},
          {"F06 - Storing sensor persgasdruk", "Storing sensor persgasdruk.", id(error_flag_f06).state},
          {"F07 - Storing hogedrukbeveiliging", "Storing hogedrukbeveiliging.", id(error_flag_f07).state},
          {"F09 - Storing ventilatormotor DC", "Storing ventilatormotor DC.", id(error_flag_f09).state},
          {"E01 - Communicatiestoring", "Communicatiestoring tussen printplaten en/of bedieningspaneel.", id(error_flag_e01).state},
          {"E02 - Communicatiestoring", "Er is een communicatiestoring tussen beide printplaten in de warmtepomp.", id(error_flag_e02).state},
          {"E03 - Voedingsspanning", "De voedingsspanning is niet in orde.", id(error_flag_e03).state},
          {"E04 - Overbelasting voedingsspanning", "Er is een overbelasting van de voedingsspanning.", id(error_flag_e04).state},
          {"E05 - Probleem inverter PCB", "Er is een probleem met de inverter PCB.", id(error_flag_e05).state},
          {"E06 - VDC-module voedingsspanning", "De voedingsspanning in de VDC-module (24 Volt-omvormer) is te hoog of te laag.", id(error_flag_e06).state},
          {"E07 - Voedingsspanning te hoog of te laag", "Voedingsspanning te hoog of te laag.", id(error_flag_e07).state},
          {"E08 - Storing EEPROM warmtepomp", "Storing EEPROM warmtepomp.", id(error_flag_e08).state},
          {"F10 - Storing ventilatormotor DC", "Storing ventilatormotor DC.", id(error_flag_f10).state},
          {"TO01 - Pomp start timeout", "De pomp startte niet binnen de verwachte tijd. Controleer pompaansturing, relais, bedrijfstoestand en de flow (flow switch), omdat deze timeout op flow-detectie wordt bepaald.", id(error_pump_start_timeout).state},
          {"TO02 - Compressor start timeout", "De compressor startte niet binnen de verwachte tijd. Controleer permissies, beveiligingen en startcondities.", id(error_compressor_start_timeout).state},
          {"TO03 - Pomp stop timeout", "De pomp stopte niet binnen de verwachte tijd. Controleer relaisstatus, besturingslogica en de flow (flow switch), omdat deze timeout op flow-detectie wordt bepaald.", id(error_pump_stop_timeout).state},
          {"TO04 - 3-weg klep status fout", "De 3-weg klep bevindt zich niet in de verwachte stand (relaisterugmelding ontbreekt of temperatuurafwijking overschreden). Controleer klepaansturing, bedrading en klepmotor.", id(error_three_way_valve_state_timeout).state},
          {"TO05 - Modbus verbinding timeout", "De Modbus-communicatie met de binnen- of buitenunit kon niet worden hersteld binnen de verwachte tijd. Controleer bekabeling, voeding en Modbus-instellingen.", id(error_modbus_connection_timeout).state},
          {"TO06 - Binnenunit failsafe / herstart", "De binnenunit bevindt zich in failsafe of is herstart. Een of meer uitgangsregisters (1099-1113) wijken af van de verwachte status. De regeling is gestopt.", id(error_inside_unit_failsafe).state},
          {"F13 - Storing sensor ruimtetemperatuur", "Storing sensor ruimtetemperatuur.", id(error_flag_f13).state},
          {"F14 - Storing sensor tapwatertemperatuur", "Storing sensor tapwatertemperatuur.", id(error_flag_f14).state},
          {"F15 - Storing sensor cv-aanvoertemperatuur", "Storing sensor cv-aanvoertemperatuur.", id(error_flag_f15).state},
          {"F16 - Storing sensor aanvoertemperatuur Tuo", "Storing sensor aanvoertemperatuur Tuo.", id(error_flag_f16).state},
          {"F17 - Storing sensor retourtemperatuur Tui", "Storing sensor retourtemperatuur Tui.", id(error_flag_f17).state},
          {"F18 - Storing sensor condensortemperatuur Tup", "Storing sensor condensortemperatuur Tup.", id(error_flag_f18).state},
          {"F21 - Storing sensor cv-aanvoertemperatuur zone 1", "Storing sensor cv-aanvoertemperatuur zone 1.", id(error_flag_f21).state},
          {"F22 - Storing sensor cv-aanvoertemperatuur zone 2", "Storing sensor cv-aanvoertemperatuur zone 2.", id(error_flag_f22).state}
        };

        const bool timeout_error_active =
            id(error_pump_start_timeout).state ||
            id(error_compressor_start_timeout).state ||
            id(error_pump_stop_timeout).state ||
            id(error_modbus_connection_timeout).state ||
            id(error_three_way_valve_state_timeout).state ||
            id(error_inside_unit_failsafe).state;

        if (id(service_errors_reset_timeout_btn) != nullptr) {
          if (timeout_error_active) lv_obj_clear_flag(id(service_errors_reset_timeout_btn), LV_OBJ_FLAG_HIDDEN);
          else lv_obj_add_flag(id(service_errors_reset_timeout_btn), LV_OBJ_FLAG_HIDDEN);
        }

        if (id(service_errors_list) == nullptr) return;
        lv_obj_clean(id(service_errors_list));
        int active_count = 0;
        const int total = sizeof(items) / sizeof(items[0]);
        for (int i = 0; i < total; i++) {
          if (items[i].active) {
            active_count++;
            std::string entry = std::string(items[i].title) + "\n" + items[i].explanation;
            lv_list_add_text(id(service_errors_list), entry.c_str());
          }
        }
        if (active_count == 0) {
          lv_list_add_text(id(service_errors_list), "Geen actieve foutmeldingen");
        }

- id: update_service_warnings_ui
  mode: restart
  then:
    - lambda: |-
        if (id(service_warnings_list) == nullptr) return;
        if (lv_obj_has_flag(id(page_service), LV_OBJ_FLAG_HIDDEN)) return;

        struct AlertItem {
          const char *title;
          const char *explanation;
          bool active;
        };

        const AlertItem items[] = {
          {"P01 - Bedrijfstroom warmtepomp", "De eerste keer wordt de normale werking van de warmtepomp na 5 minuten automatisch hervat.", id(error_flag_p01).state},
          {"P02 - Bedrijfstroom warmtepomp", "De eerste keer wordt de normale werking van de warmtepomp na 5 minuten automatisch hervat. Als dezelfde storing binnen een bepaalde tijd drie keer optreedt, wordt de warmtepomp geblokkeerd en moet worden herstart.", id(error_flag_p02).state},
          {"P06 - Storing compressor - laag drukverschil", "De compressorfrequentie zal worden begrensd. De druk zal hierdoor zakken en een normale werking wordt voortgezet.", id(error_flag_p06).state},
          {"P07 - Compressor voorverwarming", "De compressor wordt voorverwarmd om te kunnen starten. Het zal maximaal 30 minuten duren voordat de compressor op bedrijfstemperatuur is. Daarna zal deze storing vanzelf verdwijnen en zal de compressor starten.", id(error_flag_p07).state},
          {"P11 - Compressor geblokkeerd door buitentemperatuur", "De buitenunit laat de compressor niet draaien bij deze buitentemperatuur (Ta). Bij verwarmen gebeurt dit onder ongeveer -25°C en boven 46°C. De compressor start weer zodra Ta binnen het werkgebied valt.", id(error_flag_p11).state},
          {"P13 - Storing compressor - laag drukverschil", "Toerental compressor wordt verlaagd. Als dezelfde storing binnen een bepaalde tijd drie keer optreedt, wordt de warmtepomp geblokkeerd en moet worden herstart.", id(error_flag_p13).state},
          {"Communicatie-failsafe binnenunit", "Communicatie-failsafe binnenunit actief.", id(error_flag_inside_comm_failsafe).state},
          {"EEPROM-fout binnenunit", "EEPROM- of statusfout binnenunit.", id(error_flag_inside_eeprom).state},
          {"Pompterugmelding P0 alarm", "Alarm pompterugmelding P0.", id(error_flag_pump_p0_alarm).state}
        };

        lv_obj_clean(id(service_warnings_list));
        int active_count = 0;
        const int total = sizeof(items) / sizeof(items[0]);
        for (int i = 0; i < total; i++) {
          if (items[i].active) {
            active_count++;
            std::string entry = std::string(items[i].title) + "\n" + items[i].explanation;
            lv_list_add_text(id(service_warnings_list), entry.c_str());
          }
        }
        if (active_count == 0) {
          lv_list_add_text(id(service_warnings_list), "Geen actieve waarschuwingen");
        }

- id: update_service_deaeration_ui
  mode: restart
  then:
    - if:
        condition:
          lambda: 'return id(amber_ctrl).is_deaeration_running();'
        then:
          - lvgl.label.update:
              id: service_deaeration_status_val
              text:
                format: "%s"
                args:
                  - 'id(amber_ctrl).get_deaeration_phase_text().c_str()'
          - lvgl.widget.update:
              id: service_deaeration_status_val
              text_color: 0x166534
          - lvgl.label.update:
              id: service_deaeration_time_val
              text:
                format: "Nog %02lu:%02lu (%d%%)"
                args:
                  - 'id(amber_ctrl).get_deaeration_remaining_seconds() / 60UL'
                  - 'id(amber_ctrl).get_deaeration_remaining_seconds() % 60UL'
                  - 'id(amber_ctrl).get_deaeration_progress_percent()'
          - lvgl.widget.update:
              id: service_deaeration_time_val
              text_color: 0x1F3B68
          - lambda: |-
              if (id(service_deaeration_progress_bar) != nullptr) {
                lv_bar_set_value(id(service_deaeration_progress_bar), id(amber_ctrl).get_deaeration_progress_percent(), LV_ANIM_ON);
              }
          - if:
              condition:
                lambda: 'return !id(amber_ctrl).is_deaeration_extended();'
              then:
                - lvgl.widget.update: { id: service_deaeration_short_btn, bg_color: 0x1F3B68 }
                - lvgl.widget.update: { id: service_deaeration_short_btn_lbl, text_color: 0xFFFFFF }
                - lvgl.label.update: { id: service_deaeration_short_btn_lbl, text: "Stoppen (Kort)" }
                - lvgl.widget.update: { id: service_deaeration_extended_btn, bg_color: 0xEDF1F6 }
                - lvgl.widget.update: { id: service_deaeration_extended_btn_lbl, text_color: 0x9CA3AF }
                - lvgl.label.update:
                    id: service_deaeration_extended_btn_lbl
                    text:
                      format: "Uitgebreid (~%lu min)"
                      args: ['(id(amber_ctrl).get_deaeration_duration_seconds(true) + 30UL) / 60UL']
              else:
                - lvgl.widget.update: { id: service_deaeration_extended_btn, bg_color: 0x1F3B68 }
                - lvgl.widget.update: { id: service_deaeration_extended_btn_lbl, text_color: 0xFFFFFF }
                - lvgl.label.update: { id: service_deaeration_extended_btn_lbl, text: "Stoppen (Uitgebreid)" }
                - lvgl.widget.update: { id: service_deaeration_short_btn, bg_color: 0xEDF1F6 }
                - lvgl.widget.update: { id: service_deaeration_short_btn_lbl, text_color: 0x9CA3AF }
                - lvgl.label.update:
                    id: service_deaeration_short_btn_lbl
                    text:
                      format: "Kort (~%lu min)"
                      args: ['(id(amber_ctrl).get_deaeration_duration_seconds(false) + 30UL) / 60UL']
        else:
          - lvgl.label.update:
              id: service_deaeration_status_val
              text: "Inactief"
          - lvgl.widget.update:
              id: service_deaeration_status_val
              text_color: 0x6B7280
          - lvgl.label.update:
              id: service_deaeration_time_val
              text: "Resterend: -"
          - lvgl.widget.update:
              id: service_deaeration_time_val
              text_color: 0x6B7280
          - lambda: |-
              if (id(service_deaeration_progress_bar) != nullptr) {
                lv_bar_set_value(id(service_deaeration_progress_bar), 0, LV_ANIM_OFF);
              }
          - lvgl.widget.update: { id: service_deaeration_short_btn, bg_color: 0xE8ECF1 }
          - lvgl.widget.update: { id: service_deaeration_short_btn_lbl, text_color: 0x4B5563 }
          - lvgl.label.update:
              id: service_deaeration_short_btn_lbl
              text:
                format: "Kort (~%lu min)"
                args: ['(id(amber_ctrl).get_deaeration_duration_seconds(false) + 30UL) / 60UL']
          - lvgl.widget.update: { id: service_deaeration_extended_btn, bg_color: 0xE8ECF1 }
          - lvgl.widget.update: { id: service_deaeration_extended_btn_lbl, text_color: 0x4B5563 }
          - lvgl.label.update:
              id: service_deaeration_extended_btn_lbl
              text:
                format: "Uitgebreid (~%lu min)"
                args: ['(id(amber_ctrl).get_deaeration_duration_seconds(true) + 30UL) / 60UL']

- id: update_service_mode_ui
  mode: restart
  then:
    - script.execute: update_header_alert_icons
    - script.execute: update_service_diag_summary_ui
    - script.execute: update_service_errors_ui
    - script.execute: update_service_warnings_ui
    - script.execute: update_service_section_options_ui
    - if:
        condition:
          lambda: 'return !lv_obj_has_flag(id(page_service), LV_OBJ_FLAG_HIDDEN);'
        then:
          - lvgl.widget.update:
              id: set_service_mode_switch_ui
              state:
                checked: !lambda 'return id(service_mode_enabled).state;'
          - lvgl.widget.update:
              id: service_pump_p0_switch_ui
              state:
                checked: !lambda 'return id(pump_p0_relay_switch).state;'
          - lvgl.widget.update:
              id: service_pump_p1_switch_ui
              state:
                checked: !lambda 'return id(pump_p1_relay_switch).state;'
          - lvgl.widget.update:
              id: service_pump_p2_switch_ui
              state:
                checked: !lambda 'return id(pump_p2_relay_switch).state;'
          - lvgl.widget.update:
              id: service_dhw_pump_switch_ui
              state:
                checked: !lambda 'return id(dhw_pump_relay_switch).state;'
          - lvgl.widget.update:
              id: service_backup_heater_relay_switch_ui
              state:
                checked: !lambda 'return id(backup_heater_relay).state;'
          - lvgl.widget.update:
              id: service_external_backup_heating_relay_switch_ui
              state:
                checked: !lambda 'return id(external_backup_heating_relay).state;'
          - lvgl.widget.update:
              id: service_crankcase_heater_switch_ui
              state:
                checked: !lambda 'return id(compressor_crankcase_heater_manual_switch).state;'
          - lvgl.widget.update:
              id: service_bottom_plate_heater_switch_ui
              state:
                checked: !lambda 'return id(bottom_plate_heater_manual_switch).state;'
          - script.execute: update_service_valve_ui
          - script.execute: update_service_deaeration_ui
          - lvgl.label.update:
              id: service_p0_pwm_slider_value
              text:
                format: "%.0f %%"
                args: ['id(pump_p0_current_pwm_sensor).state']
          - lvgl.label.update:
              id: service_fan_slider_value
              text:
                format: "%.0f RPM"
                args: ['id(fan_speed_manual_number).state']
          - lambda: |-
              if (id(service_p0_pwm_slider) != nullptr) {
                lv_slider_set_value(id(service_p0_pwm_slider), (int) id(pump_p0_current_pwm_sensor).state, LV_ANIM_OFF);
              }
              if (id(service_fan_slider) != nullptr) {
                lv_slider_set_value(id(service_fan_slider), (int) id(fan_speed_manual_number).state, LV_ANIM_OFF);
              }
          - lvgl.widget.show: { id: service_maintenance_layout }
          - if:
              condition:
                lambda: 'return id(service_mode_enabled).state && id(state_machine_state_main).state == "Maintenance";'
              then:
                - lvgl.label.update:
                    id: service_maintenance_state
                    text: "Onderhoudsmodus actief"
                - lvgl.widget.update:
                    id: service_maintenance_state
                    text_color: 0x166534
                - lvgl.widget.hide: { id: service_maintenance_lock_hint }
                - lvgl.widget.update:
                    id: service_maintenance_layout
                    opa: 100%
                - lvgl.widget.enable: { id: service_deaeration_short_btn }
                - lvgl.widget.enable: { id: service_deaeration_extended_btn }
              else:
                - if:
                    condition:
                      switch.is_on: service_mode_enabled
                    then:
                      - lvgl.widget.show: { id: service_maintenance_lock_hint }
                      - lvgl.label.update:
                          id: service_maintenance_state
                          text: "Regeling aan het pauzeren..."
                      - lvgl.widget.update:
                          id: service_maintenance_state
                          text_color: 0xB45309
                    else:
                      - lvgl.label.update:
                          id: service_maintenance_state
                          text: "Onderhoudsmodus niet actief"
                      - lvgl.widget.update:
