          if (id(flow_sensor_enabled).state) {
            if (id(pump_p0_current_pwm_sensor).state > 0) {
              if (isnan(id(water_flow_rate).state)) {
                lv_label_set_text(id(tile_pump_state), str_sprintf("%.0f%%\n- l/u", id(pump_p0_current_pwm_sensor).state).c_str());
                lv_obj_send_event(id(tile_pump_state), lvgl::lv_update_event, nullptr);
