          if (!id(dhw_schedule_enabled_switch).state) return lv_color_hex(0xE5E7EB);
          return id(dhw_schedule_saturday_enabled_switch).state ? lv_color_hex(0x1F3B68) : lv_color_hex(0xCBD5E1);
        }(), LV_PART_MAIN);
        lv_obj_set_style_text_color(id(set_dhw_day_sat_lbl), [&]() -> lv_color_t {
          if (!id(dhw_schedule_enabled_switch).state) return lv_color_hex(0x9CA3AF);
          return id(dhw_schedule_saturday_enabled_switch).state ? lv_color_hex(0xFFFFFF) : lv_color_hex(0x334155);
        }(), LV_PART_MAIN);
        lv_obj_set_style_bg_color(id(set_dhw_day_sun), [&]() -> lv_color_t {
          if (!id(dhw_schedule_enabled_switch).state) return lv_color_hex(0xE5E7EB);
          return id(dhw_schedule_sunday_enabled_switch).state ? lv_color_hex(0x1F3B68) : lv_color_hex(0xCBD5E1);
        }(), LV_PART_MAIN);
        lv_obj_set_style_text_color(id(set_dhw_day_sun_lbl), [&]() -> lv_color_t {
          if (!id(dhw_schedule_enabled_switch).state) return lv_color_hex(0x9CA3AF);
          return id(dhw_schedule_sunday_enabled_switch).state ? lv_color_hex(0xFFFFFF) : lv_color_hex(0x334155);
        }(), LV_PART_MAIN);
        lv_label_set_text(id(set_dhw_days_summary), std::string([&]() -> std::string {
          if (!id(dhw_schedule_enabled_switch).state) {
            return std::string(oa_tr("Schema uit"));
          }
          
          std::string out = oa_tr("Actief op: ");
          bool first = true;
          
          if (id(dhw_schedule_monday_enabled_switch).state) { out += first ? oa_tr("Ma") : oa_tr(", Ma"); first = false; }
          if (id(dhw_schedule_tuesday_enabled_switch).state) { out += first ? oa_tr("Di") : oa_tr(", Di"); first = false; }
          if (id(dhw_schedule_wednesday_enabled_switch).state) { out += first ? oa_tr("Wo") : oa_tr(", Wo"); first = false; }
          if (id(dhw_schedule_thursday_enabled_switch).state) { out += first ? oa_tr("Do") : oa_tr(", Do"); first = false; }
          if (id(dhw_schedule_friday_enabled_switch).state) { out += first ? oa_tr("Vr") : oa_tr(", Vr"); first = false; }
          if (id(dhw_schedule_saturday_enabled_switch).state) { out += first ? oa_tr("Za") : oa_tr(", Za"); first = false; }
          if (id(dhw_schedule_sunday_enabled_switch).state) { out += first ? oa_tr("Zo") : oa_tr(", Zo"); first = false; }
          
          if (first) {
            return std::string(oa_tr("Geen dagen geselecteerd"));
          }
          return out;
        }()).c_str());
        lv_obj_send_event(id(set_dhw_days_summary), lvgl::lv_update_event, nullptr);
        lv_label_set_text(id(set_dhw_start_time_val), str_sprintf("%02d:%02d", id(dhw_start_time).hour, id(dhw_start_time).minute).c_str());
        lv_obj_send_event(id(set_dhw_start_time_val), lvgl::lv_update_event, nullptr);
        lv_label_set_text(id(set_dhw_end_time_val), str_sprintf("%02d:%02d", id(dhw_end_time).hour, id(dhw_end_time).minute).c_str());
        lv_obj_send_event(id(set_dhw_end_time_val), lvgl::lv_update_event, nullptr);
        // Grey out start/end time controls when schedule is off
        lv_obj_set_style_text_color(id(set_dhw_start_time_lbl), (id(dhw_schedule_enabled_switch).state ? lv_color_hex(0x1F2933) : lv_color_hex(0x9CA3AF)), LV_PART_MAIN);
        lv_obj_set_style_text_color(id(set_dhw_start_time_val), (id(dhw_schedule_enabled_switch).state ? lv_color_hex(0x1F2933) : lv_color_hex(0x9CA3AF)), LV_PART_MAIN);
        lv_obj_set_style_bg_color(id(set_dhw_start_time_dec), (id(dhw_schedule_enabled_switch).state ? lv_color_hex(0xE6F1FB) : lv_color_hex(0xE5E7EB)), LV_PART_MAIN);
        lv_obj_set_style_text_color(id(set_dhw_start_time_dec_lbl), (id(dhw_schedule_enabled_switch).state ? lv_color_hex(0x185FA5) : lv_color_hex(0x9CA3AF)), LV_PART_MAIN);
        lv_obj_set_style_bg_color(id(set_dhw_start_time_inc), (id(dhw_schedule_enabled_switch).state ? lv_color_hex(0xE6F1FB) : lv_color_hex(0xE5E7EB)), LV_PART_MAIN);
        lv_obj_set_style_text_color(id(set_dhw_start_time_inc_lbl), (id(dhw_schedule_enabled_switch).state ? lv_color_hex(0x185FA5) : lv_color_hex(0x9CA3AF)), LV_PART_MAIN);
        lv_obj_set_style_text_color(id(set_dhw_end_time_lbl), (id(dhw_schedule_enabled_switch).state ? lv_color_hex(0x1F2933) : lv_color_hex(0x9CA3AF)), LV_PART_MAIN);
        lv_obj_set_style_text_color(id(set_dhw_end_time_val), (id(dhw_schedule_enabled_switch).state ? lv_color_hex(0x1F2933) : lv_color_hex(0x9CA3AF)), LV_PART_MAIN);
        lv_obj_set_style_bg_color(id(set_dhw_end_time_dec), (id(dhw_schedule_enabled_switch).state ? lv_color_hex(0xE6F1FB) : lv_color_hex(0xE5E7EB)), LV_PART_MAIN);
        lv_obj_set_style_text_color(id(set_dhw_end_time_dec_lbl), (id(dhw_schedule_enabled_switch).state ? lv_color_hex(0x185FA5) : lv_color_hex(0x9CA3AF)), LV_PART_MAIN);
        lv_obj_set_style_bg_color(id(set_dhw_end_time_inc), (id(dhw_schedule_enabled_switch).state ? lv_color_hex(0xE6F1FB) : lv_color_hex(0xE5E7EB)), LV_PART_MAIN);
        lv_obj_set_style_text_color(id(set_dhw_end_time_inc_lbl), (id(dhw_schedule_enabled_switch).state ? lv_color_hex(0x185FA5) : lv_color_hex(0x9CA3AF)), LV_PART_MAIN);

- id: wifi_scan_networks
  then:
    - lambda: |-
        const char *current_options = lv_dropdown_get_options(id(wifi_network_dd)->obj);
        if (current_options == nullptr || std::string(current_options) != oa_tr("Zoeken...")) {
          lv_dropdown_set_options(id(wifi_network_dd)->obj, oa_tr("Zoeken..."));
        }
    - lambda: |-
        #ifdef USE_WIFI
        wifi::global_wifi_component->start_scanning();
        #endif

# Connectiviteit sub-tabs. Only WiFi exists here; the BLE package extends this
# script with its Bluetooth page (tab 1).
- id: wifi_scan_networks_if_empty
  then:
    - lambda: |-
        uint16_t count = lv_dropdown_get_option_cnt(id(wifi_network_dd)->obj);
        if (count <= 1) {
          const char *current_options = lv_dropdown_get_options(id(wifi_network_dd)->obj);
          if (current_options == nullptr || std::string(current_options) != oa_tr("Zoeken...")) {
            lv_dropdown_set_options(id(wifi_network_dd)->obj, oa_tr("Zoeken..."));
          }
          #ifdef USE_WIFI
          wifi::global_wifi_component->start_scanning();
          #endif
        }

- id: wifi_network_dropdown_changed
  then:
    - lambda: |-
        char buf[64];
        lv_dropdown_get_selected_str(id(wifi_network_dd)->obj, buf, sizeof(buf));
        if (strcmp(buf, oa_tr("Handmatig...")) == 0) {
          lv_obj_clear_flag(id(wifi_hidden_ssid_section), LV_OBJ_FLAG_HIDDEN);
        } else {
          lv_obj_add_flag(id(wifi_hidden_ssid_section), LV_OBJ_FLAG_HIDDEN);
        }

- id: wifi_password_visibility_toggle
  then:
    - lambda: |-
        bool current = lv_textarea_get_password_mode(id(wifi_password_ta));
        lv_textarea_set_password_mode(id(wifi_password_ta), !current);
        lv_label_set_text(id(wifi_password_toggle_label), current ? "\U000F0208" : "\U000F0209");

- id: wifi_focus_text_input
  parameters:
    input_index: int
  then:
    - lambda: |-
        lv_obj_remove_flag(id(wifi_keyboard)->obj, LV_OBJ_FLAG_HIDDEN);
        {
          lv_obj_t *ta = (input_index == 0) ? id(wifi_password_ta) : id(wifi_hidden_ssid_ta);
          lv_keyboard_set_textarea(id(wifi_keyboard)->obj, ta);
        }

- id: wifi_unfocus_text_input
  then:
    - lvgl.widget.hide: { id: wifi_keyboard }

- id: update_wifi_connected_summary_ui
  then:
    - lambda: |-
        if (!lv_obj_has_flag(id(page_settings), LV_OBJ_FLAG_HIDDEN)) {
          [&]() {
            if (id(wifi_connected_details_table) == nullptr) return;
            auto *wt = id(wifi_connected_details_table)->obj;
            lv_table_set_cell_value(wt, 0, 1, id(wifi_ssid_ui).state.empty() ? "-" : id(wifi_ssid_ui).state.c_str());
            lv_table_set_cell_value(wt, 1, 1, id(wifi_ip_ui).state.empty() ? "-" : id(wifi_ip_ui).state.c_str());
            lv_table_set_cell_value(wt, 2, 1, id(wifi_mac_ui).state.empty() ? "-" : id(wifi_mac_ui).state.c_str());
            lv_table_set_cell_value(wt, 3, 1, isnan(id(wifi_signal_db).state) ? oa_tr("Geen signaal") : str_sprintf("%.0f dBm", id(wifi_signal_db).state).c_str());
          }();
        }

- id: wifi_connect_selected
  mode: restart
  then:
    - if:
        # Saves the credentials and returns true when a real network was selected.
        condition:
          lambda: |-
            char dd_buf[64];
            lv_dropdown_get_selected_str(id(wifi_network_dd)->obj, dd_buf, sizeof(dd_buf));
            std::string ssid;
            if (std::string(dd_buf) == oa_tr("Handmatig...")) {
              ssid = lv_textarea_get_text(id(wifi_hidden_ssid_ta));
            } else {
              ssid = dd_buf;
            }
            if (ssid.empty() || ssid == oa_tr("Geen netwerken gevonden") || ssid == oa_tr("Zoeken...") || ssid == oa_tr("Kies netwerk...")) return false;
            std::string password = lv_textarea_get_text(id(wifi_password_ta));
            #ifdef USE_WIFI
            wifi::global_wifi_component->save_wifi_sta(ssid, password);
            // save_wifi_sta() only kicks the state machine out of COOLDOWN; from the fallback AP
            // (no network configured) it would never connect, so start it explicitly like Improv does.
            wifi::global_wifi_component->start_connecting(wifi::global_wifi_component->get_sta());
            #endif
            return true;
        then:
          # On success the panel switches to the connected section; otherwise re-enable the button text for another try.
          - delay: 30s
          - lvgl.label.update:
              id: wifi_connect_btn_label
              text: !lambda return std::string(oa_tr("Verbinden"));
        else:
          # Placeholder selected: nothing to connect, undo the "Verbinden..." set by on_click right away.
          - lvgl.label.update:
              id: wifi_connect_btn_label
              text: !lambda return std::string(oa_tr("Verbinden"));

- id: wifi_disconnect
  then:
    - lambda: |-
        {
          #ifdef USE_WIFI
          wifi::global_wifi_component->save_wifi_sta("", "");
          // clear_sta() only empties the network list; the radio stays associated.
          // With no networks left the WiFi state machine is skipped, so it won't reconnect.
          wifi::global_wifi_component->clear_sta();
          esp_wifi_disconnect();
          if (id(wifi_connected_details_table) != nullptr) {
            auto *wt = id(wifi_connected_details_table)->obj;
            lv_table_set_cell_value(wt, 0, 1, "-");
            lv_table_set_cell_value(wt, 1, 1, "-");
            lv_table_set_cell_value(wt, 2, 1, "-");
            lv_table_set_cell_value(wt, 3, 1, "-");
          }
          #endif
        }
        lv_label_set_text(id(wifi_status_label), oa_tr("Niet verbonden"));
        lv_obj_send_event(id(wifi_status_label), lvgl::lv_update_event, nullptr);
        lv_obj_set_style_text_color(id(wifi_status_label), lv_color_hex(0xEF4444), LV_PART_MAIN);
        lv_label_set_text(id(nav_status_wifi_icon), "󰤮");
        lv_obj_send_event(id(nav_status_wifi_icon), lvgl::lv_update_event, nullptr);
        lv_obj_set_style_text_color(id(nav_status_wifi_icon), lv_color_hex(0x9CA3AF), LV_PART_MAIN);
        lv_obj_add_flag(id(wifi_connected_section), LV_OBJ_FLAG_HIDDEN);
        lv_obj_remove_flag(id(wifi_disconnected_section), LV_OBJ_FLAG_HIDDEN);

# Firmware update via the display: show the progress overlay and install.
- id: start_firmware_update
  mode: single
  then:
    - if:
        # A check (e.g. after a channel change from Home Assistant) replaced the version the dialog described:
        # install nothing and show the new offer, so the user confirms what is actually installed.
        # Also refuse a beta once the channel is Stabiel: a failed or pending check keeps the beta-channel result.
        condition:
          lambda: |-
            const std::string &latest = id(firmware_update).update_info.latest_version;
            auto channel = id(firmware_update_channel).active_index();
            bool beta_channel = channel.has_value() && channel.value() == 1;
            return latest != id(service_update_target) || (!beta_channel && latest.find('-') != std::string::npos);
        then:
          - logger.log: "Firmware update target changed after confirmation, not installing"
          - script.execute: update_firmware_ui
        else:
          - globals.set:
              id: service_update_install_in_progress
              value: 'true'
          - lvgl.widget.show:
              id: service_update_progress_overlay
          - update.perform:
              id: firmware_update
          - delay: 10min
          - globals.set:
              id: service_update_install_in_progress
              value: 'false'
          - lvgl.widget.hide:
              id: service_update_progress_overlay

# Restore the confirm dialog to its two-button layout.
- id: service_confirm_reset_layout
  then:
    - lambda: |-
        lv_obj_add_flag(id(service_confirm_stop_first_button), LV_OBJ_FLAG_HIDDEN);
        lv_obj_set_size(id(service_confirm_card), 560, 260);
        lv_obj_set_width(id(service_confirm_cancel_button), 200);
        lv_obj_set_width(id(service_confirm_button), 200);


- id: setup_menu_header_ui
  # Settings and service menu headers: round back button, breadcrumb with the parent page and the title.
  # Runs on every page change (menu on_value) and keeps a small page stack per menu for the breadcrumb,
  # because LVGL does not expose the menu history.
  then:
    - lambda: |-
        static std::vector<std::pair<lv_obj_t *, std::string>> history[2];
        static lv_obj_t *crumbs[2] = {nullptr, nullptr};
        lv_obj_t *menus[2] = {id(settings_menu), id(service_menu)};
        lv_obj_t *roots[2] = {id(settings_overview_page), id(service_overview_page)};
        for (int m = 0; m < 2; m++) {
          lv_obj_t *menu = menus[m];
          if (menu == nullptr) continue;
          lv_obj_t *header = lv_menu_get_main_header(menu);
          if (header == nullptr) continue;
          if (crumbs[m] == nullptr) {
            lv_obj_t *back_btn = lv_menu_get_main_header_back_button(menu);
            if (back_btn != nullptr) {
              lv_obj_set_size(back_btn, 46, 46);
              lv_obj_set_style_radius(back_btn, 23, LV_PART_MAIN);
              lv_obj_set_style_bg_color(back_btn, lv_color_hex(0x1F3B68), LV_PART_MAIN);
              lv_obj_set_style_bg_opa(back_btn, LV_OPA_COVER, LV_PART_MAIN);
              lv_obj_set_style_bg_color(back_btn, lv_color_hex(0x185FA5), LV_STATE_PRESSED);
              lv_obj_set_style_border_width(back_btn, 0, LV_PART_MAIN);
              lv_obj_set_layout(back_btn, LV_LAYOUT_FLEX);
              lv_obj_set_flex_flow(back_btn, LV_FLEX_FLOW_ROW);
              lv_obj_set_flex_align(back_btn, LV_FLEX_ALIGN_CENTER, LV_FLEX_ALIGN_CENTER, LV_FLEX_ALIGN_CENTER);
              lv_obj_set_style_pad_all(back_btn, 0, LV_PART_MAIN);
              lv_obj_set_style_margin_right(back_btn, 14, LV_PART_MAIN);
              lv_obj_t *back_icon = lv_obj_get_child(back_btn, 0);
              if (back_icon != nullptr) {
                lv_obj_set_style_text_font(back_icon, font_mdi_24, LV_PART_MAIN);
                lv_obj_set_style_text_color(back_icon, lv_color_hex(0xFFFFFF), LV_PART_MAIN);
                lv_obj_set_style_align(back_icon, LV_ALIGN_CENTER, LV_PART_MAIN);
                lv_image_set_src(back_icon, "\363\260\205\201");
              }
            }
            lv_obj_t *title = lv_obj_get_child(header, -1);
            if (title != nullptr) {
              lv_obj_set_style_text_font(title, font_text_24, LV_PART_MAIN);
              lv_obj_set_style_text_color(title, lv_color_hex(0x1F2933), LV_PART_MAIN);
            }
            // Breadcrumb between the back button and the title.
            crumbs[m] = lv_label_create(header);
            lv_obj_set_style_text_font(crumbs[m], font_text_20, LV_PART_MAIN);
            lv_obj_set_style_text_color(crumbs[m], lv_color_hex(0x6B7280), LV_PART_MAIN);
            lv_obj_set_style_margin_right(crumbs[m], 8, LV_PART_MAIN);
            lv_obj_move_to_index(crumbs[m], 1);
          }
          lv_obj_t *page = lv_menu_get_cur_main_page(menu);
          lv_obj_t *title = lv_obj_get_child(header, -1);
          // LVGL sets the header from the page title, which holds the compiled-in language.
          if (title != nullptr) {
            const char *tr = oa_i18n_to(lv_label_get_text(title));
            if (tr != nullptr && strcmp(tr, lv_label_get_text(title)) != 0) lv_label_set_text(title, tr);
          }
          std::string text = title != nullptr ? lv_label_get_text(title) : "";
          auto &h = history[m];
          // The stack keeps titles in the language they were shown in: bring them to the selected
          // language, so the breadcrumb follows a language switch.
          for (auto &entry : h) {
            int row = oa_i18n_row(entry.second.c_str(), oa_i18n_lang_);
            if (row >= 0) entry.second = OA_I18N_ROWS[row][oa_i18n_lang_];
          }
          if (page == roots[m]) {
            h.clear();
            h.emplace_back(page, text);
          } else if (h.size() >= 2 && h[h.size() - 2].first == page) {
            h.pop_back();
          } else if (h.empty() || h.back().first != page) {
            h.emplace_back(page, text);
          }
          if (h.size() >= 2) {
            // parent title + mdi-chevron-right
            std::string crumb = h[h.size() - 2].second + "  \363\260\205\202";
            lv_label_set_text(crumbs[m], crumb.c_str());
            lv_obj_remove_flag(crumbs[m], LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_obj_add_flag(crumbs[m], LV_OBJ_FLAG_HIDDEN);
          }
        }
