          lv_obj_remove_flag(id(service_sensors_page_1), LV_OBJ_FLAG_HIDDEN);
          lv_obj_add_flag(id(service_sensors_page_2), LV_OBJ_FLAG_HIDDEN);
          lv_obj_add_flag(id(service_sensors_page_3), LV_OBJ_FLAG_HIDDEN);
          lv_obj_add_flag(id(service_sensors_page_4), LV_OBJ_FLAG_HIDDEN);
          lv_obj_set_style_bg_color(id(service_sensors_page_prev_button), lv_color_hex(0xCBD5E1), LV_PART_MAIN);
