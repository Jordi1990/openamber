              lv_obj_set_style_bg_color(id(service_sensors_page_next_button), lv_color_hex(0x1F3B68), LV_PART_MAIN);
              lv_obj_set_style_text_color(id(service_sensors_page_next_button_lbl), lv_color_hex(0xFFFFFF), LV_PART_MAIN);
              lv_label_set_text(id(service_sensors_page_indicator), "Pagina 3 / 4");
              lv_obj_send_event(id(service_sensors_page_indicator), lvgl::lv_update_event, nullptr);
            } else {
              lv_obj_add_flag(id(service_sensors_page_1), LV_OBJ_FLAG_HIDDEN);
