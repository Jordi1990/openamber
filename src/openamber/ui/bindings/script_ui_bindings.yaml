- id: update_eebus_settings_ui
  mode: restart
  then:
    - lambda: |-
        // Update EEBUS enabled switch state
        if (id(eebus_enabled_switch).state) {
          lv_obj_add_state(id(set_eebus_enabled_switch_ui), LV_STATE_CHECKED);
        } else {
          lv_obj_clear_state(id(set_eebus_enabled_switch_ui), LV_STATE_CHECKED);
        }

        // Update connection status, EMS info and disconnect button
        if (!id(eebus_enabled_switch).state) {
          lv_label_set_text(id(eebus_connection_status_lbl), "Uitgeschakeld");
          lv_obj_set_style_text_color(id(eebus_connection_status_lbl), lv_color_hex(0x6B7280), LV_PART_MAIN);
          lv_label_set_text(id(eebus_connection_status_icon), "\U000F0338");
          lv_obj_set_style_text_color(id(eebus_connection_status_icon), lv_color_hex(0x6B7280), LV_PART_MAIN);
          lv_label_set_text(id(eebus_connection_sub_lbl), "EEBUS is uitgeschakeld");
          lv_obj_add_flag(id(eebus_disconnect_btn), LV_OBJ_FLAG_HIDDEN);
        } else if (id(eebus_connected_sensor).state) {
          lv_label_set_text(id(eebus_connection_status_lbl), "Verbonden");
          lv_obj_set_style_text_color(id(eebus_connection_status_lbl), lv_color_hex(0x16A34A), LV_PART_MAIN);
          lv_label_set_text(id(eebus_connection_status_icon), "\U000F0337");
          lv_obj_set_style_text_color(id(eebus_connection_status_icon), lv_color_hex(0x16A34A), LV_PART_MAIN);
          if (id(eebus_ems_sensor).has_state() && id(eebus_ems_sensor).state != "–" && !id(eebus_ems_sensor).state.empty()) {
            std::string sub = "Verbonden met " + id(eebus_ems_sensor).state;
            lv_label_set_text(id(eebus_connection_sub_lbl), sub.c_str());
          } else {
            lv_label_set_text(id(eebus_connection_sub_lbl), "Verbonden met EMS");
          }
          lv_obj_clear_flag(id(eebus_disconnect_btn), LV_OBJ_FLAG_HIDDEN);
        } else {
          lv_label_set_text(id(eebus_connection_status_lbl), "Niet verbonden");
          lv_obj_set_style_text_color(id(eebus_connection_status_lbl), lv_color_hex(0xEF4444), LV_PART_MAIN);
          lv_label_set_text(id(eebus_connection_status_icon), "\U000F0338");
          lv_obj_set_style_text_color(id(eebus_connection_status_icon), lv_color_hex(0xEF4444), LV_PART_MAIN);
          lv_label_set_text(id(eebus_connection_sub_lbl), "Niet verbonden met een EMS");
          lv_obj_add_flag(id(eebus_disconnect_btn), LV_OBJ_FLAG_HIDDEN);
        }

        // Update EEBUS status
        if (!id(eebus_enabled_switch).state) {
          lv_label_set_text(id(eebus_status_lbl), "Uitgeschakeld");
          lv_obj_set_style_text_color(id(eebus_status_lbl), lv_color_hex(0x6B7280), LV_PART_MAIN);
        } else if (id(eebus_status_sensor).has_state()) {
          std::string st = id(eebus_status_sensor).state;
          if (st == "Normal operation") st = "Normaal bedrijf";
          else if (st == "Boost active") st = "Boost actief";
          else if (st == "Dimmed (§14a)") st = "Gedimd (§14a)";
          else if (st == "Disconnected") st = "Niet verbonden";
          else if (st == "Initializing...") st = "Initialiseren...";
          else if (st == "Disabled") st = "Uitgeschakeld";
          lv_label_set_text(id(eebus_status_lbl), st.c_str());
          lv_obj_set_style_text_color(id(eebus_status_lbl), lv_color_hex(0x1F2933), LV_PART_MAIN);
        } else {
          lv_label_set_text(id(eebus_status_lbl), "–");
          lv_obj_set_style_text_color(id(eebus_status_lbl), lv_color_hex(0x1F2933), LV_PART_MAIN);
        }

        // Update power limit display
        if (!id(eebus_enabled_switch).state) {
          lv_label_set_text(id(eebus_power_limit_lbl), "–");
          lv_obj_set_style_text_color(id(eebus_power_limit_lbl), lv_color_hex(0x6B7280), LV_PART_MAIN);
        } else if (id(eebus_connected_sensor).state && id(eebus_power_limit_sensor).has_state() && !std::isnan(id(eebus_power_limit_sensor).state)) {
          float lim = id(eebus_power_limit_sensor).state;
          if (lim <= 0.0f) {
            lv_label_set_text(id(eebus_power_limit_lbl), "0 W (Geblokkeerd)");
            lv_obj_set_style_text_color(id(eebus_power_limit_lbl), lv_color_hex(0xEF4444), LV_PART_MAIN);
          } else {
            char buf[32];
            snprintf(buf, sizeof(buf), "%.0f W", lim);
            lv_label_set_text(id(eebus_power_limit_lbl), buf);
            lv_obj_set_style_text_color(id(eebus_power_limit_lbl), lv_color_hex(0x1F2933), LV_PART_MAIN);
          }
        } else {
          lv_label_set_text(id(eebus_power_limit_lbl), "Geen limiet");
          lv_obj_set_style_text_color(id(eebus_power_limit_lbl), lv_color_hex(0x1F2933), LV_PART_MAIN);
        }

        // Update SKI display
        if (!id(eebus_enabled_switch).state) {
          lv_label_set_text(id(eebus_ski_display_lbl), "–");
        } else if (id(eebus_ski).has_state() && id(eebus_ski).state != "–" && !id(eebus_ski).state.empty()) {
          lv_label_set_text(id(eebus_ski_display_lbl), id(eebus_ski).state.c_str());
        } else {
          lv_label_set_text(id(eebus_ski_display_lbl), "Laden...");
        }

- id: eebus_disconnect
  mode: restart
  then:
    - lambda: |-
        {
          #ifdef USE_EEBUS
          eebus::eebus_disconnect();
          #endif
          if (id(eebus_connected_sensor) != nullptr) {
            id(eebus_connected_sensor).publish_state(false);
          }
          if (id(eebus_ems_sensor) != nullptr) {
            id(eebus_ems_sensor).publish_state("–");
          }
        }
        id(update_eebus_settings_ui).execute();

- id: update_advanced_settings_ui
  mode: restart
  then:
    - lambda: |-
        {
          bool enabled = id(advanced_settings_enabled).state;
          if (enabled) {
            lv_obj_add_state(id(set_advanced_settings_switch_ui), LV_STATE_CHECKED);
            lv_obj_clear_flag(id(stab_advanced), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(set_pid_disabled_overlay), LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_state(id(set_pid_section), LV_STATE_DISABLED);
          } else {
