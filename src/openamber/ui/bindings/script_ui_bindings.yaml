- id: update_system_diagnostics_ui
  mode: restart
  then:
    - lambda: |-
        if (!lv_obj_has_flag(id(page_system), LV_OBJ_FLAG_HIDDEN)) {
          [&]() {
            if (id(system_diag_runtime_table) == nullptr ||
                id(system_diag_memory_table) == nullptr ||
                id(system_diag_esp_table) == nullptr) return;
            
            auto *rt = id(system_diag_runtime_table)->obj;
            lv_table_set_cell_value(rt, 0, 1, ESPHOME_VERSION);
            if (id(sensor_uptime).has_state()) {
              uint32_t mins = static_cast<uint32_t>(id(sensor_uptime).state) / 60U;
              if (mins >= 1440U) {
                lv_table_set_cell_value(rt, 1, 1, str_sprintf(oa_tr("%lu d %lu u"), static_cast<unsigned long>(mins / 1440U), static_cast<unsigned long>((mins / 60U) % 24U)).c_str());
              } else if (mins >= 60U) {
                lv_table_set_cell_value(rt, 1, 1, str_sprintf(oa_tr("%lu u %lu m"), static_cast<unsigned long>(mins / 60U), static_cast<unsigned long>(mins % 60U)).c_str());
              } else {
                lv_table_set_cell_value(rt, 1, 1, str_sprintf(oa_tr("%lu m"), static_cast<unsigned long>(mins)).c_str());
              }
            } else {
              lv_table_set_cell_value(rt, 1, 1, "-");
            }
            
            auto *mt = id(system_diag_memory_table)->obj;
            lv_table_set_cell_value(mt, 0, 1, id(system_heap_free).has_state() ? str_sprintf("%.0f kB", id(system_heap_free).state / 1024.0f).c_str() : "-");
            lv_table_set_cell_value(mt, 1, 1, id(system_heap_fragmentation).has_state() ? str_sprintf("%.0f %%", id(system_heap_fragmentation).state).c_str() : "-");
            lv_table_set_cell_value(mt, 2, 1, id(system_heap_max_block).has_state() ? str_sprintf("%.0f kB", id(system_heap_max_block).state / 1024.0f).c_str() : "-");
            lv_table_set_cell_value(mt, 3, 1, id(system_psram_free).has_state() ? str_sprintf("%.0f kB", id(system_psram_free).state / 1024.0f).c_str() : "-");
            
            auto *et = id(system_diag_esp_table)->obj;
            lv_table_set_cell_value(et, 0, 1, id(system_debug_device_info).state.empty() ? "-" : id(system_debug_device_info).state.c_str());
            lv_table_set_cell_value(et, 1, 1, id(system_debug_reset_reason).state.empty() ? "-" : id(system_debug_reset_reason).state.c_str());
          }();
        }


- id: update_firmware_ui
  mode: restart
  then:
    - if:
        condition:
          # Like ESPHome, any different version is available. The Stabiel channel never offers a beta, also not one
          # left over from a check on the beta channel (a failed or still running check keeps that result).
          lambda: |-
            if (id(firmware_update).state != update::UPDATE_STATE_AVAILABLE) return false;
            auto channel = id(firmware_update_channel).active_index();
            bool beta_channel = channel.has_value() && channel.value() == 1;
            return beta_channel || id(firmware_update).update_info.latest_version.find('-') == std::string::npos;
        then:
          - globals.set:
              id: service_update_check_failed
              value: 'false'
          - lambda: |-
              // The beta manifest always holds the newest release, so a different version there is an update. On the
              // Stabiel channel with a beta installed (versions like 0.10.0-beta.1) the stable version is the way
              // back to stable, or the final release of that beta.
              const auto &info = id(firmware_update).update_info;
              auto channel = id(firmware_update_channel).active_index();
              bool beta_channel = channel.has_value() && channel.value() == 1;
              const std::string &current = info.current_version.empty() ? std::string(ESPHOME_PROJECT_VERSION) : info.current_version;
              id(service_update_to_stable) = !beta_channel && current.find('-') != std::string::npos;
              lv_obj_remove_flag(id(nav_system_badge), LV_OBJ_FLAG_HIDDEN);
          - if:
              condition:
                lambda: 'return !lv_obj_has_flag(id(page_system), LV_OBJ_FLAG_HIDDEN);'
              then:
                - lambda: |-
                    const auto &info = id(firmware_update).update_info;
                    const char *latest = info.latest_version.empty() ? oa_tr("onbekend") : info.latest_version.c_str();
                    const char *current = info.current_version.empty() ? ESPHOME_PROJECT_VERSION : info.current_version.c_str();
                    bool to_stable = id(service_update_to_stable);
                    lv_label_set_text(id(service_update_status), "");
                    lv_obj_send_event(id(service_update_status), lvgl::lv_update_event, nullptr);
                    lv_obj_add_flag(id(service_update_error), LV_OBJ_FLAG_HIDDEN);
                    lv_label_set_text(id(service_update_version), str_sprintf(to_stable
                        ? oa_tr("Stabiele versie %s beschikbaar\nHuidige versie: %s (beta)")
                        : oa_tr("Nieuwe versie %s beschikbaar\nHuidige versie: %s"), latest, current).c_str());
                    lv_obj_send_event(id(service_update_version), lvgl::lv_update_event, nullptr);
                    lv_label_set_text(id(service_update_button_label), to_stable ? oa_tr("Stabiel installeren") : oa_tr("Update installeren"));
                    lv_obj_send_event(id(service_update_button_label), lvgl::lv_update_event, nullptr);
                - if:
                    condition:
                      lambda: |-
                        const auto &info = id(firmware_update).update_info;
                        std::string release_url = !info.release_url.empty()
                          ? info.release_url
                          : std::string("https://github.com/Jordi1990/openamber/releases");
                        return id(service_release_qr_url_cache) != release_url;
                    then:
                      - lambda: |-
                          const auto &info = id(firmware_update).update_info;
                          id(service_release_qr_url_cache) = !info.release_url.empty()
                            ? info.release_url
                            : std::string("https://github.com/Jordi1990/openamber/releases");
                      - lvgl.qrcode.update:
                          id: service_release_qr
                          text: !lambda 'return id(service_release_qr_url_cache);'
                - lambda: |-
                    lv_obj_remove_flag(id(service_release_qr_hint), LV_OBJ_FLAG_HIDDEN);
                    lv_obj_remove_flag(id(service_release_qr), LV_OBJ_FLAG_HIDDEN);
                    lv_obj_remove_flag(id(service_update_button), LV_OBJ_FLAG_HIDDEN);
                    // The card is SIZE_CONTENT; recompute it now that the QR code and button are shown.
                    lv_obj_mark_layout_as_dirty(id(service_update_card));
                    if (id(service_update_check_in_progress)) {
                      lvgl::LvglComponent::lv_obj_set_state_value(id(service_check_update_button), LV_STATE_DISABLED, false);
                      lv_obj_remove_flag(id(service_check_update_button), LV_OBJ_FLAG_HIDDEN);
                      lvgl::LvglComponent::lv_obj_set_state_value(id(service_check_update_button), LV_STATE_DISABLED, true);
                      lv_obj_set_style_bg_color(id(service_check_update_button), lv_color_hex(0xEDF1F6), LV_PART_MAIN);
                      lv_label_set_text(id(service_check_update_button_label), oa_tr("Ophalen..."));
                      lv_obj_send_event(id(service_check_update_button_label), lvgl::lv_update_event, nullptr);
                      lv_obj_set_style_text_color(id(service_check_update_button_label), lv_color_hex(0x9CA3AF), LV_PART_MAIN);
                    } else {
                      lvgl::LvglComponent::lv_obj_set_state_value(id(service_check_update_button), LV_STATE_DISABLED, false);
                      lv_obj_remove_flag(id(service_check_update_button), LV_OBJ_FLAG_HIDDEN);
                      lv_obj_set_style_bg_color(id(service_check_update_button), lv_color_hex(0xFFFFFF), LV_PART_MAIN);
                      lv_label_set_text(id(service_check_update_button_label), oa_tr("Controleer updates"));
                      lv_obj_send_event(id(service_check_update_button_label), lvgl::lv_update_event, nullptr);
                      lv_obj_set_style_text_color(id(service_check_update_button_label), lv_color_hex(0x1F2933), LV_PART_MAIN);
                    }
        else:
          - lambda: |-
              id(service_update_to_stable) = false;
              lv_obj_add_flag(id(nav_system_badge), LV_OBJ_FLAG_HIDDEN);
              if (!lv_obj_has_flag(id(page_system), LV_OBJ_FLAG_HIDDEN)) {
                if (id(service_update_check_failed)) {
                  lv_label_set_text(id(service_update_error), oa_tr("Geen verbinding mogelijk met update server"));
                  lv_obj_send_event(id(service_update_error), lvgl::lv_update_event, nullptr);
                  lv_obj_remove_flag(id(service_update_error), LV_OBJ_FLAG_HIDDEN);
                } else {
                  lv_obj_add_flag(id(service_update_error), LV_OBJ_FLAG_HIDDEN);
                }
                lv_label_set_text(id(service_update_status), "");
                lv_obj_send_event(id(service_update_status), lvgl::lv_update_event, nullptr);
                lv_label_set_text(id(service_update_version), str_sprintf(oa_tr("Geen nieuwe software beschikbaar\nHuidige versie: %s"), id(firmware_update).update_info.current_version.empty() ? ESPHOME_PROJECT_VERSION : id(firmware_update).update_info.current_version.c_str()).c_str());
                lv_obj_send_event(id(service_update_version), lvgl::lv_update_event, nullptr);
                lv_obj_add_flag(id(service_release_qr_hint), LV_OBJ_FLAG_HIDDEN);
                lv_obj_add_flag(id(service_release_qr), LV_OBJ_FLAG_HIDDEN);
                lv_obj_add_flag(id(service_update_button), LV_OBJ_FLAG_HIDDEN);
                lv_obj_mark_layout_as_dirty(id(service_update_card));
                if (id(service_update_check_in_progress)) {
                  lvgl::LvglComponent::lv_obj_set_state_value(id(service_check_update_button), LV_STATE_DISABLED, false);
                  lv_obj_remove_flag(id(service_check_update_button), LV_OBJ_FLAG_HIDDEN);
                  lvgl::LvglComponent::lv_obj_set_state_value(id(service_check_update_button), LV_STATE_DISABLED, true);
                  lv_obj_set_style_bg_color(id(service_check_update_button), lv_color_hex(0xEDF1F6), LV_PART_MAIN);
                  lv_label_set_text(id(service_check_update_button_label), oa_tr("Ophalen..."));
                  lv_obj_send_event(id(service_check_update_button_label), lvgl::lv_update_event, nullptr);
                  lv_obj_set_style_text_color(id(service_check_update_button_label), lv_color_hex(0x9CA3AF), LV_PART_MAIN);
                } else {
                  lv_obj_remove_flag(id(service_check_update_button), LV_OBJ_FLAG_HIDDEN);
                  lvgl::LvglComponent::lv_obj_set_state_value(id(service_check_update_button), LV_STATE_DISABLED, false);
                  lv_obj_set_style_bg_color(id(service_check_update_button), lv_color_hex(0xFFFFFF), LV_PART_MAIN);
                  lv_label_set_text(id(service_check_update_button_label), oa_tr("Controleer updates"));
                  lv_obj_send_event(id(service_check_update_button_label), lvgl::lv_update_event, nullptr);
                  lv_obj_set_style_text_color(id(service_check_update_button_label), lv_color_hex(0x1F2933), LV_PART_MAIN);
                }
              }
    - lambda: |-
        if (!lv_obj_has_flag(id(page_system), LV_OBJ_FLAG_HIDDEN)) {
          if (id(service_update_install_in_progress)) {
            lv_obj_remove_flag(id(service_update_progress_overlay), LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_obj_add_flag(id(service_update_progress_overlay), LV_OBJ_FLAG_HIDDEN);
          }
          id(update_controlled_stop_button_ui).execute();
        }

- id: update_controlled_stop_button_ui
  mode: restart
  then:
    - lambda: |-
        // The stop can also end by itself (30 min) or be changed from Home Assistant, so follow the actual state.
        const char *stop_label = id(controlled_stop_active) ? oa_tr("Hervat warmtepomp") : oa_tr("Stop warmtepomp");
        if (strcmp(lv_label_get_text(id(service_controlled_stop_button_label)), stop_label) != 0) {
          lv_label_set_text(id(service_controlled_stop_button_label), stop_label);
          lv_obj_send_event(id(service_controlled_stop_button_label), lvgl::lv_update_event, nullptr);
        }
        // Resuming is only possible once the heat pump is fully stopped (Standby), and not while maintenance mode
        // runs on top of the controlled stop: turn that off first.
        const bool resume_blocked = id(controlled_stop_active) && (id(service_mode_enabled).state || !id(amber_ctrl).is_standby());
        lvgl::LvglComponent::lv_obj_set_state_value(id(service_controlled_stop_button), LV_STATE_DISABLED, resume_blocked);
