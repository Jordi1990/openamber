            lv_obj_set_style_text_color(id(stab_advanced_lbl), lv_color_hex(0x4B5563), LV_PART_MAIN);
            lv_obj_clear_flag(id(set_pid_disabled_overlay), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_state(id(set_pid_section), LV_STATE_DISABLED);
          }
          lv_obj_clear_flag(id(set_pid_section), LV_OBJ_FLAG_HIDDEN);
          
          lv_obj_t* adv_rows[8] = {
            id(set_general_bodemplaat_mode_row),
            id(set_general_bodemplaat_start_row),
            id(set_general_bodemplaat_hysteresis_row),
            id(set_general_defrost_exit_row),
            id(set_general_defrost_max_time_row),
            id(set_general_defrost_enter1_row),
            id(set_defrost_advanced_section),
            id(set_pump_flow_switch_safety_row)
          };
          for (int i = 0; i < 8; i++) {
            if (enabled) {
              lv_obj_clear_state(adv_rows[i], LV_STATE_DISABLED);
              lv_obj_set_style_opa(adv_rows[i], LV_OPA_COVER, LV_PART_MAIN);
            } else {
              lv_obj_add_state(adv_rows[i], LV_STATE_DISABLED);
              lv_obj_set_style_opa(adv_rows[i], LV_OPA_40, LV_PART_MAIN);
            }
          }
        }
        if (id(advanced_settings_enabled).state) {
          id(update_bottomplate_mode_ui).execute();
        }


