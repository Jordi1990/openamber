- id: advanced_select_tab
  mode: restart
  parameters:
    tab_index: int
  then:
    - lambda: |-
        lv_obj_add_flag(id(general_system_pager), LV_OBJ_FLAG_HIDDEN);
        lv_obj_add_flag(id(sensor_calibration_pager), LV_OBJ_FLAG_HIDDEN);
        lv_obj_add_flag(id(pump_p0_pid_pager), LV_OBJ_FLAG_HIDDEN);

        lv_obj_t* panels[5] = {
          id(panel_advanced_page_pid),
          id(panel_advanced_page_bodemplaat),
          id(panel_advanced_page_defrost),
          id(panel_advanced_page_compressor),
          id(panel_advanced_page_fan)
        };
        lv_obj_t* tabs[5] = {
          id(advanced_stab_pid),
          id(advanced_stab_bodemplaat),
          id(advanced_stab_defrost),
          id(advanced_stab_compressor),
          id(advanced_stab_fan)
        };
        lv_obj_t* labels[5] = {
          id(advanced_stab_pid_lbl),
          id(advanced_stab_bodemplaat_lbl),
          id(advanced_stab_defrost_lbl),
          id(advanced_stab_compressor_lbl),
          id(advanced_stab_fan_lbl)
        };

        if (tab_index == 0) {
          lv_obj_clear_flag(id(advanced_pid_pager), LV_OBJ_FLAG_HIDDEN);
        } else {
          lv_obj_add_flag(id(advanced_pid_pager), LV_OBJ_FLAG_HIDDEN);
        }

        if (tab_index == 2) {
          lv_obj_clear_flag(id(advanced_defrost_pager), LV_OBJ_FLAG_HIDDEN);
        } else {
          lv_obj_add_flag(id(advanced_defrost_pager), LV_OBJ_FLAG_HIDDEN);
        }

        if (tab_index == 4) {
          lv_obj_clear_flag(id(advanced_fan_pager), LV_OBJ_FLAG_HIDDEN);
        } else {
          lv_obj_add_flag(id(advanced_fan_pager), LV_OBJ_FLAG_HIDDEN);
        }

        for (int i = 0; i < 5; i++) {
          if (i == tab_index) {
            lv_obj_clear_flag(panels[i], LV_OBJ_FLAG_HIDDEN);
            lv_obj_set_style_bg_color(tabs[i], lv_color_hex(0x1F3B68), LV_PART_MAIN);
