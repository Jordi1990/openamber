- id: advanced_fan_select_page
  mode: restart
  parameters:
    page: int
  then:
    - lambda: |-
        const int page_count = 4;
        if (page < 1) page = 1;
        if (page > page_count) page = page_count;
        id(advanced_fan_page) = page;

        struct PageRow {
          lv_obj_t* row;
          int page;
        };
        const PageRow rows[] = {
          {id(set_fan_note_row), 1},
          {id(set_fan_heat_max_row), 1},
          {id(set_fan_heat_mild_row), 1},
          {id(set_fan_heat_warm_row), 2},
          {id(set_fan_heat_hz_low_row), 2},
          {id(set_fan_heat_hz_mid_row), 2},
          {id(set_fan_cool_max_row), 3},
          {id(set_fan_cool_mild_row), 3},
          {id(set_fan_cool_low_row), 3},
          {id(set_fan_cool_hz_low_row), 4},
          {id(set_fan_cool_hz_mid_row), 4},
        };
        for (const auto &r : rows) {
          if (r.page == page) lv_obj_clear_flag(r.row, LV_OBJ_FLAG_HIDDEN);
          else lv_obj_add_flag(r.row, LV_OBJ_FLAG_HIDDEN);
        }

        bool has_prev = page > 1;
        bool has_next = page < page_count;
        lv_obj_set_style_bg_color(id(advanced_fan_page_prev_button), lv_color_hex(has_prev ? 0x1F3B68 : 0xCBD5E1), LV_PART_MAIN);
        lv_obj_set_style_text_color(id(advanced_fan_page_prev_button_lbl), lv_color_hex(has_prev ? 0xFFFFFF : 0x4B5563), LV_PART_MAIN);
        lv_obj_set_style_bg_color(id(advanced_fan_page_next_button), lv_color_hex(has_next ? 0x1F3B68 : 0xCBD5E1), LV_PART_MAIN);
        lv_obj_set_style_text_color(id(advanced_fan_page_next_button_lbl), lv_color_hex(has_next ? 0xFFFFFF : 0x4B5563), LV_PART_MAIN);
        lv_label_set_text_fmt(id(advanced_fan_page_indicator), "Pagina %d / %d", page, page_count);

