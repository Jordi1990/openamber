# ══════════════════════════════════════════════════════════════
# UI helper scripts used by event-driven bindings
# ══════════════════════════════════════════════════════════════

- id: !extend dump_eeprom_parameters_ui_disable
  then:
    - lvgl.widget.disable: { id: service_eeprom_dump_button }

- id: !extend dump_eeprom_parameters_ui_enable
  then:
    - lvgl.widget.enable: { id: service_eeprom_dump_button }

# Wireless thermostat switch and "Nieuw" next to its pairing code; filled in by thermostat_link.yaml
- id: thermostat_link_toggle_ui
  then: []

- id: thermostat_link_new_code_ui
  then: []

# A new code breaks the pairing, so "Nieuw" asks for a second tap within 5 s
- id: thermostat_link_new_code_confirm
  mode: restart
  then:
    - if:
        condition:
          lambda: 'return strcmp(lv_label_get_text(id(set_therm_link_new_btn_lbl)), oa_tr("Zeker?")) == 0;'
        then:
          - script.execute: thermostat_link_new_code_ui
        else:
          - lvgl.label.update: { id: set_therm_link_new_btn_lbl, text: "${t_zeker}" }
          - lvgl.widget.update: { id: set_therm_link_new_btn, bg_color: 0xDC2626 }
          - delay: 5s
    - lvgl.label.update: { id: set_therm_link_new_btn_lbl, text: "${t_nieuw}" }
    - lvgl.widget.update: { id: set_therm_link_new_btn, bg_color: 0x1F3B68 }

- id: update_thermostat_settings_ui
  mode: restart
  then:
    - lambda: |-
        if (!lv_obj_has_flag(id(page_settings), LV_OBJ_FLAG_HIDDEN) || !lv_obj_has_flag(id(page_thermostat), LV_OBJ_FLAG_HIDDEN)) {
          lv_label_set_text(id(set_therm_def_heat_val), str_sprintf("%.1f°C", id(thermostat_default_heat_setpoint).state).c_str());
          lv_obj_send_event(id(set_therm_def_heat_val), lvgl::lv_update_event, nullptr);
          lv_label_set_text(id(set_therm_def_cool_val), str_sprintf("%.1f°C", id(thermostat_default_cool_setpoint).state).c_str());
          lv_obj_send_event(id(set_therm_def_cool_val), lvgl::lv_update_event, nullptr);
          lv_label_set_text(id(set_therm_heat_db_val), str_sprintf("%.1f°C", id(thermostat_heat_deadband).state).c_str());
          lv_obj_send_event(id(set_therm_heat_db_val), lvgl::lv_update_event, nullptr);
          lv_label_set_text(id(set_therm_heat_or_val), str_sprintf("%.1f°C", id(thermostat_heat_overrun).state).c_str());
          lv_obj_send_event(id(set_therm_heat_or_val), lvgl::lv_update_event, nullptr);
          lv_label_set_text(id(set_therm_cool_db_val), str_sprintf("%.1f°C", id(thermostat_cool_deadband).state).c_str());
          lv_obj_send_event(id(set_therm_cool_db_val), lvgl::lv_update_event, nullptr);
          lv_label_set_text(id(set_therm_cool_or_val), str_sprintf("%.1f°C", id(thermostat_cool_overrun).state).c_str());
          lv_obj_send_event(id(set_therm_cool_or_val), lvgl::lv_update_event, nullptr);
          lv_label_set_text(id(set_therm_off_delay_val), str_sprintf("%.0f min", id(thermostat_off_delay).state).c_str());
          lv_obj_send_event(id(set_therm_off_delay_val), lvgl::lv_update_event, nullptr);
        }
        if (!lv_obj_has_flag(id(page_home), LV_OBJ_FLAG_HIDDEN)) {
          if (id(climate_controller).mode == climate::CLIMATE_MODE_COOL) {
            lv_label_set_text(id(home_therm_setpoint_value), str_sprintf("%.1f°C", id(climate_controller).target_temperature_high).c_str());
            lv_obj_send_event(id(home_therm_setpoint_value), lvgl::lv_update_event, nullptr);
          } else {
            lv_label_set_text(id(home_therm_setpoint_value), str_sprintf("%.1f°C", id(climate_controller).target_temperature_low).c_str());
            lv_obj_send_event(id(home_therm_setpoint_value), lvgl::lv_update_event, nullptr);
          }
          if (isnan(id(${room_temperature_source}).state)) {
            lv_label_set_text(id(home_therm_current_temp_value), "-.-°C");
            lv_obj_send_event(id(home_therm_current_temp_value), lvgl::lv_update_event, nullptr);
          } else {
            lv_label_set_text(id(home_therm_current_temp_value), str_sprintf("%.1f°C", id(${room_temperature_source}).state).c_str());
            lv_obj_send_event(id(home_therm_current_temp_value), lvgl::lv_update_event, nullptr);
          }
          id(update_home_thermostat_mode_ui).execute();
        }

- id: update_thermostat_mode_ui
  mode: restart
  then:
    - lambda: |-
        auto idx = id(thermostat_mode_select).active_index();
        bool internal_mode = idx.has_value() && idx.value() == 0;
        lv_obj_t* internal_rows[6] = {
          id(thermostat_row_default_heat),
          id(thermostat_row_default_cool),
          id(thermostat_row_heat_deadband),
          id(thermostat_row_heat_overrun),
          id(thermostat_row_cool_deadband),
          id(thermostat_row_cool_overrun)
        };
        for (int i = 0; i < 6; i++) {
          if (internal_mode) {
            lv_obj_clear_state(internal_rows[i], LV_STATE_DISABLED);
            lv_obj_set_style_opa(internal_rows[i], LV_OPA_COVER, LV_PART_MAIN);
          } else {
            lv_obj_add_state(internal_rows[i], LV_STATE_DISABLED);
            lv_obj_set_style_opa(internal_rows[i], LV_OPA_40, LV_PART_MAIN);
          }
        }
        if (!internal_mode) {
          lv_obj_clear_state(id(thermostat_row_off_delay), LV_STATE_DISABLED);
          lv_obj_set_style_opa(id(thermostat_row_off_delay), LV_OPA_COVER, LV_PART_MAIN);
          lv_obj_clear_state(id(set_therm_off_delay_dec_btn), LV_STATE_DISABLED);
          lv_obj_clear_state(id(set_therm_off_delay_inc_btn), LV_STATE_DISABLED);
          lv_obj_add_flag(id(set_therm_off_delay_dec_btn), LV_OBJ_FLAG_CLICKABLE);
          lv_obj_add_flag(id(set_therm_off_delay_inc_btn), LV_OBJ_FLAG_CLICKABLE);
        } else {
          lv_obj_add_state(id(thermostat_row_off_delay), LV_STATE_DISABLED);
          lv_obj_set_style_opa(id(thermostat_row_off_delay), LV_OPA_40, LV_PART_MAIN);
          lv_obj_add_state(id(set_therm_off_delay_dec_btn), LV_STATE_DISABLED);
          lv_obj_add_state(id(set_therm_off_delay_inc_btn), LV_STATE_DISABLED);
          lv_obj_clear_flag(id(set_therm_off_delay_dec_btn), LV_OBJ_FLAG_CLICKABLE);
          lv_obj_clear_flag(id(set_therm_off_delay_inc_btn), LV_OBJ_FLAG_CLICKABLE);
        }

- id: settings_select_tab
  # Refreshes the widgets of a settings category when its menu page is opened.
  mode: restart
  parameters:
    tab_index: int
  then:
    - lambda: |-
        if (tab_index == 0) {
          id(update_advanced_settings_ui).execute();
          id(update_control_temp_source_ui).execute();
          id(update_analytics_ui).execute();
          id(update_mixing_valves_ui).execute();
          id(update_flow_sensor_calibration_ui).execute();
          id(update_silent_mode_ui).execute();
        }
        if (tab_index == 1) {
          id(update_thermostat_settings_ui).execute();
          id(update_thermostat_mode_ui).execute();
        }
        if (tab_index == 2) {
          id(update_advanced_settings_ui).execute();
          id(update_pump_pid_ui).execute();
          lv_label_set_text_fmt(id(set_frost1_val), "%.1f°C", (double)id(frost_protection_stage_1_temp_ta).state);
          lv_label_set_text_fmt(id(set_frost2_ta_val), "%.1f°C", (double)id(frost_protection_stage_2_temp_ta).state);
          lv_label_set_text_fmt(id(set_frost2_tui_val), "%.1f°C", (double)id(frost_protection_stage_2_temp_tui).state);
        }
        if (tab_index == 3) {
          bool is_stooklijn = (id(heat_mode_select).current_option() == "Stooklijn");
          lv_obj_t* curve_widgets[6] = {
            id(set_heat_curve_title),
            id(set_heat_curve_chart_container),
            id(set_heat_curve_controls_container),
            id(set_heat_curve_z2_title),
            id(set_heat_curve_z2_chart_container),
            id(set_heat_curve_z2_controls_container)
          };
          for (auto *w : curve_widgets) {
            if (is_stooklijn) lv_obj_clear_flag(w, LV_OBJ_FLAG_HIDDEN);
            else lv_obj_add_flag(w, LV_OBJ_FLAG_HIDDEN);
          }
          id(update_manual_setpoint_ui).execute();
          id(update_heat_curve_chart).execute();
          id(update_heat_curve_z2_chart).execute();
          id(update_advanced_settings_ui).execute();
          id(update_emergency_mode_ui).execute();
        }
        if (tab_index == 4) {
          id(update_advanced_settings_ui).execute();
          id(update_cooling_allowed_ui).execute();
          id(update_manual_setpoint_ui).execute();
        }
        if (tab_index == 5) {
          id(update_dhw_schedule_ui).execute();
          id(update_legio_ui).execute();
        }
        if (tab_index == 6) {
          if (id(backup_heater_outside_block_temperature).has_state()) {
            static char buf[8];
            snprintf(buf, sizeof(buf), "%.0f°C", id(backup_heater_outside_block_temperature).state);
            lv_label_set_text(id(set_backup_block_temp_val), buf);
          }
        }
        if (tab_index == 7) {
          id(update_eebus_settings_ui).execute();
        }
        if (tab_index == 8) {
          id(wifi_scan_networks_if_empty).execute();
        }
        if (tab_index == 9) {
          id(update_advanced_settings_ui).execute();
        }

- id: service_select_tab
  # Refreshes the widgets of a service page when it is opened from the overview.
  mode: restart
  parameters:
    tab_index: int
  then:
    - lambda: |-
        id(update_service_mode_ui).execute();
        if (tab_index == 7) {
          id(update_service_diag_summary_ui).execute();
        }
        if (tab_index == 8) {
          id(update_service_errors_ui).execute();
        }
        if (tab_index == 9) {
          id(update_service_warnings_ui).execute();
        }

- id: nav_select_tab
  mode: restart
  parameters:
    tab_index: int
  then:
    - lambda: 'lv_obj_add_flag(id(page_graph), LV_OBJ_FLAG_HIDDEN);'
    - if:
        condition:
          lambda: 'return tab_index == 0;'
        then:
          - lambda: |-
              lv_obj_remove_flag(id(page_home), LV_OBJ_FLAG_HIDDEN);
              lv_obj_add_flag(id(page_thermostat), LV_OBJ_FLAG_HIDDEN);
              lv_obj_add_flag(id(page_service), LV_OBJ_FLAG_HIDDEN);
              lv_obj_add_flag(id(page_system), LV_OBJ_FLAG_HIDDEN);
              lv_obj_add_flag(id(page_settings), LV_OBJ_FLAG_HIDDEN);
              id(update_water_mode_temperature_display).execute();
              id(update_water_mode_efficiency_display).execute();
              id(update_home_pump_tile_state).execute();
              id(update_home_thermostat_mode_ui).execute();
              id(update_thermostat_settings_ui).execute();
        else:
          - if:
              condition:
                lambda: 'return tab_index == 1;'
              then:
                - lambda: |-
                    lv_obj_add_flag(id(page_home), LV_OBJ_FLAG_HIDDEN);
                    lv_obj_remove_flag(id(page_thermostat), LV_OBJ_FLAG_HIDDEN);
                    lv_obj_add_flag(id(page_service), LV_OBJ_FLAG_HIDDEN);
                    lv_obj_add_flag(id(page_system), LV_OBJ_FLAG_HIDDEN);
                    lv_obj_add_flag(id(page_settings), LV_OBJ_FLAG_HIDDEN);
                    id(update_thermostat_settings_ui).execute();
                    id(update_thermostat_mode_ui).execute();
                    id(update_home_thermostat_mode_ui).execute();
              else:
                - if:
                    condition:
                      lambda: 'return tab_index == 2;'
                    then:
                      - lambda: |-
                          lv_obj_add_flag(id(page_home), LV_OBJ_FLAG_HIDDEN);
                          lv_obj_add_flag(id(page_thermostat), LV_OBJ_FLAG_HIDDEN);
                          lv_obj_add_flag(id(page_service), LV_OBJ_FLAG_HIDDEN);
                          lv_obj_add_flag(id(page_system), LV_OBJ_FLAG_HIDDEN);
                          lv_obj_remove_flag(id(page_settings), LV_OBJ_FLAG_HIDDEN);
                          lv_menu_clear_history(id(settings_menu));
                          lv_menu_set_page(id(settings_menu), id(settings_overview_page));
                          id(setup_menu_header_ui).execute();
                          id(update_advanced_settings_ui).execute();
                          id(update_wifi_connected_summary_ui).execute();
                          id(update_manual_setpoint_ui).execute();
                          id(update_heat_curve_chart).execute();
                          id(update_heat_curve_z2_chart).execute();
                          id(update_legio_ui).execute();
                          id(update_dhw_schedule_ui).execute();
                          id(update_thermostat_settings_ui).execute();
                          id(update_pump_pid_ui).execute();
                          id(update_control_temp_source_ui).execute();
                          id(update_silent_mode_ui).execute();
                    else:
                      - if:
                          condition:
                            lambda: 'return tab_index == 3;'
                          then:
                            - lambda: |-
                                lv_obj_add_flag(id(page_home), LV_OBJ_FLAG_HIDDEN);
                                lv_obj_add_flag(id(page_thermostat), LV_OBJ_FLAG_HIDDEN);
                                lv_obj_remove_flag(id(page_service), LV_OBJ_FLAG_HIDDEN);
                                lv_obj_add_flag(id(page_system), LV_OBJ_FLAG_HIDDEN);
                                lv_obj_add_flag(id(page_settings), LV_OBJ_FLAG_HIDDEN);
                                lv_menu_clear_history(id(service_menu));
                                lv_menu_set_page(id(service_menu), id(service_overview_page));
                                id(setup_menu_header_ui).execute();
                                id(update_service_mode_ui).execute();
                                id(update_service_diag_summary_ui).execute();
                          else:
                            - if:
                                condition:
                                  lambda: 'return tab_index == 5;'
                                then:
                                  - lambda: |-
                                      lv_obj_add_flag(id(page_home), LV_OBJ_FLAG_HIDDEN);
                                      lv_obj_add_flag(id(page_thermostat), LV_OBJ_FLAG_HIDDEN);
                                      lv_obj_add_flag(id(page_service), LV_OBJ_FLAG_HIDDEN);
                                      lv_obj_add_flag(id(page_system), LV_OBJ_FLAG_HIDDEN);
                                      lv_obj_add_flag(id(page_settings), LV_OBJ_FLAG_HIDDEN);
                                      lv_obj_remove_flag(id(page_graph), LV_OBJ_FLAG_HIDDEN);
                                      openamber_graph::page().on_opened();
                                else:
                                  - lambda: |-
                                      lv_obj_add_flag(id(page_home), LV_OBJ_FLAG_HIDDEN);
                                      lv_obj_add_flag(id(page_thermostat), LV_OBJ_FLAG_HIDDEN);
                                      lv_obj_add_flag(id(page_service), LV_OBJ_FLAG_HIDDEN);
                                      lv_obj_remove_flag(id(page_system), LV_OBJ_FLAG_HIDDEN);
                                      lv_obj_remove_flag(id(service_updates_panel), LV_OBJ_FLAG_HIDDEN);
                                      lv_obj_add_flag(id(system_diagnostics_panel), LV_OBJ_FLAG_HIDDEN);
                                      lv_obj_add_flag(id(page_settings), LV_OBJ_FLAG_HIDDEN);
                                      id(update_system_diagnostics_ui).execute();
                                      id(update_firmware_ui).execute();

    - lambda: |-
        lv_obj_set_style_bg_opa(id(nav_home), (tab_index == 0 ? 100 : 0), LV_PART_MAIN);
        lv_obj_set_style_text_color(id(nav_home_icon), (lv_color_hex(tab_index == 0 ? 0xFFFFFF : 0xD1D5DB)), LV_PART_MAIN);
        lv_obj_set_style_text_color(id(nav_home_label), (lv_color_hex(tab_index == 0 ? 0xFFFFFF : 0xD1D5DB)), LV_PART_MAIN);
        lv_obj_set_style_bg_opa(id(nav_thermostat), (tab_index == 1 ? 100 : 0), LV_PART_MAIN);
        lv_obj_set_style_text_color(id(nav_thermostat_icon), (lv_color_hex(tab_index == 1 ? 0xFFFFFF : 0xD1D5DB)), LV_PART_MAIN);
        lv_obj_set_style_text_color(id(nav_thermostat_label), (lv_color_hex(tab_index == 1 ? 0xFFFFFF : 0xD1D5DB)), LV_PART_MAIN);
        lv_obj_set_style_bg_opa(id(nav_settings), (tab_index == 2 ? 100 : 0), LV_PART_MAIN);
        lv_obj_set_style_text_color(id(nav_settings_icon), (lv_color_hex(tab_index == 2 ? 0xFFFFFF : 0xD1D5DB)), LV_PART_MAIN);
        lv_obj_set_style_text_color(id(nav_settings_label), (lv_color_hex(tab_index == 2 ? 0xFFFFFF : 0xD1D5DB)), LV_PART_MAIN);
        lv_obj_set_style_bg_opa(id(nav_service), (tab_index == 3 ? 100 : 0), LV_PART_MAIN);
        lv_obj_set_style_text_color(id(nav_service_icon), (lv_color_hex(tab_index == 3 ? 0xFFFFFF : 0xD1D5DB)), LV_PART_MAIN);
        lv_obj_set_style_text_color(id(nav_service_label), (lv_color_hex(tab_index == 3 ? 0xFFFFFF : 0xD1D5DB)), LV_PART_MAIN);
        lv_obj_set_style_bg_opa(id(nav_system), (tab_index == 4 ? 100 : 0), LV_PART_MAIN);
        lv_obj_set_style_text_color(id(nav_system_icon), (lv_color_hex(tab_index == 4 ? 0xFFFFFF : 0xD1D5DB)), LV_PART_MAIN);
        lv_obj_set_style_text_color(id(nav_system_label), (lv_color_hex(tab_index == 4 ? 0xFFFFFF : 0xD1D5DB)), LV_PART_MAIN);
        lv_obj_set_style_bg_opa(id(nav_graph), (tab_index == 5 ? 100 : 0), LV_PART_MAIN);
        lv_obj_set_style_text_color(id(nav_graph_icon), (lv_color_hex(tab_index == 5 ? 0xFFFFFF : 0xD1D5DB)), LV_PART_MAIN);
        lv_obj_set_style_text_color(id(nav_graph_label), (lv_color_hex(tab_index == 5 ? 0xFFFFFF : 0xD1D5DB)), LV_PART_MAIN);

# Called by the fixed (longer) LVGL idle timeout: bring the display back to
# the home screen so a forgotten settings/service page doesn't stay open.
- id: display_return_home
  mode: restart
  then:
    - if:
        condition:
          lambda: 'return lv_obj_has_flag(id(page_home), LV_OBJ_FLAG_HIDDEN);'
        then:
          - script.execute:
              id: nav_select_tab
              tab_index: 0

- id: update_home_thermostat_visibility
  mode: restart
  then:
    - lambda: |-
        if (id(thermostat_mode_select).current_option() == "Intern") {
          lv_obj_remove_flag(id(nav_sep_thermostat), LV_OBJ_FLAG_HIDDEN);
          lv_obj_remove_flag(id(nav_thermostat), LV_OBJ_FLAG_HIDDEN);
          lv_obj_remove_flag(id(home_thermostat_controls_panel), LV_OBJ_FLAG_HIDDEN);
        } else {
          if (!lv_obj_has_flag(id(page_thermostat), LV_OBJ_FLAG_HIDDEN)) {
            id(nav_select_tab).execute(0);
          }
          lv_obj_add_flag(id(nav_sep_thermostat), LV_OBJ_FLAG_HIDDEN);
          lv_obj_add_flag(id(nav_thermostat), LV_OBJ_FLAG_HIDDEN);
          lv_obj_add_flag(id(page_thermostat), LV_OBJ_FLAG_HIDDEN);
          lv_obj_add_flag(id(home_thermostat_controls_panel), LV_OBJ_FLAG_HIDDEN);
        }

- id: !extend update_home_thermostat_mode_ui
  then:
    - script.execute: update_home_thermostat_visibility
    - lambda: |-
        // Thermostat mode tiles: the active mode gets a tinted tile, a colored border and icon circle.
        struct ModeTile {
          lv_obj_t *btn, *icon, *lbl;
          climate::ClimateMode mode;
          uint32_t bg, border, icon_bg, fg;
        };
        const ModeTile tiles[] = {
          {id(home_therm_mode_heat_btn), id(home_therm_mode_heat_icon), id(home_therm_mode_heat_lbl),
           climate::CLIMATE_MODE_HEAT, 0xFFF7ED, 0xF97316, 0xFFEDD5, 0x9A3412},
          {id(home_therm_mode_cool_btn), id(home_therm_mode_cool_icon), id(home_therm_mode_cool_lbl),
           climate::CLIMATE_MODE_COOL, 0xF0F9FF, 0x0284C7, 0xE0F2FE, 0x0C4A6E},
          {id(home_therm_mode_off_btn), id(home_therm_mode_off_icon), id(home_therm_mode_off_lbl),
           climate::CLIMATE_MODE_OFF, 0xF1F5F9, 0x475569, 0xE2E8F0, 0x0F172A},
        };
        const auto mode = id(climate_controller).mode;
        for (const auto &t : tiles) {
          const bool active = mode == t.mode;
          lv_obj_set_style_bg_color(t.btn, lv_color_hex(active ? t.bg : 0xFFFFFF), LV_PART_MAIN);
          lv_obj_set_style_border_color(t.btn, lv_color_hex(active ? t.border : 0xD5DEE9), LV_PART_MAIN);
          lv_obj_set_style_border_width(t.btn, active ? 2 : 1, LV_PART_MAIN);
          lv_obj_set_style_bg_color(t.icon, lv_color_hex(active ? t.icon_bg : 0xE6F1FB), LV_PART_MAIN);
          lv_obj_set_style_text_color(t.icon, lv_color_hex(active ? t.fg : 0x185FA5), LV_PART_MAIN);
          lv_obj_set_style_text_color(t.lbl, lv_color_hex(active ? t.fg : 0x1F2933), LV_PART_MAIN);
        }

- id: update_silent_mode_ui
  mode: restart
  then:
    - lvgl.widget.update:
        id: set_silent_mode_switch_ui
        state:
          checked: !lambda 'return id(silent_mode_enabled_switch).state;'
    - lvgl.label.update:
        id: set_silent_mode_start_time_val
        text: !lambda |-
          if (id(silent_mode_start_time).has_state()) {
            char buf[8];
            snprintf(buf, sizeof(buf), "%02d:%02d", id(silent_mode_start_time).hour, id(silent_mode_start_time).minute);
            return std::string(buf);
          }
          return std::string("23:00");
    - lvgl.label.update:
        id: set_silent_mode_end_time_val
        text: !lambda |-
          if (id(silent_mode_end_time).has_state()) {
            char buf[8];
            snprintf(buf, sizeof(buf), "%02d:%02d", id(silent_mode_end_time).hour, id(silent_mode_end_time).minute);
            return std::string(buf);
          }
          return std::string("07:00");

    - lvgl.label.update:
        id: set_silent_mode_start_time_lbl
        text_color: !lambda |-
          return id(silent_mode_enabled_switch).state ? lv_color_hex(0x1F2933) : lv_color_hex(0x9CA3AF);
    - lvgl.label.update:
        id: set_silent_mode_start_time_sub
        text_color: !lambda |-
          return id(silent_mode_enabled_switch).state ? lv_color_hex(0x6B7280) : lv_color_hex(0x9CA3AF);
    - lvgl.label.update:
        id: set_silent_mode_start_time_val
        text_color: !lambda |-
          return id(silent_mode_enabled_switch).state ? lv_color_hex(0x1F2933) : lv_color_hex(0x9CA3AF);
    - lvgl.widget.update:
        id: set_silent_mode_start_time_dec
        bg_color: !lambda |-
