          if (id(silent_mode_start_time).has_state()) {
            char buf[8];
            snprintf(buf, sizeof(buf), "%02d:%02d", id(silent_mode_start_time).hour, id(silent_mode_start_time).minute);
            return std::string(buf);
          }
