# ══════════════════════════════════════════════════════════════
# UI helper scripts used by event-driven bindings
# ══════════════════════════════════════════════════════════════

- id: !extend dump_eeprom_parameters_ui_disable
  then:
    - lvgl.widget.disable: { id: service_eeprom_dump_button }

- id: !extend dump_eeprom_parameters_ui_enable
  then:
    - lvgl.widget.enable: { id: service_eeprom_dump_button }

- id: update_thermostat_settings_ui
  mode: restart
  then:
    - if:
        condition:
          lambda: 'return !lv_obj_has_flag(id(page_settings), LV_OBJ_FLAG_HIDDEN) || !lv_obj_has_flag(id(page_thermostat), LV_OBJ_FLAG_HIDDEN);'
        then:
          - lvgl.label.update:
              id: set_therm_def_heat_val
              text:
                format: "%.1f°C"
                args: ['id(thermostat_default_heat_setpoint).state']
          - lvgl.label.update:
              id: set_therm_def_cool_val
              text:
                format: "%.1f°C"
                args: ['id(thermostat_default_cool_setpoint).state']
          - lvgl.label.update:
              id: set_therm_heat_db_val
              text:
                format: "%.1f°C"
                args: ['id(thermostat_heat_deadband).state']
          - lvgl.label.update:
              id: set_therm_heat_or_val
              text:
                format: "%.1f°C"
                args: ['id(thermostat_heat_overrun).state']
          - lvgl.label.update:
              id: set_therm_cool_db_val
              text:
                format: "%.1f°C"
                args: ['id(thermostat_cool_deadband).state']
          - lvgl.label.update:
              id: set_therm_cool_or_val
              text:
                format: "%.1f°C"
                args: ['id(thermostat_cool_overrun).state']
          - lvgl.label.update:
              id: set_therm_off_delay_val
              text:
                format: "%.0f min"
                args: ['id(thermostat_off_delay).state']
    - if:
        condition:
          lambda: 'return !lv_obj_has_flag(id(page_home), LV_OBJ_FLAG_HIDDEN);'
        then:
          - if:
              condition:
                lambda: 'return id(climate_controller).mode == climate::CLIMATE_MODE_COOL;'
              then:
                - lvgl.label.update:
                    id: home_therm_setpoint_value
                    text:
                      format: "%.1f°C"
                      args: ['id(climate_controller).target_temperature_high']
              else:
                - lvgl.label.update:
                    id: home_therm_setpoint_value
                    text:
                      format: "%.1f°C"
                      args: ['id(climate_controller).target_temperature_low']
          - if:
              condition:
                lambda: 'return isnan(id(room_temperature).state);'
              then:
                - lvgl.label.update:
                    id: home_therm_current_temp_value
                    text: "-.-°C"
              else:
                - lvgl.label.update:
                    id: home_therm_current_temp_value
                    text:
                      format: "%.1f°C"
                      args: ['id(room_temperature).state']
          - script.execute: update_home_thermostat_mode_ui

- id: update_thermostat_mode_ui
  mode: restart
  then:
    - lambda: |-
        auto idx = id(thermostat_mode_select).active_index();
        bool internal_mode = idx.has_value() && idx.value() == 0;
        lv_obj_t* internal_rows[6] = {
          id(thermostat_row_default_heat),
          id(thermostat_row_default_cool),
          id(thermostat_row_heat_deadband),
          id(thermostat_row_heat_overrun),
          id(thermostat_row_cool_deadband),
          id(thermostat_row_cool_overrun)
        };
        for (int i = 0; i < 6; i++) {
          if (internal_mode) {
            lv_obj_clear_state(internal_rows[i], LV_STATE_DISABLED);
            lv_obj_set_style_opa(internal_rows[i], LV_OPA_COVER, LV_PART_MAIN);
          } else {
            lv_obj_add_state(internal_rows[i], LV_STATE_DISABLED);
            lv_obj_set_style_opa(internal_rows[i], LV_OPA_40, LV_PART_MAIN);
          }
        }
        if (!internal_mode) {
          lv_obj_clear_state(id(thermostat_row_off_delay), LV_STATE_DISABLED);
          lv_obj_set_style_opa(id(thermostat_row_off_delay), LV_OPA_COVER, LV_PART_MAIN);
          lv_obj_clear_state(id(set_therm_off_delay_dec_btn), LV_STATE_DISABLED);
          lv_obj_clear_state(id(set_therm_off_delay_inc_btn), LV_STATE_DISABLED);
          lv_obj_add_flag(id(set_therm_off_delay_dec_btn), LV_OBJ_FLAG_CLICKABLE);
          lv_obj_add_flag(id(set_therm_off_delay_inc_btn), LV_OBJ_FLAG_CLICKABLE);
        } else {
          lv_obj_add_state(id(thermostat_row_off_delay), LV_STATE_DISABLED);
          lv_obj_set_style_opa(id(thermostat_row_off_delay), LV_OPA_40, LV_PART_MAIN);
          lv_obj_add_state(id(set_therm_off_delay_dec_btn), LV_STATE_DISABLED);
          lv_obj_add_state(id(set_therm_off_delay_inc_btn), LV_STATE_DISABLED);
          lv_obj_clear_flag(id(set_therm_off_delay_dec_btn), LV_OBJ_FLAG_CLICKABLE);
          lv_obj_clear_flag(id(set_therm_off_delay_inc_btn), LV_OBJ_FLAG_CLICKABLE);
        }

- id: thermostat_select_tab
  mode: restart
  parameters:
    tab_index: int
  then:
    - lambda: |-
        lv_obj_add_flag(id(general_system_pager), LV_OBJ_FLAG_HIDDEN);
        lv_obj_add_flag(id(sensor_calibration_pager), LV_OBJ_FLAG_HIDDEN);
        lv_obj_add_flag(id(pump_p0_pid_pager), LV_OBJ_FLAG_HIDDEN);
        lv_obj_add_flag(id(advanced_pid_pager), LV_OBJ_FLAG_HIDDEN);
        lv_obj_add_flag(id(advanced_defrost_pager), LV_OBJ_FLAG_HIDDEN);
        lv_obj_add_flag(id(advanced_fan_pager), LV_OBJ_FLAG_HIDDEN);
        lv_obj_add_flag(id(mengventielen_pager), LV_OBJ_FLAG_HIDDEN);
        lv_obj_add_flag(id(eebus_pager), LV_OBJ_FLAG_HIDDEN);

        lv_obj_t* panels[3] = {
          id(panel_thermostat_page_setpoint),
          id(panel_thermostat_page_verwarmen),
          id(panel_thermostat_page_koelen)
        };
        lv_obj_t* tabs[3] = {
          id(thermostat_stab_algemeen),
          id(thermostat_stab_verwarmen),
          id(thermostat_stab_koelen)
        };
        lv_obj_t* labels[3] = {
          id(thermostat_stab_algemeen_lbl),
          id(thermostat_stab_verwarmen_lbl),
          id(thermostat_stab_koelen_lbl)
        };
        for (int i = 0; i < 3; i++) {
          if (i == tab_index) {
            lv_obj_clear_flag(panels[i], LV_OBJ_FLAG_HIDDEN);
            lv_obj_set_style_bg_color(tabs[i], lv_color_hex(0x1F3B68), LV_PART_MAIN);
            lv_obj_set_style_text_color(labels[i], lv_color_hex(0xFFFFFF), LV_PART_MAIN);
          } else {
            lv_obj_add_flag(panels[i], LV_OBJ_FLAG_HIDDEN);
            lv_obj_set_style_bg_color(tabs[i], lv_color_hex(0xCBD5E1), LV_PART_MAIN);
            lv_obj_set_style_text_color(labels[i], lv_color_hex(0x4B5563), LV_PART_MAIN);
          }
        }
    - script.execute: update_thermostat_settings_ui
    - script.execute: update_thermostat_mode_ui


- id: settings_select_tab
  mode: restart
  parameters:
    tab_index: int
  then:
    - lambda: |-
        lv_obj_t* panels[10] = {
          id(panel_general),
          id(panel_thermostat),
          id(panel_pump),
          id(panel_heating),
          id(panel_cooling),
          id(panel_dhw),
          id(panel_bijverwarmen),
          id(panel_smartgrid),
          id(panel_wifi),
          id(panel_advanced)
        };
        lv_obj_t* tabs[10] = {
          id(stab_general),
          id(stab_thermostat),
          id(stab_pump),
          id(stab_heating),
          id(stab_cooling),
          id(stab_dhw),
          id(stab_bijverwarmen),
          id(stab_smartgrid),
          id(stab_wifi),
          id(stab_advanced)
        };
        lv_obj_t* labels[10] = {
          id(stab_general_lbl),
          id(stab_thermostat_lbl),
          id(stab_pump_lbl),
          id(stab_heating_lbl),
          id(stab_cooling_lbl),
          id(stab_dhw_lbl),
          id(stab_bijverwarmen_lbl),
          id(stab_smartgrid_lbl),
          id(stab_wifi_lbl),
          id(stab_advanced_lbl)
        };

        lv_obj_add_flag(id(general_system_pager), LV_OBJ_FLAG_HIDDEN);
        lv_obj_add_flag(id(sensor_calibration_pager), LV_OBJ_FLAG_HIDDEN);
        lv_obj_add_flag(id(pump_p0_pid_pager), LV_OBJ_FLAG_HIDDEN);
        lv_obj_add_flag(id(advanced_pid_pager), LV_OBJ_FLAG_HIDDEN);
        lv_obj_add_flag(id(advanced_defrost_pager), LV_OBJ_FLAG_HIDDEN);
        lv_obj_add_flag(id(advanced_fan_pager), LV_OBJ_FLAG_HIDDEN);
        lv_obj_add_flag(id(mengventielen_pager), LV_OBJ_FLAG_HIDDEN);
        lv_obj_add_flag(id(eebus_pager), LV_OBJ_FLAG_HIDDEN);

        for (int i = 0; i < 10; i++) {
          if (i == tab_index) {
            lv_obj_clear_flag(panels[i], LV_OBJ_FLAG_HIDDEN);
            lv_obj_set_style_bg_color(tabs[i], lv_color_hex(0x1F3B68), LV_PART_MAIN);
            lv_obj_set_style_text_color(labels[i], lv_color_hex(0xFFFFFF), LV_PART_MAIN);
          } else {
            lv_obj_add_flag(panels[i], LV_OBJ_FLAG_HIDDEN);
            lv_obj_set_style_bg_color(tabs[i], lv_color_hex(0xE8ECF1), LV_PART_MAIN);
            lv_obj_set_style_text_color(labels[i], lv_color_hex(0x4B5563), LV_PART_MAIN);
          }
        }
    - if:
        condition:
          lambda: 'return tab_index == 0;'
        then:
          - script.execute:
              id: general_select_tab
              tab_index: 0
          - script.execute: update_advanced_settings_ui
          - script.execute: update_silent_mode_ui
    - if:
        condition:
          lambda: 'return tab_index == 1;'
        then:
          - script.execute: update_thermostat_settings_ui
          - script.execute: update_thermostat_mode_ui
          - script.execute:
              id: thermostat_select_tab
              tab_index: 0
    - if:
        condition:
          lambda: 'return tab_index == 2;'
        then:
          - script.execute:
              id: pump_select_tab
              tab_index: 0
          - script.execute: update_advanced_settings_ui
    - if:
        condition:
          lambda: 'return tab_index == 3;'
        then:
          - script.execute:
              id: heating_select_tab
              tab_index: 0
          - script.execute: update_heat_curve_chart
          - script.execute: update_advanced_settings_ui
    - if:
        condition:
          lambda: 'return tab_index == 4;'
        then:
          - script.execute:
              id: cooling_select_tab
              tab_index: 0
          - script.execute: update_advanced_settings_ui
    - if:
        condition:
          lambda: 'return tab_index == 5;'
        then:
          - script.execute:
              id: dhw_select_tab
              tab_index: 0
    - if:
        condition:
          lambda: 'return tab_index == 6;'
        then:
          - script.execute:
              id: bijverwarmen_select_tab
              tab_index: 0
    - if:
        condition:
          lambda: 'return tab_index == 7;'
        then:
          - script.execute:
              id: energie_select_tab
              tab_index: 0
          - script.execute: update_eebus_settings_ui
    - if:
        condition:
          lambda: 'return tab_index == 8;'
        then:
          - script.execute: wifi_scan_networks_if_empty
    - if:
        condition:
          lambda: 'return tab_index == 9;'
        then:
          - script.execute:
              id: advanced_select_tab
              tab_index: 0

- id: service_select_tab
  mode: restart
  parameters:
    tab_index: int
  then:
    - lambda: |-
        // Hide all main panels
        lv_obj_add_flag(id(service_maintenance_panel), LV_OBJ_FLAG_HIDDEN);
        lv_obj_add_flag(id(service_sensors_panel), LV_OBJ_FLAG_HIDDEN);
        lv_obj_add_flag(id(service_errors_panel), LV_OBJ_FLAG_HIDDEN);
        lv_obj_add_flag(id(service_warnings_panel), LV_OBJ_FLAG_HIDDEN);
        lv_obj_add_flag(id(service_eeprom_panel), LV_OBJ_FLAG_HIDDEN);

        // Hide all maintenance subpanels
        lv_obj_add_flag(id(service_mpanel_general), LV_OBJ_FLAG_HIDDEN);
        lv_obj_add_flag(id(service_mpanel_compressor), LV_OBJ_FLAG_HIDDEN);
        lv_obj_add_flag(id(service_mpanel_pumps), LV_OBJ_FLAG_HIDDEN);
        lv_obj_add_flag(id(service_mpanel_valve), LV_OBJ_FLAG_HIDDEN);
        lv_obj_add_flag(id(service_mpanel_backup), LV_OBJ_FLAG_HIDDEN);

        if (tab_index == 0) {
          lv_obj_clear_flag(id(service_maintenance_panel), LV_OBJ_FLAG_HIDDEN);
          lv_obj_clear_flag(id(service_mpanel_general), LV_OBJ_FLAG_HIDDEN);
          lv_obj_clear_flag(id(service_maintenance_header), LV_OBJ_FLAG_HIDDEN);
          lv_obj_clear_flag(id(service_maintenance_title), LV_OBJ_FLAG_HIDDEN);
          lv_obj_clear_flag(id(service_maintenance_state), LV_OBJ_FLAG_HIDDEN);
          lv_obj_clear_flag(id(set_service_mode_switch_ui), LV_OBJ_FLAG_HIDDEN);
          lv_obj_clear_flag(id(service_maintenance_lock_hint), LV_OBJ_FLAG_HIDDEN);
          lv_obj_set_y(id(service_maintenance_layout), 112);
          lv_obj_set_height(id(service_maintenance_layout), lv_pct(72));
        } else if (tab_index >= 1 && tab_index <= 4) {
          lv_obj_clear_flag(id(service_maintenance_panel), LV_OBJ_FLAG_HIDDEN);
          lv_obj_add_flag(id(service_maintenance_header), LV_OBJ_FLAG_HIDDEN);
          lv_obj_add_flag(id(service_maintenance_title), LV_OBJ_FLAG_HIDDEN);
          lv_obj_add_flag(id(service_maintenance_state), LV_OBJ_FLAG_HIDDEN);
          lv_obj_add_flag(id(set_service_mode_switch_ui), LV_OBJ_FLAG_HIDDEN);
          lv_obj_add_flag(id(service_maintenance_lock_hint), LV_OBJ_FLAG_HIDDEN);
          lv_obj_set_y(id(service_maintenance_layout), 0);
          lv_obj_set_height(id(service_maintenance_layout), lv_pct(100));
          if (tab_index == 1) lv_obj_clear_flag(id(service_mpanel_compressor), LV_OBJ_FLAG_HIDDEN);
          else if (tab_index == 2) lv_obj_clear_flag(id(service_mpanel_pumps), LV_OBJ_FLAG_HIDDEN);
          else if (tab_index == 3) lv_obj_clear_flag(id(service_mpanel_valve), LV_OBJ_FLAG_HIDDEN);
          else if (tab_index == 4) lv_obj_clear_flag(id(service_mpanel_backup), LV_OBJ_FLAG_HIDDEN);
        } else if (tab_index == 5) {
          lv_obj_clear_flag(id(service_eeprom_panel), LV_OBJ_FLAG_HIDDEN);
          lv_obj_add_flag(id(service_maintenance_header), LV_OBJ_FLAG_HIDDEN);
          lv_obj_add_flag(id(service_maintenance_title), LV_OBJ_FLAG_HIDDEN);
          lv_obj_add_flag(id(service_maintenance_state), LV_OBJ_FLAG_HIDDEN);
          lv_obj_add_flag(id(set_service_mode_switch_ui), LV_OBJ_FLAG_HIDDEN);
          lv_obj_set_y(id(service_maintenance_layout), 0);
          lv_obj_set_height(id(service_maintenance_layout), lv_pct(100));
        } else if (tab_index == 6) {
          lv_obj_clear_flag(id(service_sensors_panel), LV_OBJ_FLAG_HIDDEN);
        } else if (tab_index == 7) {
          lv_obj_clear_flag(id(service_errors_panel), LV_OBJ_FLAG_HIDDEN);
        } else if (tab_index == 8) {
          lv_obj_clear_flag(id(service_warnings_panel), LV_OBJ_FLAG_HIDDEN);
        }
    - script.execute: update_service_mode_ui
    - if:
        condition:
          lambda: 'return tab_index == 6;'
        then:
          - script.execute:
              id: service_sensors_select_page
              page: 1
          - script.execute: update_service_diag_summary_ui
    - if:
        condition:
          lambda: 'return tab_index == 7;'
        then:
          - script.execute: update_service_errors_ui
    - if:
        condition:
          lambda: 'return tab_index == 8;'
        then:
          - script.execute: update_service_warnings_ui

- id: service_sensors_select_page
  mode: restart
  parameters:
    page: int
  then:
    - if:
        condition:
          lambda: 'return page == 1;'
        then:
          - lvgl.widget.show: { id: service_sensors_page_1 }
          - lvgl.widget.hide: { id: service_sensors_page_2 }
          - lvgl.widget.hide: { id: service_sensors_page_3 }
          - lvgl.widget.hide: { id: service_sensors_page_4 }
          - lvgl.widget.hide: { id: service_sensors_page_5 }
          - lvgl.widget.update: { id: service_sensors_page_prev_button, bg_color: 0xCBD5E1 }
          - lvgl.label.update: { id: service_sensors_page_prev_button_lbl, text_color: 0x4B5563 }
          - lvgl.widget.update: { id: service_sensors_page_next_button, bg_color: 0x1F3B68 }
          - lvgl.label.update: { id: service_sensors_page_next_button_lbl, text_color: 0xFFFFFF }
          - lvgl.label.update: { id: service_sensors_page_indicator, text: "Pagina 1 / 5" }
        else:
          - if:
              condition:
                lambda: 'return page == 2;'
              then:
                - lvgl.widget.hide: { id: service_sensors_page_1 }
                - lvgl.widget.show: { id: service_sensors_page_2 }
                - lvgl.widget.hide: { id: service_sensors_page_3 }
                - lvgl.widget.hide: { id: service_sensors_page_4 }
                - lvgl.widget.hide: { id: service_sensors_page_5 }
                - lvgl.widget.update: { id: service_sensors_page_prev_button, bg_color: 0x1F3B68 }
                - lvgl.label.update: { id: service_sensors_page_prev_button_lbl, text_color: 0xFFFFFF }
                - lvgl.widget.update: { id: service_sensors_page_next_button, bg_color: 0x1F3B68 }
                - lvgl.label.update: { id: service_sensors_page_next_button_lbl, text_color: 0xFFFFFF }
                - lvgl.label.update: { id: service_sensors_page_indicator, text: "Pagina 2 / 5" }
              else:
                - if:
                    condition:
                      lambda: 'return page == 3;'
                    then:
                      - lvgl.widget.hide: { id: service_sensors_page_1 }
                      - lvgl.widget.hide: { id: service_sensors_page_2 }
                      - lvgl.widget.show: { id: service_sensors_page_3 }
                      - lvgl.widget.hide: { id: service_sensors_page_4 }
                      - lvgl.widget.hide: { id: service_sensors_page_5 }
                      - lvgl.widget.update: { id: service_sensors_page_prev_button, bg_color: 0x1F3B68 }
                      - lvgl.label.update: { id: service_sensors_page_prev_button_lbl, text_color: 0xFFFFFF }
                      - lvgl.widget.update: { id: service_sensors_page_next_button, bg_color: 0x1F3B68 }
                      - lvgl.label.update: { id: service_sensors_page_next_button_lbl, text_color: 0xFFFFFF }
                      - lvgl.label.update: { id: service_sensors_page_indicator, text: "Pagina 3 / 5" }
                    else:
                      - if:
                          condition:
                            lambda: 'return page == 4;'
                          then:
                            - lvgl.widget.hide: { id: service_sensors_page_1 }
                            - lvgl.widget.hide: { id: service_sensors_page_2 }
                            - lvgl.widget.hide: { id: service_sensors_page_3 }
                            - lvgl.widget.show: { id: service_sensors_page_4 }
                            - lvgl.widget.hide: { id: service_sensors_page_5 }
                            - lvgl.widget.update: { id: service_sensors_page_prev_button, bg_color: 0x1F3B68 }
                            - lvgl.label.update: { id: service_sensors_page_prev_button_lbl, text_color: 0xFFFFFF }
                            - lvgl.widget.update: { id: service_sensors_page_next_button, bg_color: 0x1F3B68 }
                            - lvgl.label.update: { id: service_sensors_page_next_button_lbl, text_color: 0xFFFFFF }
                            - lvgl.label.update: { id: service_sensors_page_indicator, text: "Pagina 4 / 5" }
                          else:
                            - lvgl.widget.hide: { id: service_sensors_page_1 }
                            - lvgl.widget.hide: { id: service_sensors_page_2 }
                            - lvgl.widget.hide: { id: service_sensors_page_3 }
                            - lvgl.widget.hide: { id: service_sensors_page_4 }
                            - lvgl.widget.show: { id: service_sensors_page_5 }
                            - lvgl.widget.update: { id: service_sensors_page_prev_button, bg_color: 0x1F3B68 }
                            - lvgl.label.update: { id: service_sensors_page_prev_button_lbl, text_color: 0xFFFFFF }
                            - lvgl.widget.update: { id: service_sensors_page_next_button, bg_color: 0xCBD5E1 }
                            - lvgl.label.update: { id: service_sensors_page_next_button_lbl, text_color: 0x4B5563 }
                            - lvgl.label.update: { id: service_sensors_page_indicator, text: "Pagina 5 / 5" }

- id: service_sensors_prev_page
  mode: restart
  then:
    - if:
        condition:
          lambda: 'return !lv_obj_has_flag(id(service_sensors_page_5), LV_OBJ_FLAG_HIDDEN);'
        then:
          - script.execute:
              id: service_sensors_select_page
              page: 4
        else:
          - if:
              condition:
                lambda: 'return !lv_obj_has_flag(id(service_sensors_page_4), LV_OBJ_FLAG_HIDDEN);'
              then:
                - script.execute:
                    id: service_sensors_select_page
                    page: 3
              else:
                - if:
                    condition:
                      lambda: 'return !lv_obj_has_flag(id(service_sensors_page_3), LV_OBJ_FLAG_HIDDEN);'
                    then:
                      - script.execute:
                          id: service_sensors_select_page
                          page: 2
                    else:
                      - if:
                          condition:
                            lambda: 'return !lv_obj_has_flag(id(service_sensors_page_2), LV_OBJ_FLAG_HIDDEN);'
                          then:
                            - script.execute:
                                id: service_sensors_select_page
                                page: 1

- id: service_sensors_next_page
  mode: restart
  then:
    - if:
        condition:
          lambda: 'return !lv_obj_has_flag(id(service_sensors_page_1), LV_OBJ_FLAG_HIDDEN);'
        then:
          - script.execute:
              id: service_sensors_select_page
              page: 2
        else:
          - if:
              condition:
                lambda: 'return !lv_obj_has_flag(id(service_sensors_page_2), LV_OBJ_FLAG_HIDDEN);'
              then:
                - script.execute:
                    id: service_sensors_select_page
                    page: 3
              else:
                - if:
                    condition:
                      lambda: 'return !lv_obj_has_flag(id(service_sensors_page_3), LV_OBJ_FLAG_HIDDEN);'
                    then:
                      - script.execute:
                          id: service_sensors_select_page
                          page: 4
                    else:
                      - if:
