            lv_table_set_cell_value(dm, 2, 1, id(cool_demand_active_sensor).state ? oa_tr("AAN") : oa_tr("UIT"));
            lv_table_set_cell_value(dm, 3, 1, id(external_heat_demand_wired).state ? oa_tr("AAN") : oa_tr("UIT"));
