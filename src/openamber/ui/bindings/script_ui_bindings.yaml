        lv_obj_set_style_text_color(id(set_dhw_start_time_lbl), (id(dhw_schedule_enabled_switch).state ? lv_color_hex(0x1F2933) : lv_color_hex(0x9CA3AF)), LV_PART_MAIN);
        lv_obj_set_style_text_color(id(set_dhw_start_time_val), (id(dhw_schedule_enabled_switch).state ? lv_color_hex(0x1F2933) : lv_color_hex(0x9CA3AF)), LV_PART_MAIN);
        lv_obj_set_style_bg_color(id(set_dhw_start_time_dec), (id(dhw_schedule_enabled_switch).state ? lv_color_hex(0x1F3B68) : lv_color_hex(0xE5E7EB)), LV_PART_MAIN);
        lv_obj_set_style_text_color(id(set_dhw_start_time_dec_lbl), (id(dhw_schedule_enabled_switch).state ? lv_color_hex(0xFFFFFF) : lv_color_hex(0x9CA3AF)), LV_PART_MAIN);
        lv_obj_set_style_bg_color(id(set_dhw_start_time_inc), (id(dhw_schedule_enabled_switch).state ? lv_color_hex(0x1F3B68) : lv_color_hex(0xE5E7EB)), LV_PART_MAIN);
        lv_obj_set_style_text_color(id(set_dhw_start_time_inc_lbl), (id(dhw_schedule_enabled_switch).state ? lv_color_hex(0xFFFFFF) : lv_color_hex(0x9CA3AF)), LV_PART_MAIN);
        lv_obj_set_style_text_color(id(set_dhw_end_time_lbl), (id(dhw_schedule_enabled_switch).state ? lv_color_hex(0x1F2933) : lv_color_hex(0x9CA3AF)), LV_PART_MAIN);
        lv_obj_set_style_text_color(id(set_dhw_end_time_val), (id(dhw_schedule_enabled_switch).state ? lv_color_hex(0x1F2933) : lv_color_hex(0x9CA3AF)), LV_PART_MAIN);
        lv_obj_set_style_bg_color(id(set_dhw_end_time_dec), (id(dhw_schedule_enabled_switch).state ? lv_color_hex(0x1F3B68) : lv_color_hex(0xE5E7EB)), LV_PART_MAIN);
        lv_obj_set_style_text_color(id(set_dhw_end_time_dec_lbl), (id(dhw_schedule_enabled_switch).state ? lv_color_hex(0xFFFFFF) : lv_color_hex(0x9CA3AF)), LV_PART_MAIN);
        lv_obj_set_style_bg_color(id(set_dhw_end_time_inc), (id(dhw_schedule_enabled_switch).state ? lv_color_hex(0x1F3B68) : lv_color_hex(0xE5E7EB)), LV_PART_MAIN);
        lv_obj_set_style_text_color(id(set_dhw_end_time_inc_lbl), (id(dhw_schedule_enabled_switch).state ? lv_color_hex(0xFFFFFF) : lv_color_hex(0x9CA3AF)), LV_PART_MAIN);

- id: wifi_scan_networks
  then:
    - lambda: |-
        const char *current_options = lv_dropdown_get_options(id(wifi_network_dd)->obj);
        if (current_options == nullptr || std::string(current_options) != "Zoeken...") {
          lv_dropdown_set_options(id(wifi_network_dd)->obj, "Zoeken...");
        }
    - lambda: |-
        #ifdef USE_WIFI
        wifi::global_wifi_component->start_scanning();
        #endif

- id: wifi_scan_networks_if_empty
  then:
    - lambda: |-
        uint16_t count = lv_dropdown_get_option_cnt(id(wifi_network_dd)->obj);
        if (count <= 1) {
          const char *current_options = lv_dropdown_get_options(id(wifi_network_dd)->obj);
          if (current_options == nullptr || std::string(current_options) != "Zoeken...") {
            lv_dropdown_set_options(id(wifi_network_dd)->obj, "Zoeken...");
          }
          #ifdef USE_WIFI
          wifi::global_wifi_component->start_scanning();
          #endif
        }

- id: wifi_network_dropdown_changed
  then:
    - lambda: |-
        char buf[64];
        lv_dropdown_get_selected_str(id(wifi_network_dd)->obj, buf, sizeof(buf));
        if (strcmp(buf, "Handmatig...") == 0) {
          lv_obj_clear_flag(id(wifi_hidden_ssid_section), LV_OBJ_FLAG_HIDDEN);
        } else {
          lv_obj_add_flag(id(wifi_hidden_ssid_section), LV_OBJ_FLAG_HIDDEN);
        }

- id: wifi_password_visibility_toggle
  then:
    - lambda: |-
        bool current = lv_textarea_get_password_mode(id(wifi_password_ta));
        lv_textarea_set_password_mode(id(wifi_password_ta), !current);
        lv_label_set_text(id(wifi_password_toggle_label), current ? "\U000F0208" : "\U000F0209");

- id: wifi_focus_text_input
  parameters:
    input_index: int
  then:
    - lambda: |-
        lv_obj_remove_flag(id(wifi_keyboard)->obj, LV_OBJ_FLAG_HIDDEN);
        {
          lv_obj_t *ta = (input_index == 0) ? id(wifi_password_ta) : id(wifi_hidden_ssid_ta);
          lv_keyboard_set_textarea(id(wifi_keyboard)->obj, ta);
        }

- id: wifi_unfocus_text_input
  then:
    - lvgl.widget.hide: { id: wifi_keyboard }

- id: update_wifi_connected_summary_ui
  then:
    - lambda: |-
        if (!lv_obj_has_flag(id(page_settings), LV_OBJ_FLAG_HIDDEN)) {
          [&]() {
            if (id(wifi_connected_details_table) == nullptr) return;
            auto *wt = id(wifi_connected_details_table)->obj;
            lv_table_set_cell_value(wt, 0, 1, id(wifi_ssid_ui).state.empty() ? "-" : id(wifi_ssid_ui).state.c_str());
            lv_table_set_cell_value(wt, 1, 1, id(wifi_ip_ui).state.empty() ? "-" : id(wifi_ip_ui).state.c_str());
            lv_table_set_cell_value(wt, 2, 1, id(wifi_mac_ui).state.empty() ? "-" : id(wifi_mac_ui).state.c_str());
            lv_table_set_cell_value(wt, 3, 1, isnan(id(wifi_signal_db).state) ? "Geen signaal" : str_sprintf("%.0f dBm", id(wifi_signal_db).state).c_str());
          }();
        }

- id: wifi_connect_selected
  then:
    - lambda: |-
        char dd_buf[64];
        lv_dropdown_get_selected_str(id(wifi_network_dd)->obj, dd_buf, sizeof(dd_buf));
        std::string ssid;
        if (std::string(dd_buf) == "Handmatig...") {
          ssid = lv_textarea_get_text(id(wifi_hidden_ssid_ta));
        } else {
          ssid = dd_buf;
        }
        if (ssid.empty() || ssid == "Geen netwerken gevonden" || ssid == "Zoeken..." || ssid == "Kies netwerk...") return;
        std::string password = lv_textarea_get_text(id(wifi_password_ta));
        #ifdef USE_WIFI
        wifi::global_wifi_component->save_wifi_sta(ssid, password);
        #endif

- id: wifi_disconnect
  then:
    - lambda: |-
        {
          #ifdef USE_WIFI
          wifi::global_wifi_component->save_wifi_sta("", "");
          wifi::global_wifi_component->clear_sta();
          if (id(wifi_connected_details_table) != nullptr) {
            auto *wt = id(wifi_connected_details_table)->obj;
            lv_table_set_cell_value(wt, 0, 1, "-");
            lv_table_set_cell_value(wt, 1, 1, "-");
            lv_table_set_cell_value(wt, 2, 1, "-");
            lv_table_set_cell_value(wt, 3, 1, "-");
          }
          #endif
        }
        lv_label_set_text(id(wifi_status_label), "Niet verbonden");
        lv_obj_send_event(id(wifi_status_label), lvgl::lv_update_event, nullptr);
        lv_obj_set_style_text_color(id(wifi_status_label), lv_color_hex(0xEF4444), LV_PART_MAIN);
        lv_label_set_text(id(nav_status_wifi_icon), "󰤮");
        lv_obj_send_event(id(nav_status_wifi_icon), lvgl::lv_update_event, nullptr);
        lv_obj_set_style_text_color(id(nav_status_wifi_icon), lv_color_hex(0x9CA3AF), LV_PART_MAIN);
        lv_obj_add_flag(id(wifi_connected_section), LV_OBJ_FLAG_HIDDEN);
        lv_obj_remove_flag(id(wifi_disconnected_section), LV_OBJ_FLAG_HIDDEN);
