        text_color: !lambda |-
          return id(silent_mode_enabled_switch).state ? lv_color_hex(0xFFFFFF) : lv_color_hex(0x9CA3AF);
    - lvgl.widget.update:
        id: set_silent_mode_end_time_inc
        bg_color: !lambda |-
          return id(silent_mode_enabled_switch).state ? lv_color_hex(0x1F3B68) : lv_color_hex(0xE5E7EB);
    - lvgl.label.update:
        id: set_silent_mode_end_time_inc_lbl
        text_color: !lambda |-
          return id(silent_mode_enabled_switch).state ? lv_color_hex(0xFFFFFF) : lv_color_hex(0x9CA3AF);

    - lvgl.label.update:
        id: set_silent_mode_power_lbl
        text_color: !lambda |-
          return id(silent_mode_enabled_switch).state ? lv_color_hex(0x1F2933) : lv_color_hex(0x9CA3AF);
    - lvgl.label.update:
        id: set_silent_mode_power_sub
        text_color: !lambda |-
          return id(silent_mode_enabled_switch).state ? lv_color_hex(0x6B7280) : lv_color_hex(0x9CA3AF);
    - lvgl.dropdown.update:
        id: set_silent_mode_power_dd
        selected_index: !lambda |-
          auto idx = id(silent_mode_compressor_mode).active_index();
          return idx.has_value() ? idx.value() : 3;
    - lambda: |-
        if (!id(set_silent_mode_power_dd) || !id(set_silent_mode_power_dd)->obj) return;
        bool enabled = id(silent_mode_enabled_switch).state;
        if (enabled) {
          lv_obj_clear_state(id(set_silent_mode_power_dd)->obj, LV_STATE_DISABLED);
          lv_obj_set_style_opa(id(set_silent_mode_power_dd)->obj, LV_OPA_COVER, LV_PART_MAIN);
          lv_obj_clear_state(id(set_silent_mode_start_time_dec), LV_STATE_DISABLED);
