        };
        lv_obj_t* labels[2] = {
          id(cooling_stab_algemeen_lbl),
          id(cooling_stab_setpoint_lbl)
        };
        for (int i = 0; i < 2; i++) {
          if (i == tab_index) {
            lv_obj_clear_flag(panels[i], LV_OBJ_FLAG_HIDDEN);
            lv_obj_set_style_bg_color(tabs[i], lv_color_hex(0x1F3B68), LV_PART_MAIN);
