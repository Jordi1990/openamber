- id: general_select_tab
  mode: restart
  parameters:
    tab_index: int
  then:
    - lambda: |-
        lv_obj_add_flag(id(pump_p0_pid_pager), LV_OBJ_FLAG_HIDDEN);
        lv_obj_add_flag(id(advanced_pid_pager), LV_OBJ_FLAG_HIDDEN);
        lv_obj_add_flag(id(advanced_defrost_pager), LV_OBJ_FLAG_HIDDEN);
        lv_obj_add_flag(id(advanced_fan_pager), LV_OBJ_FLAG_HIDDEN);
        lv_obj_add_flag(id(eebus_pager), LV_OBJ_FLAG_HIDDEN);

        lv_obj_t* panels[5] = {
          id(panel_general_page_systeem),
          id(panel_general_page_mengventielen),
          id(panel_general_page_sensor_kalibratie),
          id(panel_general_page_stiltemodus),
          id(panel_general_page_hardware)
        };
        lv_obj_t* tabs[5] = {
          id(general_stab_systeem),
          id(general_stab_mengventielen),
          id(general_stab_sensor_kalibratie),
          id(general_stab_stiltemodus),
          id(general_stab_hardware)
        };
        lv_obj_t* labels[5] = {
          id(general_stab_systeem_lbl),
          id(general_stab_mengventielen_lbl),
          id(general_stab_sensor_kalibratie_lbl),
          id(general_stab_stiltemodus_lbl),
          id(general_stab_hardware_lbl)
        };

        if (tab_index == 0) {
          lv_obj_clear_flag(id(general_system_pager), LV_OBJ_FLAG_HIDDEN);
        } else {
          lv_obj_add_flag(id(general_system_pager), LV_OBJ_FLAG_HIDDEN);
        }

        if (tab_index == 1) {
          lv_obj_clear_flag(id(mengventielen_pager), LV_OBJ_FLAG_HIDDEN);
        } else {
          lv_obj_add_flag(id(mengventielen_pager), LV_OBJ_FLAG_HIDDEN);
        }

        if (tab_index == 2) {
          lv_obj_clear_flag(id(sensor_calibration_pager), LV_OBJ_FLAG_HIDDEN);
        } else {
          lv_obj_add_flag(id(sensor_calibration_pager), LV_OBJ_FLAG_HIDDEN);
        }

        for (int i = 0; i < 5; i++) {
          if (i == tab_index) {
            lv_obj_clear_flag(panels[i], LV_OBJ_FLAG_HIDDEN);
            lv_obj_set_style_bg_color(tabs[i], lv_color_hex(0x1F3B68), LV_PART_MAIN);
            lv_obj_set_style_text_color(labels[i], lv_color_hex(0xFFFFFF), LV_PART_MAIN);
          } else {
            lv_obj_add_flag(panels[i], LV_OBJ_FLAG_HIDDEN);
            lv_obj_set_style_bg_color(tabs[i], lv_color_hex(0xCBD5E1), LV_PART_MAIN);
            lv_obj_set_style_text_color(labels[i], lv_color_hex(0x4B5563), LV_PART_MAIN);
          }
        }
    - if:
        condition:
          lambda: 'return tab_index == 0;'
        then:
          - script.execute:
              id: general_system_select_page
              page: 1
          - script.execute: update_advanced_settings_ui
          - script.execute: update_control_temp_source_ui
          - script.execute: update_analytics_ui
    - if:
        condition:
          lambda: 'return tab_index == 1;'
        then:
          - script.execute:
              id: mengventielen_select_page
              page: 1
          - script.execute: update_mixing_valves_ui
    - if:
        condition:
          lambda: 'return tab_index == 2;'
        then:
          - script.execute:
              id: sensor_calibration_select_page
              page: 1
    - if:
        condition:
          lambda: 'return tab_index == 3;'
        then:
          - script.execute: update_silent_mode_ui
    - if:
        condition:
          lambda: 'return tab_index == 4;'
        then:
          - script.execute: update_flow_sensor_calibration_ui

- id: update_silent_mode_ui
