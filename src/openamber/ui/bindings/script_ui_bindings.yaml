- id: update_header_mode_badge
  mode: restart
  then:
    - lambda: |-
        // The heat pump is out of operation after a controlled stop; maintenance mode only runs on top of it.
        const char *stopped_text = nullptr;
        if (id(service_mode_enabled).state || id(amber_ctrl).is_standby()) {
          stopped_text = oa_tr("Warmtepomp gestopt");
        } else if (id(controlled_stop_active)) {
          stopped_text = oa_tr("Warmtepomp wordt gestopt...");
        }
        if (stopped_text != nullptr) {
          if (strcmp(lv_label_get_text(id(header_maintenance_badge_label)), stopped_text) != 0) {
            lv_label_set_text(id(header_maintenance_badge_label), stopped_text);
            lv_obj_send_event(id(header_maintenance_badge_label), lvgl::lv_update_event, nullptr);
          }
          lv_obj_remove_flag(id(header_maintenance_badge), LV_OBJ_FLAG_HIDDEN);
          lv_obj_add_flag(id(header_emergency_badge), LV_OBJ_FLAG_HIDDEN);
        } else {
          if (id(emergency_mode_enabled).state) {
            lv_obj_add_flag(id(header_maintenance_badge), LV_OBJ_FLAG_HIDDEN);
            lv_obj_remove_flag(id(header_emergency_badge), LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_obj_add_flag(id(header_maintenance_badge), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(header_emergency_badge), LV_OBJ_FLAG_HIDDEN);
          }
        }

- id: update_header_model_badge
  mode: restart
  then:
    - lambda: |-
        lv_obj_set_style_bg_color(id(header_model_badge), [&]() -> lv_color_t {
          bool inside_ok = id(modbus_inside_online).state;
          bool outside_ok = id(modbus_outside_online).state;
          if (inside_ok && outside_ok) {
            return lv_color_hex(0x0072CE);
          }
          return lv_color_hex(0x475569);
        }(), LV_PART_MAIN);
        lv_label_set_text(id(header_model_badge_label), std::string([&]() -> std::string {
          bool inside_ok = id(modbus_inside_online).state;
          bool outside_ok = id(modbus_outside_online).state;
          
          if (!inside_ok || !outside_ok) {
            return oa_tr("Verbinden...");
          }
          
          // Both online
          if (id(model_identification_1).has_state()) {
            int model = (int)id(model_identification_1).state;
            switch (model) {
              case 140: return "Amber 65";
              case 150: return "Amber 95";
              case 15:  return "Amber 120";
              case 145:
              case 160: return "HP-S 95";
              default:  return oa_tr("Onbekend model");
            }
          }
          return "Amber";
        }()).c_str());
        lv_obj_send_event(id(header_model_badge_label), lvgl::lv_update_event, nullptr);

