- id: service_sensors_prev_page
  mode: restart
  then:
    - lambda: |-
        if (!lv_obj_has_flag(id(service_sensors_page_4), LV_OBJ_FLAG_HIDDEN)) {
          id(service_sensors_select_page).execute(3);
        } else {
          if (!lv_obj_has_flag(id(service_sensors_page_3), LV_OBJ_FLAG_HIDDEN)) {
            id(service_sensors_select_page).execute(2);
          } else {
            if (!lv_obj_has_flag(id(service_sensors_page_2), LV_OBJ_FLAG_HIDDEN)) {
              id(service_sensors_select_page).execute(1);
            }
          }
        }

- id: service_sensors_next_page
  mode: restart
  then:
    - lambda: |-
        if (!lv_obj_has_flag(id(service_sensors_page_1), LV_OBJ_FLAG_HIDDEN)) {
          id(service_sensors_select_page).execute(2);
        } else {
          if (!lv_obj_has_flag(id(service_sensors_page_2), LV_OBJ_FLAG_HIDDEN)) {
            id(service_sensors_select_page).execute(3);
          } else {
            if (!lv_obj_has_flag(id(service_sensors_page_3), LV_OBJ_FLAG_HIDDEN)) {
              id(service_sensors_select_page).execute(4);
            }
          }
        }

- id: nav_select_tab
  mode: restart
  parameters:
    tab_index: int
  then:
    - if:
        condition:
          lambda: 'return tab_index == 0;'
        then:
          - lambda: |-
              lv_obj_remove_flag(id(page_home), LV_OBJ_FLAG_HIDDEN);
              lv_obj_add_flag(id(page_thermostat), LV_OBJ_FLAG_HIDDEN);
              lv_obj_add_flag(id(page_service), LV_OBJ_FLAG_HIDDEN);
              lv_obj_add_flag(id(page_system), LV_OBJ_FLAG_HIDDEN);
              lv_obj_add_flag(id(page_settings), LV_OBJ_FLAG_HIDDEN);
              id(update_water_mode_temperature_display).execute();
              id(update_water_mode_efficiency_display).execute();
              id(update_home_pump_tile_state).execute();
              id(update_home_thermostat_mode_ui).execute();
              id(update_thermostat_settings_ui).execute();
        else:
          - if:
              condition:
                lambda: 'return tab_index == 1;'
              then:
                - lambda: |-
                    lv_obj_add_flag(id(page_home), LV_OBJ_FLAG_HIDDEN);
                    lv_obj_remove_flag(id(page_thermostat), LV_OBJ_FLAG_HIDDEN);
                    lv_obj_add_flag(id(page_service), LV_OBJ_FLAG_HIDDEN);
                    lv_obj_add_flag(id(page_system), LV_OBJ_FLAG_HIDDEN);
                    lv_obj_add_flag(id(page_settings), LV_OBJ_FLAG_HIDDEN);
                    id(update_thermostat_settings_ui).execute();
                    id(update_thermostat_mode_ui).execute();
                    id(update_home_thermostat_mode_ui).execute();
              else:
                - if:
                    condition:
                      lambda: 'return tab_index == 2;'
                    then:
                      - lambda: |-
                          lv_obj_add_flag(id(page_home), LV_OBJ_FLAG_HIDDEN);
                          lv_obj_add_flag(id(page_thermostat), LV_OBJ_FLAG_HIDDEN);
                          lv_obj_add_flag(id(page_service), LV_OBJ_FLAG_HIDDEN);
                          lv_obj_add_flag(id(page_system), LV_OBJ_FLAG_HIDDEN);
