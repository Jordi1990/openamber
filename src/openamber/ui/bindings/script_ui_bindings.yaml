- id: display_return_home
  mode: restart
  then:
    - if:
        condition:
          lambda: 'return lv_obj_has_flag(id(page_home), LV_OBJ_FLAG_HIDDEN);'
        then:
          - script.execute:
              id: nav_select_tab
              tab_index: 0

