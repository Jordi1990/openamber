- id: update_heat_curve_chart
  mode: restart
  then:
    - lambda: |-
        // Read sensor values with NaN fallback
        float vals[5] = {
          id(heat_curve_m10).state,
          id(heat_curve_0).state,
          id(heat_curve_p5).state,
          id(heat_curve_p10).state,
          id(heat_curve_p15).state,
        };
        float defaults[5] = {35.0f, 30.0f, 28.0f, 27.0f, 25.0f};
        for (int i = 0; i < 5; i++) {
          if (isnan(vals[i])) vals[i] = defaults[i];
        }
        float vmin = vals[0], vmax = vals[0];
        for (int i = 1; i < 5; i++) {
          if (vals[i] < vmin) vmin = vals[i];
          if (vals[i] > vmax) vmax = vals[i];
        }
        if (vmax < 1.0f && vmin < 1.0f) { vmin = 25.0f; vmax = 35.0f; }
        float range = vmax - vmin;
        if (range < 0.5f) range = 0.5f;

        // Compute Y coordinates for the 5 data points
        static lv_point_precise_t pts[5];
        int xs[5] = {0, 155, 310, 465, 620};
        for (int i = 0; i < 5; i++) {
          float y = 114.0f - ((vals[i] - vmin) / range) * 108.0f;
          if (y < 6.0f) y = 6.0f;
          if (y > 114.0f) y = 114.0f;
          pts[i].x = xs[i];
          pts[i].y = (lv_coord_t) y;
        }
        lv_line_set_points(id(heat_curve_line)->obj, pts, 5);

        // Update Y-axis labels
        float step = (vmax - vmin) / 4.0f;
        int ax_top = (int)(vmax + 0.5f);
        int ax_umid = (int)((vmax - step) + 0.5f);
        int ax_mid = (int)((vmax - 2.0f * step) + 0.5f);
        int ax_lmid = (int)((vmax - 3.0f * step) + 0.5f);
        int ax_bot = (int)(vmin + 0.5f);
        lv_label_set_text_fmt(id(heat_curve_y_axis_labels), "%d\n%d\n%d\n%d\n%d",
                              ax_top, ax_umid, ax_mid, ax_lmid, ax_bot);

        // Update data point value labels
        lv_label_set_text_fmt(id(set_hc_m10_val), "%.0f°C", (double)vals[0]);
        lv_label_set_text_fmt(id(set_hc_0_val), "%.0f°C", (double)vals[1]);
        lv_label_set_text_fmt(id(set_hc_p5_val), "%.0f°C", (double)vals[2]);
        lv_label_set_text_fmt(id(set_hc_p10_val), "%.0f°C", (double)vals[3]);
        lv_label_set_text_fmt(id(set_hc_p15_val), "%.0f°C", (double)vals[4]);

