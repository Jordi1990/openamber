- id: update_header_mode_badge
  mode: restart
  then:
    - if:
        condition:
          lambda: 'return id(service_mode_enabled).state && id(state_machine_state_main).state == "Maintenance";'
        then:
          - lvgl.widget.show: { id: header_maintenance_badge }
          - lvgl.widget.hide: { id: header_emergency_badge }
        else:
          - if:
              condition:
                switch.is_on: emergency_mode_enabled
              then:
                - lvgl.widget.hide: { id: header_maintenance_badge }
                - lvgl.widget.show: { id: header_emergency_badge }
              else:
                - lvgl.widget.hide: { id: header_maintenance_badge }
                - lvgl.widget.hide: { id: header_emergency_badge }

- id: update_header_model_badge
  mode: restart
  then:
    - lvgl.widget.update:
        id: header_model_badge
        bg_color: !lambda |-
          bool inside_ok = id(modbus_inside_online).state;
          bool outside_ok = id(modbus_outside_online).state;
          if (inside_ok && outside_ok) {
            return lv_color_hex(0x0072CE);
          }
          return lv_color_hex(0x475569);
    - lvgl.label.update:
        id: header_model_badge_label
        text: !lambda |-
          bool inside_ok = id(modbus_inside_online).state;
          bool outside_ok = id(modbus_outside_online).state;

          if (!inside_ok || !outside_ok) {
            return "Verbinden...";
          }

          // Both online
          if (id(model_identification_1).has_state()) {
            int model = (int)id(model_identification_1).state;
            switch (model) {
              case 140: return "Amber 65";
              case 150: return "Amber 95";
              case 15:  return "Amber 120";
              case 145: return "HP-S 95";
              default:  return "Onbekend model";
            }
          }
          return "Amber";

