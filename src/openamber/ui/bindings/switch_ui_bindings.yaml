# ── Settings: Mengventielen zone 1 & 2 aanwezig ──
- id: !extend mixing_valve_zone1_enabled
  on_state:
    then:
      - lambda: |-
          lvgl::LvglComponent::lv_obj_set_state_value(id(set_mv_z1_enabled_switch_ui), LV_STATE_CHECKED, (x));
          id(update_control_temp_source_ui).execute();
          if (id(current_setpoint).is_ready()) id(current_setpoint).update();

