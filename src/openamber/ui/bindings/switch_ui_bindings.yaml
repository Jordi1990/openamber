# ── Settings: DHW enabled toggle ──
- id: !extend dhw_enabled_switch
  on_state:
    then:
      - lambda: |-
          lvgl::LvglComponent::lv_obj_set_state_value(id(set_dhw_enabled_switch_ui), LV_STATE_CHECKED, (x));
          if (x) {
            lv_obj_remove_flag(id(stab_dhw), LV_OBJ_FLAG_HIDDEN);
            lv_obj_set_style_opa(id(dhw_tank_card), static_cast<uint8_t>(255.0f), LV_PART_MAIN);
          } else {
            lv_obj_add_flag(id(stab_dhw), LV_OBJ_FLAG_HIDDEN);
            lv_obj_set_style_opa(id(dhw_tank_card), static_cast<uint8_t>(102.0f), LV_PART_MAIN);
          }
          id(update_service_deaeration_ui).execute();

