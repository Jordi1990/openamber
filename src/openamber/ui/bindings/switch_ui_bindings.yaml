# ── Settings page: EEBUS enabled toggle ──
- id: !extend eebus_enabled_switch
  on_state:
    then:
      - lambda: |-
          lvgl::LvglComponent::lv_obj_set_state_value(id(set_eebus_enabled_switch_ui), LV_STATE_CHECKED, (x));
          id(update_eebus_settings_ui).execute();
      - if:
          condition:
            lambda: 'return x;'
          then:
            - delay: 200ms
            - script.execute: update_eebus_settings_ui
            - delay: 500ms
            - script.execute: update_eebus_settings_ui
            - delay: 1000ms
            - script.execute: update_eebus_settings_ui

