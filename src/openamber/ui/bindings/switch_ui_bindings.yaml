# ══════════════════════════════════════════════════════════════
# Switch → LVGL UI bindings (event-driven via !extend)
# These extend switches defined in common/switches.yaml to add
# on_state callbacks that update LVGL widgets on change.
# ══════════════════════════════════════════════════════════════

# ── Settings page: Analytics toggle ──
- id: !extend analytics_enabled_switch
  on_state:
    then:
      - lambda: |-
          lvgl::LvglComponent::lv_obj_set_state_value(id(set_analytics_enabled_switch_ui), LV_STATE_CHECKED, (x));
          if (x) {
            lv_obj_remove_flag(id(set_analytics_id_row), LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_obj_add_flag(id(set_analytics_id_row), LV_OBJ_FLAG_HIDDEN);
          }

# ── Settings page: Advanced settings toggle ──
- id: !extend advanced_settings_enabled
  on_state:
    then:
      - script.execute: update_advanced_settings_ui

# ── Settings page: Emergency mode toggle ──
