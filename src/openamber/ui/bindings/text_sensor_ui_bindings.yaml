- id: !extend wifi_scan_results_ui
  on_value:
    then:
      - lambda: |-
          std::string result = x;
          std::string options;
          options.reserve(result.size() + 24);
          std::string seen;
          seen.reserve(result.size() + 2);
          seen.push_back('\n');
          size_t pos = 0;
          while (pos < result.size()) {
            size_t end = result.find('\n', pos);
            if (end == std::string::npos) end = result.size();
            std::string line = result.substr(pos, end - pos);
            // Each line is "SSID: -XXdB"; strip the signal strength suffix.
            size_t sep = line.rfind(": ");
            bool has_rssi = sep != std::string::npos && line.size() >= sep + 4 && line.compare(line.size() - 2, 2, "dB") == 0;
            std::string ssid = has_rssi ? line.substr(0, sep) : line;
            if (!ssid.empty()) {
              std::string needle;
              needle.reserve(ssid.size() + 2);
              needle.push_back('\n');
              needle += ssid;
              needle.push_back('\n');
              if (seen.find(needle) == std::string::npos) {
                if (!options.empty()) options += "\n";
                options += ssid;
                seen += ssid;
                seen.push_back('\n');
              }
            }
            pos = end + 1;
          }
          if (!options.empty()) {
            options += "\nHandmatig...";
          } else {
            options = "Geen netwerken gevonden\nHandmatig...";
          }
          const char *current_options = lv_dropdown_get_options(id(wifi_network_dd)->obj);
          if (current_options != nullptr && options == current_options) {
            return;
          }
          // New options reset the selection to the first entry; keep the network the user picked.
          char selected[64];
          lv_dropdown_get_selected_str(id(wifi_network_dd)->obj, selected, sizeof(selected));
          lv_dropdown_set_options(id(wifi_network_dd)->obj, options.c_str());
          int32_t index = lv_dropdown_get_option_index(id(wifi_network_dd)->obj, selected);
          if (index >= 0) {
            lv_dropdown_set_selected(id(wifi_network_dd)->obj, index);
          }

- id: !extend controlled_stop_status
  on_value:
    then:
      - lambda: |-
          const bool safe = x.rfind("Gestopt", 0) == 0;
          const bool off = x == "Uit";
          std::string text = off ? std::string("Gecontroleerd stoppen: uit")
                                 : std::string("Gecontroleerd stoppen: ") + x + (safe ? " (hervat vanzelf na 30 min)" : "");
          lv_label_set_text(id(service_controlled_stop_status), text.c_str());
          lv_obj_set_style_text_color(id(service_controlled_stop_status),
                                      lv_color_hex(safe ? 0x166534 : (off ? 0x6B7280 : 0xB45309)), LV_PART_MAIN);
          lv_obj_send_event(id(service_controlled_stop_status), lvgl::lv_update_event, nullptr);
