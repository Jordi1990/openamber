# ══════════════════════════════════════════════════════════════
# Text Sensor → LVGL UI bindings (event-driven via !extend)
# These extend text sensors defined in common/text_sensors.yaml
# to add on_value callbacks that update LVGL widgets on change.
# ══════════════════════════════════════════════════════════════

# ── Home page: Mode temperature display depends on state ──
- id: !extend state_machine_state_main
  on_value:
    then:
      - lambda: |-
          id(update_water_mode_temperature_display).execute();
          id(update_water_mode_efficiency_display).execute();
          id(update_service_mode_ui).execute();
          id(update_service_diag_summary_ui).execute();
          id(update_system_diagnostics_ui).execute();

- id: !extend state_machine_state_heat_cool
  on_value:
    then:
      - lambda: |-
          id(update_service_diag_summary_ui).execute();
          id(update_system_diagnostics_ui).execute();

- id: !extend state_machine_state_dhw
  on_value:
    then:
      - lambda: |-
          id(update_service_diag_summary_ui).execute();
          id(update_system_diagnostics_ui).execute();

- id: !extend state_machine_state_routine
  on_value:
    then:
      - script.execute: update_service_mode_ui

# ── Settings page: Analytics device ID ──
- id: !extend analytics_device_id
  on_value:
    then:
      - lambda: |-
          if (!x.empty()) {
            lv_label_set_text(id(set_analytics_id_value), str_sprintf("%s", x.c_str()).c_str());
            lv_obj_send_event(id(set_analytics_id_value), lvgl::lv_update_event, nullptr);
          } else {
            lv_label_set_text(id(set_analytics_id_value), "Onbekend");
            lv_obj_send_event(id(set_analytics_id_value), lvgl::lv_update_event, nullptr);
          }

