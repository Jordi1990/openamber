# ── Nav bar: Demand icons ──
- id: !extend heat_demand_active_sensor
  on_state:
    then:
      - lvgl.widget.update:
          id: nav_status_heat_icon
          hidden: !lambda 'return !x;'

- id: !extend cool_demand_active_sensor
  on_state:
    then:
      - lambda: |-
          if (!x) {
            lv_obj_add_flag(id(nav_status_cool_icon), LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_obj_remove_flag(id(nav_status_cool_icon), LV_OBJ_FLAG_HIDDEN);
          }
          id(update_service_diag_summary_ui).execute();

- id: !extend dhw_demand_active_sensor
  on_state:
    then:
      - lvgl.widget.update:
          id: nav_status_dhw_icon
          hidden: !lambda 'return !x;'

# ── Home page: DHW pump active → circulation animation ──
- id: !extend dhw_pump_active_sensor
  on_state:
    then:
      - lambda: |-
          if (!x) {
            lv_obj_add_flag(id(dhw_circulation_spinner), LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_obj_remove_flag(id(dhw_circulation_spinner), LV_OBJ_FLAG_HIDDEN);
          }
          if (!x) {
            lv_obj_add_flag(id(dhw_flow_arrow_up), LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_obj_remove_flag(id(dhw_flow_arrow_up), LV_OBJ_FLAG_HIDDEN);
          }
          if (!x) {
            lv_obj_add_flag(id(dhw_flow_arrow_down), LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_obj_remove_flag(id(dhw_flow_arrow_down), LV_OBJ_FLAG_HIDDEN);
          }
          lv_label_set_text(id(dhw_pump_state_label), std::string([&]() -> std::string {
            if (x) return "AAN";
            return "UIT";
          }()).c_str());
          lv_obj_send_event(id(dhw_pump_state_label), lvgl::lv_update_event, nullptr);
          lv_obj_set_style_text_color(id(dhw_pump_icon), [&]() -> lv_color_t {
            if (x) return lv_color_hex(0x22D3EE);
            return lv_color_hex(0x919191);
          }(), LV_PART_MAIN);
          lv_obj_set_style_text_color(id(dhw_pump_state_label), [&]() -> lv_color_t {
            if (x) return lv_color_hex(0x22D3EE);
            return lv_color_hex(0x919191);
          }(), LV_PART_MAIN);

