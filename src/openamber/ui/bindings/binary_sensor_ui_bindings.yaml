# ══════════════════════════════════════════════════════════════
# Binary Sensor → LVGL UI bindings (event-driven via !extend)
# These extend binary sensors defined in common/binary_sensors.yaml
# to add on_state callbacks that update LVGL widgets on change.
# ══════════════════════════════════════════════════════════════

# ── Home page: Tiles ──
- id: !extend defrost_active_sensor
  on_state:
    then:
      - lambda: |-
          lv_obj_set_style_bg_color(id(tile_defrost), [&]() -> lv_color_t {
            if (x) return lv_color_hex(0xF5F8FC);
            return lv_color_hex(0x919191);
          }(), LV_PART_MAIN);
          lv_label_set_text(id(tile_defrost_state), std::string([&]() -> std::string {
            if (x) return "AAN";
            return "UIT";
          }()).c_str());
          lv_obj_send_event(id(tile_defrost_state), lvgl::lv_update_event, nullptr);
          id(update_service_diag_summary_ui).execute();

