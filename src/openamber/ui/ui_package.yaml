# ==============================================================================
# OpenAmber Shared UI Package (Images, Fonts, and LVGL Widget Hierarchy)
# ==============================================================================

image:
  - platform: file
    file: openamber/ui/images/water_circuit.png
    id: img_water_circuit
    type: RGB565
    transparency: alpha_channel
    resize: 350x420
  - platform: file
    file: openamber/ui/images/icon.png
    id: openamber_icon
    type: RGB565
    resize: 57x70
    transparency: alpha_channel
  - platform: file
    file: openamber/ui/images/dhw_tank.png
    id: img_dhw_tank
    type: RGB565
    transparency: alpha_channel
    resize: 130x260
  - platform: file
    file: openamber/ui/images/logo-512x512.png
    id: openamber_logo
    type: RGB565
    transparency: alpha_channel

font: !include fonts.yaml

lvgl:
  buffer_size: 100%
  bottom_layer:
    bg_color: 0x0A2747
  # Shared styles for the menu tiles (settings and service): stored once instead of as local style
  # properties on every tile, icon and label.
  style_definitions:
    - id: menu_tile_style
      width: 19.2%
      height: 140
      bg_color: 0xFFFFFF
      bg_opa: 100%
      radius: 14
      border_width: 1
      border_color: 0xD5DEE9
      border_opa: 100%
      pad_all: 0
    - id: menu_tile_pressed_style
      bg_color: 0xE6F1FB
      border_color: 0x185FA5
    - id: menu_tile_disabled_style
      bg_color: 0xEDF1F6
      opa: 45%
    - id: menu_tile_icon_style
      align: TOP_MID
      y: 20
      width: 52
      height: 52
      radius: 26
      bg_color: 0xE6F1FB
      bg_opa: 100%
      text_color: 0x185FA5
      text_font: font_mdi_24
      text_align: CENTER
      pad_top: 12
    - id: menu_tile_label_style
      align: BOTTOM_MID
      y: -16
      width: 96%
      text_color: 0x1F2933
      text_font: font_text_20
      text_align: CENTER
  widgets:
    - !include root_bg.yaml
    - !include header_bar.yaml
    - !include page_home.yaml
    - !include page_thermostat.yaml
    - !include page_service.yaml
    - !include page_system.yaml
    - !include page_settings.yaml
    - !include page_graph.yaml
    - !include nav_bar.yaml
    - !include idle_screen_overlay.yaml
