- nl: "P01 - Bedrijfstroom warmtepomp"
  de: "P01 - Betriebsstrom Wärmepumpe"
  en: "P01 - Heat pump operating current"
- nl: "De eerste keer wordt de normale werking van de warmtepomp na 5 minuten automatisch hervat."
  de: "Beim ersten Mal setzt die Wärmepumpe den Normalbetrieb nach 5 Minuten automatisch fort."
  en: "The first time, normal heat pump operation resumes automatically after 5 minutes."
- nl: "P02 - Bedrijfstroom warmtepomp"
  de: "P02 - Betriebsstrom Wärmepumpe"
  en: "P02 - Heat pump operating current"
- nl: "De eerste keer wordt de normale werking van de warmtepomp na 5 minuten automatisch hervat. Als dezelfde storing binnen een bepaalde tijd drie keer optreedt, wordt de warmtepomp geblokkeerd en moet worden herstart."
  de: "Beim ersten Mal setzt die Wärmepumpe den Normalbetrieb nach 5 Minuten automatisch fort. Tritt dieselbe Störung innerhalb einer bestimmten Zeit dreimal auf, wird die Wärmepumpe gesperrt und muss neu gestartet werden."
  en: "The first time, normal heat pump operation resumes automatically after 5 minutes. If the same fault occurs three times within a certain period, the heat pump is blocked and must be restarted."
- nl: "P06 - Storing compressor - laag drukverschil"
  de: "P06 - Störung Kompressor - geringer Druckunterschied"
  en: "P06 - Compressor fault - low pressure difference"
- nl: "De compressorfrequentie zal worden begrensd. De druk zal hierdoor zakken en een normale werking wordt voortgezet."
  de: "Die Kompressorfrequenz wird begrenzt. Dadurch sinkt der Druck und der Normalbetrieb wird fortgesetzt."
  en: "The compressor frequency is limited. The pressure drops and normal operation continues."
- nl: "P07 - Compressor voorverwarming"
  de: "P07 - Kompressor-Vorheizung"
  en: "P07 - Compressor preheating"
- nl: "De compressor wordt voorverwarmd om te kunnen starten. Het zal maximaal 30 minuten duren voordat de compressor op bedrijfstemperatuur is. Daarna zal deze storing vanzelf verdwijnen en zal de compressor starten."
  de: "Der Kompressor wird zum Starten vorgeheizt. Es dauert höchstens 30 Minuten, bis er Betriebstemperatur hat. Danach verschwindet diese Meldung von selbst und der Kompressor startet."
  en: "The compressor is being preheated so it can start. It takes up to 30 minutes for the compressor to reach operating temperature. After that this warning clears by itself and the compressor starts."
- nl: "P11 - Compressor geblokkeerd door buitentemperatuur"
  de: "P11 - Kompressor durch Außentemperatur gesperrt"
  en: "P11 - Compressor blocked by outside temperature"
- nl: "De buitenunit laat de compressor niet draaien bij deze buitentemperatuur (Ta). Bij verwarmen gebeurt dit onder ongeveer -25°C en boven 46°C. De compressor start weer zodra Ta binnen het werkgebied valt."
  de: "Die Außeneinheit lässt den Kompressor bei dieser Außentemperatur (Ta) nicht laufen. Beim Heizen geschieht das unter etwa -25°C und über 46°C. Der Kompressor startet wieder, sobald Ta im Arbeitsbereich liegt."
  en: "The outdoor unit does not run the compressor at this outside temperature (Ta). When heating this happens below about -25°C and above 46°C. The compressor starts again once Ta is within the operating range."
- nl: "P13 - Storing compressor - laag drukverschil"
  de: "P13 - Störung Kompressor - geringer Druckunterschied"
  en: "P13 - Compressor fault - low pressure difference"
- nl: "Toerental compressor wordt verlaagd. Als dezelfde storing binnen een bepaalde tijd drie keer optreedt, wordt de warmtepomp geblokkeerd en moet worden herstart."
  de: "Die Kompressordrehzahl wird gesenkt. Tritt dieselbe Störung innerhalb einer bestimmten Zeit dreimal auf, wird die Wärmepumpe gesperrt und muss neu gestartet werden."
  en: "The compressor speed is reduced. If the same fault occurs three times within a certain period, the heat pump is blocked and must be restarted."
- nl: "Communicatie-failsafe binnenunit"
