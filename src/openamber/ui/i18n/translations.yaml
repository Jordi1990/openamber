- nl: "TO01 - Pomp start timeout"
  de: "TO01 - Zeitüberschreitung Pumpenstart"
  en: "TO01 - Pump start timeout"
- nl: "De pomp startte niet binnen de verwachte tijd. Controleer pompaansturing, relais, bedrijfstoestand en de flow (flow switch), omdat deze timeout op flow-detectie wordt bepaald."
  de: "Die Pumpe ist nicht in der erwarteten Zeit angelaufen. Prüfe Pumpenansteuerung, Relais, Betriebszustand und den Durchfluss (Strömungsschalter), denn diese Zeitüberschreitung beruht auf der Durchflusserkennung."
  en: "The pump did not start within the expected time. Check pump control, relays, operating state and the flow (flow switch), because this timeout is based on flow detection."
- nl: "TO02 - Compressor start timeout"
  de: "TO02 - Zeitüberschreitung Kompressorstart"
  en: "TO02 - Compressor start timeout"
- nl: "De compressor startte niet binnen de verwachte tijd. Controleer permissies, beveiligingen en startcondities."
  de: "Der Kompressor ist nicht in der erwarteten Zeit angelaufen. Prüfe Freigaben, Schutzeinrichtungen und Startbedingungen."
  en: "The compressor did not start within the expected time. Check permissions, protections and start conditions."
- nl: "TO03 - Pomp stop timeout"
  de: "TO03 - Zeitüberschreitung Pumpenstopp"
  en: "TO03 - Pump stop timeout"
- nl: "De pomp stopte niet binnen de verwachte tijd. Controleer relaisstatus, besturingslogica en de flow (flow switch), omdat deze timeout op flow-detectie wordt bepaald."
  de: "Die Pumpe hat nicht in der erwarteten Zeit gestoppt. Prüfe Relaisstatus, Steuerlogik und den Durchfluss (Strömungsschalter), denn diese Zeitüberschreitung beruht auf der Durchflusserkennung."
  en: "The pump did not stop within the expected time. Check relay status, control logic and the flow (flow switch), because this timeout is based on flow detection."
- nl: "TO04 - 3-weg klep status fout"
  de: "TO04 - Statusfehler 3-Wege-Ventil"
  en: "TO04 - 3-way valve state error"
- nl: "De 3-weg klep bevindt zich niet in de verwachte stand (relaisterugmelding ontbreekt of temperatuurafwijking overschreden). Controleer klepaansturing, bedrading en klepmotor."
  de: "Das 3-Wege-Ventil steht nicht in der erwarteten Stellung (Relaisrückmeldung fehlt oder Temperaturabweichung überschritten). Prüfe Ventilansteuerung, Verdrahtung und Ventilmotor."
  en: "The 3-way valve is not in the expected position (relay feedback missing or temperature deviation exceeded). Check valve control, wiring and valve motor."
- nl: "TO05 - Modbus verbinding timeout"
  de: "TO05 - Zeitüberschreitung Modbus-Verbindung"
  en: "TO05 - Modbus connection timeout"
- nl: "De Modbus-communicatie met de binnen- of buitenunit kon niet worden hersteld binnen de verwachte tijd. Controleer bekabeling, voeding en Modbus-instellingen."
  de: "Die Modbus-Kommunikation mit der Innen- oder Außeneinheit ließ sich nicht in der erwarteten Zeit wiederherstellen. Prüfe Verkabelung, Stromversorgung und Modbus-Einstellungen."
  en: "Modbus communication with the indoor or outdoor unit could not be restored within the expected time. Check cabling, power and Modbus settings."
- nl: "TO06 - Binnenunit failsafe / herstart"
  de: "TO06 - Inneneinheit Failsafe / Neustart"
  en: "TO06 - Indoor unit failsafe / restart"
- nl: "De binnenunit bevindt zich in failsafe of is herstart. Een of meer uitgangsregisters (1099-1113) wijken af van de verwachte status. De regeling is gestopt."
  de: "Die Inneneinheit ist im Failsafe oder wurde neu gestartet. Ein oder mehrere Ausgangsregister (1099-1113) weichen vom erwarteten Zustand ab. Die Regelung ist gestoppt."
  en: "The indoor unit is in failsafe or has restarted. One or more output registers (1099-1113) differ from the expected state. Control has stopped."
- nl: "TO07 - Compressor onverwacht gestopt"
  de: "TO07 - Kompressor unerwartet gestoppt"
  en: "TO07 - Compressor stopped unexpectedly"
- nl: "De buitenunit stopte de compressor zelf terwijl OpenAmber hem liet draaien. De regeling is gestopt. Controleer beveiligingen, voeding en de Modbus-verbinding met de buitenunit en reset daarna de fout."
  de: "Die Außeneinheit hat den Kompressor selbst gestoppt, während OpenAmber ihn laufen ließ. Die Regelung ist gestoppt. Prüfe Schutzeinrichtungen, Stromversorgung und die Modbus-Verbindung zur Außeneinheit und setze danach den Fehler zurück."
  en: "The outdoor unit stopped the compressor itself while OpenAmber was running it. Control has stopped. Check protections, power and the Modbus connection to the outdoor unit, then reset the error."
