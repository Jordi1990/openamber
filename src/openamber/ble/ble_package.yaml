packages:
  common: !include ble_common.yaml

# ESPHome's native BLE stack (Bluedroid). It stays off until the Bluetooth
# switch (Settings -> Connectiviteit -> Bluetooth) is turned on;
# ble_sensor_update() enables and disables it.
# A device that includes this package also sets the substitution
# room_temperature_source to effective_room_temperature. Options for its
# Bluetooth controller are in the device file.
esp32_ble:
  enable_on_boot: false
  # Scan only: no GATT connections. Keep Bluedroid's allocations in PSRAM.
  max_connections: 1
  use_psram: true

esp32_ble_tracker:
  scan_parameters:
    active: false
    continuous: true
  on_ble_advertise:
    - then:
        - lambda: ble_sensor_on_advertise(x.address(), x.get_manufacturer_datas(), x.get_service_datas());
