# A paired sensor on the Bluetooth page (slot ${index}).
obj:
  id: ble_paired_row_${index}
  width: 100%
  height: 76
  hidden: true
  bg_color: 0xFFFFFF
  bg_opa: 100%
  radius: 8
  border_color: 0xCBD5E1
  border_width: 1
  pad_all: 10
  scrollable: false
  widgets:
    - label:
        id: ble_paired_icon_${index}
        text: "\U000F05E0"
        text_font: font_mdi_24
        text_color: 0x16A34A
        align: LEFT_MID
    - label:
        id: ble_paired_label_${index}
        text: ""
        x: 40
        width: 72%
        text_font: font_text_20
        text_color: 0x1F2933
        align: LEFT_MID
    - button:
        width: 170
        height: 42
        align: RIGHT_MID
        bg_color: 0xB91C1C
        on_click:
          - lambda: switchbot_unpair(${index});
        widgets:
          - label: { text: "Ontkoppelen", text_font: font_text_20, text_color: 0xFFFFFF, align: CENTER }
