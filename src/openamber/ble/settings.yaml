# BLE UI: the room temperature source dropdown on the thermostat setpoint page
# and the Bluetooth sub-tab under Settings -> Connectiviteit.
lvgl:
  widgets:
    - obj:
        id: !extend page_settings
        widgets:
          - obj:
              id: !extend settings_card
              widgets:
                - obj:
                    id: !extend settings_content
                    widgets:
                      - obj:
                          id: !extend panel_thermostat
                          widgets:
                            - obj:
                                id: !extend panel_thermostat_page_setpoint
                                widgets:
                                  - obj:
                                      id: ble_source_row
                                      width: 100%
                                      height: SIZE_CONTENT
                                      bg_opa: 0%
                                      border_opa: 0%
                                      pad_all: 6
                                      scrollable: false
                                      widgets:
                                        - label: { text: "Ruimtetemperatuur bron", text_font: font_text_24, text_color: 0x1F2933, align: TOP_LEFT }
                                        - label: { text: "Bedrade Tr-sensor of gekoppelde Bluetooth-sensor", text_font: font_text_20, text_color: 0x6B7280, align: TOP_LEFT, y: 38 }
                                        - dropdown:
                                            id: ble_source_dropdown
                                            width: 360
                                            height: 40
                                            align: TOP_RIGHT
                                            # Lifted and kept compact so it clears the description line below the title.
                                            y: -4
                                            symbol: "\U000F0140"
                                            # Options are rebuilt from the paired sensors (switchbot_ble_ui.h).
                                            options: ["Tr (Bedraad)"]
                                            text_font: font_text_20
                                            dropdown_list: { text_font: font_text_20 }
                                            on_change:
                                              - lambda: switchbot_source_dropdown_changed();
                      - obj:
                          id: !extend panel_wifi
                          widgets:
                            - obj:
                                id: !extend connectivity_tab_bar
                                hidden: false
                                widgets:
                                  - obj:
                                      id: conn_stab_bluetooth
                                      width: SIZE_CONTENT
                                      height: 34
                                      bg_color: 0xCBD5E1
                                      bg_opa: 100%
                                      radius: 8
                                      border_opa: 0%
                                      pad_left: 12
                                      pad_right: 12
                                      pad_top: 4
                                      pad_bottom: 4
                                      scrollbar_mode: "OFF"
                                      scrollable: false
                                      on_click:
                                        - script.execute:
                                            id: connectivity_select_tab
                                            tab_index: 1
                                      widgets:
                                        - label: { id: conn_stab_bluetooth_lbl, text: "Bluetooth", text_color: 0x4B5563, text_font: font_text_20, align: CENTER }
                            - obj:
                                id: panel_wifi_page_bluetooth
                                hidden: true
                                width: 100%
                                height: 0
                                flex_grow: 1
                                bg_opa: 0%
                                border_opa: 0%
                                pad_all: 0
                                scrollbar_mode: AUTO
                                scrollable: true
                                layout:
                                  type: FLEX
                                  flex_flow: COLUMN
                                  flex_align_main: START
                                  flex_align_cross: CENTER
                                  pad_row: 8
                                widgets:
                                  - obj:
                                      width: 100%
                                      height: SIZE_CONTENT
                                      bg_opa: 0%
                                      border_opa: 0%
                                      pad_all: 6
                                      scrollable: false
                                      widgets:
                                        - label: { text: "Bluetooth", text_font: font_text_24, text_color: 0x1F2933, align: TOP_LEFT }
                                        - label: { text: "SwitchBot-temperatuursensoren via BLE", text_font: font_text_20, text_color: 0x6B7280, align: TOP_LEFT, y: 38 }
                                        - switch:
                                            id: ble_enabled_switch_ui
                                            align: TOP_RIGHT
                                            bg_color: 0x9CA3AF
                                            indicator:
                                              bg_color: 0x9CA3AF
                                              checked:
                                                bg_color: 0x16A34A
                                            knob:
                                              bg_color: 0xFFFFFF
                                            on_change:
                                              - lambda: |-
                                                  if (lv_obj_has_state(id(ble_enabled_switch_ui), LV_STATE_CHECKED)) id(ble_enabled_switch).turn_on();
                                                  else id(ble_enabled_switch).turn_off();
                                  - label:
                                      id: ble_hint_label
                                      width: 100%
                                      text: "Schakel Bluetooth in om SwitchBot-sensoren te koppelen."
                                      text_font: font_text_20
                                      text_color: 0x6B7280
                                      long_mode: WRAP
                                      pad_left: 6
                                  - obj:
                                      id: ble_sensors_section
                                      hidden: true
                                      width: 100%
                                      height: SIZE_CONTENT
                                      bg_opa: 0%
                                      border_opa: 0%
                                      pad_all: 0
                                      scrollable: false
                                      layout: { type: FLEX, flex_flow: COLUMN, pad_row: 8 }
                                      widgets:
                                        - label: { id: ble_paired_title, text: "Gekoppelde sensoren", text_font: font_text_20, text_color: 0x4B5563, pad_left: 6 }
                                        - !include { file: paired_row.yaml, vars: { index: 0 } }
                                        - !include { file: paired_row.yaml, vars: { index: 1 } }
                                        - !include { file: paired_row.yaml, vars: { index: 2 } }
                                        - obj:
                                            width: 100%
                                            height: 52
                                            bg_opa: 0%
                                            border_opa: 0%
                                            pad_all: 6
                                            scrollable: false
                                            widgets:
                                              - label: { id: ble_discovery_status_label, text: "Gevonden sensoren", text_font: font_text_20, text_color: 0x4B5563, align: LEFT_MID }
                                              - button:
                                                  width: 160
                                                  height: 40
                                                  align: RIGHT_MID
                                                  bg_color: 0x1F3B68
                                                  on_click:
                                                    - button.press: ble_discovery_button
                                                  widgets:
                                                    - label: { text: "Zoeken", text_font: font_text_20, text_color: 0xFFFFFF, align: CENTER }
                                        - !include { file: sensor_row.yaml, vars: { index: 0 } }
                                        - !include { file: sensor_row.yaml, vars: { index: 1 } }
                                        - !include { file: sensor_row.yaml, vars: { index: 2 } }
                                        - !include { file: sensor_row.yaml, vars: { index: 3 } }
                                        - !include { file: sensor_row.yaml, vars: { index: 4 } }
                                        - !include { file: sensor_row.yaml, vars: { index: 5 } }
                                        - !include { file: sensor_row.yaml, vars: { index: 6 } }
                                        - !include { file: sensor_row.yaml, vars: { index: 7 } }
