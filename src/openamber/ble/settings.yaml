# BLE UI: the room temperature source dropdown on the thermostat "Basis & Setpoints"
# menu page and the Bluetooth page under Settings -> Connectiviteit.
lvgl:
  widgets:
    - obj:
        id: !extend page_settings
        widgets:
          - menu:
              id: !extend settings_menu
              pages:
                - id: !extend panel_thermostat_page_setpoint
                  widgets:
                    - obj:
                        id: ble_source_row
                        styles: setting_row_style
                        scrollable: false
                        widgets:
                          - label: { text: "${t_ruimtetemperatuur_bron}", text_font: font_text_24, text_color: 0x1F2933, align: TOP_LEFT }
                          - label: { text: "${t_bedrade_tr_sensor_of_gekoppelde_bluetoot}", text_font: font_text_20, text_color: 0x6B7280, align: TOP_LEFT, y: 32 }
                          - dropdown:
                              id: ble_source_dropdown
                              width: 360
                              height: 40
                              align: TOP_RIGHT
                              # Lifted and kept compact so it clears the description line below the title.
                              y: -4
                              symbol: "\U000F0140"
                              # Options are rebuilt from the paired sensors (ble_sensor_ui.h).
                              options: ["Tr (Bedraad)"]
                              text_font: font_text_20
                              dropdown_list: { text_font: font_text_20 }
                              on_change:
                                - lambda: ble_sensor_source_dropdown_changed();

                - id: !extend panel_wifi
                  widgets:
                    - obj:
                        id: !extend connectivity_cards
                        widgets:
                          - obj:
                              id: conn_stab_bluetooth
                              styles: menu_tile_style
                              scrollable: false
                              pressed:
                                styles: menu_tile_pressed_style
                              disabled:
                                styles: menu_tile_disabled_style
                              on_click:
                                - lvgl.menu.set_page:
                                    id: settings_menu
                                    page: panel_wifi_page_bluetooth
                                - lambda: ble_sensor_bluetooth_page_opened();
                              widgets:
                                - label: { text: "\U000F00AF", styles: menu_tile_icon_style }
                                - label: { id: conn_stab_bluetooth_lbl, text: "Bluetooth", long_mode: WRAP, styles: menu_tile_label_style }

                - id: panel_wifi_page_bluetooth
                  title: "Bluetooth"
                  widgets:
                    - obj:
                        styles: setting_row_style
                        scrollable: false
                        widgets:
                          - label: { text: "Bluetooth", text_font: font_text_24, text_color: 0x1F2933, align: TOP_LEFT }
                          - label: { text: "${t_switchbot_bthome_en_xiaomi_atc_sensoren}", text_font: font_text_20, text_color: 0x6B7280, align: TOP_LEFT, y: 32 }
                          - switch:
                              id: ble_enabled_switch_ui
                              align: TOP_RIGHT
                              bg_color: 0x9CA3AF
                              indicator:
                                bg_color: 0x9CA3AF
                                checked:
                                  bg_color: 0x16A34A
                              knob:
                                bg_color: 0xFFFFFF
                              on_change:
                                - lambda: |-
                                    if (lv_obj_has_state(id(ble_enabled_switch_ui), LV_STATE_CHECKED)) id(ble_enabled_switch).turn_on();
                                    else id(ble_enabled_switch).turn_off();
                    - label:
                        id: ble_hint_label
                        width: 100%
                        text: "${t_schakel_bluetooth_in_om_sensoren_te_kopp}"
                        text_font: font_text_20
                        text_color: 0x6B7280
                        long_mode: WRAP
                        pad_left: 6
                    - obj:
                        id: ble_sensors_section
                        hidden: true
                        width: 100%
                        height: SIZE_CONTENT
                        bg_opa: 0%
                        border_opa: 0%
                        pad_all: 0
                        scrollable: false
                        layout: { type: FLEX, flex_flow: COLUMN, pad_row: 8 }
                        widgets:
                          - label: { id: ble_paired_title, text: "${t_gekoppelde_sensoren}", text_font: font_text_20, text_color: 0x4B5563, pad_left: 6 }
                          - !include { file: paired_row.yaml, vars: { index: 0 } }
                          - !include { file: paired_row.yaml, vars: { index: 1 } }
                          - !include { file: paired_row.yaml, vars: { index: 2 } }
                          - obj:
                              width: 100%
                              height: 52
                              bg_opa: 0%
                              border_opa: 0%
                              pad_all: 6
                              scrollable: false
                              widgets:
                                - label: { id: ble_discovery_status_label, text: "${t_gevonden_sensoren}", text_font: font_text_20, text_color: 0x4B5563, align: LEFT_MID }
                                - button:
                                    width: 160
                                    height: 40
                                    align: RIGHT_MID
                                    bg_color: 0x1F3B68
                                    on_click:
                                      - button.press: ble_discovery_button
                                    widgets:
                                      - label: { text: "${t_zoeken}", text_font: font_text_20, text_color: 0xFFFFFF, align: CENTER }
                          - !include { file: sensor_row.yaml, vars: { index: 0 } }
                          - !include { file: sensor_row.yaml, vars: { index: 1 } }
                          - !include { file: sensor_row.yaml, vars: { index: 2 } }
                          - !include { file: sensor_row.yaml, vars: { index: 3 } }
                          - !include { file: sensor_row.yaml, vars: { index: 4 } }
                          - !include { file: sensor_row.yaml, vars: { index: 5 } }
                          - !include { file: sensor_row.yaml, vars: { index: 6 } }
                          - !include { file: sensor_row.yaml, vars: { index: 7 } }
