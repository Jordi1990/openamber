uart:
  id: modbus_uart
  baud_rate: 19200
  parity: EVEN

# The outdoor unit drops a whole frame on a parity error, and the end of a frame is the most
# fragile part on RS485 adapters with automatic direction control. One extra byte after the CRC
# keeps the CRC away from the end of the frame; the outdoor unit ignores trailing bytes (#322).
modbus_frame_padding:
  id: modbus_uart_padded
  uart_id: modbus_uart
  addresses: [0x02]
  pad_byte: 0xFF

modbus:
  uart_id: modbus_uart_padded

modbus_controller:
- id: modbus_outside_unit
  address: 0x2
  update_interval: 15s
  max_cmd_retries: 2
  on_offline:
    then:
      - lambda: |-
          id(modbus_outside_is_online) = false;
      - logger.log: "Modbus outside unit OFFLINE"
  on_online:
    then:
      - lambda: |-
          id(modbus_outside_is_online) = true;
      - logger.log: "Modbus outside unit ONLINE"
# Internal working variables of the outdoor unit (5149-5298). The addresses
# are only verified for program version 0x0110 (register 2122), so this
# controller never polls on its own; the interval below triggers it.
- id: modbus_outside_unit_internal
  address: 0x2
  update_interval: never
  max_cmd_retries: 1
- id: modbus_inside_unit
  address: 0x0B
  update_interval: 15s
  max_cmd_retries: 2
  on_offline:
    then:
      - lambda: |-
          id(modbus_inside_is_online) = false;
      - logger.log: "Modbus inside unit OFFLINE"
  on_online:
    then:
      - lambda: |-
          id(modbus_inside_is_online) = true;
      - logger.log: "Modbus inside unit ONLINE"

interval:
  - interval: 30s
    then:
      - if:
          condition:
            lambda: |-
              return id(modbus_outside_is_online) &&
                     id(outside_unit_internal_registers_supported).state;
          then:
            - component.update: modbus_outside_unit_internal
