uart:
  id: modbus_uart
  baud_rate: 19200
  parity: EVEN

# The outdoor unit drops a whole frame on a parity error, and the end of a frame is the most
# fragile part on RS485 adapters with automatic direction control. One extra byte after the CRC
# keeps the CRC away from the end of the frame; the outdoor unit ignores trailing bytes (#322).
modbus_frame_padding:
  id: modbus_uart_padded
  uart_id: modbus_uart
  addresses: [0x02]
  pad_byte: 0xFF

modbus:
  uart_id: modbus_uart_padded

modbus_controller:
- id: modbus_outside_unit
  address: 0x2
  update_interval: 15s
  max_cmd_retries: 2
  on_offline:
    then:
      - lambda: |-
          id(modbus_outside_is_online) = false;
      - logger.log: "Modbus outside unit OFFLINE"
  on_online:
    then:
      - lambda: |-
          id(modbus_outside_is_online) = true;
      - logger.log: "Modbus outside unit ONLINE"
- id: modbus_inside_unit
  address: 0x0B
  update_interval: 15s
  max_cmd_retries: 2
  on_offline:
    then:
      - lambda: |-
          id(modbus_inside_is_online) = false;
      - logger.log: "Modbus inside unit OFFLINE"
  on_online:
    then:
      - lambda: |-
          id(modbus_inside_is_online) = true;
      - logger.log: "Modbus inside unit ONLINE"
