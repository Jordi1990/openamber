- platform: modbus_controller
  modbus_controller_id: modbus_inside_unit
  id: pump_p0_current_pwm_sensor
  name: "Pomp P0 PWM"
  address: 1303
  register_type: holding
  value_type: S_WORD
  unit_of_measurement: "%"
  state_class: "measurement"
  filters:
    - lambda: |-
        return ((x * -1) + 1000) / 10;
  web_server: 
    sorting_group_id: overview
  on_value: 
    then:
      - lambda: 
          id(modbus_inside_is_online) = true;

