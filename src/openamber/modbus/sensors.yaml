sensor:
- platform: modbus_controller
  modbus_controller_id: modbus_inside_unit
  id: room_temperature
  internal: True # Already readable through thermostat
  name: "Ruimte temperatuur (Tr)"
  address: 1199
  register_type: holding
  value_type: S_WORD
  device_class: temperature
  state_class: measurement
  unit_of_measurement: °C   
  accuracy_decimals: 1
  filters:
    - offset: -3000
    - multiply: 0.01
    - lambda: return x + id(tr_offset).state;

- platform: modbus_controller
  modbus_controller_id: modbus_inside_unit
  id: dhw_temperature_tw_sensor
  name: "Tapwatertemperatuur (Tw)"
  address: 1200
  register_type: holding
  value_type: S_WORD
  device_class: temperature
  state_class: measurement
  unit_of_measurement: °C   
  accuracy_decimals: 1
  web_server: 
    sorting_group_id: overview
  filters:
    - offset: -3000
    - multiply: 0.01
    - lambda: return x + id(tw_offset).state;

- platform: modbus_controller
  modbus_controller_id: modbus_inside_unit
  id: heat_cool_temperature_tc
  name: "CV-aanvoertemperatuur (Tc)"
  address: 1201
  register_type: holding
  value_type: S_WORD
  device_class: temperature
  state_class: measurement
  unit_of_measurement: °C   
  accuracy_decimals: 1
  web_server: 
    sorting_group_id: overview
  filters:
    - offset: -3000
    - multiply: 0.01
    - lambda: return x + id(tc_offset).state;
    - throttle: 30s # Throttle because PID loop depends on this

- platform: modbus_controller
  modbus_controller_id: modbus_inside_unit
  id: outlet_temperature_tuo
  name: "CV-aanvoertemperatuur (Tuo)"
  address: 1202
  register_type: holding
  value_type: S_WORD
  device_class: temperature
  state_class: measurement
  unit_of_measurement: °C   
  accuracy_decimals: 1
  web_server: 
    sorting_group_id: temperature_sensors
  filters:
    - offset: -3000
    - multiply: 0.01
    - lambda: return x + id(tuo_offset).state;
  on_value: 
    then:
      - component.update: heat_exchanger_delta_t

- platform: modbus_controller
  modbus_controller_id: modbus_inside_unit
  id: inlet_temperature_tui
  name: "CV-retourtemperatuur (Tui)"
  address: 1203
  register_type: holding
  value_type: S_WORD
  device_class: temperature
  state_class: measurement
  unit_of_measurement: °C   
  accuracy_decimals: 1
  web_server: 
    sorting_group_id: temperature_sensors
  filters:
    - offset: -3000
    - multiply: 0.01
    - lambda: return x + id(tui_offset).state;
  on_raw_value: 
    then:
      - number.set: 
          id: outlet_temperature_outside
          value: !lambda "return x;"
  on_value: 
    then:
      - component.update: heat_exchanger_delta_t

