    step: 1.0
    initial_value: 5.0
  - platform: template
    id: enter_defrost_temperature
    name: "Start ontdooitemperatuur"
    optimistic: true
    min_value: -15.0
    max_value: 5.0
    step: 1.0
    initial_value: -5.0
  - platform: template
    id: exit_defrost_temperature
    name: "Stop ontdooitemperatuur"
    optimistic: true
