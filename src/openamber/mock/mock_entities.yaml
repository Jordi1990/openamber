    lambda: 'return 114.0f;'
    update_interval: 1s
  - platform: template
    id: outlet_temperature_tuo
    name: "Aanvoertemperatuur (Tuo)"
    lambda: |-
      if (id(inside_unit_status_1225_raw).has_state() && (((uint16_t) id(inside_unit_status_1225_raw).state & 0x0008) != 0)) {
        return NAN;
      }
      if (id(outlet_temperature_tuo).has_state()) return id(outlet_temperature_tuo).state;
      return 35.4f;
    filters:
      - lambda: |-
          if (id(inside_unit_status_1225_raw).has_state() && (((uint16_t) id(inside_unit_status_1225_raw).state & 0x0008) != 0)) {
            return NAN;
          }
          return x;
    update_interval: 5s
    # Same trigger as modbus/sensors.yaml: heat_exchanger_delta_t has update_interval: never
    # and is only recalculated when Tuo/Tui publish. Without this the P0 pump PID never runs.
    on_value:
      then:
        - component.update: heat_exchanger_delta_t
