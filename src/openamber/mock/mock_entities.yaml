    lambda: |-
      if (id(inside_unit_status_1225_raw).has_state()) return id(inside_unit_status_1225_raw).state;
      return 0.0f;
    update_interval: 5s
    on_value:
      then:
        - component.update: room_temperature
        - component.update: dhw_temperature_tw_sensor
        - component.update: heat_cool_temperature_tc
        - component.update: outlet_temperature_tuo
        - component.update: inlet_temperature_tui
