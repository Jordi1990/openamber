# ==============================================================================
# OpenAmber Mock Hardware Entities for Host SDL Simulation
# ==============================================================================
# This package mocks physical heat pump signals and external services
# that are provided by Modbus or GPIO on real hardware.
# All application logic, settings, and PID controllers are in core_package.yaml.
# ==============================================================================

time:
  - platform: mock_time
    id: my_time
    # Empty timezone disables USE_TIME_TIMEZONE. With it enabled, core/time.h pulls
    # namespace esphome::time into every TU, which breaks the unqualified time() call
    # in ESPHome's logger_host.cpp (2026.10.x) on host builds.
    timezone: ""

update:
  - platform: mock_update
    id: firmware_update
    name: Firmware Update

sensor:
  - platform: template
    id: voltage_outside_unit
    name: "Spanning buitenunit"
    unit_of_measurement: "V"
    accuracy_decimals: 1
    lambda: 'return 230.0f;'
    update_interval: 5s
  - platform: template
    id: current_outside_unit
    name: "Stroom buitenunit"
    unit_of_measurement: "A"
    accuracy_decimals: 1
    lambda: 'return 0.0f;'
    update_interval: 5s
  - platform: template
    id: error_register_2119_raw
    name: "Foutregister 2119"
    accuracy_decimals: 0
    # Holds an injected value like a real Modbus register would (previously reset to 0 every 5s).
    lambda: |-
      if (id(error_register_2119_raw).has_state()) return id(error_register_2119_raw).state;
      return 0.0f;
    update_interval: 5s
  - platform: template
    id: error_register_2120_raw
    name: "Foutregister 2120"
    accuracy_decimals: 0
    # Holds an injected value like a real Modbus register would (previously reset to 0 every 5s).
    lambda: |-
      if (id(error_register_2120_raw).has_state()) return id(error_register_2120_raw).state;
      return 0.0f;
    update_interval: 5s
  - platform: template
    id: error_register_2121_raw
