# ==============================================================================
# OpenAmber Mock Entities for Host SDL Simulation
# ==============================================================================

globals:
  - id: analytics_topic
    type: std::string
    restore_value: no
    initial_value: '"openamber/telemetry"'
  - id: modbus_inside_is_online
    type: bool
    restore_value: no
    initial_value: 'true'
  - id: modbus_outside_is_online
    type: bool
    restore_value: no
    initial_value: 'true'
  - id: analytics_batch_timestamp
    type: int64_t
    restore_value: no
    initial_value: '1726320000'

openamber_component:
  id: amber_ctrl

time:
  - platform: mock_time
    id: my_time
    timezone: "Europe/Amsterdam"

update:
  - platform: mock_update
    id: firmware_update
    name: Firmware Update

output:
  - platform: template
    id: pid_heat_output
    type: float
    write_action:
      - lambda: |-
          id(amber_ctrl).write_heat_pid_value(state);
  - platform: template
    id: pid_cool_output
    type: float
    write_action:
      - lambda: |-
          id(amber_ctrl).write_cool_pid_value(state);
  - platform: template
    id: pump_p0_pid_output
    type: float
    write_action:
      - lambda: |-
          id(amber_ctrl).write_pump_p0_pid_value(state);
  - platform: template
    id: mixing_valve_zone1_pid_output
    type: float
    write_action:
      - lambda: |-
          id(amber_ctrl).write_mixing_valve_zone1_pid_value(state);
  - platform: template
    id: mixing_valve_zone2_pid_output
    type: float
    write_action:
      - lambda: |-
          id(amber_ctrl).write_mixing_valve_zone2_pid_value(state);

button:
  - platform: template
    id: restart_openamber
    name: Restart OpenAmber

datetime:
  - platform: template
    id: dhw_start_time
    type: time
    name: "Tapwater starttijd"
    optimistic: true
    initial_value: "10:00:00"
  - platform: template
    id: dhw_end_time
    type: time
    name: "Tapwater eindtijd"
    optimistic: true
    initial_value: "17:00:00"
  - platform: template
    id: next_legionella_run
    name: "Volgende legionellapreventie"
    type: datetime
    optimistic: true
    initial_value: "2030-01-01 10:00:00"

climate:
  - platform: thermostat
    id: climate_controller
    name: Amber thermostat
    sensor: room_temperature
    set_point_minimum_differential: 4.0
    min_cooling_off_time: 15min
    min_cooling_run_time: 1h
    min_heating_off_time: 15min
    min_heating_run_time: 1h
    min_idle_time: 15min
    default_preset: Comfort
    heat_deadband: 0.3
    heat_overrun: 0.2
    cool_deadband: 0.5
    cool_overrun: 3.0
    heat_action: []
    cool_action: []
    idle_action: []
    preset:
      - name: Comfort
        default_target_temperature_low: 20.5 °C
        default_target_temperature_high: 24 °C
  - platform: pid
    id: pid_heat_temperature_control
    internal: true
    sensor: heat_cool_control_temperature
    default_target_temperature: 35°C
    heat_output: pid_heat_output
    control_parameters:
      kp: 0.6
      ki: 0.002
      kd: 0.7
  - platform: pid
    id: pid_cool_temperature_control
    internal: true
    sensor: heat_cool_control_temperature
    default_target_temperature: 18°C
    cool_output: pid_cool_output
    control_parameters:
      kp: 0.6
      ki: 0.002
      kd: 0.7
  - platform: pid
    id: pump_p0_pid_temperature_control
    internal: true
    sensor: heat_exchanger_delta_t
    default_target_temperature: 5.0°C
    heat_output: pump_p0_pid_output
    control_parameters:
      kp: 2.0
      ki: 0.05
      kd: 0.0
  - platform: pid
    id: pid_mixing_valve_zone1
    internal: true
    sensor: heat_cool_temperature_tv1
    default_target_temperature: 30°C
    heat_output: mixing_valve_zone1_pid_output
    control_parameters:
      kp: 1.0
      ki: 0.005
      kd: 0.0
  - platform: pid
    id: pid_mixing_valve_zone2
    internal: true
    sensor: heat_cool_temperature_tv2
    default_target_temperature: 28°C
    heat_output: mixing_valve_zone2_pid_output
    control_parameters:
      kp: 1.0
      ki: 0.005
      kd: 0.0

sensor:
  - platform: template
    id: outside_unit_eeprom_version
    name: "EEPROM"
    lambda: 'return 114.0f;'
    update_interval: 1s
  - platform: template
    id: backup_heater_degmin_current_sensor
    name: "Backup heater degree/min current"
    unit_of_measurement: "°C·min"
    accuracy_decimals: 1
  - platform: template
    id: dhw_backup_current_avg_rate_sensor
    name: "DHW verwarmsnelheid"
    unit_of_measurement: "°C/min"
    accuracy_decimals: 2
  - platform: template
    id: outlet_temperature_tuo
    name: "Aanvoertemperatuur (Tuo)"
    lambda: |-
      if (id(outlet_temperature_tuo).has_state()) return id(outlet_temperature_tuo).state;
      return 35.4f;
    update_interval: 5s
  - platform: template
    id: inlet_temperature_tui
    name: "Retourtemperatuur (Tui)"
    lambda: |-
      if (id(inlet_temperature_tui).has_state()) return id(inlet_temperature_tui).state;
      return 30.1f;
    update_interval: 5s
  - platform: template
    id: heat_exchanger_delta_t
    name: "Warmtewisselaar Delta-T"
    lambda: |-
      return id(outlet_temperature_tuo).state - id(inlet_temperature_tui).state;
    update_interval: 5s
  - platform: template
    id: temperature_outside_ta
    name: "Buitentemperatuur (Ta)"
    lambda: |-
      if (id(temperature_outside_ta).has_state()) return id(temperature_outside_ta).state;
      return 7.2f;
    update_interval: 5s
  - platform: template
    id: temperature_outside_ta_avg_1h
    name: "Gemiddelde buitentemperatuur 1u"
    lambda: |-
      return id(temperature_outside_ta).state;
    update_interval: 5s
  - platform: template
    id: outdoor_temperature_tp_sensor
    name: "Buitencondensor (Tp)"
    lambda: |-
      if (id(outdoor_temperature_tp_sensor).has_state()) return id(outdoor_temperature_tp_sensor).state;
      return 5.1f;
    update_interval: 5s
  - platform: template
    id: current_water_temperature_tc_sensor
    name: "Water temperatuur (Tc)"
    lambda: |-
      if (id(current_water_temperature_tc_sensor).has_state()) return id(current_water_temperature_tc_sensor).state;
      return 35.2f;
    update_interval: 5s
  - platform: template
    id: dhw_temperature_tw_sensor
    name: "Tapwatertemperatuur (Tw)"
    lambda: |-
      if (id(dhw_temperature_tw_sensor).has_state()) return id(dhw_temperature_tw_sensor).state;
      return 52.0f;
    update_interval: 5s
  - platform: template
    id: current_dhw_setpoint_sensor
    name: "Huidig tapwater setpoint"
    unit_of_measurement: "°C"
    accuracy_decimals: 0
    update_interval: 5s
    lambda: |-
      float setpoint = 0.0f;
      if (id(dhw_legionella_run_active_sensor).state) {
        setpoint = id(legio_target_temperature_number).state;
      } else {
        setpoint = id(dhw_setpoint_temperature).state;
      }
      if (id(sg_ready_boost_mode_active_sensor).state || id(sg_ready_max_boost_mode_active_sensor).state) {
        setpoint += id(sg_ready_dhw_boost_temperature_number).state;
      }
      return setpoint;
  - platform: template
    id: heat_curve_calculated_setpoint
    name: "Stooklijn berekend setpoint"
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    update_interval: 5s
    lambda: |-
      const float Ta = id(temperature_outside_ta).state;
      const float tc15  = id(heat_curve_p15).state;
      const float tc10  = id(heat_curve_p10).state;
      const float tc5   = id(heat_curve_p5).state;
      const float tc0   = id(heat_curve_0).state;
      const float tc_m10 = id(heat_curve_m10).state;
      auto lerp = [](float x, float x0, float y0, float x1, float y1) -> float {
        const float t = (x - x0) / (x1 - x0);
        return y0 + t * (y1 - y0);
      };
      if (Ta >= 15.0f)       return tc15;
      else if (Ta >= 10.0f)  return lerp(Ta, 15.0f, tc15, 10.0f, tc10);
      else if (Ta >= 5.0f)   return lerp(Ta, 10.0f, tc10, 5.0f, tc5);
      else if (Ta >= 0.0f)   return lerp(Ta, 5.0f, tc5, 0.0f, tc0);
      else if (Ta >= -10.0f) return lerp(Ta, 0.0f, tc0, -10.0f, tc_m10);
      return tc_m10;
  - platform: template
    id: current_setpoint
    name: "Huidig setpoint"
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    update_interval: 5s
    lambda: |-
      if (id(cool_demand_active_sensor).state) {
        if (id(cool_mode_select).current_option() == "Extern setpoint") {
          return id(manual_setpoint).state;
        }
        return id(cooling_setpoint_number).state;
      }
      if (id(heat_mode_select).current_option() == "Stooklijn") {
        return id(heat_curve_calculated_setpoint).state;
      }
      return id(manual_setpoint).state;
    on_value:
      then:
        - lambda: |-
            auto climate = id(cool_demand_active_sensor).state ? id(pid_cool_temperature_control) : id(pid_heat_temperature_control);
            auto call = climate->make_call();
            call.set_target_temperature(x);
            call.perform();
  - platform: template
    id: current_heating_temperature_setpoint
    name: "Huidig verwarmingssetpoint"
    lambda: 'return id(current_setpoint).state;'
    update_interval: 5s
  - platform: template
    id: current_cooling_temperature_setpoint
    name: "Huidig koelsetpoint"
    lambda: 'return 18.0f;'
    update_interval: 5s
  - platform: template
    id: calculated_heat_curve_setpoint
    name: "Berekend stooklijn setpoint"
    lambda: 'return id(heat_curve_calculated_setpoint).state;'
    update_interval: 5s
  - platform: template
    id: room_temperature
    name: "Kamertemperatuur (Tr)"
    lambda: |-
      if (id(room_temperature).has_state()) return id(room_temperature).state;
      return 20.8f;
    update_interval: 5s
  - platform: template
    id: heat_cool_control_temperature
    name: "Regeltemperatuur verwarmen/koelen"
    update_interval: 5s
    lambda: |-
      auto selected_source = id(heat_cool_control_temperature_source_select).active_index();
      int source = (selected_source.has_value() && selected_source.value() == 1) ? 1 : 0;
      if (source == 1) {
        return id(heat_cool_temperature_tv1).state;
      }
      return id(heat_cool_temperature_tc).state;
  - platform: template
    id: heat_cool_temperature_tc
    name: "Cv-aanvoertemperatuur (Tc)"
    update_interval: 5s
    lambda: |-
      if (id(heat_cool_temperature_tc).has_state()) return id(heat_cool_temperature_tc).state;
      return id(current_water_temperature_tc_sensor).state;
  - platform: template
    id: heat_cool_temperature_tv1
    name: "Cv-aanvoertemperatuur zone 1 (Tv1)"
    lambda: 'return 30.0f;'
    update_interval: 5s
  - platform: template
    id: heat_cool_temperature_tv2
    name: "Cv-aanvoertemperatuur zone 2 (Tv2)"
    lambda: 'return 28.0f;'
    update_interval: 5s
  - platform: template
    id: heat_curve_z2_calculated_setpoint
    name: "Stooklijn zone 2 berekend setpoint"
    lambda: 'return 28.0f;'
    update_interval: 5s
  - platform: template
    id: mixing_valve_zone1_position
    name: "Mengventiel zone 1 positie"
    lambda: 'return 50.0f;'
    update_interval: 5s
  - platform: template
    id: mixing_valve_zone2_position
    name: "Mengventiel zone 2 positie"
    lambda: 'return 50.0f;'
    update_interval: 5s
  - platform: template
    id: fan_rpm_sensor
    name: "Ventilator RPM"
    lambda: 'return 450.0f;'
    update_interval: 5s
  - platform: template
    id: pump_p0_current_pwm_sensor
    name: "Pomp P0 PWM"
    lambda: |-
      return id(pump_control_pwm_number).state;
    update_interval: 1s
  - platform: template
    id: water_flow_rate
    name: "Waterdebiet"
    lambda: 'return 18.2f;'
    update_interval: 5s
  - platform: template
    id: cop_hour_heating
    name: "COP verwarmen uur"
    lambda: 'return 4.3f;'
    update_interval: 5s
  - platform: template
    id: eer_hour_cooling
    name: "EER koelen uur"
    lambda: 'return 3.8f;'
    update_interval: 5s
  - platform: template
    id: cop_hour_dhw
    name: "COP tapwater uur"
    lambda: 'return 3.2f;'
    update_interval: 5s
  - platform: template
    id: current_compressor_frequency
    name: "Compressorfrequentie"
    lambda: |-
      int mode = id(compressor_control_select).active_index().value_or(0);
      if (mode > 0) return 30.0f + mode * 5.0f;
      return 0.0f;
    update_interval: 1s
  - platform: template
    id: power_compressor
    name: "Compressor vermogen"
    lambda: 'return 850.0f;'
    update_interval: 5s
  - platform: template
    id: suction_pressure_ps
    name: "Zuigdruk (Ps)"
    lambda: 'return 0.85f;'
    update_interval: 5s
  - platform: template
    id: discharge_pressure_pd
    name: "Persdruk (Pd)"
    lambda: 'return 2.15f;'
    update_interval: 5s
  - platform: template
    id: expansion_valve_position
    name: "Expansieventiel"
    lambda: 'return 180.0f;'
    update_interval: 5s
  - platform: template
    id: model_identification_1
    name: "Model identificatie"
    lambda: 'return 150.0f;'
    update_interval: 5s
  - platform: template
    id: system_heap_free
    name: "Vrij RAM"
    lambda: 'return 245000.0f;'
    update_interval: 5s
  - platform: template
    id: system_psram_free
    name: "Vrij PSRAM"
    lambda: 'return 6500000.0f;'
    update_interval: 5s
  - platform: template
    id: system_heap_fragmentation
    name: "RAM Fragmentatie"
    lambda: 'return 8.0f;'
    update_interval: 5s
  - platform: template
    id: system_heap_max_block
    name: "Grootste RAM blok"
    lambda: 'return 180000.0f;'
    update_interval: 5s
  - platform: template
    id: sensor_uptime
    name: "Uptime"
    lambda: 'return 86400.0f;'
    update_interval: 5s
  - platform: template
    id: wifi_signal_db
    name: "Wi-Fi RSSI"
    lambda: 'return -62.0f;'
    update_interval: 5s

binary_sensor:
  - platform: template
    id: error_active
    name: "Actieve fout"
  - platform: template
    id: warning_active
    name: "Actieve waarschuwing"
    lambda: 'return false;'
  - platform: template
    id: modbus_inside_online
    name: "Binnenunit online"
    lambda: 'return true;'
  - platform: template
    id: modbus_outside_online
    name: "Buitenunit online"
    lambda: 'return true;'
  - platform: template
    id: backup_heater_active_sensor
    name: "Bijverwarming actief"
    lambda: 'return id(backup_heater_relay).state;'
  - platform: template
    id: bottom_heater_active_sensor
    name: "Bodemverwarming actief"
    lambda: 'return false;'
  - platform: template
    id: sg_ready_block_mode_active_sensor
    name: "SG Ready Block actief"
  - platform: template
    id: external_heat_demand_wired
    name: "Externe warmtevraag"
  - platform: template
    id: external_cool_demand_wired
    name: "Externe koelvraag"
  - platform: template
    id: dhw_active
    name: "Tapwater actief"
  - platform: template
    id: dhw_legionella_run_active_sensor
    name: "Legionellacyclus actief"
  - platform: template
    id: dhw_schedule_active_sensor
    name: "Tapwater schema actief"
    lambda: 'return true;'
  - platform: template
    id: internal_pump_active
    name: "Pomp P0 actief"
    lambda: |-
      if (!id(pump_p0_relay_switch).state) return false;
      return id(pump_control_pwm_number).state < 995.0f;
  - platform: template
    id: three_way_valve_active_sensor
    name: "3-weg klep"
    lambda: 'return id(three_way_valve_dhw_switch).state;'
  - platform: template
    id: frost_protection_stage1_active
    name: "Vorstbeveiliging fase 1 actief"
    lambda: |-
      return id(temperature_outside_ta).state < id(frost_protection_stage_1_temp_ta).state;
    on_press:
      then:
        - logger.log:
            format: "Pump interval reset due to pump required for frost protection."
            level: INFO
        - lambda: |-
            id(amber_ctrl).reset_pump_interval();
  - platform: template
    id: frost_protection_stage2_active
    name: "Vorstbeveiliging fase 2 actief"
    lambda: |-
      return id(temperature_outside_ta).state < id(frost_protection_stage_2_temp_ta).state &&
             id(inlet_temperature_tui).state < id(frost_protection_stage_2_temp_tui).state;
    on_press:
      then:
        - logger.log:
            format: "Pump interval reset due to pump required for frost protection."
            level: INFO
        - lambda: |-
            id(amber_ctrl).reset_pump_interval();
  - platform: template
    id: dhw_demand_active_sensor
    name: "Tapwater vraag"
    lambda: |-
      float tw = id(dhw_temperature_tw_sensor).state;
      float setpoint = id(current_dhw_setpoint_sensor).state;
      bool dhw_enabled = id(dhw_enabled_switch).state;
      float delta_restart = id(dhw_restart_dhw_delta).state;
      if (id(sg_ready_block_mode_active_sensor).state || !dhw_enabled || id(error_active).state) {
        return false;
      }
      if (id(dhw_legionella_run_active_sensor).state) {
        return true;
      }
      if (!id(dhw_schedule_active_sensor).state) {
        return false;
      }
      if (tw >= setpoint) {
        return false;
      }
      if (id(dhw_active).state) {
        return true;
      }
      return tw < setpoint - delta_restart;
  - platform: template
    id: dhw_pump_active_sensor
    name: "Tapwater pomp actief"
    lambda: 'return id(dhw_pump_relay_switch).state;'
  - platform: template
    id: heat_demand_active_sensor
    name: "Warmtevraag"
    lambda: |-
      if (id(sg_ready_block_mode_active_sensor).state || id(error_active).state) {
        return false;
      }
      if (id(thermostat_mode_select).current_option() == "Intern") {
        return id(climate_controller).action == climate::CLIMATE_ACTION_HEATING;
      } else {
        return id(external_heat_demand_wired).state || id(heat_demand_switch).state;
      }
  - platform: template
    id: cool_demand_active_sensor
    name: "Koudevraag"
    lambda: |-
      if (id(sg_ready_block_mode_active_sensor).state || id(error_active).state || id(heat_demand_active_sensor).state) {
        return false;
      }
      if (id(thermostat_mode_select).current_option() == "Intern") {
        return id(climate_controller).action == climate::CLIMATE_ACTION_COOLING;
      } else {
        return id(external_cool_demand_wired).state || id(cool_demand_switch).state;
      }
  - platform: template
    id: defrost_active_sensor
    name: "Ontdooicyclus actief"
  - platform: template
    id: oil_return_cycle_active
    name: "Olieretourcyclus actief"
    lambda: 'return false;'
  - platform: template
    id: oil_return_cycle_active_settled
    name: "Olieretourcyclus actief (settled)"
    lambda: 'return id(oil_return_cycle_active).state;'
  - platform: template
    id: sg_ready_a_active_sensor
    name: "SG Ready A actief"
    lambda: 'return false;'
  - platform: template
    id: sg_ready_b_active_sensor
    name: "SG Ready B actief"
    lambda: 'return false;'
  - platform: template
