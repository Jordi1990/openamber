  - platform: template
    id: internal_pump_active
    name: "Pomp P0 actief"
    lambda: |-
      if (!id(pump_p0_relay_switch).state) return false;
      return id(pump_control_pwm_number).state < 995.0f;
  - platform: template
    id: pump_p1_active
    name: "Pomp P1"
    device_class: running
    lambda: 'return id(pump_p1_relay_switch).state;'
  - platform: template
    id: three_way_valve_active_sensor
    name: "3-weg klep"
    lambda: 'return !id(mock_three_way_valve_feedback_missing).state && id(three_way_valve_heat_cool_switch).state;'
  - platform: template
    id: three_way_valve_dhw_active_sensor
    name: "3-weg klep SWW"
    lambda: 'return !id(mock_three_way_valve_feedback_missing).state && id(three_way_valve_dhw_switch).state;'
  - platform: template
    id: dhw_pump_active_sensor
    name: "Tapwater pomp actief"
    lambda: 'return id(dhw_pump_relay_switch).state;'
  - platform: template
    id: defrost_active_sensor
    name: "Ontdooicyclus actief"
  - platform: template
    id: sg_ready_a_active_sensor
    name: "SG Ready A actief"
  - platform: template
    id: sg_ready_b_active_sensor
    name: "SG Ready B actief"

