# ==============================================================================
# OpenAmber Mock Entities for Host SDL Simulation
# ==============================================================================

globals:
  - id: analytics_topic
    type: std::string
    restore_value: no
    initial_value: '"openamber/telemetry"'
  - id: modbus_inside_is_online
    type: bool
    restore_value: no
    initial_value: 'true'
  - id: modbus_outside_is_online
    type: bool
    restore_value: no
    initial_value: 'true'
  - id: analytics_batch_timestamp
    type: int64_t
    restore_value: no
    initial_value: '1726320000'

openamber_component:
  id: amber_ctrl

update:
  - platform: mock_update
    id: firmware_update
    name: Firmware Update

output:
  - platform: template
    id: pid_heat_output
    type: float
    write_action: []
  - platform: template
    id: pid_cool_output
    type: float
    write_action: []
  - platform: template
    id: pump_p0_pid_output
    type: float
    write_action: []

button:
  - platform: template
    id: restart_openamber
    name: Restart OpenAmber

datetime:
  - platform: template
    id: dhw_start_time
    type: time
    name: "Tapwater starttijd"
    optimistic: true
    initial_value: "10:00:00"
  - platform: template
    id: dhw_end_time
    type: time
    name: "Tapwater eindtijd"
    optimistic: true
    initial_value: "17:00:00"
  - platform: template
    id: next_legionella_run
    name: "Volgende legionellapreventie"
    type: datetime
    optimistic: true
    initial_value: "2030-01-01 10:00:00"

climate:
  - platform: thermostat
    id: climate_controller
    name: Amber thermostat
    sensor: room_temperature
    set_point_minimum_differential: 4.0
    min_cooling_off_time: 15min
    min_cooling_run_time: 1h
    min_heating_off_time: 15min
    min_heating_run_time: 1h
    min_idle_time: 15min
    default_preset: Comfort
    heat_deadband: 0.3
    heat_overrun: 0.2
    cool_deadband: 0.5
    cool_overrun: 3.0
    heat_action: []
    cool_action: []
    idle_action: []
    preset:
      - name: Comfort
        default_target_temperature_low: 20.5 °C
        default_target_temperature_high: 24 °C
  - platform: pid
    id: pid_heat_temperature_control
    internal: true
    sensor: heat_cool_control_temperature
    default_target_temperature: 35°C
    heat_output: pid_heat_output
    control_parameters:
      kp: 0.6
      ki: 0.002
      kd: 0.7
  - platform: pid
    id: pid_cool_temperature_control
    internal: true
    sensor: heat_cool_control_temperature
    default_target_temperature: 18°C
    cool_output: pid_cool_output
    control_parameters:
      kp: 0.6
      ki: 0.002
      kd: 0.7
  - platform: pid
    id: pump_p0_pid_temperature_control
    internal: true
    sensor: heat_exchanger_delta_t
    default_target_temperature: 5.0°C
    heat_output: pump_p0_pid_output
    control_parameters:
      kp: 2.0
      ki: 0.05
      kd: 0.1

