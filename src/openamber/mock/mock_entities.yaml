    id: pump_p0_current_pwm_sensor
    name: "Pomp P0 PWM"
    # Mirrors modbus/sensors.yaml: the raw value is the inverted register (0..1000, 1000 = off),
    # the published state is the duty cycle in %. PumpController compares against get_raw_state().
    unit_of_measurement: "%"
    lambda: |-
      return id(pump_control_pwm_number).state;
    filters:
      - lambda: |-
          return ((x * -1) + 1000) / 10;
    update_interval: 1s
