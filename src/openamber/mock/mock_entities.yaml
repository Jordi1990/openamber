# ==============================================================================
# OpenAmber Mock Hardware Entities for Host SDL Simulation
# ==============================================================================
# This package mocks physical heat pump signals and external services
# that are provided by Modbus or GPIO on real hardware.
# All application logic, settings, and PID controllers are in core_package.yaml.
# ==============================================================================

time:
  - platform: mock_time
    id: my_time
    timezone: "Europe/Amsterdam"

update:
  - platform: mock_update
    id: firmware_update
    name: Firmware Update

sensor:
  - platform: template
    id: voltage_outside_unit
    name: "Spanning buitenunit"
    unit_of_measurement: "V"
    accuracy_decimals: 1
    lambda: 'return 230.0f;'
    update_interval: 5s
  - platform: template
    id: current_outside_unit
    name: "Stroom buitenunit"
    unit_of_measurement: "A"
    accuracy_decimals: 1
    lambda: 'return 0.0f;'
    update_interval: 5s
  - platform: template
    id: error_register_2119_raw
    name: "Foutregister 2119"
    accuracy_decimals: 0
    lambda: 'return 0.0f;'
    update_interval: 5s
  - platform: template
    id: error_register_2120_raw
    name: "Foutregister 2120"
    accuracy_decimals: 0
    lambda: 'return 0.0f;'
    update_interval: 5s
  - platform: template
    id: error_register_2121_raw
    name: "Foutregister 2121"
    accuracy_decimals: 0
    lambda: 'return 0.0f;'
    update_interval: 5s
  - platform: template
    id: outside_unit_program_version
    name: "Buitenunit programmaversie"
    accuracy_decimals: 0
    lambda: 'return 1.0f;'
    update_interval: 5s
  - platform: template
    id: outside_unit_eeprom_version_part1
    name: "EEPROM versie deel 1"
    accuracy_decimals: 0
    lambda: 'return 1.0f;'
    update_interval: 5s
  - platform: template
    id: outside_unit_eeprom_version_part2
    name: "EEPROM versie deel 2"
    accuracy_decimals: 0
    lambda: 'return 14.0f;'
    update_interval: 5s
  - platform: template
    id: system_heap_free
    name: "Vrij RAM"
    lambda: 'return 245000.0f;'
    update_interval: 5s
  - platform: template
    id: system_heap_fragmentation
    name: "RAM Fragmentatie"
    lambda: 'return 8.0f;'
    update_interval: 5s
  - platform: template
    id: system_heap_max_block
    name: "Grootste RAM blok"
    lambda: 'return 180000.0f;'
    update_interval: 5s
  - platform: template
    id: wifi_signal_db
    name: "Wi-Fi RSSI"
    lambda: 'return -62.0f;'
    update_interval: 5s
  - platform: template
    id: outside_unit_eeprom_version
    name: "EEPROM"
    lambda: 'return 114.0f;'
    update_interval: 1s
  - platform: template
    id: outlet_temperature_tuo
    name: "Aanvoertemperatuur (Tuo)"
    lambda: |-
      if (id(outlet_temperature_tuo).has_state()) return id(outlet_temperature_tuo).state;
      return 35.4f;
    update_interval: 5s
  - platform: template
    id: inlet_temperature_tui
    name: "Retourtemperatuur (Tui)"
    lambda: |-
      if (id(inlet_temperature_tui).has_state()) return id(inlet_temperature_tui).state;
      return 30.1f;
    update_interval: 5s
  - platform: template
    id: temperature_outside_ta
    name: "Buitentemperatuur (Ta)"
    lambda: |-
      if (id(temperature_outside_ta).has_state()) return id(temperature_outside_ta).state;
      return 7.2f;
    update_interval: 5s
  - platform: template
    id: outdoor_temperature_tp_sensor
    name: "Buitencondensor (Tp)"
    lambda: |-
      if (id(outdoor_temperature_tp_sensor).has_state()) return id(outdoor_temperature_tp_sensor).state;
      return 5.1f;
    update_interval: 5s
  - platform: template
    id: current_water_temperature_tc_sensor
    name: "Water temperatuur (Tc)"
    lambda: |-
      if (id(current_water_temperature_tc_sensor).has_state()) return id(current_water_temperature_tc_sensor).state;
      return 35.2f;
    update_interval: 5s
  - platform: template
    id: dhw_temperature_tw_sensor
    name: "Tapwatertemperatuur (Tw)"
    lambda: |-
      if (id(dhw_temperature_tw_sensor).has_state()) return id(dhw_temperature_tw_sensor).state;
      return 52.0f;
    update_interval: 5s
  - platform: template
    id: current_heating_temperature_setpoint
    name: "Huidig verwarmingssetpoint"
    lambda: 'return id(current_setpoint).state;'
    update_interval: 5s
  - platform: template
    id: current_cooling_temperature_setpoint
    name: "Huidig koelsetpoint"
    lambda: 'return 18.0f;'
    update_interval: 5s
  - platform: template
    id: calculated_heat_curve_setpoint
    name: "Berekend stooklijn setpoint"
    lambda: 'return id(heat_curve_calculated_setpoint).state;'
    update_interval: 5s
  - platform: template
    id: room_temperature
    name: "Kamertemperatuur (Tr)"
    lambda: |-
      if (id(room_temperature).has_state()) return id(room_temperature).state;
      return 20.8f;
    update_interval: 5s
  - platform: template
    id: heat_cool_temperature_tc
    name: "Cv-aanvoertemperatuur (Tc)"
    update_interval: 5s
    lambda: |-
      if (id(heat_cool_temperature_tc).has_state()) return id(heat_cool_temperature_tc).state;
      return id(current_water_temperature_tc_sensor).state;
  - platform: template
    id: heat_cool_temperature_tv1
    name: "Cv-aanvoertemperatuur zone 1 (Tv1)"
    lambda: 'return 30.0f;'
    update_interval: 5s
  - platform: template
    id: heat_cool_temperature_tv2
    name: "Cv-aanvoertemperatuur zone 2 (Tv2)"
    lambda: 'return 28.0f;'
    update_interval: 5s
  - platform: template
    id: fan_rpm_sensor
    name: "Ventilator RPM"
    lambda: 'return 450.0f;'
    update_interval: 5s
  - platform: template
    id: pump_p0_current_pwm_sensor
    name: "Pomp P0 PWM"
    lambda: |-
      return id(pump_control_pwm_number).state;
    update_interval: 1s
  - platform: template
    id: water_flow_rate
    name: "Waterdebiet"
    lambda: 'return 18.2f;'
    update_interval: 5s
  - platform: template
    id: current_compressor_frequency
    name: "Compressorfrequentie"
    lambda: |-
      int mode = id(compressor_control_select).active_index().value_or(0);
      if (mode > 0) return 30.0f + mode * 5.0f;
      return 0.0f;
    update_interval: 1s
  - platform: template
    id: suction_pressure_ps
    name: "Zuigdruk (Ps)"
    lambda: 'return 0.85f;'
    update_interval: 5s
  - platform: template
    id: discharge_pressure_pd
    name: "Persdruk (Pd)"
    lambda: 'return 2.15f;'
    update_interval: 5s
  - platform: template
    id: expansion_valve_position
    name: "Expansieventiel"
    lambda: 'return 180.0f;'
    update_interval: 5s
  - platform: template
    id: model_identification_1
    name: "Model identificatie"
    lambda: 'return 150.0f;'
    update_interval: 5s
  - platform: template
    id: system_psram_free
    name: "Vrij PSRAM"
    lambda: 'return 6500000.0f;'
    update_interval: 5s
binary_sensor:
  - platform: template
    id: backup_heater_active_sensor
    name: "Bijverwarming actief"
    lambda: 'return id(backup_heater_relay).state;'
  - platform: template
    id: bottom_heater_active_sensor
    name: "Bodemverwarming actief"
    lambda: 'return false;'
  - platform: template
    id: external_heat_demand_wired
    name: "Externe warmtevraag"
  - platform: template
    id: external_cool_demand_wired
    name: "Externe koelvraag"
  - platform: template
    id: internal_pump_active
    name: "Pomp P0 actief"
    lambda: |-
      if (!id(pump_p0_relay_switch).state) return false;
      return id(pump_control_pwm_number).state < 995.0f;
  - platform: template
    id: three_way_valve_active_sensor
    name: "3-weg klep"
    lambda: 'return id(three_way_valve_dhw_switch).state;'
  - platform: template
    id: dhw_pump_active_sensor
    name: "Tapwater pomp actief"
    lambda: 'return id(dhw_pump_relay_switch).state;'
  - platform: template
    id: defrost_active_sensor
    name: "Ontdooicyclus actief"
  - platform: template
    id: sg_ready_a_active_sensor
    name: "SG Ready A actief"
    lambda: 'return false;'
  - platform: template
    id: sg_ready_b_active_sensor
    name: "SG Ready B actief"
    lambda: 'return false;'
