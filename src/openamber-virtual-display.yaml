substitutions:
  device_model: virtual-display

esphome:
  name: openamber-test
  project:
    name: jordi.openamber
    version: dev
  on_boot:
    - priority: 900
      then:
        - lambda: |-
            id(outside_unit_eeprom_version).publish_state(114.0f);
            id(modbus_inside_is_online) = true;
            id(modbus_outside_is_online) = true;
            id(defrost_active_sensor).publish_state(false);
    - priority: -100
      then:
        - lvgl.label.update:
            id: header_title
            text: "OpenAmber"
        - script.execute: setup_menu_header_ui
  includes:
    - openamber/controllers/constants.h
    - openamber/controllers/timing.h
    - openamber/controllers/pump_controller.h
    - openamber/controllers/compressor_controller.h
    - openamber/controllers/base_controller.h
    - openamber/controllers/dhw_controller.h
    - openamber/controllers/mixing_valve_actuator.h
    - openamber/controllers/heat_cool_controller.h
    - openamber/controllers/routine_controller.h
    - openamber/controllers/deaeration_routine.h
    - openamber/controllers/openamber_component.h
  build_flags:
    - "-Wl,--wrap=_ZN7esphome6millisEv"
    - "-Wl,--wrap=_ZN7esphome9millis_64Ev"
    - "-Wl,--wrap=_ZN7esphome6microsEv"

host:

debug:

web_server:
  port: 80
  # Same groups as core/openamber.yaml: ESPHome 2026.11+ checks the entities' sorting_group_id references.
  sorting_groups:
    - { id: overview, name: "Overzicht", sorting_weight: 0 }
    - { id: general_settings, name: "Algemene instellingen", sorting_weight: 10 }
    - { id: dhw_settings, name: "Tapwater instellingen", sorting_weight: 20 }
    - { id: dhw_schedule_settings, name: "Tapwater schema instellingen", sorting_weight: 30 }
    - { id: heating_settings, name: "Verwarmingsinstellingen", sorting_weight: 40 }
    - { id: cooling_settings, name: "Koelinstellingen", sorting_weight: 45 }
    - { id: temperature_sensors, name: "Temperatuursensoren", sorting_weight: 50 }
    - { id: diagnostic, name: "Diagnostiek", sorting_weight: 60 }
    - { id: error_codes, name: "Foutcodes", sorting_weight: 70 }
    - { id: manual_control, name: "Handmatige bediening", sorting_weight: 80 }
    - { id: config, name: "Config", sorting_weight: 90 }

logger:
  level: INFO

external_components:
  - source:
      type: local
      path: openamber
    components: [openamber_component, test_bridge, mock_time, mock_update, native_build_flags, web_server, eebus]

display:
  - platform: sdl
    id: openamber_display
    dimensions:
      width: 1024
      height: 600
    snapshot_key: SDLK_F12

touchscreen:
  - platform: sdl
    id: openamber_touchscreen

packages:
  - !include openamber/core/core_package.yaml
  - !include openamber/mock/mock_entities.yaml
  - !include openamber/ui/display_globals.yaml
  - !include openamber/ui/bindings/ui_bindings_package.yaml
  - !include openamber/ui/ui_package.yaml

test_bridge:
  port: 8888
