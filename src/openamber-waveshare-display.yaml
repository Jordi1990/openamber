substitutions:
  device_model: waveshare-5-1024x600

packages:
 - !include openamber/common/openamber.yaml
 - !include openamber/ui/display_globals.yaml
 - !include openamber/ui/bindings/ui_bindings_package.yaml
 - !include openamber/ui/ui_package.yaml
 
wifi:
  use_psram: true

esp32:
  variant: esp32s3
  flash_size: 16MB
  cpu_frequency: 240MHZ
  framework:
    sdkconfig_options:
      CONFIG_ESP32S3_DATA_CACHE_64KB: y
      CONFIG_SPIRAM_USE_MALLOC: y
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: y
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: y  
      CONFIG_SPIRAM_MALLOC_ALWAYSINTERNAL: "0"
      CONFIG_SPIRAM_MALLOC_RESERVE_INTERNAL: "65536"
      CONFIG_SPIRAM_TRY_ALLOCATE_WIFI_LWIP: y
      CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC: y
      CONFIG_MDNS_TASK_CREATE_FROM_SPIRAM: y
      CONFIG_MDNS_MEMORY_ALLOC_SPIRAM: y
      CONFIG_NVS_ALLOCATE_CACHE_IN_SPIRAM: y
      CONFIG_SPIRAM_RODATA: y
      CONFIG_ESP_TASK_WDT_TIMEOUT_S: "60"
    advanced:
      loop_task_stack_size: 10240
      execute_from_psram: true

esphome:
  project:
    version: dev
  on_boot:
    - priority: -100
      then:
        - lvgl.label.update:
            id: header_title
            text:
              format: "OpenAmber %s"
              args: ['ESPHOME_PROJECT_VERSION']
        - script.execute: update_firmware_ui

# Workaround: native ESP-IDF esphome.build_flags filters out -m... Xtensa compiler options.
# -mauto-litpools is required because ESPHome's generated setup() exceeds the L32R literal range due to large amount of LVGL elements.
native_build_flags:
  cxx_flags:
    - -mauto-litpools

uart:
  rx_pin:
    number: GPIO43
    inverted: False
  tx_pin:
    number: GPIO44
    inverted: False

psram:
  mode: octal
  speed: 80MHz

ch422g:
  - id: ch422g_hub

i2c:
  sda: GPIO08
  scl: GPIO09
  scan: False
  frequency: 400kHz

display:
  - platform: mipi_rgb
    model: WAVESHARE-5-1024X600
    id: my_display
    auto_clear_enabled: false
    dimensions:
      width: 1024
      height: 600
      offset_width: 0
      offset_height: 0
      pad_width: 0
      pad_height: 0

output:
  - platform: ledc
    pin: GPIO15
    id: backlight

switch:
  - platform: gpio
    name: backlight switch
    pin:
      ch422g: ch422g_hub
      number: 2
    restore_mode: ALWAYS_ON
    internal: true

touchscreen:
  - platform: gt911
    address: 0x5D
    id: my_touchscreen
    interrupt_pin: GPIO4
    reset_pin:
      ch422g: ch422g_hub
      number: 1
    on_release:
      - if:
          condition:
            lambda: 'return id(is_idled);'
          then:
            - globals.set:
                id: is_idled
                value: 'false'
            - output.set_level:
                id: backlight
                level: 100%
            - lvgl.widget.hide:
                id: idle_screen_overlay

api:
  on_client_connected:
    - lvgl.widget.update:
        id: nav_status_ha_icon
        text_color: 0x22C55E
  on_client_disconnected:
    - lvgl.widget.update:
        id: nav_status_ha_icon
        text_color: 0xEF4444

# EEBus warmtepomp-apparaat (native SHIP/SPINE PoC). Zie docs/eebus-native-poc.md
# Pairing-SKI komt uit het ingebedde certificaat (log: "EEBus certificate").
eebus:
  device_sku: "OpenAmber-Waveshare"
  brand: "OpenAmber"
  model: "Amber"
  failsafe_duration: 2h
  read_power: "return id(power_compressor).state;"
  read_dhw_temp: "return id(dhw_temperature_tw_sensor).state;"
  is_boost_active: "return id(sg_ready_boost_mode_active_sensor).state || id(sg_ready_max_boost_mode_active_sensor).state;"
  status:
    name: "EEBUS Status"
  last_action:
    name: "EEBUS Laatste actie"
  connected:
    name: "EEBUS Verbonden"
  power_limit:
    name: "EEBUS Vermogenslimiet"
  ski:
    name: "EEBUS SKI"
    id: eebus_ski
  apply_optional: |-
    if (value) {
      auto call = id(sg_ready_mode_select).make_call();
      call.set_option("Boost");
      call.perform();
      return true;
    } else {
      if (id(sg_ready_mode_select).current_option() == "Boost") {
        auto call = id(sg_ready_mode_select).make_call();
        call.set_option("Normaal");
        call.perform();
      }
      return true;
    }
  apply_dim: |-
    if (value) {
      auto call = id(sg_ready_mode_select).make_call();
      call.set_option("Blokkeren");
      call.perform();
      return true;
    } else {
      if (id(sg_ready_mode_select).current_option() == "Blokkeren") {
        auto call = id(sg_ready_mode_select).make_call();
        call.set_option("Normaal");
        call.perform();
      }
      return true;
    }
  # Optioneel: Uitgebreide numerieke vermogenslimiet i.p.v. binaire apply_dim
  # apply_limit: |-
  #   if (!active) {
  #     auto call = id(sg_ready_mode_select).make_call();
  #     call.set_index(0); // Normaal
  #     call.perform();
  #   } else if (limit_w <= 0.0f) {
  #     auto call = id(sg_ready_mode_select).make_call();
  #     call.set_index(1); // Blokkeren
  #     call.perform();
  #   } else {
  #     ESP_LOGI("eebus", "Dynamische EEBUS vermogenslimiet: %.0f W", limit_w);
  #   }
  #   return true;
  #
  # Vermogensschatting voor EVCC PV-overschot drempel (OHPCF RequestedPowerEstimate)
  # Gebaseerd op de ingestelde maximale compressor modus voor verwarmen (heat_compressor_mode)
  # en het specifieke Amber warmtepomp model (Amber 65, 95 of 120).
  read_power_estimate: |-
    int model_id = id(model_identification_1).has_state() ? (int)id(model_identification_1).state : 150;
    int mode_idx = 6; // Standaard Maximaal (stand 10)
    if (id(heat_compressor_mode).has_state() && id(heat_compressor_mode).active_index().has_value()) {
      mode_idx = (int)id(heat_compressor_mode).active_index().value();
    }
    if (mode_idx < 0) mode_idx = 0;
    if (mode_idx > 6) mode_idx = 6;
    int stand = mode_idx + 4; // Stand 4 t/m 10

    static const int heating_frequencies[11] = {
        0, 28, 36, 43, 55, 61, 67, 72, 79, 85, 90
    };
    // Amber 65
    static const float power_table_amber_65[11]  = {
        0.0f,  183.0f,  464.0f,  506.0f,  696.0f,  836.0f, 1120.0f, 1357.0f, 1386.0f, 1360.0f, 1338.0f
    };
    // Amber 95
    static const float power_table_amber_95[11]  = {
        0.0f,  282.0f,  552.0f,  690.0f,  940.0f, 1166.0f, 1816.0f, 2100.0f, 1990.0f, 1895.0f, 1816.0f
    };
    // Amber 120
    static const float power_table_amber_120[11] = {
        0.0f,  986.0f, 1161.0f, 1314.0f, 1650.0f, 1744.0f, 1931.0f, 2086.0f, 2304.0f, 2490.0f, 2646.0f
    };

    switch (model_id) {
      case 140: // Amber 65
        return power_table_amber_65[stand];
      case 15:  // Amber 120
        return power_table_amber_120[stand];
      case 150: // Amber 95
      case 145: // HP-S 95
      default:  // Onbekend / default Amber 95
        return power_table_amber_95[stand];
    }

interval:
  - interval: 700ms
    then:
      - script.execute: toggle_header_alert_blink



sensor:
  - platform: debug
    psram:
      name: "Free PSRAM"
      id: system_psram_free
      disabled_by_default: true
  - platform: pulse_counter
    pin:
      number: GPIO16
      mode:
        input: true
        pullup: false
    internal_filter: 
      milliseconds: 1
    use_pcnt: false
    name: Pulse meter
    id: water_flow_rate
    device_class: volume_flow_rate
    unit_of_measurement: L/min
    filters:
      - lambda: return (x / id(flow_sensor_calibration).state);
    total:
      name: Total liters
      unit_of_measurement: l
      filters:
        - lambda: return x / id(flow_sensor_calibration).state;
        - delta: 1

lvgl:
  on_idle:
    - timeout: 60s
      then:
        - globals.set:
            id: is_idled
            value: 'true'
        - output.set_level:
            id: backlight
            level: 50% # 50% turns off the backlight
        - lvgl.widget.show:
            id: idle_screen_overlay

