name: Build and validate on PR publish

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - src/**
      - tests/**
      - run_tests.py
      - .github/workflows/**

concurrency:
  group: build-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-and-validate:
    name: Build & Validate
    if: github.event.pull_request.draft == false
    uses: ./.github/workflows/build-firmware.yml
    with:
      files: |
        src/openamber-leejow.yaml
        src/openamber-waveshare-display.yaml
        src/openamber-waveshare-p4.yaml
      combined-name: openamber-pr-validation
      run-tests: true

