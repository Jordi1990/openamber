name: Publish release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  # Versions are semver: 0.10.0 for a stable release, 0.10.0-beta.1 for a beta. Only stable releases may reach the
  # stable manifest (GitHub's "latest" release), so a beta must be published as a pre-release and a stable
  # release must not. Devices compare these versions to decide what counts as an update.
  check-version:
    name: Check version
    runs-on: ubuntu-latest
    steps:
      - name: Check tag and pre-release flag
        env:
          TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          if [[ ! "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-(beta|rc)\.[0-9]+)?$ ]]; then
            echo "::error::Tag '$TAG' is not a release version like 0.10.0, 0.10.0-beta.1 or 0.10.0-rc.1"
            exit 1
          fi
          if [[ "$TAG" == *-* && "$PRERELEASE" != "true" ]]; then
            echo "::error::Beta '$TAG' must be published as a pre-release, otherwise it lands in the stable manifest"
            exit 1
          fi
          if [[ "$TAG" != *-* && "$PRERELEASE" == "true" ]]; then
            echo "::error::Stable release '$TAG' must not be marked as a pre-release"
            exit 1
          fi

  build-firmware:
    name: Build Firmware
    needs: check-version
    uses: ./.github/workflows/build-firmware.yml
    with:
      files: |
        src/openamber-leejow.yaml
        src/openamber-waveshare-display.yaml
        src/openamber-waveshare-p4.yaml
      combined-name: openamber
      release-summary: ${{ github.event_name == 'release' && github.event.release.body || '' }}
      release-url: ${{ github.event_name == 'release' && github.event.release.html_url || '' }}
      release-version: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}

  upload-to-release:
    name: Upload to Release
    if: github.event_name == 'release'
    uses: esphome/workflows/.github/workflows/upload-to-gh-release.yml@3c4e8446aa1029f1c346a482034b3ee1489077ca  # 2026.4.0
    needs:
      - build-firmware
    with:
      version: ${{ github.event.release.tag_name }}

  beta-manifest:
    name: Beta manifest
    needs: upload-to-release
    runs-on: ubuntu-latest
    steps:
      - name: Add openamber.beta.manifest.json to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern openamber.manifest.json
          if [ "$PRERELEASE" = "true" ]; then
            jq '.builds |= map(
                  (if .ota then .ota.path |= "beta/" + . else . end)
                  | (if .parts then .parts |= map(.path |= "beta/" + .) else . end))' \
              openamber.manifest.json > openamber.beta.manifest.json
          else
            cp openamber.manifest.json openamber.beta.manifest.json
          fi
          gh release upload "$TAG" openamber.beta.manifest.json --repo "$GITHUB_REPOSITORY" --clobber
          # Only after the beta manifest is uploaded, so a failed upload can be retried with the original still there.
          if [ "$PRERELEASE" = "true" ]; then
            gh release delete-asset "$TAG" openamber.manifest.json --repo "$GITHUB_REPOSITORY" --yes
          fi
